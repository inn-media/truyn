[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "truyn-sdk"
version = "0.1.0a3"
description = "First-party Python SDK for the TRUYN Intelligence Network"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "cryptography>=43,<47"
]

[project.optional-dependencies]
# Optional native QUIC stack. The main SDK remains compatible with Python 3.10.
# QUIC requires Python >=3.11 and verified TLS (never disable certificate checks).
quic = ["aioquic==1.6.1; python_version >= '3.11'"]

[project.urls]
Homepage = "https://truyn.org"
Repository = "https://github.com/inn-media/truyn"
Issues = "https://github.com/inn-media/truyn/issues"

[tool.setuptools.packages.find]
where = ["src"]

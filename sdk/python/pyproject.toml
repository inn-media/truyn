[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "truyn-sdk"
version = "0.0.0"
description = "TRUYN Python DX-1 reference SDK core"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=43,<47"
]

[tool.setuptools.packages.find]
where = ["src"]

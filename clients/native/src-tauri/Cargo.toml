[package]
name = "truyn-native-client"
version = "0.1.0-alpha.1"
description = "Native GUI requester client for the TRUYN Intelligence Network"
authors = ["TRUYN contributors"]
license = "Apache-2.0"
repository = "https://github.com/inn-media/truyn"
edition = "2021"
rust-version = "1.90"

[lib]
name = "truyn_native_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8", "pem"] }
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
ryu-js = "=1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.12.0", features = [] }
tokio = { version = "1.48.0", features = ["net", "sync"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

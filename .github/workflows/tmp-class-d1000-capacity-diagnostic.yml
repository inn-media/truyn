name: tmp-class-d1000-capacity-diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-capacity-diagnostic.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Capture v7 SKU and quota state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          az vm list-usage -l eastus2 -o json > usage.json
          for sku in Standard_D2as_v7 Standard_D2s_v7 Standard_D4as_v7 Standard_D4s_v7 Standard_D4d_v7; do
            az vm list-skus -l eastus2 --size "$sku" --all -o json > "sku-${sku}.json"
          done
          python3 - <<'PY' > diagnostic.txt
          import json
          usage=json.load(open('usage.json'))
          print('USAGE')
          for u in usage:
              n=(u.get('name') or {}).get('localizedValue') or (u.get('name') or {}).get('value')
              low=(n or '').lower().replace(' ','')
              if n and any(x in low for x in ['totalregionalvcpus','standarddasv7familyvcpus','standarddsv7familyvcpus','standardddsv7familyvcpus']):
                  print(n, 'current=',u.get('currentValue'),'limit=',u.get('limit'))
          print('SKUS')
          for sku in ['Standard_D2as_v7','Standard_D2s_v7','Standard_D4as_v7','Standard_D4s_v7','Standard_D4d_v7']:
              arr=json.load(open('sku-'+sku+'.json'))
              print(sku,'records=',len(arr))
              for r in arr[:3]:
                  caps={c.get('name'):c.get('value') for c in (r.get('capabilities') or [])}
                  print(' restrictions=',r.get('restrictions') or [],'vCPUs=',caps.get('vCPUs'),'memoryGB=',caps.get('MemoryGB'))
          PY
          body="$(python3 - <<'PY'
          import pathlib
          s=pathlib.Path('diagnostic.txt').read_text().replace('\n',' | ')
          print('read_only=true required_hosts=20 '+s[:9000])
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 V7 CAPACITY DIAGNOSTIC' -f "body=${body}" >/dev/null

name: NuGet alpha.1 documentation sanitation v3

on:
  push:
    branches:
      - docs/nuget-alpha1-accepted-sanitation-20260923

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/nuget-alpha1-accepted-sanitation-20260923
          fetch-depth: 0
      - name: Reconcile final DX3 boundary
        run: python3 scripts/maintenance/nuget-alpha1-dx3-prepatch.py
      - name: Reconcile accepted NuGet state
        run: python3 scripts/maintenance/nuget-alpha1-sanitation.py
      - name: Targeted release tests
        run: node --test tests/maven-nuget-publication-workflow.test.js
      - name: Commit sanitized non-workflow tree
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i '3s/[[:space:]]*$//' \
            docs/architecture/SDK_DEVELOPER_EXPERIENCE.md \
            docs/compatibility/SDK_COMPATIBILITY.md \
            docs/compatibility/SDK_PACKAGING.md \
            sdk/release/PUBLISHING.md

          # GitHub's default Actions token cannot write workflow files. Keep the
          # canonical workflow byte-identical in this commit; the one-line
          # clean-room syntax repair is applied separately through the repository
          # write path after the documentation commit lands.
          git restore --source=HEAD -- .github/workflows/publish-nuget.yml

          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'TRUYN_NUGET_DOC_COMMIT=NOOP'
            exit 0
          fi
          git commit -m 'docs(release): close NuGet alpha.1 publication state' -m 'Record accepted immutable NuGet.org evidence and synchronize stale SDK, compatibility, quickstart and release documentation.' -m 'Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:docs/nuget-alpha1-accepted-sanitation-20260923

name: NuGet alpha.1 documentation sanitation v3

on:
  push:
    branches:
      - docs/nuget-alpha1-accepted-sanitation-20260923

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/nuget-alpha1-accepted-sanitation-20260923
          fetch-depth: 0
      - name: Reconcile final DX3 boundary
        run: python3 scripts/maintenance/nuget-alpha1-dx3-prepatch.py
      - name: Reconcile accepted NuGet state
        run: python3 scripts/maintenance/nuget-alpha1-sanitation.py
      - name: Targeted release tests
        run: node --test tests/maven-nuget-publication-workflow.test.js
      - name: Commit sanitized tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/nuget-alpha1-doc-sanitation-one-shot.yml
          rm -f .github/workflows/nuget-alpha1-doc-sanitation-v2.yml
          rm -f .github/workflows/nuget-alpha1-doc-sanitation-v3.yml
          rm -f scripts/maintenance/nuget-alpha1-sanitation.py
          rm -f scripts/maintenance/nuget-alpha1-dx3-prepatch.py
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(release): close NuGet alpha.1 publication state' -m 'Record accepted immutable NuGet.org evidence, synchronize stale SDK and compatibility documentation, and repair future clean-room restore syntax without weakening acceptance.' -m 'Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:docs/nuget-alpha1-accepted-sanitation-20260923

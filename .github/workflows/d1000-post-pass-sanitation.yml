name: D1000 Post-PASS Branch Sanitation
on:
  push:
    branches: [main]
    paths: ['.github/d1000/post-pass-sanitation.run']
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact D1000 Attempt 1 prep branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="prep/d1000-a1-from-d500-a22"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            echo "TRUYN_D1000_SANITATION delete=${branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          else
            echo "TRUYN_D1000_SANITATION absent=${branch}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            echo "TRUYN_D1000_SANITATION=FAIL remaining=${branch}" >&2
            exit 1
          fi
          echo "TRUYN_D1000_SANITATION=PASS removed_or_absent=1"

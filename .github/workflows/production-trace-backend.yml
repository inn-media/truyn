name: Production Trace Backend

on:
  pull_request:
    paths:
      - 'infra/production-tracing/**'
      - 'observability/bootstrap.js'
      - 'runtime/trace-export-canary.js'
      - 'operations/production-trace-backend.json'
      - 'operations/production-trace-export.json'
      - '.github/workflows/production-trace-backend.yml'
      - 'tests/production-trace-backend.test.js'
      - 'tests/production-trace-retention.test.js'
      - 'tests/observability.test.js'
      - 'tests/public-repository.test.js'
      - 'infra/production-dr/**'
      - '.github/workflows/production-dr-foundation.yml'
  workflow_run:
    workflows: ['Production Logs Retention']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'infra/production-tracing/**'
      - 'observability/bootstrap.js'
      - 'runtime/trace-export-canary.js'
      - 'operations/production-trace-backend.json'
      - 'operations/production-trace-export.json'

permissions:
  contents: read
  actions: read
  id-token: write

env:
  DEPLOYMENT_ID: dc4518de-d1bf-4fce-b351-e43d7c152999
  RESOURCE_GROUP: ${{ vars.TRUYN_AZURE_RESOURCE_GROUP || 'truyn' }}
  REGION_PAIRS: ${{ vars.TRUYN_DR_REGION_PAIRS || 'germanywestcentral:francecentral northeurope:swedencentral' }}
  AZURE_CLIENT_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_VALUE: ${{ vars[format('AZURE_{0}', 'TENANT_ID')] || secrets[format('AZURE_{0}', 'TENANT_ID')] }}
  AZURE_SUBSCRIPTION_VALUE: ${{ vars[format('AZURE_{0}', 'SUBSCRIPTION_ID')] || secrets[format('AZURE_{0}', 'SUBSCRIPTION_ID')] }}
  NORMAL_TRACE_RETENTION_DAYS: '30'
  INCIDENT_TRACE_RETENTION_DAYS: '90'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile trace backend Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep install >/dev/null
          az bicep build --file infra/production-tracing/trace-backend.bicep --stdout >/dev/null
      - name: Build pinned Tempo image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag truyn-trace-backend:validate infra/production-tracing/tempo >/dev/null
      - name: Validate trace runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check observability/bootstrap.js
          node --check runtime/trace-export-canary.js
          python -m py_compile infra/production-tracing/trace-retention-probe.py
      - name: Validate trace backend and retention contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NORMAL_TRACE_RETENTION_DAYS" -ge 14 && "$NORMAL_TRACE_RETENTION_DAYS" -le 30 ]]
          [[ "$INCIDENT_TRACE_RETENTION_DAYS" -gt "$NORMAL_TRACE_RETENTION_DAYS" ]]
          jq -e '
            .schema == "truyn.production-trace-backend/v2" and
            .backendId == "prod-traces-01" and
            .deploymentId == "dc4518de-d1bf-4fce-b351-e43d7c152999" and
            .backendClass == "azure-container-apps-tempo" and
            .backendVersion == "3.0.2" and
            .protocols.otlpHttp.enabled == true and
            .protocols.otlpHttp.port == 4318 and
            .protocols.otlpHttp.path == "/v1/traces" and
            .protocols.otlpGrpc.enabled == true and
            .protocols.otlpGrpc.port == 4317 and
            .storage.backend == "azure-blob" and
            .storage.authentication == "managed-identity" and
            .storage.publicNetworkAccess == false and
            .retention.mechanism == "tempo-per-tenant-compaction" and
            .retention.multitenancyRequired == true and
            .retention.tenantHeader == "X-Scope-OrgID" and
            .retention.normal.tenant == "normal" and
            .retention.normal.retentionDays == 30 and
            .retention.incident.tenant == "incident" and
            .retention.incident.retentionDays == 90 and
            .retention.incidentLongerThanNormal == true and
            .retention.failClosedRetentionClass == true and
            .publicIngress == false and
            .acceptance.traceReadBackRequired == true and
            .acceptance.normalRetentionConfigReadBackRequired == true and
            .acceptance.incidentRetentionConfigReadBackRequired == true
          ' operations/production-trace-backend.json >/dev/null
      - name: Validate production trace export contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == "truyn.production-trace-export/v1" and
            .exportId == "prod-trace-export-01" and
            .deploymentId == "dc4518de-d1bf-4fce-b351-e43d7c152999" and
            .runtimeRole == "provider" and
            .runtimeImageBinding == "exact-main-source-sha" and
            .environmentVariable == "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" and
            .protocol == "otlp/http-protobuf" and
            .endpointScope == "private-loopback-sidecar" and
            .endpointPath == "/v1/traces" and
            .publicEndpoint == false and
            .acceptance.spanName == "truyn.provider.execute" and
            .acceptance.exactTraceReadBackRequired == true and
            .acceptance.sourceShaBindingRequired == true
          ' operations/production-trace-export.json >/dev/null

  apply-and-prove:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_run') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: truyn-production-aca-exclusive-writer
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A single commit may change DR, Logs and Trace material sources.
      # In that case the direct Trace push arm must refuse writes and the
      # accepted DR -> Logs -> Trace workflow_run chain handles this SHA.
      - name: Reject mixed upstream push before direct Trace apply
        if: github.event_name == 'push'
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$PUSH_BEFORE" =~ ^0{40}$ ]] || {
            echo '::error::Cannot verify pre-push base; direct Trace apply denied.'
            exit 41
          }
          git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" >/dev/null
          changed="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA")"
          if grep -Eq '^(infra/production-dr/|infra/production-observability/logs-retention[.]bicep$|operations/production-logs-retention[.]json$)' <<<"$changed"; then
            echo '::error::Mixed DR/Logs/Trace push must complete upstream release before Trace apply.'
            exit 42
          fi

      - name: Verify exact-main upstream admission and immutable live evidence
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$UPSTREAM_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$UPSTREAM_SHA" ]]
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          jq -e --arg sha "$UPSTREAM_SHA" '
            .head_sha==$sha and (.event=="push" or .event=="workflow_run") and .head_branch=="main"
            and .status=="completed" and .conclusion=="success"
          ' <<<"$source_run" >/dev/null
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name 'production-logs-retention-evidence' '
            [.artifacts[] | select(.name==$name and .expired==false and .size_in_bytes>0)] | length==1
          ' <<<"$artifacts" >/dev/null
          echo 'TRUYN_PRODUCTION_CHAIN=PASS exact_upstream_sha=true immutable_evidence=true auto_fallback=false'


      - name: Verify live remote main before Azure production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo '::error::Production apply refused: protected main changed since this run was queued.'
            exit 43
          }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo '::error::Production apply refused: checked-out source is not the current main.'
            exit 44
          }

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_VALUE }}

      - name: Resolve accepted private production Container Apps plane
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          az bicep install >/dev/null
          [[ "$NORMAL_TRACE_RETENTION_DAYS" -eq 30 ]]
          [[ "$INCIDENT_TRACE_RETENTION_DAYS" -eq 90 ]]
          printf '::add-mask::%s\n' "$RESOURCE_GROUP"

          selected_environment=''
          selected_environment_id=''
          selected_region=''
          selected_prefix=''
          selected_vnet_id=''
          selected_private_endpoint_subnet_id=''
          selected_registry=''
          attempt=0

          for pair in $REGION_PAIRS; do
            attempt=$((attempt + 1))
            [[ "$attempt" -le 2 ]] || break
            [[ "$pair" == *:* ]] || { echo '::error::Invalid production region pair.'; exit 1; }
            primary="${pair%%:*}"
            secondary="${pair#*:}"
            pair_suffix="$(printf '%s' "${GITHUB_REPOSITORY}:${GITHUB_REPOSITORY_ID}:${primary}:${secondary}" | sha256sum | cut -c1-10)"
            prefix="truyn${pair_suffix}"
            environment="${prefix}-aca-env"
            cosmos="${prefix}cosmos"
            vnet="${prefix}-vnet"
            registry="${prefix}acr"
            for value in "$prefix" "$environment" "$cosmos" "$vnet" "$registry"; do printf '::add-mask::%s\n' "$value"; done

            if ! environment_json="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$environment" --only-show-errors -o json 2>/dev/null)"; then continue; fi
            if ! cosmos_json="$(az cosmosdb show --resource-group "$RESOURCE_GROUP" --name "$cosmos" --only-show-errors -o json 2>/dev/null)"; then continue; fi
            if ! vnet_id="$(az network vnet show --resource-group "$RESOURCE_GROUP" --name "$vnet" --query id -o tsv --only-show-errors 2>/dev/null)"; then continue; fi
            if ! pe_subnet_id="$(az network vnet subnet show --resource-group "$RESOURCE_GROUP" --vnet-name "$vnet" --name private-endpoints --query id -o tsv --only-show-errors 2>/dev/null)"; then continue; fi
            if ! az acr show --resource-group "$RESOURCE_GROUP" --name "$registry" --only-show-errors -o none 2>/dev/null; then continue; fi

            if ! jq -e '
              .properties.vnetConfiguration.internal == true and
              (.properties.publicNetworkAccess | ascii_downcase) == "disabled" and
              .properties.provisioningState == "Succeeded"
            ' <<<"$environment_json" >/dev/null; then continue; fi
            if ! jq -e --arg primary "$primary" --arg secondary "$secondary" '
              .provisioningState == "Succeeded" and
              ([.locations[].locationName | gsub(" "; "") | ascii_downcase] | sort) == ([$primary, $secondary] | sort)
            ' <<<"$cosmos_json" >/dev/null; then continue; fi

            selected_environment="$environment"
            selected_environment_id="$(jq -r '.id' <<<"$environment_json")"
            selected_region="$primary"
            selected_prefix="$prefix"
            selected_vnet_id="$vnet_id"
            selected_private_endpoint_subnet_id="$pe_subnet_id"
            selected_registry="$registry"
            break
          done

          [[ -n "$selected_environment" && -n "$selected_environment_id" && -n "$selected_region" && -n "$selected_prefix" && -n "$selected_vnet_id" && -n "$selected_private_endpoint_subnet_id" && -n "$selected_registry" ]] || {
            echo '::error::No accepted internal production Container Apps foundation is available.'
            exit 1
          }

          trace_suffix="$(printf '%s' "${GITHUB_REPOSITORY}:${DEPLOYMENT_ID}:${selected_prefix}:tempo" | sha256sum | cut -c1-10)"
          app_name="truyn-traces-${trace_suffix}"
          storage_name="truyntr${trace_suffix}"
          identity_name="truyn-traces-${trace_suffix}-mi"
          image_repo='truyn-trace-backend'
          image_name="${selected_registry}.azurecr.io/${image_repo}:${GITHUB_SHA}"
          runtime_image="${selected_registry}.azurecr.io/truyn-runtime:${GITHUB_SHA}"
          opaque_region="region-$(printf '%s' "${DEPLOYMENT_ID}:${selected_region}" | sha256sum | cut -c1-8)"

          for value in "$selected_environment" "$selected_environment_id" "$selected_prefix" "$selected_vnet_id" "$selected_private_endpoint_subnet_id" "$selected_registry" "$app_name" "$storage_name" "$identity_name" "$image_name" "$runtime_image"; do printf '::add-mask::%s\n' "$value"; done

          printf 'ACA_ENVIRONMENT=%s\n' "$selected_environment" >> "$GITHUB_ENV"
          printf 'ACA_ENVIRONMENT_ID=%s\n' "$selected_environment_id" >> "$GITHUB_ENV"
          printf 'TRACE_REGION=%s\n' "$selected_region" >> "$GITHUB_ENV"
          printf 'TRACE_OPAQUE_REGION=%s\n' "$opaque_region" >> "$GITHUB_ENV"
          printf 'TRACE_VNET_ID=%s\n' "$selected_vnet_id" >> "$GITHUB_ENV"
          printf 'TRACE_PE_SUBNET_ID=%s\n' "$selected_private_endpoint_subnet_id" >> "$GITHUB_ENV"
          printf 'TRACE_REGISTRY=%s\n' "$selected_registry" >> "$GITHUB_ENV"
          printf 'TRACE_APP=%s\n' "$app_name" >> "$GITHUB_ENV"
          printf 'TRACE_STORAGE=%s\n' "$storage_name" >> "$GITHUB_ENV"
          printf 'TRACE_IDENTITY=%s\n' "$identity_name" >> "$GITHUB_ENV"
          printf 'TRACE_IMAGE=%s\n' "$image_name" >> "$GITHUB_ENV"
          printf 'TRACE_RUNTIME_IMAGE=%s\n' "$runtime_image" >> "$GITHUB_ENV"

      - name: Verify live remote main before Azure production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo '::error::Production apply refused: protected main changed since this run was queued.'
            exit 43
          }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo '::error::Production apply refused: checked-out source is not the current main.'
            exit 44
          }

      - name: Build exact-main Tempo image
        shell: bash
        run: |
          set -euo pipefail
          az acr build --registry "$TRACE_REGISTRY" --image "truyn-trace-backend:${GITHUB_SHA}" --file infra/production-tracing/tempo/Dockerfile infra/production-tracing/tempo --only-show-errors -o none

      - name: Build exact-main production runtime image
        shell: bash
        run: |
          set -euo pipefail
          az acr build --registry "$TRACE_REGISTRY" --image "truyn-runtime:${GITHUB_SHA}" --file Dockerfile . --only-show-errors -o none

      - name: Recheck private ACA readiness before Tempo and trace canary provisioning
        shell: bash
        run: |
          set -Eeuo pipefail
          ready=false
          for attempt in $(seq 1 12); do
            arm="$(az resource show --ids "$ACA_ENVIRONMENT_ID" --api-version 2025-07-01 --only-show-errors -o json 2>/dev/null || echo '{}')"
            cli="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$ACA_ENVIRONMENT" --only-show-errors -o json 2>/dev/null || echo '{}')"
            if jq -e '
              (.properties.provisioningState // "") == "Succeeded" and
              (.properties.vnetConfiguration.internal // false) == true and
              ((.properties.publicNetworkAccess // "") | ascii_downcase) == "disabled"
            ' <<<"$arm" >/dev/null &&
            jq -e '(.properties.provisioningState // "") == "Succeeded"' <<<"$cli" >/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          [[ "$ready" == true ]] || {
            echo '::error::TRUYN_ACA_TRACE_ADMISSION=BLOCKED; refuse Tempo deployment into an unprovisioned/unknown Container Apps environment.'
            exit 1
          }
          echo 'TRUYN_ACA_TRACE_ADMISSION=PASS control_planes=2 public_ingress=disabled mutations=0'

      - name: Verify live remote main before Azure production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo '::error::Production apply refused: protected main changed since this run was queued.'
            exit 43
          }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo '::error::Production apply refused: checked-out source is not the current main.'
            exit 44
          }

      - name: Provision private OTLP trace storage and runtime export canary
        shell: bash
        run: |
          set -euo pipefail
          deployment_name="trace-backend-${GITHUB_SHA:0:8}"
          printf '::add-mask::%s\n' "$deployment_name"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/production-tracing/trace-backend.bicep \
            --parameters \
              appName="$TRACE_APP" \
              storageAccountName="$TRACE_STORAGE" \
              identityName="$TRACE_IDENTITY" \
              environmentId="$ACA_ENVIRONMENT_ID" \
              vnetId="$TRACE_VNET_ID" \
              privateEndpointSubnetId="$TRACE_PE_SUBNET_ID" \
              registryName="$TRACE_REGISTRY" \
              imageName="$TRACE_IMAGE" \
              runtimeImage="$TRACE_RUNTIME_IMAGE" \
              location="$TRACE_REGION" \
              deploymentId="$DEPLOYMENT_ID" \
              sourceSha="$GITHUB_SHA" \
              tempoVersion='3.0.2' \
            --only-show-errors -o none

          app_json="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$TRACE_APP" --only-show-errors -o json)"
          storage_json="$(az storage account show --resource-group "$RESOURCE_GROUP" --name "$TRACE_STORAGE" --only-show-errors -o json)"
          identity_json="$(az identity show --resource-group "$RESOURCE_GROUP" --name "$TRACE_IDENTITY" --only-show-errors -o json)"

          jq -e --arg runtimeImage "$TRACE_RUNTIME_IMAGE" --arg sourceSha "$GITHUB_SHA" '
            .properties.provisioningState == "Succeeded" and
            .properties.configuration.ingress.external == false and
            .properties.configuration.ingress.targetPort == 4318 and
            .identity.type == "UserAssigned" and
            any(.properties.template.containers[];
              .name == "runtime-trace-canary" and
              .image == $runtimeImage and
              any(.env[]; .name == "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" and .value == "http://127.0.0.1:4318/v1/traces") and
              any(.env[]; .name == "TRUYN_TRACE_RETENTION_CLASS" and .value == "normal") and
              any(.env[]; .name == "TRUYN_VERSION" and .value == $sourceSha)
            )
          ' <<<"$app_json" >/dev/null
          jq -e '
            .provisioningState == "Succeeded" and
            (.publicNetworkAccess | ascii_downcase) == "disabled" and
            .allowBlobPublicAccess == false and
            .allowSharedKeyAccess == false and
            .defaultToOAuthAuthentication == true and
            .minimumTlsVersion == "TLS1_2"
          ' <<<"$storage_json" >/dev/null
          jq -e '.principalId != null and .clientId != null' <<<"$identity_json" >/dev/null

      - name: Prove OTLP endpoint, retention classes and trace read-back
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for attempt in $(seq 1 120); do
            logs="$(az containerapp logs show --resource-group "$RESOURCE_GROUP" --name "$TRACE_APP" --container acceptance-probe --type console --tail 200 --follow false --format text --only-show-errors 2>/dev/null || true)"
            if grep -q 'TRUYN_TRACE_CANARY_PASS otlp_http=accepted trace_readback=observed storage=azure-blob' <<<"$logs" && \
               grep -q 'TRUYN_TRACE_RETENTION_PASS normal_days=30 incident_days=90 normal_readback=1 incident_readback=1' <<<"$logs"; then
              accepted=true
              break
            fi
            sleep 10
          done
          [[ "$accepted" == true ]] || {
            echo '::error::Tempo retention classes were not active and readable.'
            exit 1
          }

      - name: Prove production runtime trace export
        shell: bash
        run: |
          set -euo pipefail
          observed=false
          for attempt in $(seq 1 120); do
            logs="$(az containerapp logs show --resource-group "$RESOURCE_GROUP" --name "$TRACE_APP" --container acceptance-probe --type console --tail 200 --follow false --format text --only-show-errors 2>/dev/null || true)"
            if grep -q 'TRUYN_TRACE_EXPORT_PASS span=truyn.provider.execute runtime=production source=exact-main retention_class=normal' <<<"$logs"; then
              observed=true
              break
            fi
            sleep 10
          done
          [[ "$observed" == true ]] || {
            echo '::error::Production runtime did not export a readable normal-retention truyn.provider.execute trace.'
            exit 1
          }

      - name: Emit sanitized trace backend and Sprint 17 retention evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg region "$TRACE_OPAQUE_REGION" \
            --argjson normalRetentionDays "$NORMAL_TRACE_RETENTION_DAYS" \
            --argjson incidentRetentionDays "$INCIDENT_TRACE_RETENTION_DAYS" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "truyn.production-trace-backend-evidence/v2",
              deploymentId: $deploymentId,
              component: "trace-backend",
              backendClass: "azure-container-apps-tempo",
              backendVersion: "3.0.2",
              protocols: { otlpHttp: true, otlpGrpc: true },
              storageBackend: "azure-blob",
              storageAuthentication: "managed-identity",
              storagePublicNetworkDisabled: true,
              privateEndpoint: true,
              publicIngress: false,
              retentionMechanism: "tempo-per-tenant-compaction",
              multitenancyEnabled: true,
              tenantHeader: "X-Scope-OrgID",
              normalRetentionDays: $normalRetentionDays,
              incidentRetentionDays: $incidentRetentionDays,
              incidentRetentionLonger: ($incidentRetentionDays > $normalRetentionDays),
              normalRetentionConfigObserved: true,
              incidentRetentionConfigObserved: true,
              normalTraceReadBackObserved: true,
              incidentTraceReadBackObserved: true,
              runtimeRetentionClass: "normal",
              region: $region,
              sourceSha: $sourceSha,
              exactMain: true,
              generatedAt: $generatedAt,
              status: "PASS"
            }' > production-trace-backend-evidence.json

      - name: Emit sanitized trace export evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg region "$TRACE_OPAQUE_REGION" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "truyn.production-trace-export-evidence/v2",
              deploymentId: $deploymentId,
              component: "trace-export",
              runtimeRole: "provider",
              runtimeImageBoundToExactMain: true,
              environmentVariable: "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT",
              retentionClassEnvironmentVariable: "TRUYN_TRACE_RETENTION_CLASS",
              retentionClass: "normal",
              endpointScope: "private-loopback-sidecar",
              protocol: "otlp/http-protobuf",
              spanName: "truyn.provider.execute",
              providerSpanObserved: true,
              exactTraceReadBackObserved: true,
              sourceSha: $sourceSha,
              exactMain: true,
              region: $region,
              generatedAt: $generatedAt,
              status: "PASS"
            }' > production-trace-export-evidence.json

      - name: Upload sanitized trace backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-trace-backend-evidence
          path: production-trace-backend-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized trace export evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-trace-export-evidence
          path: production-trace-export-evidence.json
          if-no-files-found: error
          retention-days: 30

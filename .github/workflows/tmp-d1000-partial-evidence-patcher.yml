name: tmp-d1000-partial-evidence-patcher

on:
  push:
    branches: [fix/d1000-partial-convergence-evidence]
    paths:
      - '.github/workflows/tmp-d1000-partial-evidence-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1000-partial-convergence-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, validate and commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, zlib
          payload = ' '
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY

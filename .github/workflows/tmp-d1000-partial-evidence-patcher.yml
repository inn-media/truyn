name: tmp-d1000-partial-evidence-patcher

on:
  push:
    branches: [fix/d1000-partial-convergence-evidence]
    paths:
      - '.github/workflows/tmp-d1000-partial-evidence-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1000-partial-convergence-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply diagnostics patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          service = Path('network/testnet/node-service.js')
          text = service.read_text()
          anchor = "  const requireFaultControl = () => {\n"
          diagnostics = textwrap.dedent(r'''
            const diagnosticsSnapshot = () => {
              const peerRecords = node.discovery.snapshot().map((record) => ({
                nodeId: record.nodeId,
                endpoints: record.endpoints,
                sequence: record.sequence,
                issuedAt: record.issuedAt,
                expiresAt: record.expiresAt,
                capabilities: record.capabilities || []
              }));
              const routingPeers = node.discovery.routing.snapshot().map((peer) => ({
                nodeId: peer.nodeId,
                endpoints: peer.endpoints || [],
                lastSeenAt: peer.lastSeenAt || null
              }));
              const routingBuckets = node.discovery.routing.buckets
                .map((bucket, index) => ({ index, size: bucket.length }))
                .filter((bucket) => bucket.size > 0);
              const connectedPeerNodeIds = [...node.router.connections.keys()].sort();
              return {
                ...statusSnapshot(),
                diagnosticsVersion: 1,
                routing: {
                  size: node.discovery.routing.size(),
                  bucketCount: routingBuckets.length,
                  buckets: routingBuckets,
                  peers: routingPeers
                },
                discovery: {
                  knownPeerRecords: peerRecords.length,
                  peers: peerRecords
                },
                connectionManager: {
                  connectedPeerCount: connectedPeerNodeIds.length,
                  connectedPeerNodeIds,
                  outboundAdmission: node.router.admissionSnapshot(),
                  inboundAdmission: node.quic.admissionSnapshot(),
                  quicClientCount: node.quic.clients.size
                },
                dht: {
                  recordCount: node.recordStore.snapshot().length,
                  rpcTimeoutMs: node.rpc.timeoutMs
                },
                peerRecordLifecycle: node.peerRecordLifecycleSnapshot(),
                faults: node.faultSnapshot()
              };
            };

          ''')
          if 'const diagnosticsSnapshot = () =>' not in text:
              if anchor not in text:
                  raise SystemExit('diagnostics anchor not found')
              text = text.replace(anchor, diagnostics + anchor, 1)
          status = "      if (req.method === 'GET' && url.pathname === '/status') return json(res, 200, statusSnapshot());\n"
          diag = "      if (req.method === 'GET' && url.pathname === '/diagnostics') return json(res, 200, diagnosticsSnapshot());\n"
          if "/diagnostics" not in text:
              text = text.replace(status, status + diag, 1)
          service.write_text(text)

          campaign = Path('benchmarks/scale/class-d-azure-1000-campaign.sh')
          text = campaign.read_text()
          start = text.index('STAGE=convergence\n')
          end = text.index('\nSTAGE=baseline-routing\n')
          block = textwrap.dedent(r'''
            STAGE=convergence
            CONV_HOSTS_JSONL="${GITHUB_WORKSPACE:-$PWD}/class-d-1000-convergence-hosts.jsonl"
            CONV_NODE_DIAG_JSONL="${GITHUB_WORKSPACE:-$PWD}/class-d-1000-node-diagnostics.jsonl"
            CONV_DIAG_JSON="${GITHUB_WORKSPACE:-$PWD}/class-d-1000-convergence-diagnostics.json"
            : >"$CONV_HOSTS_JSONL"
            : >"$CONV_NODE_DIAG_JSONL"

            collect_convergence_node_diagnostics() {
              : >"$CONV_NODE_DIAG_JSONL"
              for i in $(seq 0 $((HOST_COUNT-1))); do
                script=$(cat <<EOS
            set -Eeuo pipefail
            python3 - <<'PY'
            import base64, collections, json, urllib.request
            records=json.load(open('/var/lib/truyn-d1000/records-by-host.json'))
            node_to_host={r['nodeId']: h for h, rows in enumerate(records) for r in rows}
            host=${i}; base=${CONTROL_BASE}; N=${NODES_PER_HOST}
            nodes=[]
            for local in range(N):
                try:
                    with urllib.request.urlopen(f'http://127.0.0.1:{base+local}/diagnostics', timeout=3) as res:
                        diag=json.load(res)
                except Exception as error:
                    nodes.append({'localIndex':local,'ok':False,'error':type(error).__name__+':'+str(error)[:160]})
                    continue
                known=collections.Counter(str(node_to_host.get(p.get('nodeId'),'unknown')) for p in diag.get('discovery',{}).get('peers',[]))
                routing=collections.Counter(str(node_to_host.get(p.get('nodeId'),'unknown')) for p in diag.get('routing',{}).get('peers',[]))
                cm=diag.get('connectionManager',{})
                nodes.append({
                    'localIndex':local,'ok':True,'nodeId':diag.get('nodeId'),
                    'routingTableSize':diag.get('routing',{}).get('size'),
                    'routingBucketCount':diag.get('routing',{}).get('bucketCount'),
                    'knownPeerRecords':diag.get('discovery',{}).get('knownPeerRecords'),
                    'knownPeersByRemoteHost':dict(sorted(known.items())),
                    'routingPeersByRemoteHost':dict(sorted(routing.items())),
                    'connectedPeerCount':cm.get('connectedPeerCount'),
                    'connectedPeerNodeIds':cm.get('connectedPeerNodeIds',[]),
                    'outboundAdmission':cm.get('outboundAdmission'),
                    'inboundAdmission':cm.get('inboundAdmission'),
                    'quicClientCount':cm.get('quicClientCount'),
                    'dhtRecordCount':diag.get('dht',{}).get('recordCount'),
                    'dhtRpcTimeoutMs':diag.get('dht',{}).get('rpcTimeoutMs'),
                    'peerRecordLifecycle':diag.get('peerRecordLifecycle')})
            valid=[n for n in nodes if n.get('ok')]
            def vals(key): return [n.get(key) for n in valid if isinstance(n.get(key),(int,float))]
            out={'host':host,'ok':len(valid),'total':N,'aggregate':{
              'routingTableSizeMin':min(vals('routingTableSize') or [0]),
              'routingTableSizeMax':max(vals('routingTableSize') or [0]),
              'routingTableSizeAvg':round(sum(vals('routingTableSize') or [0])/max(1,len(vals('routingTableSize'))),3),
              'knownPeerRecordsMin':min(vals('knownPeerRecords') or [0]),
              'knownPeerRecordsMax':max(vals('knownPeerRecords') or [0]),
              'connectedPeerCountMin':min(vals('connectedPeerCount') or [0]),
              'connectedPeerCountMax':max(vals('connectedPeerCount') or [0]),
              'dhtRecordCountMax':max(vals('dhtRecordCount') or [0])},'nodes':nodes}
            print('NODE_DIAG_B64='+base64.b64encode(json.dumps(out,separators=(',',':')).encode()).decode())
            PY
            EOS
            )
                out=$(remote "${VMS[$i]}" "$script")
                b64=$(marker "$out" NODE_DIAG_B64)
                [[ -n "$b64" ]]
                printf '%s' "$b64" | base64 -d >>"$CONV_NODE_DIAG_JSONL"
                printf '\n' >>"$CONV_NODE_DIAG_JSONL"
              done
            }

            write_convergence_partial_evidence() {
              reason="$1"
              end_ms=$(date +%s%3N)
              python3 - "$EVIDENCE" "$CONV_HOSTS_JSONL" "$CONV_NODE_DIAG_JSONL" "$CONV_DIAG_JSON" "$reason" "$conv_success" "$conv_total" "$conv_rate" "$conv_p95" "$conv_p99" "$NODE_COUNT" "$HOST_COUNT" "$NODES_PER_HOST" "$START_MS" "$end_ms" <<'PY'
            import collections, json, os, sys
            evidence_path, host_path, node_path, diag_path, reason, conv_success, conv_total, conv_rate, conv_p95, conv_p99, node_count, host_count, nodes_per_host, start_ms, end_ms = sys.argv[1:]
            def read_jsonl(path):
                rows=[]
                try:
                    for line in open(path, encoding='utf-8'):
                        line=line.strip()
                        if line: rows.append(json.loads(line))
                except FileNotFoundError:
                    pass
                return rows
            hosts=read_jsonl(host_path); nodes=read_jsonl(node_path)
            failure=collections.Counter(); codes=collections.Counter(); rcs=collections.Counter(); target_ok=collections.Counter(); target_total=collections.Counter()
            for row in hosts:
                for k,v in (row.get('failureReasons') or {}).items(): failure[k]+=v
                for k,v in (row.get('httpCodes') or {}).items(): codes[k]+=v
                for k,v in (row.get('returnCodes') or {}).items(): rcs[k]+=v
                for k,v in (row.get('targetHostSuccesses') or {}).items(): target_ok[k]+=v
                for k,v in (row.get('targetHostProbes') or {}).items(): target_total[k]+=v
            aggs=[r.get('aggregate') or {} for r in nodes]
            def vals(name): return [v for v in (a.get(name) for a in aggs) if isinstance(v,(int,float))]
            diagnostics={'version':1,'convergenceHosts':hosts,'nodeDiagnosticsByHost':nodes,'summary':{
              'failureReasons':dict(failure),'httpCodes':dict(codes),'returnCodes':dict(rcs),
              'targetHostSuccesses':dict(target_ok),'targetHostProbes':dict(target_total),
              'routingTableSizeMin':min(vals('routingTableSizeMin') or [0]),
              'routingTableSizeMax':max(vals('routingTableSizeMax') or [0]),
              'knownPeerRecordsMin':min(vals('knownPeerRecordsMin') or [0]),
              'knownPeerRecordsMax':max(vals('knownPeerRecordsMax') or [0]),
              'connectedPeerCountMin':min(vals('connectedPeerCountMin') or [0]),
              'connectedPeerCountMax':max(vals('connectedPeerCountMax') or [0])}}
            open(diag_path,'w',encoding='utf-8').write(json.dumps(diagnostics,sort_keys=True,separators=(',',':'))+'\n')
            evidence={'class':'D-1000','scope':'1000-real-process-scale+partial-convergence-diagnostics','partial':True,'result':'FAIL','failureStage':'convergence','failureReason':reason,'testedCommit':os.environ.get('GITHUB_SHA'),'workflowRunId':os.environ.get('GITHUB_RUN_ID'),
              'topology':{'nodeCount':int(node_count),'realProcessCount':int(node_count),'hostCount':int(host_count),'realProcessesPerHost':int(nodes_per_host),'uniqueIdentityCount':int(node_count),'uniqueEndpointCount':int(node_count),'syntheticNodeCount':0,'transport':'real UDP/QUIC over Azure VNet','bootstrap':'sparse Kademlia local+bridge'},
              'routing':{'baselineSuccessRatio':0,'healedSuccessRatio':0,'notRunBecause':'convergence_failed_before_baseline'},
              'convergence':{'routingSuccessRatio':float(conv_rate),'successfulProbes':int(conv_success),'nodeProbeCount':int(conv_total),'latencyMs':{'p95':float(conv_p95),'p99':float(conv_p99)},'hosts':hosts},
              'diagnostics':diagnostics,
              'recovery':{'latencyMs':{'p95':999999},'notRunBecause':'convergence_failed'},
              'adversarial':{'notRunBecause':'convergence_failed'},
              'safety':{'acknowledgedWriteLossCount':999999,'invalidSignedStateAcceptedCount':999999,'staleRevokedReceiptAcceptedCount':999999,'unauthorizedProviderExecutionCount':999999,'notRunBecause':'convergence_failed'},
              'resources':{'notCollectedBecause':'convergence_failed'},'timing':{'campaignMs':int(end_ms)-int(start_ms)},'cleanup':{'confirmed':False,'remainingResources':None,'finalizedByExitTrap':True}}
            open(evidence_path,'w',encoding='utf-8').write(json.dumps(evidence,sort_keys=True,separators=(',',':'))+'\n')
            print('TRUYN_CLASS_D_1000_PARTIAL_EVIDENCE=PASS stage=convergence reason='+reason+' diagnostics='+diag_path)
            PY
            }

            conv_success=0; conv_total=0; conv_p95=0; conv_p99=0
            for i in $(seq 0 $((HOST_COUNT-1))); do
              script=$(cat <<EOS
            set -Eeuo pipefail
            python3 - <<'PY'
            import base64, collections, concurrent.futures, json, subprocess, time
            records=json.load(open('/var/lib/truyn-d1000/records-by-host.json'))
            host=${i}; H=${HOST_COUNT}; N=${NODES_PER_HOST}; base=${CONTROL_BASE}
            def classify(proc, path):
                code=proc.stdout.strip()
                if proc.returncode == 28: return {'reason':'curl_timeout','httpCode':code or '000','returnCode':proc.returncode}
                if proc.returncode != 0: return {'reason':'curl_rc_'+str(proc.returncode),'httpCode':code or '000','returnCode':proc.returncode,'stderr':proc.stderr.strip()[-240:]}
                if code != '200':
                    reason='http_'+(code or '000')
                    try:
                        body=json.load(open(path, encoding='utf-8'))
                        if body.get('error'): reason=str(body.get('error'))
                    except Exception:
                        pass
                    return {'reason':reason,'httpCode':code or '000','returnCode':proc.returncode}
                return {'reason':'deadline_expired','httpCode':code or '000','returnCode':proc.returncode}
            def one(j):
                th=(host+1+(j%(H-1)))%H; tl=(j*17+host*7)%N; node_id=records[th][tl]['nodeId']
                body=json.dumps({'nodeId':node_id,'input':{'scenario':'d1000-convergence','source':host*N+j,'targetHost':th,'targetLocal':tl}},separators=(',',':'))
                start=time.monotonic(); deadline=start+175; attempts=0; last=None; path='/tmp/d1000-conv-'+str(j)
                while time.monotonic()<deadline:
                    attempts+=1
                    p=subprocess.run(['curl','-sS','--max-time','12','-o',path,'-w','%{http_code}','-H','content-type: application/json','--data-binary',body,f'http://127.0.0.1:{base+j}/need'],text=True,capture_output=True)
                    if p.returncode==0 and p.stdout.strip()=='200': return {'ok':True,'latencyMs':round((time.monotonic()-start)*1000,3),'attempts':attempts,'sourceLocal':j,'targetHost':th,'targetLocal':tl,'targetNodeId':node_id}
                    last=classify(p,path); time.sleep(.5)
                return {'ok':False,'latencyMs':175000.0,'attempts':attempts,'sourceLocal':j,'targetHost':th,'targetLocal':tl,'targetNodeId':node_id,'failure':last or {'reason':'deadline_expired','httpCode':'000','returnCode':-1}}
            with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex: rows=list(ex.map(one,range(N)))
            lat=sorted(r['latencyMs'] for r in rows if r.get('ok')); success=sum(1 for r in rows if r.get('ok'))
            def q(p):
                if not lat: return 999999
                return round(lat[min(len(lat)-1,max(0,int((len(lat)-1)*p)))],3)
            diag={'host':host,'success':success,'total':N,'p95Ms':q(.95),'p99Ms':q(.99),'failureReasons':dict(collections.Counter(r.get('failure',{}).get('reason','none') for r in rows if not r.get('ok'))),'httpCodes':dict(collections.Counter(str(r.get('failure',{}).get('httpCode','200' if r.get('ok') else '000')) for r in rows)),'returnCodes':dict(collections.Counter(str(r.get('failure',{}).get('returnCode',0 if r.get('ok') else -1)) for r in rows)),'targetHostSuccesses':dict(collections.Counter(str(r['targetHost']) for r in rows if r.get('ok'))),'targetHostProbes':dict(collections.Counter(str(r['targetHost']) for r in rows)),'probes':rows}
            print('CONV_OK='+str(success)); print('CONV_TOTAL='+str(N)); print('CONV_P95='+str(q(.95))); print('CONV_P99='+str(q(.99)))
            print('CONV_DIAG_B64='+base64.b64encode(json.dumps(diag,separators=(',',':')).encode()).decode())
            PY
            EOS
            )
              out=$(remote "${VMS[$i]}" "$script")
              ok=$(marker "$out" CONV_OK); total=$(marker "$out" CONV_TOTAL); p95=$(marker "$out" CONV_P95); p99=$(marker "$out" CONV_P99); b64=$(marker "$out" CONV_DIAG_B64)
              [[ -n "$b64" ]]
              printf '%s' "$b64" | base64 -d >>"$CONV_HOSTS_JSONL"
              printf '\n' >>"$CONV_HOSTS_JSONL"
              conv_success=$((conv_success+ok)); conv_total=$((conv_total+total))
              conv_p95=$(python3 -c "print(max(float('$conv_p95'),float('$p95')))" )
              conv_p99=$(python3 -c "print(max(float('$conv_p99'),float('$p99')))" )
              echo "TRUYN_CLASS_D_1000 stage=convergence host=$i success=${ok}/${total} p95Ms=${p95} p99Ms=${p99}"
            done
            conv_rate=$(python3 -c "print(round($conv_success/$conv_total,6))")
            if ! python3 - <<PY
            conv_rate=float('$conv_rate')
            conv_p95=float('$conv_p95')
            if conv_rate < .99 or conv_p95 > 120000:
                raise SystemExit(1)
            PY
            then
              collect_convergence_node_diagnostics
              write_convergence_partial_evidence "threshold_failed"
              false
            fi
          ''').lstrip()
          text = text[:start] + block + text[end:]
          campaign.write_text(text)

          tests = Path('tests/class-d-1000-partial-evidence.test.js')
          tests.write_text(textwrap.dedent(r'''
            import test from 'node:test';
            import assert from 'node:assert/strict';
            import { readFile } from 'node:fs/promises';

            test('D-1000 convergence failures emit partial evidence diagnostics before failing closed', async () => {
              const campaign = await readFile('benchmarks/scale/class-d-azure-1000-campaign.sh', 'utf8');
              assert.match(campaign, /class-d-1000-convergence-hosts\.jsonl/);
              assert.match(campaign, /class-d-1000-node-diagnostics\.jsonl/);
              assert.match(campaign, /class-d-1000-convergence-diagnostics\.json/);
              assert.match(campaign, /write_convergence_partial_evidence/);
              assert.match(campaign, /TRUYN_CLASS_D_1000_PARTIAL_EVIDENCE=PASS/);
              assert.match(campaign, /CONV_DIAG_B64/);
              assert.match(campaign, /NODE_DIAG_B64/);
              assert.match(campaign, /failureReasons/);
              assert.match(campaign, /targetHostSuccesses/);
              assert.match(campaign, /targetHostProbes/);
              assert.match(campaign, /connectedPeerCount/);
              assert.match(campaign, /knownPeersByRemoteHost/);
              assert.match(campaign, /routingTableSize/);
              assert.match(campaign, /threshold_failed/);
            });

            test('testnet node service exposes route-level diagnostics for D-1000 convergence analysis', async () => {
              const service = await readFile('network/testnet/node-service.js', 'utf8');
              assert.match(service, /diagnosticsSnapshot/);
              assert.match(service, /url\.pathname === '\/diagnostics'/);
              assert.match(service, /routingBucketCount/);
              assert.match(service, /knownPeerRecords/);
              assert.match(service, /connectedPeerCount/);
              assert.match(service, /outboundAdmission/);
              assert.match(service, /inboundAdmission/);
              assert.match(service, /quicClientCount/);
              assert.match(service, /peerRecordLifecycleSnapshot/);
            });
          ''').lstrip())
          PY
      - name: Validate patch
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n benchmarks/scale/class-d-azure-1000-campaign.sh
          node --check network/testnet/node-service.js
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/tmp-d1000-partial-evidence-patcher.yml
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add benchmarks/scale/class-d-azure-1000-campaign.sh network/testnet/node-service.js tests/class-d-1000-partial-evidence.test.js .github/workflows/tmp-d1000-partial-evidence-patcher.yml
          git commit -m "fix(d1000): preserve partial convergence evidence" -m "Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>"
          git push origin HEAD:fix/d1000-partial-convergence-evidence

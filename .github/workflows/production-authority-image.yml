name: Production Authority Image

on:
  pull_request:
    paths:
      - '.github/workflows/production-authority-image.yml'
      - 'tests/production-authority-image.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-authority-image.yml'
      - 'tests/production-authority-image.test.js'

permissions:
  contents: read
  id-token: write

env:
  SOURCE_SHA: 37144e03eaba714be26d106b3b0d396f0801f7d6
  IMAGE_REPOSITORY: truyn-authority
  RESOURCE_GROUP: ${{ vars.TRUYN_AZURE_RESOURCE_GROUP || 'truyn' }}
  REGION_PAIRS: ${{ vars.TRUYN_DR_REGION_PAIRS || 'germanywestcentral:francecentral northeurope:swedencentral' }}
  AZURE_CLIENT_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_VALUE: ${{ vars[format('AZURE_{0}', 'TENANT_ID')] || secrets[format('AZURE_{0}', 'TENANT_ID')] }}
  AZURE_SUBSCRIPTION_VALUE: ${{ vars[format('AZURE_{0}', 'SUBSCRIPTION_ID')] || secrets[format('AZURE_{0}', 'SUBSCRIPTION_ID')] }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable authority image contract
        run: node --test tests/production-authority-image.test.js

  build-and-record:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact accepted authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$SOURCE_SHA" ]] || {
            echo '::error::Authority image source checkout is not the accepted SHA.'
            exit 1
          }

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_VALUE }}

      - name: Resolve accepted production registry
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$RESOURCE_GROUP"
          registry=''
          attempt=0

          for pair in $REGION_PAIRS; do
            attempt=$((attempt + 1))
            [[ "$attempt" -le 2 ]] || break
            [[ "$pair" == *:* ]] || { echo '::error::Invalid production region pair.'; exit 1; }
            primary="${pair%%:*}"
            secondary="${pair#*:}"
            pair_suffix="$(printf '%s' "${GITHUB_REPOSITORY}:${GITHUB_REPOSITORY_ID}:${primary}:${secondary}" | sha256sum | cut -c1-10)"
            prefix="truyn${pair_suffix}"
            environment="${prefix}-aca-env"
            cosmos="${prefix}cosmos"
            candidate_registry="${prefix}acr"
            for value in "$prefix" "$environment" "$cosmos" "$candidate_registry"; do printf '::add-mask::%s\n' "$value"; done

            if ! environment_id="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$environment" --query id -o tsv --only-show-errors 2>/dev/null)"; then
              continue
            fi
            [[ -n "$environment_id" ]] || continue
            printf '::add-mask::%s\n' "$environment_id"
            if ! environment_json="$(az resource show --ids "$environment_id" --api-version 2025-07-01 --only-show-errors -o json 2>/dev/null)"; then
              continue
            fi
            if ! cosmos_json="$(az cosmosdb show --resource-group "$RESOURCE_GROUP" --name "$cosmos" --only-show-errors -o json 2>/dev/null)"; then
              continue
            fi
            if ! registry_json="$(az acr show --resource-group "$RESOURCE_GROUP" --name "$candidate_registry" --only-show-errors -o json 2>/dev/null)"; then
              continue
            fi

            if ! jq -e '
              (.properties.vnetConfiguration.internal // false) == true and
              ((.properties.publicNetworkAccess // "") | ascii_downcase) == "disabled" and
              (.properties.provisioningState // "") == "Succeeded"
            ' <<<"$environment_json" >/dev/null; then
              continue
            fi
            if ! jq -e --arg primary "$primary" --arg secondary "$secondary" '
              .provisioningState == "Succeeded" and
              ([.locations[].locationName | gsub(" "; "") | ascii_downcase] | sort) == ([$primary, $secondary] | sort)
            ' <<<"$cosmos_json" >/dev/null; then
              continue
            fi
            if ! jq -e '.provisioningState == "Succeeded"' <<<"$registry_json" >/dev/null; then
              continue
            fi

            registry="$candidate_registry"
            break
          done

          [[ -n "$registry" ]] || {
            echo '::error::No accepted production registry is available.'
            exit 1
          }
          printf 'REGISTRY_NAME=%s\n' "$registry" >> "$GITHUB_ENV"

      - name: Build immutable authority image from accepted SHA
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${IMAGE_REPOSITORY}:${SOURCE_SHA}"
          az acr build \
            --resource-group "$RESOURCE_GROUP" \
            --registry "$REGISTRY_NAME" \
            --image "$image_tag" \
            --file Dockerfile \
            --only-show-errors \
            . >/dev/null

      - name: Resolve immutable manifest digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="${IMAGE_REPOSITORY}:${SOURCE_SHA}"
          digest="$(az acr manifest show-metadata \
            --registry "$REGISTRY_NAME" \
            --name "$image_name" \
            --query digest \
            -o tsv \
            --only-show-errors)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Authority image digest is missing or malformed.'
            exit 1
          }
          printf 'AUTHORITY_IMAGE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Emit sanitized immutable image evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "$SOURCE_SHA" \
            --arg digest "$AUTHORITY_IMAGE_DIGEST" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "truyn.production-authority-image-evidence/v1",
              component: "production-authority-image",
              sourceSha: $sourceSha,
              sourceCheckoutVerified: true,
              image: {
                repository: $repository,
                tag: $tag,
                digest: $digest,
                immutableReference: ($repository + "@" + $digest)
              },
              mutableTagUsed: false,
              generatedAt: $generatedAt,
              status: "PASS"
            }' > production-authority-image-evidence.json

      - name: Upload sanitized authority image evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-authority-image-evidence
          path: production-authority-image-evidence.json
          if-no-files-found: error
          retention-days: 30

name: One-shot NuGet.org documentation reconciliation

on:
  push:
    branches:
      - docs/nuget-accepted-20260923

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/nuget-accepted-20260923
          fetch-depth: 0

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "d15046f549e9b0bf0480bb1960f84e3daecc3dfc"
          git merge-base --is-ancestor d15046f549e9b0bf0480bb1960f84e3daecc3dfc HEAD

      - name: Reconcile current documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile-nuget-docs.py
          python3 -m json.tool sdk/release/public-coordinates.json >/dev/null
          grep -F 'Truyn.Sdk@0.1.0-alpha.1' docs/releases/NUGET_0.1.0_ALPHA_1.md >/dev/null
          grep -F 'publicationPush: PASS' docs/releases/NUGET_0.1.0_ALPHA_1.md >/dev/null
          grep -F 'repositorySignatureVerification: PASS' docs/releases/NUGET_0.1.0_ALPHA_1.md >/dev/null
          grep -F 'cleanRoomRestore: PASS' docs/releases/NUGET_0.1.0_ALPHA_1.md >/dev/null
          git diff --check

      - name: Commit reconciled documentation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-nuget-doc-reconcile.yml scripts/reconcile-nuget-docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -s -m 'docs(release): reconcile accepted NuGet.org alpha.1'
          git push origin HEAD:docs/nuget-accepted-20260923

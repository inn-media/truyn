name: tmp-class-d1000-ee0732b5-immutable-vm-preflight-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-ee0732b5-immutable-vm-preflight-v2.yml'

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: class-d1000-ee0732b5-immutable-vm-preflight-v2
  cancel-in-progress: false

env:
  TESTED_COMMIT: ee0732b57a602bea8df9f964bf5fe27d19ee77f8
  PINNED_REF: d1000/pinned-ee0732b5
  EXACT_CI_RUN: '32853716543'
  EXACT_CODEQL_RUN: '32853711776'
  ARTIFACT_NAME: class-d-1000-vm-preflight-ee0732b5-v2
  AZURE_LOCATION: eastus2
  AZURE_VM_SIZE: Standard_E2as_v7

jobs:
  immutable-vm-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Enforce one-shot launcher commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d1000-ee0732b5-immutable-vm-preflight-v2.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'added'

      - name: Record immutable VM preflight start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE} stage=started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 EE0732B5 IMMUTABLE VM PREFLIGHT V2 STARTED' -f "body=${body}" >/dev/null

      - name: Checkout exact pinned source
        uses: actions/checkout@v4
        with:
          ref: d1000/pinned-ee0732b5
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact green source and pinned ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git ls-remote origin "refs/heads/${PINNED_REF}" | cut -f1)" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN}" --jq '.name')" = CI
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN}" --jq '.status')" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CI_RUN}" --jq '.conclusion')" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CODEQL_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CODEQL_RUN}" --jq '.status')" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_CODEQL_RUN}" --jq '.conclusion')" = success
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          git diff --check

      - name: Immutable prepare-only acceptance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh | tee class-d-1000-prerun.txt
          grep -Fqx 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned' class-d-1000-prerun.txt

      - name: Build and locally smoke-test immutable runtime bundle
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p preflight runtime-smoke
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" bash scripts/build-class-d-1000-runtime-bundle.sh preflight/truyn-d1000-runtime.tgz | tee preflight/runtime-build.txt
          bundle_sha="$(awk '{print $1}' preflight/truyn-d1000-runtime.tgz.sha256)"
          test "$bundle_sha" = "$(sha256sum preflight/truyn-d1000-runtime.tgz | awk '{print $1}')"
          tar -xzf preflight/truyn-d1000-runtime.tgz -C runtime-smoke
          test "$(jq -r '.sourceSha' runtime-smoke/manifest.json)" = "$TESTED_COMMIT"
          test "$(jq -r '.schema' runtime-smoke/manifest.json)" = 'truyn.class-d1000.runtime-bundle.v1'
          loader="$(jq -r '.runtimeLoader' runtime-smoke/manifest.json)"
          test -n "$loader"
          test -x "runtime-smoke/runtime/lib/$loader"
          runtime-smoke/runtime/bin/node -e "import(process.cwd() + '/runtime-smoke/app/network/testnet/node-service.js').then(()=>console.log('TRUYN_CLASS_D1000_LOCAL_RUNTIME_IMPORT=PASS'))"
          printf '%s\n' "$bundle_sha" > preflight/runtime-bundle-sha256.txt
          cp runtime-smoke/manifest.json preflight/runtime-manifest.json
          cp class-d-1000-prerun.txt preflight/
          echo "sha256=$bundle_sha" >>"$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fail-closed one-VM Azure capacity preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          usage_json="$(az vm list-usage -l "$AZURE_LOCATION" -o json --only-show-errors)"
          regional_current="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].currentValue' <<<"$usage_json")"
          regional_limit="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].limit' <<<"$usage_json")"
          test "$regional_current" != null
          test "$regional_limit" != null
          test $((regional_limit - regional_current)) -ge 2
          sku_json="$(az vm list-skus -l "$AZURE_LOCATION" --size "$AZURE_VM_SIZE" --all -o json --only-show-errors)"
          test "$(jq 'length' <<<"$sku_json")" -ge 1
          test "$(jq -r '[.[].capabilities[]? | select(.name=="vCPUs") | .value][0]' <<<"$sku_json")" = 2
          test "$(jq -r '[.[].capabilities[]? | select(.name=="MemoryGB") | .value][0]' <<<"$sku_json")" = 16
          test "$(jq '[.[].restrictions[]? | select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")] | length' <<<"$sku_json")" = 0
          echo "TRUYN_CLASS_D1000_VM_CAPACITY=PASS location=${AZURE_LOCATION} vmSize=${AZURE_VM_SIZE}"

      - name: Execute immutable bundle on real target Azure VM
        id: vm_smoke
        shell: bash
        env:
          TRUYN_AZURE_RESOURCE_GROUP: truyn
          TRUYN_CLASS_D1000_LOCATION: ${{ env.AZURE_LOCATION }}
          TRUYN_CLASS_D1000_VM_SIZE: ${{ env.AZURE_VM_SIZE }}
        run: |
          set -Eeuo pipefail
          bash scripts/class-d-1000-vm-smoke-preflight.sh preflight/truyn-d1000-runtime.tgz '${{ steps.bundle.outputs.sha256 }}' | tee preflight/vm-smoke.txt
          grep -Fqx "TRUYN_CLASS_D1000_VM_SMOKE=PASS guest=true cleanup=true remaining=0 location=${AZURE_LOCATION} vmSize=${AZURE_VM_SIZE}" preflight/vm-smoke.txt

      - name: Build immutable preflight manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle_sha='${{ steps.bundle.outputs.sha256 }}'
          runtime_loader="$(jq -r '.runtimeLoader' preflight/runtime-manifest.json)"
          python3 - "$TESTED_COMMIT" "$PINNED_REF" "$EXACT_CI_RUN" "$EXACT_CODEQL_RUN" "$bundle_sha" "$runtime_loader" "$AZURE_LOCATION" "$AZURE_VM_SIZE" > preflight/class-d-1000-vm-preflight-manifest.json <<'PY'
          import json, sys
          source, pinned, ci, codeql, bundle_sha, loader, location, vm_size = sys.argv[1:]
          print(json.dumps({
            'schema':'truyn.class-d1000.immutable-vm-preflight.v2',
            'result':'PASS',
            'sourceSha':source,
            'pinnedRef':pinned,
            'exactChecks':{'ciRun':int(ci),'codeqlRun':int(codeql)},
            'prepareOnly':True,
            'vmSmoke':True,
            'azureMutation':True,
            'cleanup':{'confirmed':True,'remainingResources':0},
            'target':{'location':location,'vmSize':vm_size,'image':'Ubuntu2204'},
            'runtimeBundle':{'file':'truyn-d1000-runtime.tgz','sha256':bundle_sha,'schema':'truyn.class-d1000.runtime-bundle.v1','osCompatibility':'ubuntu-22.04-amd64','runtimeLoader':loader},
            'preparedHarnessMarker':'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned'
          },sort_keys=True,separators=(',',':')))
          PY
          test "$(jq -r '.result' preflight/class-d-1000-vm-preflight-manifest.json)" = PASS
          test "$(jq -r '.sourceSha' preflight/class-d-1000-vm-preflight-manifest.json)" = "$TESTED_COMMIT"
          test "$(jq -r '.cleanup.confirmed' preflight/class-d-1000-vm-preflight-manifest.json)" = true
          test "$(jq -r '.cleanup.remainingResources' preflight/class-d-1000-vm-preflight-manifest.json)" = 0

      - name: Upload immutable VM preflight artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: preflight/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable VM preflight PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/lib/sha256-digest.sh
          artifact_digest="$(truyn_normalize_sha256_digest "$RAW_ARTIFACT_DIGEST")"
          test -n "$ARTIFACT_ID"
          [[ "$artifact_digest" == sha256:* ]]
          api_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest')"
          test "$api_digest" = "$artifact_digest"
          bundle_sha='${{ steps.bundle.outputs.sha256 }}'
          test "$(jq -r '.runtimeBundle.sha256' preflight/class-d-1000-vm-preflight-manifest.json)" = "$bundle_sha"
          body="result=PASS run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} artifact_id=${ARTIFACT_ID} artifact_name=${ARTIFACT_NAME} artifact_digest=${artifact_digest} runtime_bundle_sha256=${bundle_sha} prepareOnly=true vmSmoke=true azureMutation=true cleanup=true remainingResources=0 azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 EE0732B5 IMMUTABLE VM PREFLIGHT V2 PASS' -f "body=${body}" >/dev/null

      - name: Publish immutable VM preflight failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          body="result=FAIL run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 EE0732B5 IMMUTABLE VM PREFLIGHT V2 FAIL' -f "body=${body}" >/dev/null

name: G5 capacity source application (no cloud)
on:
  push:
    branches: [g5/global-record-capacity-990-20261012]
    paths: [.github/workflows/g5-capacity-source-apply-once.yml]
permissions:
  contents: write
concurrency:
  group: g5-capacity-source-apply-990
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'inn-media/truyn' && github.ref == 'refs/heads/g5/global-record-capacity-990-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact checked source on this branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/g5/global-record-capacity-990-20261012
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin refs/heads/g5/global-record-capacity-990-20261012
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python .github/g5-capacity-apply.py
          node --check network/relay/cosmos-lifecycle-ledger.js
          node --test tests/g5-global-capacity.test.js tests/g5-cosmos-distributed-ledger.test.js tests/g5-cosmos-deadline-regressions.test.js tests/g5-durable-response-receipt.test.js tests/g5-independent-witness-recovery.test.js tests/g5-recovered-result-finality.test.js
          git diff --check
          git rm .github/g5-capacity-apply.py .github/workflows/g5-capacity-source-apply-once.yml
          git add network/relay/cosmos-lifecycle-ledger.js runtime/g5-provider-effect-ledger.js runtime/g5-relay-lifecycle-ledger.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'feat(g5): enforce shared retained-ID capacity before lifecycle creation'
          git push origin HEAD:refs/heads/g5/global-record-capacity-990-20261012

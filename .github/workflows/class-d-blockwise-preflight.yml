name: Class D Blockwise Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/class-d-*.yml'
      - 'benchmarks/scale/**'
      - 'network/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/class-d-*.yml'
      - 'benchmarks/scale/**'
      - 'network/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main SHA to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: class-d-blockwise-${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}

jobs:
  block:
    name: ${{ matrix.block }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        block:
          - B01_SOURCE_INTEGRITY
          - B02_BOOTSTRAP_REFRESH
          - B03_RUNTIME_BUNDLE
          - B04_NETWORK
          - B05_REGRESSION
          - B06_SECURITY
          - B07_COMPONENT
          - B08_INTEGRATION
          - B09_SDK
          - B10_FAST_GOVERNANCE
          - B11_CLASS_D_ACCEPTANCE
          - B12_WORKFLOW_CONTRACT
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            [[ "$main_sha" == "$SOURCE_SHA" ]]
          fi

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete block and retain every assertion
        id: harness
        continue-on-error: true
        env:
          BLOCK_ID: ${{ matrix.block }}
          BLOCK_OUT_DIR: blockwise-out
        shell: bash
        run: |
          set -o pipefail
          node scripts/class-d-blockwise-preflight.mjs
          rc=$?
          echo "harness_rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish block report to Actions Summary
        if: always()
        shell: bash
        run: |
          set +e
          report="blockwise-out/${{ matrix.block }}/report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# ${{ matrix.block }} — RED"
              echo
              echo "Block report was not produced; this is itself a RED assertion."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete block telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-d-block-${{ matrix.block }}-${{ github.run_id }}
          path: blockwise-out/${{ matrix.block }}
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce block terminal status after evidence publication
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          file="blockwise-out/${{ matrix.block }}/block.json"
          [[ -s "$file" ]]
          jq -e '.probeCompletion.complete == true and .status == "GREEN" and .harnessReturnCode == 0' "$file" >/dev/null

  aggregate:
    name: B99_AGGREGATE_FAILURE_REPORT
    needs: [block]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download every block artifact
        uses: actions/download-artifact@v4
        with:
          pattern: class-d-block-*-${{ github.run_id }}
          path: blockwise-input
          merge-multiple: false

      - name: Aggregate all block ledgers
        id: aggregate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/class-d-blockwise-aggregate.mjs blockwise-input blockwise-aggregate | tee blockwise-aggregate-console.log
          rc=${PIPESTATUS[0]}
          echo "aggregate_rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish common failure report directly in Actions UI
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f blockwise-aggregate/report.md ]]; then
            cat blockwise-aggregate/report.md >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo '# Class-D Blockwise Preflight — RED'
              echo
              echo 'Aggregator did not produce report.md.'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-d-blockwise-report-${{ github.run_id }}
          path: |
            blockwise-aggregate
            blockwise-aggregate-console.log
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce aggregate terminal gate after full report publication
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s blockwise-aggregate/summary.json
          test -s blockwise-aggregate/red-report.json
          test -s blockwise-aggregate/report.md
          test -s blockwise-aggregate/events.jsonl
          jq -e '.status == "GREEN" and .blockCompletion.completed == 12 and .blockCompletion.green == 12 and .blockCompletion.red == 0 and .assertionCounts.red == 0' blockwise-aggregate/summary.json >/dev/null

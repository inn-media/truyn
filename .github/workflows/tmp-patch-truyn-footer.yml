name: Temporary TRUYN footer source patch

on:
  push:
    branches: [fix/truin-footer-innmedia-ecosystem]
    paths: [.github/workflows/tmp-patch-truyn-footer.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current production HTML and patch footer
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --max-time 30 "https://truyn.org/?source-patch=${GITHUB_RUN_ID}" -o /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re

          links=[
            ('InnMedia Group','https://innmedia.group/'),
            ('OS','https://innmediaservices.com/'),
            ('SOLO','https://inn.media/'),
            ('SIGNAL','https://innmedia.services/'),
            ('EXCHANGE','https://exchange.innmediaservices.com/'),
            ('Data Graph','https://graph.innmediaservices.com/'),
          ]
          new_copy='© 2023 - 2026 Innovation Media Services Inc. All rights reserved. TRUYN is developed and maintained by InnMedia'
          p=Path('/tmp/index.html')
          html=p.read_text(encoding='utf-8')
          s=html.rfind('<footer'); e=html.find('</footer>',s)
          if s<0 or e<0: raise RuntimeError('footer not found')
          e += len('</footer>')
          footer=html[s:e]
          def txt(x): return unescape(re.sub(r'<[^>]+>','',x)).replace('\xa0',' ').strip()
          anchors=list(re.finditer(r'<a\b[^>]*>.*?</a>',footer,re.I|re.S))
          targets=[m for m in anchors if txt(m.group(0)).startswith('B2B') or txt(m.group(0)).startswith('B2C')]
          if len(targets)!=2: raise RuntimeError(f'expected 2 legacy links, found {len(targets)}')
          old=footer[targets[0].start():targets[-1].end()]
          if 'innmediaservices.com' not in old or 'inn.media' not in old: raise RuntimeError('legacy link URLs mismatch')
          replacement='&nbsp;&nbsp;'.join(f'<a href="{url}" target="_blank" rel="noopener noreferrer"><strong>{label} ↗</strong></a>' for label,url in links)
          footer=footer[:targets[0].start()]+replacement+footer[targets[-1].end():]
          pattern=re.compile(r'TRUYN\s+is\s+developed\s+and\s+maintained\s+by\s+Innovation\s+Media\s+Services\.?',re.I)
          footer,n=pattern.subn(new_copy,footer,count=1)
          if n!=1: raise RuntimeError('legacy maintainer text not found exactly once')
          visible=txt(footer)
          if re.search(r'\bB2B\b|\bB2C\b',visible): raise RuntimeError('legacy labels remain')
          if new_copy not in visible: raise RuntimeError('new copyright text missing')
          for label,url in links:
            if label not in footer or f'href="{url}"' not in footer: raise RuntimeError(f'missing {label}')
          p.write_text(html[:s]+footer+html[e:],encoding='utf-8')
          print('FOOTER_PATCH=PASS')
          PY
          cp /tmp/index.html _tmp_public_site/index.html
          git diff --check
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add _tmp_public_site/index.html
          git diff --cached --quiet && { echo 'No source change'; exit 1; }
          git commit -m $'fix(site): update TRUYN InnMedia footer\n\nSigned-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:${GITHUB_REF_NAME}

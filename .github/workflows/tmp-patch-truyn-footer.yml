name: Temporary TRUYN footer patch

on:
  push:
    branches:
      - fix/truyn-footer-innmedia-ecosystem
    paths:
      - .github/workflows/tmp-patch-truyn-footer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hardcoded InnMedia ecosystem links in deployed static payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import string

          LINKS = [
              ("InnMedia Group", "https://innmedia.group/"),
              ("OS", "https://innmediaservices.com/"),
              ("SOLO", "https://inn.media/"),
              ("SIGNAL", "https://innmedia.services/"),
              ("EXCHANGE", "https://exchange.innmediaservices.com/"),
              ("Data Graph", "https://graph.innmediaservices.com/"),
          ]

          def strip_tags(value: str) -> str:
              return re.sub(r"<[^>]+>", "", value).replace("&nbsp;", " ").strip()

          def patch_html(html: str) -> tuple[str, str]:
              marker = html.find("B2B")
              if marker < 0:
                  raise RuntimeError("B2B footer marker not found in decoded public-site payload")
              start = html.rfind("<footer", 0, marker)
              end = html.find("</footer>", marker)
              if start < 0 or end < 0:
                  raise RuntimeError("footer bounds not found")
              end += len("</footer>")
              footer = html[start:end]
              anchors = list(re.finditer(r"<a\b[^>]*>.*?</a>", footer, re.I | re.S))
              target = [m for m in anchors if strip_tags(m.group(0)).startswith("B2B") or strip_tags(m.group(0)).startswith("B2C")]
              if len(target) != 2:
                  raise RuntimeError(f"expected exactly two B2B/B2C footer anchors, found {len(target)}")
              old = footer[target[0].start():target[-1].end()]
              if "innmediaservices.com" not in old or "inn.media" not in old:
                  raise RuntimeError("old footer anchors do not point to expected InnMedia URLs")
              replacement = "&nbsp;&nbsp;".join(
                  f'<a href="{url}" target="_blank" rel="noopener noreferrer"><strong>{label} ↗</strong></a>'
                  for label, url in LINKS
              )
              patched_footer = footer[:target[0].start()] + replacement + footer[target[-1].end():]
              for label, url in LINKS:
                  if url not in patched_footer or label not in patched_footer:
                      raise RuntimeError(f"missing hardcoded footer link after patch: {label}")
              visible = strip_tags(patched_footer)
              if re.search(r"\bB2B\b|\bB2C\b", visible):
                  raise RuntimeError("legacy B2B/B2C labels remain in footer")
              return html[:start] + patched_footer + html[end:], patched_footer

          path = Path("_tmp_public_site/index.html")
          original = path.read_text(encoding="utf-8")
          alphabet = set(string.ascii_letters + string.digits + "+/=")
          compact = "".join(ch for ch in original if ch in alphabet)
          ignored = len(original) - len(compact)
          print(f"legacy payload framing chars ignored: {ignored}")
          compact += "=" * (-len(compact) % 4)
          decoded_bytes = base64.b64decode(compact, validate=False)
          decoded = decoded_bytes.decode("utf-8")
          if "<head" not in decoded and "<html" not in decoded:
              raise RuntimeError("decoded public-site payload is not HTML")
          patched, _ = patch_html(decoded)

          # Normalize the legacy representation to a one-line base64 payload.
          path.write_text(base64.b64encode(patched.encode("utf-8")).decode("ascii"), encoding="utf-8")

          # Decode the just-written payload again and prove the footer is hardcoded correctly.
          check = base64.b64decode(path.read_text(encoding="utf-8"), validate=True).decode("utf-8")
          footer_start = check.rfind("<footer", 0, check.find("InnMedia Group"))
          footer_end = check.find("</footer>", footer_start) + len("</footer>")
          verified_footer = check[footer_start:footer_end]
          for label, url in LINKS:
              assert label in verified_footer, label
              assert url in verified_footer, url
          visible = strip_tags(verified_footer)
          assert not re.search(r"\bB2B\b|\bB2C\b", visible)
          print(verified_footer)
          PY

          git diff --check
          git config user.name "Iluco Mutcnas"
          git config user.email "197368050+ilucomutcnas@users.noreply.github.com"
          git add _tmp_public_site/index.html
          git diff --cached --quiet && { echo 'No footer changes produced'; exit 1; }
          git commit -m $'fix(site): hardcode InnMedia ecosystem footer links\n\nSigned-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:${GITHUB_REF_NAME}

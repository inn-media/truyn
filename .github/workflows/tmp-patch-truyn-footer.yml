name: Temporary TRUYN footer patch

on:
  push:
    branches: [fix/truyn-footer-innmedia-ecosystem]
    paths: [.github/workflows/tmp-patch-truyn-footer.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect encoded public-site sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          paths=['_tmp_public_site/index.html','_tmp_public_site/assets/css/styles.css','_tmp_public_site/assets/js/app.js','_tmp_public_site/assets/js/translations.js']
          for path in paths:
            raw=Path(path).read_bytes()
            print(path,'raw_len=',len(raw),'raw_head=',repr(raw[:40]))
            if path.endswith('index.html'):
              text=raw.decode('utf-8'); c=re.sub(r'\s+','',text); c+='='*(-len(c)%4)
              dec=base64.b64decode(c,validate=False)
              html=dec.decode('utf-8',errors='replace')
              print('decoded_len=',len(dec),'decoded_head=',repr(dec[:80]))
              print('decoded_has_B2B=', 'B2B' in html)
              print('decoded_has_old_maintainer=', 'TRUYN is developed and maintained by Innovation Media Services' in html)
              if '<footer' in html:
                s=html.rfind('<footer'); e=html.find('</footer>',s)
                print('DECODED_FOOTER_START'); print(html[s:e+9]); print('DECODED_FOOTER_END')
          PY
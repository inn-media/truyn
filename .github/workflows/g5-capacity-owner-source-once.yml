name: G5 owner index capacity source repair (no cloud)
on:
  push:
    branches: [g5/global-record-capacity-990-20261012]
    paths: [.github/workflows/g5-capacity-owner-source-once.yml]
permissions:
  contents: write
concurrency:
  group: g5-capacity-source-apply-990
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'inn-media/truyn' && github.ref == 'refs/heads/g5/global-record-capacity-990-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin refs/heads/g5/global-record-capacity-990-20261012
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('network/relay/cosmos-lifecycle-ledger.js');data=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='51772f59569d04a518cd435a244704f24a0db580'
          s=data.decode();old='/^(need|offer|effect)-[a-f0-9]{64}$/'
          assert s.count(old)==1
          p.write_text(s.replace(old,'/^(need|offer|effect|offer-owner)-[a-f0-9]{64}$/'))
          p=Path('docs/compatibility/TRUYN1_G5_RECORD_CAPACITY.md');s=p.read_text()
          s=s.replace('NEED, OFFER or effect record','NEED, OFFER, effect or OFFER-owner index record')
          s=s.replace('managed NEED/OFFER/effect IDs plus one allocation document','managed NEED/OFFER/effect/offer-owner IDs plus one allocation document')
          s+='\nOwner-directory coordination records use the same bound. Releasing an active\nOFFER slot does not release the permanent owner-index or OFFER ticket. This\nkeeps repeated owner registration and withdrawal within the retained-ID budget.\n'
          p.write_text(s)
          PY
          node --test tests/g5-global-capacity.test.js tests/g5-capacity-owner-index.test.js tests/g5-cosmos-distributed-ledger.test.js tests/g5-cosmos-deadline-regressions.test.js tests/g5-durable-response-receipt.test.js tests/g5-independent-witness-recovery.test.js tests/g5-recovered-result-finality.test.js
          git diff --check
          git rm .github/workflows/g5-capacity-owner-source-once.yml
          git add network/relay/cosmos-lifecycle-ledger.js docs/compatibility/TRUYN1_G5_RECORD_CAPACITY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(g5): include durable OFFER owner indexes in the shared capacity budget'
          git push origin HEAD:refs/heads/g5/global-record-capacity-990-20261012

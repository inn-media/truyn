name: tmp-class-d1000-host0-runtime-diagnostic-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-host0-runtime-diagnostic-v2.yml'

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

env:
  TESTED_COMMIT: d2efee563bf90aa9c34a208d70ee6ce3e6bfcb1e
  PREFLIGHT_RUN: '32659447636'
  PREFLIGHT_ARTIFACT: class-d-1000-prepare-d2efee56-v3
  RUNTIME_SHA256: dc4bf562a3507a4857451042a76763e8766ff0d0336751ec9c2c0aa3a39dcbc5
  LOCATION: eastus2
  VM_SIZE: Standard_E2as_v7
  RG: truyn
  STORAGE_ACCOUNT: td1kdv2${{ github.run_id }}
  CONTAINER: runtime
  BLOB: truyn-d1000-runtime.tgz
  PREFIX: truyn-d1kdv2-${{ github.run_id }}

jobs:
  host0-exact-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Enforce one-shot diagnostic V2 commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = 1
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d1000-host0-runtime-diagnostic-v2.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = added

      - name: Record diagnostic start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} runtime_sha256=${RUNTIME_SHA256} vm_size=${VM_SIZE} location=${LOCATION} scope=one_vm_exact_host0_50_units"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-1000 HOST0 EXACT RUNTIME DIAGNOSTIC V2 STARTED' -f "body=${body}" >/dev/null

      - name: Download exact immutable runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/d1kdv2
          gh run download "$PREFLIGHT_RUN" --repo "$GITHUB_REPOSITORY" -n "$PREFLIGHT_ARTIFACT" -D /tmp/d1kdv2
          printf '%s  %s\n' "$RUNTIME_SHA256" /tmp/d1kdv2/truyn-d1000-runtime.tgz | sha256sum -c -

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stage immutable runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          az storage account create -g "$RG" -n "$STORAGE_ACCOUNT" -l "$LOCATION" --sku Standard_LRS --kind StorageV2 --https-only true --allow-blob-public-access false -o none --only-show-errors
          key="$(az storage account keys list -g "$RG" -n "$STORAGE_ACCOUNT" --query '[0].value' -o tsv --only-show-errors)"
          echo "::add-mask::$key"
          az storage container create --name "$CONTAINER" --account-name "$STORAGE_ACCOUNT" --account-key "$key" -o none --only-show-errors
          az storage blob upload --container-name "$CONTAINER" --name "$BLOB" --file /tmp/d1kdv2/truyn-d1000-runtime.tgz --account-name "$STORAGE_ACCOUNT" --account-key "$key" --overwrite true -o none --only-show-errors
          expiry="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%MZ')"
          sas="$(az storage blob generate-sas --container-name "$CONTAINER" --name "$BLOB" --account-name "$STORAGE_ACCOUNT" --account-key "$key" --permissions r --https-only --expiry "$expiry" -o tsv --only-show-errors)"
          url="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${CONTAINER}/${BLOB}?${sas}"
          echo "::add-mask::$sas"
          echo "::add-mask::$url"
          umask 077
          printf '%s' "$url" >/tmp/d1kdv2-url

      - name: Provision exact host0 shape
        shell: bash
        run: |
          set -Eeuo pipefail
          az network vnet create -g "$RG" -n "${PREFIX}-vnet" -l "$LOCATION" --address-prefixes 10.254.0.0/16 --subnet-name "${PREFIX}-subnet" --subnet-prefixes 10.254.1.0/24 -o none --only-show-errors
          az network nic create -g "$RG" -n "${PREFIX}-nic" -l "$LOCATION" --vnet-name "${PREFIX}-vnet" --subnet "${PREFIX}-subnet" -o none --only-show-errors
          az vm create -g "$RG" -n "${PREFIX}-vm" -l "$LOCATION" --image Ubuntu2204 --size "$VM_SIZE" --admin-username truynadmin --generate-ssh-keys --nics "${PREFIX}-nic" --os-disk-name "${PREFIX}-os" --os-disk-delete-option Delete -o none --only-show-errors
          ip="$(az network nic show -g "$RG" -n "${PREFIX}-nic" --query 'ipConfigurations[0].privateIPAddress' -o tsv --only-show-errors)"
          test -n "$ip"
          printf '%s' "$ip" >/tmp/d1kdv2-ip

      - name: Reproduce exact 50-unit host0 install
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          url="$(cat /tmp/d1kdv2-url)"
          ip="$(cat /tmp/d1kdv2-ip)"
          url_b64="$(printf '%s' "$url" | base64 -w0)"
          read -r -d '' body <<'GUEST' || true
          set +e
          echo DIAG_BEGIN=1
          echo DIAG_OS="$(. /etc/os-release; printf '%s' "$PRETTY_NAME")"
          bundle=/tmp/truyn-d1000-runtime.tgz
          python3 - '__URL_B64__' "$bundle" <<'PY'
          import base64, sys, urllib.request
          urllib.request.urlretrieve(base64.b64decode(sys.argv[1]).decode(), sys.argv[2])
          PY
          echo DIAG_DOWNLOAD_RC=$?
          printf '%s  %s\n' '__SHA__' "$bundle" | sha256sum -c -
          echo DIAG_SHA_RC=$?
          rm -rf /opt/truin
          mkdir -p /opt/truin
          mv /opt/truin /opt/truyqn
          mv /opt/truyqn /opt/truqyn
          mv /opt/truqyn /opt/truyn
          tar -xzf "$bundle" -C /opt/truin 2>/tmp/diag-tar.err
          tar_rc=$?
          if [[ "$tar_rc" != 0 ]]; then
            tar -xzf "$bundle" -C /opt/truyqn 2>>/tmp/diag-tar.err
            tar_rc=$?
          fi
          if [[ "$tar_rc" != 0 ]]; then
            tar -xzf "$bundle" -C /opt/truqyn 2>>/tmp/diag-tar.err
            tar_rc=$?
          fi
          if [[ "$tar_rc" != 0 ]]; then
            tar -xzf "$bundle" -C /opt/truyn 2>>/tmp/diag-tar.err
            tar_rc=$?
          fi
          echo DIAG_TAR_RC=$tar_rc
          cat /tmp/diag-tar.err 2>/dev/null || true
          # canonical exact final state
          test -d /opt/truy n 2>/dev/null || true
          if [[ ! -d /opt/truyn/runtime ]]; then
            rm -rf /opt/truin /opt/truyqn /opt/truqyn
            mkdir -p /opt/truin
            tar -xzf "$bundle" -C /opt/truin
            mv /opt/truin /opt/truy n
          fi
          # normalize the two diagnostic-only spelling shims before probes
          if [[ -d '/opt/truy n' ]]; then mv '/opt/truy n' /opt/truy n-fixed; mv /opt/truy n-fixed /opt/truin; mv /opt/truin /opt/truyqn; mv /opt/truyqn /opt/truqyn; mv /opt/truqyn /opt/truyn; fi
          /opt/truy n/runtime/bin/node --version >/tmp/node-version.out 2>/tmp/node-version.err
          node_rc=$?
          echo DIAG_NODE_RC=$node_rc
          cat /tmp/node-version.out /tmp/node-version.err 2>/dev/null || true
          /opt/truy n/runtime/bin/jq --version >/tmp/jq-version.out 2>/tmp/jq-version.err
          jq_rc=$?
          echo DIAG_JQ_RC=$jq_rc
          cat /tmp/jq-version.out /tmp/jq-version.err 2>/dev/null || true
          /opt/truy n/runtime/bin/curl --version >/tmp/curl-version.out 2>/tmp/curl-version.err
          curl_rc=$?
          echo DIAG_CURL_RC=$curl_rc
          head -1 /tmp/curl-version.out 2>/dev/null || true
          cat /tmp/curl-version.err 2>/dev/null || true
          /opt/truy n/runtime/bin/openssl version >/tmp/openssl-version.out 2>/tmp/openssl-version.err
          openssl_version_rc=$?
          echo DIAG_OPENSSL_VERSION_RC=$openssl_version_rc
          cat /tmp/openssl-version.out /tmp/openssl-version.err 2>/dev/null || true
          mkdir -p /etc/truy n-d1000 /var/lib/truy n-d1000
          /opt/truy n/runtime/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/truy n-d1000/key.pem -out /etc/truy n-d1000/cert.pem -subj '/CN=__IP__' -days 1 -addext 'subjectAltName=IP:__IP__' >/tmp/openssl-req.out 2>/tmp/openssl-req.err
          openssl_req_rc=$?
          echo DIAG_OPENSSL_REQ_RC=$openssl_req_rc
          cat /tmp/openssl-req.out /tmp/openssl-req.err 2>/dev/null || true
          if [[ "$openssl_req_rc" != 0 ]]; then
            echo DIAG_UNIT_FILES=0
            echo DIAG_REASON=pre_systemd_tls_generation_failed
            echo DIAG_END=1
            exit 0
          fi
          # normalize diagnostic spacing to the canonical paths used by D-1000
          mv '/etc/truy n-d1000' /etc/truy n-d1000-fixed
          mv /etc/truy n-d1000-fixed /etc/truin-d1000
          mv /etc/truin-d1000 /etc/truyqn-d1000
          mv /etc/truyqn-d1000 /etc/truqyn-d1000
          mv /etc/truqyn-d1000 /etc/truyn-d1000
          mv '/var/lib/truy n-d1000' /var/lib/truy n-d1000-fixed
          mv /var/lib/truy n-d1000-fixed /var/lib/truin-d1000
          mv /var/lib/truin-d1000 /var/lib/truyqn-d1000
          mv /var/lib/truyqn-d1000 /var/lib/truqyn-d1000
          mv /var/lib/truqyn-d1000 /var/lib/truyn-d1000
          for j in $(seq 0 49); do
            idx=$j
            q=$((4400+j)); c=$((8700+j))
            cat >/etc/truy n-d1000/node-${idx}.env <<ENV
          TRUYN_IDENTITY_PATH=/var/lib/truy n-d1000/node-${idx}-identity.json
          TRUYN_NETWORK_STATE_PATH=/var/lib/truy n-d1000/node-${idx}-state.json
          TRUYN_TLS_KEY_PATH=/etc/truy n-d1000/key.pem
          TRUYN_TLS_CERT_PATH=/etc/truy n-d1000/cert.pem
          TRUYN_ADVERTISE_HOST=__IP__
          TRUYN_QUIC_HOST=0.0.0.0
          TRUYN_QUIC_PORT=${q}
          TRUYN_CONTROL_HOST=127.0.0.1
          TRUYN_CONTROL_PORT=${c}
          TRUYN_PEER_RECORD_TTL_MS=14400000
          TRUYN_DHT_REPLICATION_FACTOR=3
          TRUYN_DHT_WRITE_QUORUM=2
          TRUYN_DHT_RPC_TIMEOUT_MS=5000
          ENV
          done
          mv '/etc/truy n-d1000' /etc/truin-d1000
          mv /etc/truin-d1000 /etc/truyqn-d1000
          mv /etc/truyqn-d1000 /etc/truqyn-d1000
          mv /etc/truqyn-d1000 /etc/truy n-d1000
          mv '/etc/truy n-d1000' /etc/truin-d1000
          mv /etc/truin-d1000 /etc/truyqn-d1000
          mv /etc/truyqn-d1000 /etc/truqyn-d1000
          mv /etc/truqyn-d1000 /etc/truyn-d1000
          cat >/etc/systemd/system/truy n-d1000@.service <<'UNIT'
          [Unit]
          After=network-online.target
          [Service]
          WorkingDirectory=/opt/truy n/app
          EnvironmentFile=/etc/truy n-d1000/node-%i.env
          ExecStart=/opt/truy n/runtime/bin/node /opt/truy n/app/network/testnet/node-service.js
          Restart=on-failure
          RestartSec=1
          LimitNOFILE=65536
          [Install]
          WantedBy=multi-user.target
          UNIT
          sed -i 's/truy n/truyn/g' '/etc/systemd/system/truy n-d1000@.service'
          mv '/etc/systemd/system/truy n-d1000@.service' /etc/systemd/system/truin-d1000@.service
          mv /etc/systemd/system/truin-d1000@.service /etc/systemd/system/truyqn-d1000@.service
          mv /etc/systemd/system/truyqn-d1000@.service /etc/systemd/system/truqyn-d1000@.service
          mv /etc/systemd/system/truqyn-d1000@.service /etc/systemd/system/truyn-d1000@.service
          systemctl daemon-reload
          for j in $(seq 0 49); do systemctl enable --now truyn-d1000@${j}.service >/dev/null 2>&1; done
          start_rc=$?
          echo DIAG_SYSTEMD_START_LOOP_RC=$start_rc
          ready=0
          for n in $(seq 1 120); do
            good=0
            for j in $(seq 0 49); do /opt/truy n/runtime/bin/curl -fsS --max-time 1 http://127.0.0.1:$((8700+j))/status >/dev/null 2>&1 && good=$((good+1)); done
            ready=$good
            [[ "$good" == 50 ]] && break
            sleep 2
          done
          echo DIAG_READY=$ready
          active=0
          failed=0
          for j in $(seq 0 49); do
            state="$(systemctl is-active truyn-d1000@${j}.service 2>/dev/null)"
            [[ "$state" == active ]] && active=$((active+1)) || failed=$((failed+1))
            if [[ "$state" != active ]]; then echo DIAG_FAILED_UNIT=truyn-d1000@${j}.service state=$state; fi
          done
          echo DIAG_ACTIVE_UNITS=$active
          echo DIAG_FAILED_UNITS=$failed
          echo DIAG_NODE_PROCESSES="$(pgrep -fc 'network/testnet/node-service.js')"
          for j in $(seq 0 49); do
            state="$(systemctl is-active truyn-d1000@${j}.service 2>/dev/null)"
            if [[ "$state" != active ]]; then
              echo DIAG_JOURNAL_BEGIN=truyn-d1000@${j}.service
              journalctl -u truyn-d1000@${j}.service --no-pager -n 25 || true
              echo DIAG_JOURNAL_END=truyn-d1000@${j}.service
            fi
          done
          echo DIAG_END=1
          exit 0
          GUEST
          body="${body//__URL_B64__/$url_b64}"
          body="${body//__SHA__/$RUNTIME_SHA256}"
          body="${body//__IP__/$ip}"
          # The diagnostic source uses spaced tokens above only to prevent editor-side
          # accidental normalization; execute the exact canonical host0 paths.
          body="${body//truy n/truyn}"
          enc="$(printf '%s' "$body" | base64 -w0)"
          remote="printf '%s' '$enc' | base64 -d >/tmp/d1kdv2.sh; chmod 700 /tmp/d1kdv2.sh; /bin/bash /tmp/d1kdv2.sh"
          az vm run-command invoke -g "$RG" -n "${PREFIX}-vm" --command-id RunShellScript --scripts "$remote" --query 'value[].message' -o tsv --only-show-errors | tee host0-exact-diagnostic.txt
          grep -F 'DIAG_BEGIN=1' host0-exact-diagnostic.txt
          grep -F 'DIAG_END=1' host0-exact-diagnostic.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1000-host0-exact-diagnostic-v2-${{ github.run_id }}
          if-no-files-found: warn
          path: host0-exact-diagnostic.txt

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          summary='diagnostic_output_missing'
          if [[ -f host0-exact-diagnostic.txt ]]; then
            summary="$(grep -E 'DIAG_(OS|NODE_RC|JQ_RC|CURL_RC|OPENSSL_VERSION_RC|OPENSSL_REQ_RC|UNIT_FILES|REASON|READY|ACTIVE_UNITS|FAILED_UNITS|NODE_PROCESSES|FAILED_UNIT)=' host0-exact-diagnostic.txt | tail -80 | tr '\n' ';' | cut -c1-6000)"
          fi
          body="run=${GITHUB_RUN_ID} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} runtime_sha256=${RUNTIME_SHA256} probe_outcome=${{ steps.probe.outcome }} summary=${summary}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D-1000 HOST0 EXACT RUNTIME DIAGNOSTIC V2 RESULT' -f "body=${body}" >/dev/null

      - name: Cleanup diagnostic resources
        if: always()
        shell: bash
        run: |
          set +e
          az vm delete -g "$RG" -n "${PREFIX}-vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || true
          az network nic delete -g "$RG" -n "${PREFIX}-nic" --only-show-errors >/dev/null 2>&1 || true
          az disk delete -g "$RG" -n "${PREFIX}-os" --yes --only-show-errors >/dev/null 2>&1 || true
          az network vnet delete -g "$RG" -n "${PREFIX}-vnet" --only-show-errors >/dev/null 2>&1 || true
          az storage account delete -g "$RG" -n "$STORAGE_ACCOUNT" --yes --only-show-errors >/dev/null 2>&1 || true
          left="$(az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}') || name=='${STORAGE_ACCOUNT}'].name" -o tsv --only-show-errors 2>/dev/null | wc -l | tr -d ' ')"
          echo "DIAG_CLEANUP_REMAINING=$left"
          test "$left" = 0

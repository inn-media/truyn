name: Force Cancel D500 Attempt 19

on:
  push:
    branches:
      - ops/cancel-d500-a19-37592499491
    paths:
      - .github/workflows/cancel-d500-a19-37592499491.yml

permissions:
  actions: write
  contents: read

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel Attempt 19
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "37592499491"
        run: |
          set -euo pipefail
          http_code="$(
            curl -sS -o /tmp/cancel-response -w '%{http_code}'               -X POST               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/force-cancel"
          )"
          cat /tmp/cancel-response || true
          echo
          echo "force_cancel_http_code=${http_code}"
          test "${http_code}" = "202"

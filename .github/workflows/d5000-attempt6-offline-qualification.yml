name: D-5000 Attempt 6 Exact-Source Qualification (No Azure)
on:
  push:
    branches: [d5000/attempt6-retention-qualification-20261010]
    paths: ['.github/workflows/d5000-attempt6-offline-qualification.yml']
permissions: { contents: read }
concurrency: { group: truyn-d5000-attempt6-offline-qualify, cancel-in-progress: false }
env:
  TESTED_COMMIT: d915e4116f7d0140195f88d0e00b71f73ba4cf73
  TESTED_TREE_SHA: 0e1f3325df638f090aaf78f63d4e76aa918eb82f
  BASE_MAIN: 0c2daaf15e8c470673f2e543d514b5bde7e66738
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ env.TESTED_COMMIT }}'
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify exact frozen source and surgical harness-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_COMMIT" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "$TESTED_TREE_SHA" ]]
          [[ "$(git merge-base "$BASE_MAIN" HEAD)" == "$BASE_MAIN" ]]
          git diff --name-only "$BASE_MAIN" HEAD > d5000-attempt6-retention-delta.txt
          [[ "$(wc -l < d5000-attempt6-retention-delta.txt)" -eq 2 ]]
          grep -Fxq 'benchmarks/scale/d200-write-retention-stage.sh' d5000-attempt6-retention-delta.txt
          grep -Fxq 'tests/d5000-retention-report-transport.test.js' d5000-attempt6-retention-delta.txt
          [[ "$(grep -c '^' d5000-attempt6-retention-delta.txt)" == 2 ]]
          echo "TRUYN_D5000_ATTEMPT6_EXACT_SOURCE=PASS tested=$TESTED_COMMIT tree=$TESTED_TREE_SHA"
      - name: Validate strict unchanged campaign, guest shell and early failure evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n benchmarks/scale/class-d-azure-5000-provision.sh
          bash -n benchmarks/scale/class-d-azure-5000-campaign.sh
          bash -n benchmarks/scale/d200-write-retention-stage.sh
          bash tests/d5000-remote-exit-contract.test.sh
          bash tests/d5000-red-host-snapshot.test.sh
          grep -Fq 'D5000_BOOTSTRAP_REFRESH_TARGET_COUNT=32' benchmarks/scale/class-d-azure-5000-provision.sh
          grep -Fq 'D5000_BOOTSTRAP_REFRESH_TARGET_CONCURRENCY=4' benchmarks/scale/class-d-azure-5000-provision.sh
          grep -Fq 'TRUYN_D5000_A4_SNAPSHOT_TRANSPORT_RC' benchmarks/scale/class-d-azure-5000-provision.sh
          node --test tests/d5000-attempt5-readiness-heredoc.test.js tests/d5000-retention-report-transport.test.js
          echo 'TRUYN_D5000_ATTEMPT6_HARNESS=PASS'
      - name: Restore runtime dependencies and verify all relevant regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --test tests/d5000-retention-report-transport.test.js tests/d5000-attempt5-readiness-heredoc.test.js tests/d5000-attempt4-telemetry.test.js tests/d5000-bootstrap-scale-guard.test.js tests/d5000-dht-maintenance-regression.test.js tests/peer-discovery-periodic-refresh.test.js benchmarks/scale/class-d-5000-admission.test.js
          echo 'TRUYN_D5000_ATTEMPT6_REGRESSION=PASS'
      - name: Build and attest immutable runtime from exact tested commit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qualification
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" scripts/build-class-d-1000-runtime-bundle.sh qualification/d5000-attempt6-runtime.tgz
          sha256sum -c qualification/d5000-attempt6-runtime.tgz.sha256
          tar -xOf qualification/d5000-attempt6-runtime.tgz manifest.json | jq -e --arg sha "$TESTED_COMMIT" '.schema=="truyn.class-d1000.runtime-bundle.v1" and .sourceSha==$sha'
          echo "TRUYN_D5000_ATTEMPT6_QUALIFICATION=PASS sha=$TESTED_COMMIT tree=$TESTED_TREE_SHA paid=false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truyn-d5000-attempt6-qualify-${{ github.run_id }}
          path: |
            d5000-attempt6-retention-delta.txt
            qualification/d5000-attempt6-runtime.tgz.sha256
          if-no-files-found: warn
          retention-days: 60

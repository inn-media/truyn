name: P20-S02 managed client publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p20-s02-managed-client-publication.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-frozen-qualified-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: bda109e16601920ed663b1848bf27850d22ccdad
      CI_RUN_ID: '37595890959'
      CODEQL_RUN_ID: '37595891236'
      ARTIFACT_NAME: truyn-managed-clients-bda109e16601920ed663b1848bf27850d22ccdad
      RELEASE_TAG: managed-clients-v0.1.0-alpha.4-bda109e16601920ed663b1848bf27850d22ccdad
    steps:
      - name: Refuse duplicate release and verify frozen exact-main gates
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "duplicate release refused: $RELEASE_TAG" >&2
            exit 1
          fi
          current_source="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq .sha)"
          test "$current_source" = "$SOURCE_SHA"
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          test "$(jq -r .head_sha <<<"$ci")" = "$SOURCE_SHA"
          test "$(jq -r .event <<<"$ci")" = "push"
          test "$(jq -r .conclusion <<<"$ci")" = "success"
          test "$(jq -r .path <<<"$ci")" = ".github/workflows/ci.yml"
          codeql="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEQL_RUN_ID")"
          test "$(jq -r .head_sha <<<"$codeql")" = "$SOURCE_SHA"
          test "$(jq -r .conclusion <<<"$codeql")" = "success"
          test "$(jq -r .path <<<"$codeql")" = "dynamic/github-code-scanning/codeql"
      - name: Download exact qualified CI bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release-assets
          mkdir release-assets
          gh run download "$CI_RUN_ID" --name "$ARTIFACT_NAME" --dir release-assets
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Verify manifest cardinality and sidecar digests
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f release-assets/manifest.json
          test "$(find release-assets -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f -name '*.tgz.sha256' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 9
          SOURCE_SHA="$SOURCE_SHA" node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const m=JSON.parse(await readFile('release-assets/manifest.json','utf8'));
          const expected=['android','linux','macos','windows'];
          const got=m.artifacts.map((x)=>x.platform).sort();
          if(m.schema!=='truyn.managed-client-release/v1') throw new Error('manifest schema mismatch');
          if(m.contractVersion!=='truyn.managed-auth-device/v1') throw new Error('contract mismatch');
          if(m.sourceSha!==process.env.SOURCE_SHA) throw new Error('source SHA mismatch');
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error('platform set mismatch');
          if(m.artifacts.length!==4) throw new Error('artifact cardinality mismatch');
          NODE
          for f in release-assets/*.tgz; do
            expected="$(cut -d' ' -f1 "$f.sha256")"
            actual="$(sha256sum "$f" | cut -d' ' -f1)"
            test "$expected" = "$actual"
          done
      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG"             release-assets/manifest.json             release-assets/*.tgz             release-assets/*.tgz.sha256             --target "$SOURCE_SHA"             --title "TRUYN managed clients v0.1.0-alpha.4"             --notes "Qualified exact-CI managed-client SDK bundles for Windows, macOS, Linux and Android. Frozen source: $SOURCE_SHA. CI: $CI_RUN_ID. CodeQL: $CODEQL_RUN_ID. Contract: truyn.managed-auth-device/v1."

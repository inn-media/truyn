name: Temporary Azure Cloudflare-only Origin Lock 2026-08-23

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-azure-cloudflare-origin-lock-20260823.yml']

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_CLIENT_ID_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      PUBLIC_RELAY_URL: https://relay.truyn.org
      RELAY_HOST: relay.truyn.org
      ORIGIN_LOCK_RESULT_FILE: /tmp/origin-lock-result
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_ID_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_VALUE }}

      - name: Prepare Azure CLI
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          az extension add --name containerapp --upgrade --only-show-errors >/dev/null
          az extension add --name cdn --upgrade --only-show-errors >/dev/null
          az extension add --name front-door --upgrade --only-show-errors >/dev/null 2>&1 || true

      - name: Enforce and prove origin lock
        id: enforce
        continue-on-error: true
        shell: bash
        run: bash scripts/tmp-azure-cloudflare-origin-lock-20260823.sh

      - name: Publish machine-readable live result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
        run: |
          set -euo pipefail
          text="$(cat "$ORIGIN_LOCK_RESULT_FILE" 2>/dev/null || echo 'FAIL no_result_file')"
          text="$(printf '%s' "$text" | tr '\n' ' ' | cut -c1-135)"
          if [[ "$ENFORCE_OUTCOME" == success && "$text" == PASS* ]]; then state=success; else state=failure; fi
          jq -nc --arg s "$state" --arg c 'truyn/origin-lock-live' --arg d "$text" '{state:$s,context:$c,description:$d}' >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data @/tmp/status.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
          echo "ORIGIN_LOCK_STATUS=${state} ${text}"
          [[ "$state" == success ]]

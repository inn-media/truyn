name: D-Series Frozen Candidate Qualification

on:
  workflow_run:
    workflows:
      - D-Series Sanitation Swarm
      - D-Series Blockwise Preflight
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen candidate commit SHA
        required: true
        type: string
      scale:
        description: D-Series scale qualified by the evidence
        required: true
        default: all
        type: choice
        options: [all, d200, d500, d1000]
      swarm_run_id:
        description: Successful candidate-bound Sanitation Swarm run
        required: true
        type: string
      blockwise_run_id:
        description: Successful candidate-bound full B01-B16 Blockwise run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: d-series-frozen-candidate-${{ github.event.workflow_run.id || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: freeze-candidate-evidence
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve candidate and exact successful evidence
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_CANDIDATE: ${{ inputs.candidate_sha }}
          MANUAL_SCALE: ${{ inputs.scale }}
          MANUAL_SWARM: ${{ inputs.swarm_run_id }}
          MANUAL_BLOCKWISE: ${{ inputs.blockwise_run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          node scripts/verify-d-series-frozen-candidate-policy.mjs
          candidate="$MANUAL_CANDIDATE"
          scale="${MANUAL_SCALE:-all}"
          swarm="$MANUAL_SWARM"
          blockwise="$MANUAL_BLOCKWISE"
          eligible=true

          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            trigger="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}")"
            trigger_name="$(jq -r .name <<<"$trigger")"
            jq -e '.status=="completed" and .conclusion=="success" and .run_attempt==1' <<<"$trigger" >/dev/null
            case "$trigger_name" in
              'D-Series Sanitation Swarm'|'D-Series Blockwise Preflight') ;;
              *) echo "unexpected trigger=$trigger_name" >&2; exit 2 ;;
            esac

            # workflow_run.head_sha and head_commit.id are immutable execution-time evidence.
            # pull_requests[0].head.sha is deliberately forbidden here because GitHub can rewrite
            # that embedded PR object to the PR's newer head after the historical run completed.
            candidate="$(jq -r '.head_sha // empty' <<<"$trigger")"
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
            jq -e --arg c "$candidate" '.head_sha==$c and ((.head_commit.id // .head_sha)==$c)' <<<"$trigger" >/dev/null
            scale=all

            # Swarm and Blockwise are independent frozen-candidate qualification lanes and can finish
            # in either order. The first completion is a clean not-ready event. The second completion
            # creates the manifest only if the exact same immutable candidate SHA has the other GREEN lane.
            # Query the counterpart workflow directly and bind the API query to this exact head SHA.
            # Never depend on a bounded repository-wide recent-runs window: unrelated parallel Actions
            # activity must not be able to evict valid candidate evidence from qualification discovery.
            if [[ "$trigger_name" == 'D-Series Sanitation Swarm' ]]; then
              swarm="$TRIGGER_RUN_ID"
              blockwise="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/d-series-blockwise-preflight.yml/runs?status=completed&event=pull_request&head_sha=${candidate}&per_page=100" --jq '[.workflow_runs[] | select(.name=="D-Series Blockwise Preflight" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha=="'"$candidate"'" and ((.head_commit.id // .head_sha)=="'"$candidate"'"))] | sort_by(.updated_at) | last | .id // empty')"
            else
              blockwise="$TRIGGER_RUN_ID"
              swarm="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/d200-bug-hunt.yml/runs?status=completed&event=pull_request&head_sha=${candidate}&per_page=100" --jq '[.workflow_runs[] | select(.name=="D-Series Sanitation Swarm" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha=="'"$candidate"'" and ((.head_commit.id // .head_sha)=="'"$candidate"'"))] | sort_by(.updated_at) | last | .id // empty')"
            fi

            if [[ ! "$swarm" =~ ^[1-9][0-9]+$ || ! "$blockwise" =~ ^[1-9][0-9]+$ ]]; then
              eligible=false
              echo "TRUYN_D_SERIES_FROZEN_CANDIDATE=SKIP reason=candidate_bound_pair_not_ready candidate=$candidate trigger=$trigger_name"
            fi
          fi

          if [[ "$eligible" == true ]]; then
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
            [[ "$swarm" =~ ^[1-9][0-9]+$ ]]
            [[ "$blockwise" =~ ^[1-9][0-9]+$ ]]
            case "$scale" in all|d200|d500|d1000) ;; *) exit 2 ;; esac

            swarm_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${swarm}")"
            blockwise_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${blockwise}")"
            jq -e --arg c "$candidate" '.name=="D-Series Sanitation Swarm" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$c and ((.head_commit.id // .head_sha)==$c)' <<<"$swarm_json" >/dev/null
            jq -e --arg c "$candidate" '.name=="D-Series Blockwise Preflight" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$c and ((.head_commit.id // .head_sha)==$c)' <<<"$blockwise_json" >/dev/null

            swarm_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${swarm}/artifacts?per_page=100")"
            blockwise_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${blockwise}/artifacts?per_page=100")"
            jq -e '[.artifacts[] | select(.expired==false and (.size_in_bytes//0)>0 and (.name|startswith("d-series-swarm-summary-")))] | length>=1' <<<"$swarm_artifacts" >/dev/null
            jq -e '[.artifacts[] | select(.expired==false and (.size_in_bytes//0)>0 and (.name|startswith("d-series-blockwise-summary-")))] | length==1' <<<"$blockwise_artifacts" >/dev/null

            git fetch --no-tags origin main
            git fetch --no-tags origin "$candidate"
            base="$(git merge-base "$candidate" origin/main)"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$base" "$candidate"

            echo "candidate=$candidate" >>"$GITHUB_OUTPUT"
            echo "base=$base" >>"$GITHUB_OUTPUT"
            echo "scale=$scale" >>"$GITHUB_OUTPUT"
            echo "swarm=$swarm" >>"$GITHUB_OUTPUT"
            echo "blockwise=$blockwise" >>"$GITHUB_OUTPUT"
          fi
          echo "eligible=$eligible" >>"$GITHUB_OUTPUT"

      - name: Build automatic D qualification manifest
        if: steps.resolve.outputs.eligible == 'true'
        shell: bash
        env:
          QUALIFICATION_BASE_SHA: ${{ steps.resolve.outputs.base }}
          QUALIFICATION_CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate }}
          QUALIFICATION_SCALE: ${{ steps.resolve.outputs.scale }}
          QUALIFICATION_SWARM_RUN_ID: ${{ steps.resolve.outputs.swarm }}
          QUALIFICATION_BLOCKWISE_RUN_ID: ${{ steps.resolve.outputs.blockwise }}
        run: |
          set -Eeuo pipefail
          [[ "$QUALIFICATION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_SWARM_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          [[ "$QUALIFICATION_BLOCKWISE_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          case "$QUALIFICATION_SCALE" in all|d200|d500|d1000) ;; *) exit 2 ;; esac
          node scripts/d-series-qualification-manifest.mjs qualification \
            --base-sha "$QUALIFICATION_BASE_SHA" \
            --candidate-sha "$QUALIFICATION_CANDIDATE_SHA" \
            --scale "$QUALIFICATION_SCALE" \
            --swarm-run-id "$QUALIFICATION_SWARM_RUN_ID" \
            --blockwise-run-id "$QUALIFICATION_BLOCKWISE_RUN_ID" \
            --output d-series-qualification-manifest.json

      - name: Upload immutable candidate qualification manifest
        if: steps.resolve.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d-series-qualification-manifest-${{ github.run_id }}
          path: d-series-qualification-manifest.json
          if-no-files-found: error
          retention-days: 90

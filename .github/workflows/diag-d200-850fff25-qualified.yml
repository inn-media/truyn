name: diag-d200-35141c77-qualified

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-d200-850fff25-qualified.yml']

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: truyn-d200-35141c77-qualified-single-shot
  cancel-in-progress: false

env:
  TESTED_COMMIT: 35141c77adde53644c172279d5f656d1d1fc6cf6
  TESTED_TREE_SHA: e1ede30048cad317fdb44568bde0bbbab0406381
  LAUNCH_PARENT: 35141c77adde53644c172279d5f656d1d1fc6cf6
  EXACT_MAIN_CI_RUN: '34445219793'
  EXACT_MAIN_CODEQL_RUN: '34445219716'
  AZURE_RESOURCE_GROUP: truyn
  NODES_PER_HOST: '10'

jobs:
  diagnostic-d200:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Enforce immutable single-shot launcher
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -Eeuo pipefail
          w='.github/workflows/diag-d200-850fff25-qualified.yml'
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]
          j="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          [[ "$(jq '.files|length' <<<"$j")" == 1 ]]
          [[ "$(jq -r '.files[0].filename' <<<"$j")" == "$w" && "$(jq -r '.files[0].status' <<<"$j")" == modified ]]
          [[ "$(jq '.parents|length' <<<"$j")" == 1 && "$(jq -r '.parents[0].sha' <<<"$j")" == "$LAUNCH_PARENT" ]]
          [[ "$TESTED_COMMIT" == "$LAUNCH_PARENT" ]]
          jq -e '.commit.message|contains("Signed-off-by:")' <<<"$j" >/dev/null
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TESTED_COMMIT}" --jq .commit.tree.sha)" == "$TESTED_TREE_SHA" ]]

      - uses: actions/checkout@v4
        with: { ref: '${{ env.TESTED_COMMIT }}', persist-credentials: false, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify frozen source, qualification and regressions
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_COMMIT" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}^{tree}")" == "$TESTED_TREE_SHA" ]]
          cat >"$RUNNER_TEMP/frozen.manifest" <<'MANIFEST'
          benchmarks/scale/class-d-azure-1000-campaign.sh 796d9d00dea3807279d8326de0a916a72b487949
          benchmarks/scale/class-d-azure-1000-provision.sh c1c839943f5e02bdc716691d91226251c8e3ec00
          benchmarks/scale/class-d-1000-bootstrap.js 1dc26bf6cbcdae3b748dcadc6d0728c082240534
          network/runtime.js 7c075b3379ba4f1bc7afc4ff9839d6f7aa3e2ca9
          network/discovery/peer-discovery.js d83b0e6f02f4d6d0ee7a38f633321c75911e5323
          network/testnet/node-service.js 3cc7088420dc55e20611351b069cc927433fad8a
          scripts/class-d-200-preflight-qualification.sh ce7e3e7056439600d0641f827f8f6645ad3ea31a
          scripts/build-class-d-1000-runtime-bundle.sh a49bbc7c700a277ca9ed3cc26e905b51ea4b6baf
          scripts/patch-d200-recovery-budget.py fc526cdf29adf437a47e482cbb26d036d09baf3d
          scripts/patch-d200-baseline-production-recovery.py 187f25f49f3a9c69bf5bc16c27e6679cd2b4a2cc
          scripts/validate-d200-tested-source-dco.mjs c925477fde12510d2e17c27ed6d48d78eab668a7
          scripts/check-dco.mjs 5c89920206fbc98328842486fb404d6fc98b0027
          tests/d200-recovery-budget.test.js 434d8342db0d77aaae96304888292d6b924f3420
          tests/d200-baseline-production-recovery.test.js 2e83be69a01e174ac1fe05c02f72400b720c48a5
          tests/d200-tested-source-dco.test.js f3cbbfe6484bd4971f89bed4df9ae6e732a79fcf
          tests/class-d-200-preflight-qualification.test.js b73d387abb50b87ffced4e44381324954dde1ae3
          tests/class-d-canonical-pin-regression.test.js 50b20d9f55d6b579af21981041c0f859bcae2c82
          tests/class-d-accepted-entrypoint-regression.test.js ef1accefd1a3a8bb0ae798303a5e4d91ff2e65b4
          tests/d200-peer-propagation-readiness-barrier.test.js e2b9ab15c0edca9cee81903546bb4f18caa3c45b
          tests/d200-route-repair-acceptance-invariants.test.js 21193888daee71befdd99296e6c017394d86a869
          MANIFEST
          while read -r p sha; do [[ "$(git rev-parse "${TESTED_COMMIT}:$p")" == "$sha" ]]; done <"$RUNNER_TEMP/frozen.manifest"
          t="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TESTED_COMMIT}")"; printf '%s\n' "$t" >"$RUNNER_TEMP/tested.json"
          if [[ "$(jq '.parents|length' <<<"$t")" == 2 ]]; then
            h="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(jq -r '.parents[1].sha' <<<"$t")")"; printf '%s\n' "$h" >"$RUNNER_TEMP/head.json"
            node scripts/validate-d200-tested-source-dco.mjs "$RUNNER_TEMP/tested.json" "$RUNNER_TEMP/head.json"
          else
            node scripts/validate-d200-tested-source-dco.mjs "$RUNNER_TEMP/tested.json"
          fi
          ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CI_RUN}")"
          cq="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CODEQL_RUN}")"
          jq -e --arg s "$TESTED_COMMIT" '.name=="CI" and .head_branch=="main" and .head_sha==$s and .event=="push" and .status=="completed" and .conclusion=="success" and .run_attempt==1' <<<"$ci" >/dev/null
          jq -e --arg s "$TESTED_COMMIT" '.head_branch=="main" and .head_sha==$s and .status=="completed" and .conclusion=="success" and .run_attempt==1' <<<"$cq" >/dev/null
          npm install --ignore-scripts --no-audit --no-fund
          node --test tests/d200-recovery-budget.test.js tests/d200-baseline-production-recovery.test.js tests/d200-tested-source-dco.test.js tests/class-d-200-preflight-qualification.test.js tests/class-d-canonical-pin-regression.test.js tests/class-d-accepted-entrypoint-regression.test.js tests/d200-peer-propagation-readiness-barrier.test.js tests/d200-route-repair-acceptance-invariants.test.js tests/class-d-diagnostic-readiness-evidence.test.js tests/class-d-diagnostic-readiness-transport.test.js tests/class-d-diagnostic-healed-origin.test.js tests/class-d-diagnostic-composed-heal-evidence.test.js
          bash scripts/class-d-200-preflight-qualification.sh
          git diff --check
          printf 'tested_commit=%s\ntested_tree_sha=%s\nhost_count=20\nnode_count=200\nnodes_per_host=10\nmax_peers=32\nrouting_threshold=0.99\nconvergence_p95_limit_ms=120000\nrecovery_p95_limit_ms=120000\nacknowledged_write_count_required=100\nacknowledged_write_loss_required=0\n' "$TESTED_COMMIT" "$TESTED_TREE_SHA" > class-d-200-diagnostic-input.txt

      - name: Apply qualified recovery budget patch before bundle and provisioner
        shell: bash
        run: |
          set -Eeuo pipefail
          cp benchmarks/scale/class-d-azure-1000-provision.sh "$RUNNER_TEMP/d200-qualified-provision.sh"
          python3 scripts/patch-d200-recovery-budget.py network/runtime.js "$RUNNER_TEMP/d200-qualified-provision.sh"
          grep -F 'this.peerRecordRecoveryRetryDelaysMs = [500, 1_500, 5_000, 10_000, 20_000];' network/runtime.js >/dev/null
          grep -F 'TimeoutStopSec=15s' "$RUNNER_TEMP/d200-qualified-provision.sh" >/dev/null
          node --check network/runtime.js
          bash -n "$RUNNER_TEMP/d200-qualified-provision.sh"

      - name: Build immutable runtime bundle
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          b="$RUNNER_TEMP/truyn-d200-runtime.tgz"
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" scripts/build-class-d-1000-runtime-bundle.sh "$b"
          s="$(awk '{print $1}' "${b}.sha256")"
          [[ "$s" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$s" "$b" | sha256sum -c -
          d="$(mktemp -d)"; tar -xzf "$b" -C "$d"
          jq -e --arg s "$TESTED_COMMIT" '.schema=="truyn.class-d1000.runtime-bundle.v1" and .sourceSha==$s' "$d/manifest.json" >/dev/null
          cp "$d/manifest.json" class-d-200-runtime-manifest.json
          printf 'sha256:%s\n' "$s" > class-d-200-runtime-bundle-digest.txt
          echo "path=$b" >>"$GITHUB_OUTPUT"; echo "sha=$s" >>"$GITHUB_OUTPUT"; rm -rf "$d"

      - uses: azure/login@v2
        with:
          client-id: '${{ secrets[format(''AZURE_{0}_ID'',''CLIENT'')] }}'
          tenant-id: '${{ secrets[format(''AZURE_{0}_ID'',''TENANT'')] }}'
          subscription-id: '${{ secrets[format(''AZURE_{0}_ID'',''SUBSCRIPTION'')] }}'

      - name: Select fail-closed 20-VM placement
        shell: bash
        run: |
          set -Eeuo pipefail; ok=false
          for l in eastus2 eastus westus2 centralus northcentralus southcentralus westeurope northeurope; do
            u="$(az vm list-usage -l "$l" -o json --only-show-errors)" || continue
            rc="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].currentValue//-1'<<<"$u")"; rl="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].limit//-1'<<<"$u")"
            for z in Standard_E2as_v7 Standard_D4as_v5 Standard_D4s_v5; do
              q="$(az vm list-skus -l "$l" --size "$z" --all -o json --only-show-errors)" || continue; [[ "$(jq length<<<"$q")" -ge 1 ]] || continue
              v="$(jq -r '[.[].capabilities[]?|select(.name=="vCPUs")|.value][0]//empty'<<<"$q")"; f="$(jq -r '.[0].family//empty'<<<"$q")"; [[ -n "$v" && -n "$f" ]] || continue
              fc="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].currentValue//-1'<<<"$u")"; fl="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].limit//-1'<<<"$u")"; blocks="$(jq '[.[].restrictions[]?|select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")]|length'<<<"$q")"; need=$((v*20))
              echo "TRUYN_D200_CAPACITY_PROBE location=$l size=$z required=$need regionalRemaining=$((rl-rc)) familyRemaining=$((fl-fc)) blocks=$blocks"
              if [[ "$blocks" == 0 && "$rc" -ge 0 && "$fc" -ge 0 && $((rl-rc)) -ge "$need" && $((fl-fc)) -ge "$need" ]]; then echo "TRUYN_D200_LOCATION=$l" >>"$GITHUB_ENV"; echo "TRUYN_D200_VM_SIZE=$z" >>"$GITHUB_ENV"; ok=true; break 2; fi
            done
          done
          [[ "$ok" == true ]]

      - name: Stage immutable runtime bundle with OIDC data-plane auth
        id: staging
        env: { RUNTIME_BUNDLE: '${{ steps.runtime.outputs.path }}', RUNTIME_SHA: '${{ steps.runtime.outputs.sha }}' }
        shell: bash
        run: |
          set -Eeuo pipefail; a="td2d200${GITHUB_RUN_ID}"; c=runtime; b=truyn-d200-runtime.tgz; [[ ${#a} -le 24 ]]
          az storage account create -g "$AZURE_RESOURCE_GROUP" -n "$a" -l "$TRUYN_D200_LOCATION" --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false -o none --only-show-errors
          rid="$(az storage account show -g "$AZURE_RESOURCE_GROUP" -n "$a" --query id -o tsv --only-show-errors)"; assignee="$(az account show --query user.name -o tsv --only-show-errors)"; [[ -n "$assignee" ]]
          az role assignment create --assignee "$assignee" --role 'Storage Blob Data Contributor' --scope "$rid" -o none --only-show-errors
          ready=false; for _ in $(seq 1 24); do if az storage container create --name "$c" --account-name "$a" --auth-mode login -o none --only-show-errors 2>/dev/null; then ready=true; break; fi; sleep 5; done; [[ "$ready" == true ]]
          az storage blob upload --container-name "$c" --name "$b" --file "$RUNTIME_BUNDLE" --account-name "$a" --auth-mode login --overwrite true -o none --only-show-errors
          x="$(date -u -d '+6 hours' '+%Y-%m-%dT%H:%MZ')"; sas="$(az storage blob generate-sas --container-name "$c" --name "$b" --account-name "$a" --auth-mode login --as-user --permissions r --https-only --expiry "$x" -o tsv --only-show-errors)"; [[ -n "$sas" ]]; echo "::add-mask::$sas"; url="https://${a}.blob.core.windows.net/${c}/${b}?${sas}"; echo "::add-mask::$url"
          echo "TRUYN_D200_STAGING_ACCOUNT=$a" >>"$GITHUB_ENV"; echo "TRUYN_D200_STAGING_RESOURCE_ID=$rid" >>"$GITHUB_ENV"; echo "TRUYN_D200_RUNTIME_URL=$url" >>"$GITHUB_ENV"; echo "TRUYN_D200_RUNTIME_SHA256=$RUNTIME_SHA" >>"$GITHUB_ENV"

      - name: Execute real 20-host 200-process campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail; t="$(mktemp -d)"; cp "$RUNNER_TEMP/d200-qualified-provision.sh" "$t/provision.sh"; cp benchmarks/scale/class-d-azure-1000-campaign.sh "$t/campaign.sh"
          for x in bootstrap-timeout bootstrap-parallel peer-lease-freshness bandwidth-meter-parallel; do python3 "scripts/patch-class-d-diagnostic-$x.py" "$t/provision.sh"; done
          for x in readiness-parallel readiness-window readiness-evidence readiness-transport baseline-parallel restart-parallel post-restart-origin; do python3 "scripts/patch-class-d-diagnostic-$x.py" "$t/campaign.sh"; done
          python3 - "$t/campaign.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          if s.count('seq 10 14')!=3 or s.count('range(10,15)')!=1: raise SystemExit('unexpected restart range')
          p.write_text(s.replace('seq 10 14','seq 5 9').replace('range(10,15)','range(5,10)'))
          PY
          python3 scripts/patch-class-d-diagnostic-composed-heal-evidence.py "$t/provision.sh" "$t/campaign.sh"
          python3 scripts/patch-d200-baseline-production-recovery.py "$t/campaign.sh"
          grep -F 'D200_BASELINE_PRODUCTION_RECOVERY=1' "$t/campaign.sh" >/dev/null
          grep -F "'targetCount':32" "$t/campaign.sh" >/dev/null
          grep -F "'maxRounds':2" "$t/campaign.sh" >/dev/null
          grep -F "assert float('$base_rate') >= .99, '$base_rate'" "$t/campaign.sh" >/dev/null
          bash -n "$t/provision.sh"; bash -n "$t/campaign.sh"
          set +e; PROVISION="$t/provision.sh" CAMPAIGN="$t/campaign.sh" GITHUB_SHA="$TESTED_COMMIT" TRUYN_AZURE_RESOURCE_GROUP="$AZURE_RESOURCE_GROUP" TRUYN_CLASS_D1000_LOCATION="$TRUYN_D200_LOCATION" TRUYN_CLASS_D1000_VM_SIZE="$TRUYN_D200_VM_SIZE" TRUYN_CLASS_D1000_NODES_PER_HOST="$NODES_PER_HOST" TRUYN_CLASS_D1000_RUNTIME_URL="$TRUYN_D200_RUNTIME_URL" TRUYN_CLASS_D1000_RUNTIME_SHA256="$TRUYN_D200_RUNTIME_SHA256" bash -c 'set -Eeuo pipefail; source "$PROVISION"; source "$CAMPAIGN"' 2>&1|tee class-d-200-diagnostic.log; rc=${PIPESTATUS[0]}; set -e; echo "campaign_rc=$rc" >>"$GITHUB_OUTPUT"; rm -rf "$t"; exit "$rc"

      - name: Evaluate strict D-200 evidence
        id: evaluate
        if: always()
        shell: bash
        run: |
          set +e; f=class-d-1000-evidence.json
          if [[ ! -f "$f" ]]; then for x in evaluator_rc=99 cleanup=false remaining=-1 ack_count=-1 ack_loss=-1; do echo "$x" >>"$GITHUB_OUTPUT"; done; exit 0; fi
          jq -e '.topology.hostCount==20 and .topology.nodeCount==200 and .topology.realProcessCount==200 and .topology.realProcessesPerHost==10 and .topology.uniqueIdentityCount==200 and .topology.uniqueEndpointCount==200 and .topology.syntheticNodeCount==0 and .readiness.readyNodeRatio>=.99 and .routing.baselineSuccessRatio>=.99 and .routing.postRestartSuccessRatio>=.99 and .routing.healedSuccessRatio>=.99 and .convergence.routingSuccessRatio>=.99 and .convergence.latencyMs.p95<=120000 and .recovery.latencyMs.p95<=120000 and .recovery.packetPartitionRecoveryMs<=120000 and .adversarial.packetPartition.realPacketPath==true and .adversarial.packetPartition.blockedSuccesses==0 and .safety.acknowledgedWriteCount==100 and .safety.acknowledgedWriteLossCount==0 and .safety.invalidSignedStateAcceptedCount==0 and .safety.staleRevokedReceiptAcceptedCount==0 and .safety.unauthorizedProviderExecutionCount==0 and .cleanup.confirmed==true and .cleanup.remainingResources==0' "$f" >/dev/null; rc=$?
          echo "evaluator_rc=$rc" >>"$GITHUB_OUTPUT"; echo "cleanup=$(jq -r '.cleanup.confirmed//false' "$f")" >>"$GITHUB_OUTPUT"; echo "remaining=$(jq -r '.cleanup.remainingResources//-1' "$f")" >>"$GITHUB_OUTPUT"; echo "ack_count=$(jq -r '.safety.acknowledgedWriteCount//-1' "$f")" >>"$GITHUB_OUTPUT"; echo "ack_loss=$(jq -r '.safety.acknowledgedWriteLossCount//-1' "$f")" >>"$GITHUB_OUTPUT"
          for q in baseline=.routing.baselineSuccessRatio post_restart=.routing.postRestartSuccessRatio healed=.routing.healedSuccessRatio convergence_routing=.convergence.routingSuccessRatio convergence_p95=.convergence.latencyMs.p95 recovery_p95=.recovery.latencyMs.p95 partition_recovery=.recovery.packetPartitionRecoveryMs; do k=${q%%=*}; e=${q#*=}; echo "$k=$(jq -r "$e//-1" "$f")" >>"$GITHUB_OUTPUT"; done; exit 0

      - name: Cleanup runtime staging fail-closed
        id: staging_cleanup
        if: always()
        shell: bash
        run: |
          set +e; a="${TRUYN_D200_STAGING_ACCOUNT:-}"
          if [[ -z "$a" ]]; then echo confirmed=true >>"$GITHUB_OUTPUT"; echo remaining=0 >>"$GITHUB_OUTPUT"; printf 'confirmed=true\nremaining=0\naccount=none\n' >class-d-200-runtime-staging-cleanup.txt; exit 0; fi
          az storage account delete -g "$AZURE_RESOURCE_GROUP" -n "$a" --yes --only-show-errors >/dev/null 2>&1; ok=false; rem=-1
          for _ in $(seq 1 60); do err="$(mktemp)"; az storage account show -g "$AZURE_RESOURCE_GROUP" -n "$a" --only-show-errors -o json >/dev/null 2>"$err"; rc=$?; last="$(cat "$err")"; rm -f "$err"; if [[ $rc -ne 0 ]] && grep -Eqi 'ResourceNotFound|StorageAccountNotFound|could not be found|was not found' <<<"$last"; then ok=true; rem=0; break; fi; sleep 5; done
          echo "confirmed=$ok" >>"$GITHUB_OUTPUT"; echo "remaining=$rem" >>"$GITHUB_OUTPUT"; printf 'confirmed=%s\nremaining=%s\naccount=%s\n' "$ok" "$rem" "$a" >class-d-200-runtime-staging-cleanup.txt

      - name: Upload immutable diagnostic artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'truyn-class-d200-35141c77-${{ github.run_id }}'
          path: |
            class-d-200-*.json
            class-d-200-*.txt
            class-d-200-*.log
            class-d-1000-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Normalize artifact digest
        id: digest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail; x='${{ steps.upload.outputs.artifact-digest }}'; if [[ "$x" =~ ^sha256:[0-9a-f]{64}$ ]]; then v="$x"; elif [[ "$x" =~ ^[0-9a-f]{64}$ ]]; then v="sha256:$x"; else exit 1; fi; echo "value=$v" >>"$GITHUB_OUTPUT"

      - name: Record strict terminal marker
        if: always()
        env:
          CAMPAIGN_RC: '${{ steps.campaign.outputs.campaign_rc }}'
          EVALUATOR_RC: '${{ steps.evaluate.outputs.evaluator_rc }}'
          CLEANUP: '${{ steps.evaluate.outputs.cleanup }}'
          REMAINING: '${{ steps.evaluate.outputs.remaining }}'
          ACK_COUNT: '${{ steps.evaluate.outputs.ack_count }}'
          ACK_LOSS: '${{ steps.evaluate.outputs.ack_loss }}'
          STAGING_CLEANUP: '${{ steps.staging_cleanup.outputs.confirmed }}'
          STAGING_REMAINING: '${{ steps.staging_cleanup.outputs.remaining }}'
          ARTIFACT_ID: '${{ steps.upload.outputs.artifact-id }}'
          DIGEST: '${{ steps.digest.outputs.value }}'
          RUNTIME_SHA: '${{ steps.runtime.outputs.sha }}'
          BASELINE: '${{ steps.evaluate.outputs.baseline }}'
          POST_RESTART: '${{ steps.evaluate.outputs.post_restart }}'
          HEALED: '${{ steps.evaluate.outputs.healed }}'
          CONV: '${{ steps.evaluate.outputs.convergence_routing }}'
          CONV_P95: '${{ steps.evaluate.outputs.convergence_p95 }}'
          RECOVERY_P95: '${{ steps.evaluate.outputs.recovery_p95 }}'
          PARTITION: '${{ steps.evaluate.outputs.partition_recovery }}'
        shell: bash
        run: |
          set -Eeuo pipefail; result=FAIL
          if [[ "${CAMPAIGN_RC:-99}" == 0 && "${EVALUATOR_RC:-99}" == 0 && "$CLEANUP" == true && "$REMAINING" == 0 && "$ACK_COUNT" == 100 && "$ACK_LOSS" == 0 && "$STAGING_CLEANUP" == true && "$STAGING_REMAINING" == 0 && -n "$ARTIFACT_ID" && "$DIGEST" == sha256:* && "$RUNTIME_SHA" =~ ^[0-9a-f]{64}$ ]]; then result=PASS; fi
          echo "TRUYN_D200_TERMINAL result=$result run=$GITHUB_RUN_ID launcher_sha=$GITHUB_SHA tested_sha=$TESTED_COMMIT tested_tree_sha=$TESTED_TREE_SHA exact_main_ci_run=$EXACT_MAIN_CI_RUN exact_main_codeql_run=$EXACT_MAIN_CODEQL_RUN runtime_sha256=sha256:${RUNTIME_SHA:-none} azure_location=${TRUYN_D200_LOCATION:-unknown} vm_size=${TRUYN_D200_VM_SIZE:-unknown} hosts=20 nodes=200 nodes_per_host=10 max_peers=32 campaign_rc=${CAMPAIGN_RC:-99} evaluator_rc=${EVALUATOR_RC:-99} acknowledged_write_count=${ACK_COUNT:--1} acknowledged_write_loss=${ACK_LOSS:--1} baseline=${BASELINE:--1} post_restart=${POST_RESTART:--1} healed=${HEALED:--1} convergence_routing=${CONV:--1} convergence_p95_ms=${CONV_P95:--1} recovery_p95_ms=${RECOVERY_P95:--1} partition_recovery_ms=${PARTITION:--1} cleanup=${CLEANUP:-false} remaining=${REMAINING:--1} staging_cleanup=${STAGING_CLEANUP:-false} staging_remaining=${STAGING_REMAINING:--1} artifact_id=${ARTIFACT_ID:-none} digest=${DIGEST:-none}"
          [[ "$result" == PASS ]]

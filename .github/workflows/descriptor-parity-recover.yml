name: Recover bounded Descriptor parity qualification
on:
  push:
    branches: [fix/descriptor-five-sdk-parity-20261012]
    paths: [.github/workflows/descriptor-parity-recover.yml]
permissions:
  contents: write
concurrency:
  group: descriptor-five-sdk-parity-20261012
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'inn-media/truyn' && github.ref == 'refs/heads/fix/descriptor-five-sdk-parity-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reapply exact bounded source patch with portable invalid signature
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 8cd23898314fd3d96a4796b485935f812a59f2a1 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          raw=Path('.github/workflows/descriptor-parity-apply.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=raw.index(marker)+len(marker)
          end=raw.index('\n          PY\n',start)
          source=textwrap.dedent(raw[start:end])
          assert source.count('bytes[0] ^= 1')==1
          source=source.replace('bytes[0] ^= 1','bytes[32] ^= 1')
          exec(compile(source,'descriptor-parity-reviewed-application','exec'),{})
          PY
          gofmt -w sdk/go/descriptor.go sdk/go/descriptor_interface_test.go
      - name: Reconcile active Descriptor guides without changing release coordinates
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          changed=json.loads(Path('/tmp/descriptor-parity-changed.json').read_text())
          def write(path,text):
              Path(path).write_text(text.rstrip()+'\n')
              if path not in changed: changed.append(path)
          paths=['SECURITY.md','sdk/README.md','sdk/conformance/README.md','docs/architecture/IMPLEMENTATION_STATUS.md','docs/architecture/SDK_DEVELOPER_EXPERIENCE.md','docs/compatibility/SDK_COMPATIBILITY.md','docs/getting-started/SDK_QUICKSTART.md','docs/getting-started/DX3_SDK.md']
          replacements={
          'Cross-language malformed-interface parity is not yet established.':'The bounded 18-case interface-parity suite is implemented through the actual HTTP fetch, validation, signature and selection path of all five source SDKs; exact-source acceptance is established by the corresponding successful five-language CI report.',
          'Missing or empty interface types are rejected by the reference parser; identical rejection across all five SDKs still needs executable proof.':'Each source SDK rejects missing or empty interface types and supplied empty/non-string endpoints, including invalid entries that negotiation would otherwise skip. The separate shared interface fixture and required five-language runner exercise this bounded contract.',
          'Current Descriptor evidence and remaining interface-negative parity:':'Current Descriptor contract and bounded five-SDK interface evidence:',
          'cross-language malformed-interface parity and complete production lifecycle certification remain separate unproven scopes.':'the bounded five-SDK interface-parity suite is implemented, while full production lifecycle and released-binary certification remain separate scopes.',
          'cross-language malformed-interface parity and broader release-specific lifecycle acceptance remain separate as described below.':'bounded source interface-parity checks now exercise all five SDKs; broader release-specific lifecycle acceptance remains separate as described below.',
          '- [ ] shared five-language acceptance of omitted optional endpoints and rejection of invalid empty endpoints or types, with current-source executable proof;':'- [x] shared 18-case source suite for five-language optional-endpoint acceptance and invalid endpoint/type rejection; exact-SHA qualification is recorded by the actual CI report, not inferred for immutable published packages;',
          'missing/blank endpoint/type negative parity is unverified on current source;':'bounded optional/invalid-interface source parity is implemented; ',
          'The five-language E2E proves executable happy-path network behavior. It does **not** by itself prove every negative property in every language: for example, it does not attempt a non-owner cancellation and its valid Descriptor fixture does not detect every missing/malformed endpoint case.':'The five-language E2E proves executable network behavior and now invokes the separate 18-case signed Descriptor interface matrix through every actual SDK. It does **not** prove every security/lifecycle property: non-owner cancellation, delegated signing and full production lifecycle require their own evidence.',
          'runtime Descriptor refresh/re-signing before expiry, full malformed/missing-interface-endpoint parity across every first-party verifier, archive-member content scanning beyond entry-name checks':'full production/delegated-signing Descriptor lifecycle beyond the implemented refresh and bounded 18-case interface-parity suite, archive-member content scanning beyond entry-name checks'
          }
          for path in paths:
              text=Path(path).read_text()
              for old,new in replacements.items(): text=text.replace(old,new)
              assert 'Cross-language malformed-interface parity is not yet established.' not in text
              assert 'identical rejection across all five SDKs still needs executable proof' not in text
              write(path,text)
          path='docs/compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md'
          old=Path(path).read_text()
          oldids=re.findall(r'^- `(descriptor\.[^`]+)`\s*$',old,re.M)
          assert len(oldids)==9
          text='''# Agent Descriptor: current contract and five-SDK source evidence

          **Implementation baseline:** `8cd23898314fd3d96a4796b485935f812a59f2a1` (2026-10-12). The prior sanitation identified a genuine bounded interface-parity gap. The current source adds the implementation and an executable shared suite; qualification must refer to the actual final SHA and successful CI, not this baseline.

          **DESCRIPTOR_INTERFACE_PARITY=IMPLEMENTED**

          ## Contract authority and optional endpoints

          An omitted interface endpoint is permitted; an explicitly empty endpoint is invalid in the current reference parser. The five source SDKs preserve this contract. Interface `type` must be a nonempty string. A supplied endpoint must be a nonempty string; null and other types are invalid. The existing nonempty-string profile does not trim whitespace or impose new URL/discovery rules.

          The [normative interface entry](../../spec/protocol/v1/agent-descriptor.md#5-interface-entry) permits intentionally undisclosed endpoints. This implementation does not change that specification, TCJ1 signed bytes, identity binding, refresh/re-signing, or immutable released packages.

          ## Actual five-SDK shared interface matrix

          The additional fixture is `sdk/conformance/v1/agent-descriptor-interface-fixtures.json`. The required runner is `sdk/conformance/run-descriptor-interface-parity.mjs`, invoked by the existing five-language release E2E. It serves the same freshly signed case to TypeScript, Python, Go, Java and .NET over loopback HTTP. Each driver invokes its actual SDK fetch/parse/validate/signature/negotiate path, not the reference parser on another language's behalf. The parent checks all five exact result sets, every expected outcome, one actual HTTP fetch per case, signer/identity binding and unchanged selected-interface fields.

          | Bounded property | Expected outcome |
          |---|---|
          | Omitted optional endpoint acceptance | Accept and preserve omission |
          | Normal supplied endpoint and optional metadata | Accept; preserve fields |
          | Explicit empty, null or numeric endpoint | Reject as invalid interfaces |
          | Missing, empty, null or numeric type | Reject as invalid interfaces |
          | Non-object interface entry | Reject as invalid interfaces |
          | Invalid additional/non-selected interface | Reject the entire Descriptor |
          | Whitespace-only endpoint under the existing no-trim profile | Preserve existing acceptance; not a usable-URL certification |
          | Tampered signature with otherwise valid present or omitted endpoint | Reject at signature verification |

          There are **18 cases per SDK / 90 observed SDK fetch-and-validation outcomes** in a successful invocation. Negative interface documents are correctly signed; separate signature-negative cases alter the signature scalar, retaining its structurally valid curve-point encoding. Thus an unrelated signature/HTTP/expiry error cannot masquerade as malformed-interface rejection.

          Native drivers:
          - `sdk/typescript/test/descriptor-interface-conformance.ts`
          - `sdk/python/tests/descriptor_interface_conformance.py`
          - `sdk/go/descriptor_interface_test.go`
          - `sdk/java/src/test/java/org/truyn/sdk/DescriptorInterfaceConformance.java`
          - `sdk/dotnet/conformance/DescriptorInterfaceConformance.cs`

          Go and Java now validate every interface entry. .NET no longer makes an omitted endpoint mandatory and follows the existing nonempty-string/no-trim profile. TypeScript/Python semantics were already consistent and are exercised through their real clients. Serving-time refresh in `runtime/agent-descriptor.js` and its tests are unchanged.

          ## Preserved baseline runtime cases

          The existing `sdk/conformance/v1/agent-descriptor-runtime-fixtures.json` is unchanged and retains exactly these observed cases:

          '''+'\n'.join('- `'+id+'`' for id in oldids)+'''

          The nine-case historical inventory and its bidirectional documentation regression remain distinct from the new 18-case interface fixture. The earlier sanitation test exercises the **reference parser only**; it is retained as a contract check, not substituted for the five actual SDK drivers.

          ## Exact-source qualification and release boundary

          Run `node sdk/conformance/run-five-language-e2e.mjs` with all five toolchains installed. The mandatory child runner prints `DESCRIPTOR_INTERFACE_PARITY_REPORT=` JSON with actual source SHA, worktree cleanliness, fixture/document digests, per-language results and observed HTTP counts. Any absent SDK, skipped/missing case, unexpected outcome, unrelated negative error or wrong selection fails the command. `TRUYN_DESCRIPTOR_PARITY_REPORT` optionally stores the same JSON as an artifact.

          A dirty-worktree application run is diagnostic evidence only. Acceptance requires clean final-head full CI, DCO/security/CodeQL and independent merged-main qualification. Use the actual pull request and run records; do not infer acceptance from a checkbox, historical S103 merge or an older SHA. The earlier Java diagnostic run rejected a deliberately malformed signature point with a JDK-specific message; the scalar-tamper fixture preserves cryptographic rejection and all strict interface checks while removing that test-path ambiguity.

          This closes only the bounded source interface matrix when qualified. It does not certify arbitrary Descriptor lifecycle, delegated signing, production/Mainnet or Stable TRUYN/1. Existing published Alpha bytes and private dependency pins are unchanged and require new versioned publication/consumer admission to obtain any source repair. Issue #615's broader S104-S200 and G1-G34 reconciliation remains independent.
          '''
          import textwrap
          write(path,textwrap.dedent(text))
          # Keep reference-only contract and exact legacy fixture assertions, but
          # transition their implementation status to the new scoped source suite.
          path='tests/documentation-release-regression.test.js'
          text=Path(path).read_text()
          old='assert.match(canonical, /DESCRIPTOR_INTERFACE_NEGATIVE_PARITY=UNVERIFIED/);'
          assert text.count(old)==1
          text=text.replace(old,"assert.match(canonical, /DESCRIPTOR_INTERFACE_PARITY=IMPLEMENTED/);\n  assert.ok(canonical.includes('sdk/conformance/v1/agent-descriptor-interface-fixtures.json'));\n  assert.ok(canonical.includes('sdk/conformance/run-descriptor-interface-parity.mjs'));")
          write(path,text)
          # No claim that the historical, already frozen release includes a repair.
          for path in paths:
              print('DOC_RECONCILED '+path)
              for n,line in enumerate(Path(path).read_text().splitlines(),1):
                  if 'parity' in line.lower(): print(str(n)+': '+line)
          Path('/tmp/descriptor-parity-changed.json').write_text(json.dumps(changed))
          PY
      - name: Install dependencies and remove all temporary writers
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check -e ./sdk/python
          git rm .github/workflows/descriptor-parity-apply.yml .github/workflows/descriptor-parity-recover.yml
      - name: Execute real five-SDK conformance and retained contract/security regressions
        env:
          TRUYN_DESCRIPTOR_PARITY_REPORT: ${{ runner.temp }}/descriptor-interface-parity.json
        run: |
          set -Eeuo pipefail
          node --test tests/agent-descriptor-interface-parity.test.js tests/documentation-descriptor-contract.test.js tests/documentation-descriptor-inventory.test.js tests/documentation-release-regression.test.js tests/agent-descriptor-refresh.test.js
          node sdk/conformance/run-five-language-e2e.mjs
          node scripts/check-documentation-consistency.mjs
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descriptor-parity-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/descriptor-interface-parity.json
          if-no-files-found: warn
      - name: Commit only reviewed source, test and documentation paths
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/descriptor-parity-changed.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==set(paths+['.github/workflows/descriptor-parity-apply.yml','.github/workflows/descriptor-parity-recover.yml']),actual
          forbidden=['runtime/agent-descriptor.js','sdk/conformance/v1/agent-descriptor-runtime-fixtures.json','sdk/release/public-coordinates.json','sdk/release/version.json','spec/protocol/v1/agent-descriptor.md']
          assert not set(forbidden)&actual
          PY
          test "$(git ls-remote origin refs/heads/fix/descriptor-five-sdk-parity-20261012 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git commit -s -m 'fix(sdk): qualify optional Descriptor endpoints across all five implementations'
          git push origin HEAD:refs/heads/fix/descriptor-five-sdk-parity-20261012
          git rev-parse HEAD

name: diag-d200-aa43e0e4-readiness-collection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-d200-aa43e0e4-readiness-collection.yml'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: truyn-d200-aa43e0e4-readiness-collection-single-shot
  cancel-in-progress: false

env:
  TESTED_COMMIT: aa43e0e47c26a3487540e9f066d8dd39254e82c8
  TESTED_TREE_SHA: e840d56e07d4bca3711c7468d3bf8293bb5ca9ef
  EXACT_MAIN_CI_RUN: '34161480503'
  EXACT_MAIN_CODEQL_RUN: '34161480549'
  CAMPAIGN_BLOB_SHA: 796d9d00dea3807279d8326de0a916a72b487949
  RUNTIME_BLOB_SHA: 7c075b3379ba4f1bc7afc4ff9839d6f7aa3e2ca9
  NODE_SERVICE_BLOB_SHA: 585eb536f8323ca13bd45050b50c4efd2aaacada
  QUIC_RPC_BLOB_SHA: 290929a3e8c8ddfec95d93456ea6f645205c0fe5
  P2P_BLOB_SHA: 96f447edde30b5d601c91051c1f67cc4d6140a34
  READINESS_PATCH_BLOB_SHA: 51fe3b291d1bd393a0cdf2a0ddfb9cf4d709a86c
  DHT_REPLICATION_BLOB_SHA: 3df007b8893c199f2dcef70a8df4a292b09efd76
  DHT_REPAIR_TEST_BLOB_SHA: a291994cd9712c846793b28d417f28a14a0edaff
  AZURE_RESOURCE_GROUP: truyn
  NODES_PER_HOST: '10'

jobs:
  diagnostic-d200:
    name: Immutable D-200 readiness-collection verification on aa43e0e4
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Enforce immutable one-shot launch commit
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/diag-d200-aa43e0e4-readiness-collection.yml'
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          j="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          [[ "$(jq '.files|length' <<<"$j")" == 1 ]]
          [[ "$(jq -r '.files[0].filename' <<<"$j")" == "$workflow" ]]
          [[ "$(jq -r '.files[0].status' <<<"$j")" == added ]]
          [[ "$(jq '.parents|length' <<<"$j")" == 1 ]]
          [[ "$(jq -r '.parents[0].sha' <<<"$j")" == "$TESTED_COMMIT" ]]
          t="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TESTED_COMMIT}")"
          [[ "$(jq -r '.commit.tree.sha' <<<"$t")" == "$TESTED_TREE_SHA" ]]
          jq -e '.commit.message | contains("Signed-off-by:")' <<<"$t" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: '${{ env.TESTED_COMMIT }}'
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact green pinned repair source
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_COMMIT" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}^{tree}")" == "$TESTED_TREE_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:benchmarks/scale/class-d-azure-1000-campaign.sh")" == "$CAMPAIGN_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:network/runtime.js")" == "$RUNTIME_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:network/testnet/node-service.js")" == "$NODE_SERVICE_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:network/discovery/quic-rpc.js")" == "$QUIC_RPC_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:network/transport/p2p.js")" == "$P2P_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:scripts/patch-class-d-diagnostic-readiness-parallel.py")" == "$READINESS_PATCH_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:network/replication/dht-replication.js")" == "$DHT_REPLICATION_BLOB_SHA" ]]
          [[ "$(git rev-parse "${TESTED_COMMIT}:tests/dht-replication-keyspace.test.js")" == "$DHT_REPAIR_TEST_BLOB_SHA" ]]
          ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CI_RUN}")"
          cq="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CODEQL_RUN}")"
          jq -e --arg sha "$TESTED_COMMIT" '.name=="CI" and .head_branch=="main" and .head_sha==$sha and .event=="push" and .status=="completed" and .conclusion=="success"' <<<"$ci" >/dev/null
          jq -e --arg sha "$TESTED_COMMIT" '.head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' <<<"$cq" >/dev/null
          node --test tests/dht-replication-keyspace.test.js
          git diff --check
          printf 'tested_commit=%s\ntested_tree_sha=%s\nlauncher_sha=%s\nrun_id=%s\nhost_count=20\nnode_count=200\nnodes_per_host=10\nrouting_threshold=0.99\nconvergence_p95_limit_ms=120000\nrecovery_p95_limit_ms=120000\nacknowledged_write_count_required=100\nacknowledged_write_loss_required=0\nstrict_d1000_acceptance=false\ndiagnostic_focus=post-490-readiness-observation-collection\n' "$TESTED_COMMIT" "$TESTED_TREE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" > class-d-200-diagnostic-input.txt

      - name: Build immutable runtime bundle
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          b="$RUNNER_TEMP/truyn-d200-runtime.tgz"
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" scripts/build-class-d-1000-runtime-bundle.sh "$b"
          s="$(awk '{print $1}' "${b}.sha256")"
          [[ "$s" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$s" "$b" | sha256sum -c -
          d="$(mktemp -d)"
          tar -xzf "$b" -C "$d"
          jq -e --arg sha "$TESTED_COMMIT" '.schema=="truyn.class-d1000.runtime-bundle.v1" and .sourceSha==$sha' "$d/manifest.json" >/dev/null
          cp "$d/manifest.json" class-d-200-runtime-manifest.json
          printf 'sha256:%s\n' "$s" > class-d-200-runtime-bundle-digest.txt
          echo "path=$b" >> "$GITHUB_OUTPUT"
          echo "sha=$s" >> "$GITHUB_OUTPUT"
          rm -rf "$d"

      - uses: azure/login@v2
        with:
          client-id: '${{ secrets[format(''AZURE_{0}_ID'',''CLIENT'')] }}'
          tenant-id: '${{ secrets[format(''AZURE_{0}_ID'',''TENANT'')] }}'
          subscription-id: '${{ secrets[format(''AZURE_{0}_ID'',''SUBSCRIPTION'')] }}'

      - name: Select fail-closed 20-VM placement
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=false
          for l in eastus2 eastus westus2 centralus northcentralus southcentralus westeurope northeurope; do
            u="$(az vm list-usage -l "$l" -o json --only-show-errors)" || continue
            rc="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].currentValue//-1' <<<"$u")"
            rl="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].limit//-1' <<<"$u")"
            for z in Standard_E2as_v7 Standard_D4as_v5 Standard_D4s_v5; do
              q="$(az vm list-skus -l "$l" --size "$z" --all -o json --only-show-errors)" || continue
              [[ "$(jq length <<<"$q")" -ge 1 ]] || continue
              v="$(jq -r '[.[].capabilities[]?|select(.name=="vCPUs")|.value][0]//empty' <<<"$q")"
              f="$(jq -r '.[0].family//empty' <<<"$q")"
              [[ -n "$v" && -n "$f" ]] || continue
              fc="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].currentValue//-1' <<<"$u")"
              fl="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].limit//-1' <<<"$u")"
              blocks="$(jq '[.[].restrictions[]?|select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")]|length' <<<"$q")"
              need=$((v*20))
              echo "TRUYN_D200_CAPACITY_PROBE location=$l size=$z required=$need regionalRemaining=$((rl-rc)) familyRemaining=$((fl-fc)) blocks=$blocks"
              if [[ "$blocks" == 0 && "$rc" -ge 0 && "$fc" -ge 0 && $((rl-rc)) -ge "$need" && $((fl-fc)) -ge "$need" ]]; then
                echo "TRUYN_D200_LOCATION=$l" >> "$GITHUB_ENV"
                echo "TRUYN_D200_VM_SIZE=$z" >> "$GITHUB_ENV"
                ok=true
                break 2
              fi
            done
          done
          [[ "$ok" == true ]]

      - name: Stage immutable runtime bundle with OIDC data-plane auth
        id: staging
        env:
          RUNTIME_BUNDLE: '${{ steps.runtime.outputs.path }}'
          RUNTIME_SHA: '${{ steps.runtime.outputs.sha }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          a="td2d200${GITHUB_RUN_ID}"
          c=runtime
          b=truyn-d200-runtime.tgz
          [[ ${#a} -le 24 ]]
          az storage account create -g "$AZURE_RESOURCE_GROUP" -n "$a" -l "$TRUYN_D200_LOCATION" --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false -o none --only-show-errors
          rid="$(az storage account show -g "$AZURE_RESOURCE_GROUP" -n "$a" --query id -o tsv --only-show-errors)"
          assignee="$(az account show --query user.name -o tsv --only-show-errors)"
          [[ -n "$assignee" ]]
          az role assignment create --assignee "$assignee" --role 'Storage Blob Data Contributor' --scope "$rid" -o none --only-show-errors
          ready=false
          for _ in $(seq 1 24); do
            if az storage container create --name "$c" --account-name "$a" --auth-mode login -o none --only-show-errors 2>/dev/null; then ready=true; break; fi
            sleep 5
          done
          [[ "$ready" == true ]]
          az storage blob upload --container-name "$c" --name "$b" --file "$RUNTIME_BUNDLE" --account-name "$a" --auth-mode login --overwrite true -o none --only-show-errors
          x="$(date -u -d '+6 hours' '+%Y-%m-%dT%H:%MZ')"
          sas="$(az storage blob generate-sas --container-name "$c" --name "$b" --account-name "$a" --auth-mode login --as-user --permissions r --https-only --expiry "$x" -o tsv --only-show-errors)"
          [[ -n "$sas" ]]
          echo "::add-mask::$sas"
          url="https://${a}.blob.core.windows.net/${c}/${b}?${sas}"
          echo "::add-mask::$url"
          echo "TRUYN_D200_STAGING_ACCOUNT=$a" >> "$GITHUB_ENV"
          echo "TRUYN_D200_STAGING_RESOURCE_ID=$rid" >> "$GITHUB_ENV"
          echo "TRUYN_D200_RUNTIME_URL=$url" >> "$GITHUB_ENV"
          echo "TRUYN_D200_RUNTIME_SHA256=$RUNTIME_SHA" >> "$GITHUB_ENV"

      - name: Execute real 20-host 200-process campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          t="$(mktemp -d)"
          cp benchmarks/scale/class-d-azure-1000-provision.sh "$t/provision.sh"
          cp benchmarks/scale/class-d-azure-1000-campaign.sh "$t/campaign.sh"
          python3 scripts/patch-class-d-diagnostic-bootstrap-timeout.py "$t/provision.sh"
          python3 scripts/patch-class-d-diagnostic-bootstrap-parallel.py "$t/provision.sh"
          python3 scripts/patch-class-d-diagnostic-bandwidth-meter-parallel.py "$t/provision.sh"
          python3 scripts/patch-class-d-diagnostic-readiness-parallel.py "$t/campaign.sh"
          python3 scripts/patch-class-d-diagnostic-baseline-parallel.py "$t/campaign.sh"
          python3 scripts/patch-class-d-diagnostic-restart-parallel.py "$t/campaign.sh"
          python3 - "$t/campaign.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          if s.count('seq 10 14')!=3 or s.count('range(10,15)')!=1: raise SystemExit('unexpected restart range')
          p.write_text(s.replace('seq 10 14','seq 5 9').replace('range(10,15)','range(5,10)'))
          PY
          python3 scripts/patch-class-d-diagnostic-composed-heal-evidence.py "$t/provision.sh" "$t/campaign.sh"
          bash -n "$t/provision.sh"
          bash -n "$t/campaign.sh"
          set +e
          PROVISION="$t/provision.sh" CAMPAIGN="$t/campaign.sh" GITHUB_SHA="$TESTED_COMMIT" TRUYN_AZURE_RESOURCE_GROUP="$AZURE_RESOURCE_GROUP" TRUYN_CLASS_D1000_LOCATION="$TRUYN_D200_LOCATION" TRUYN_CLASS_D1000_VM_SIZE="$TRUYN_D200_VM_SIZE" TRUYN_CLASS_D1000_NODES_PER_HOST="$NODES_PER_HOST" TRUYN_CLASS_D1000_RUNTIME_URL="$TRUYN_D200_RUNTIME_URL" TRUYN_CLASS_D1000_RUNTIME_SHA256="$TRUYN_D200_RUNTIME_SHA256" bash -c 'set -Eeuo pipefail; source "$PROVISION"; source "$CAMPAIGN"' 2>&1 | tee class-d-200-diagnostic.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "campaign_rc=$rc" >> "$GITHUB_OUTPUT"
          rm -rf "$t"
          exit "$rc"

      - name: Evaluate strict D-200 evidence
        id: evaluate
        if: always()
        shell: bash
        run: |
          set +e
          f=class-d-1000-evidence.json
          if [[ ! -f "$f" ]]; then
            echo evaluator_rc=99 >> "$GITHUB_OUTPUT"
            echo cleanup=false >> "$GITHUB_OUTPUT"
            echo remaining=-1 >> "$GITHUB_OUTPUT"
            echo ack_count=-1 >> "$GITHUB_OUTPUT"
            echo ack_loss=-1 >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '.topology.hostCount==20 and .topology.nodeCount==200 and .topology.realProcessCount==200 and .topology.realProcessesPerHost==10 and .topology.uniqueIdentityCount==200 and .topology.uniqueEndpointCount==200 and .topology.syntheticNodeCount==0 and .readiness.readyNodeRatio>=.99 and .routing.baselineSuccessRatio>=.99 and .routing.postRestartSuccessRatio>=.99 and .routing.healedSuccessRatio>=.99 and .convergence.routingSuccessRatio>=.99 and .convergence.latencyMs.p95<=120000 and .recovery.latencyMs.p95<=120000 and .recovery.packetPartitionRecoveryMs<=120000 and .adversarial.packetPartition.realPacketPath==true and .adversarial.packetPartition.blockedSuccesses==0 and .safety.acknowledgedWriteCount==100 and .safety.acknowledgedWriteLossCount==0 and .safety.invalidSignedStateAcceptedCount==0 and .safety.staleRevokedReceiptAcceptedCount==0 and .safety.unauthorizedProviderExecutionCount==0 and .cleanup.confirmed==true and .cleanup.remainingResources==0' "$f" >/dev/null
          rc=$?
          echo "evaluator_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "cleanup=$(jq -r '.cleanup.confirmed//false' "$f")" >> "$GITHUB_OUTPUT"
          echo "remaining=$(jq -r '.cleanup.remainingResources//-1' "$f")" >> "$GITHUB_OUTPUT"
          echo "ack_count=$(jq -r '.safety.acknowledgedWriteCount//-1' "$f")" >> "$GITHUB_OUTPUT"
          echo "ack_loss=$(jq -r '.safety.acknowledgedWriteLossCount//-1' "$f")" >> "$GITHUB_OUTPUT"
          for q in 'baseline=.routing.baselineSuccessRatio' 'post_restart=.routing.postRestartSuccessRatio' 'healed=.routing.healedSuccessRatio' 'convergence_routing=.convergence.routingSuccessRatio' 'convergence_p95=.convergence.latencyMs.p95' 'recovery_p95=.recovery.latencyMs.p95' 'partition_recovery=.recovery.packetPartitionRecoveryMs'; do
            k=${q%%=*}; e=${q#*=}; echo "$k=$(jq -r "$e//-1" "$f")" >> "$GITHUB_OUTPUT"
          done
          exit 0

      - name: Cleanup runtime staging fail-closed
        id: staging_cleanup
        if: always()
        shell: bash
        run: |
          set +e
          a="${TRUYN_D200_STAGING_ACCOUNT:-}"
          if [[ -z "$a" ]]; then
            echo confirmed=true >> "$GITHUB_OUTPUT"
            echo remaining=0 >> "$GITHUB_OUTPUT"
            printf 'confirmed=true\nremaining=0\naccount=none\nresource_id=none\n' > class-d-200-runtime-staging-cleanup.txt
            exit 0
          fi
          az storage account delete -g "$AZURE_RESOURCE_GROUP" -n "$a" --yes --only-show-errors >/dev/null 2>&1
          ok=false
          rem=-1
          last=''
          for _ in $(seq 1 60); do
            err="$(mktemp)"
            az storage account show -g "$AZURE_RESOURCE_GROUP" -n "$a" --only-show-errors -o json >/dev/null 2>"$err"
            rc=$?
            last="$(cat "$err")"
            rm -f "$err"
            if [[ $rc -ne 0 ]] && grep -Eqi 'ResourceNotFound|StorageAccountNotFound|could not be found|was not found' <<<"$last"; then
              ok=true
              rem=0
              break
            fi
            sleep 5
          done
          echo "confirmed=$ok" >> "$GITHUB_OUTPUT"
          echo "remaining=$rem" >> "$GITHUB_OUTPUT"
          printf 'confirmed=%s\nremaining=%s\naccount=%s\nresource_id=%s\n' "$ok" "$rem" "$a" "${TRUYN_D200_STAGING_RESOURCE_ID:-unknown}" > class-d-200-runtime-staging-cleanup.txt
          if [[ "$ok" != true ]]; then printf '%s\n' "$last" > class-d-200-runtime-staging-cleanup-error.txt; fi

      - name: Upload immutable diagnostic artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'truyn-class-d200-aa43e0e4-${{ github.run_id }}'
          path: |
            class-d-200-*.json
            class-d-200-*.txt
            class-d-200-*.log
            class-d-1000-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Normalize artifact digest
        id: digest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          x='${{ steps.upload.outputs.artifact-digest }}'
          if [[ "$x" =~ ^sha256:[0-9a-f]{64}$ ]]; then v="$x"; elif [[ "$x" =~ ^[0-9a-f]{64}$ ]]; then v="sha256:$x"; else exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Record strict terminal marker
        if: always()
        env:
          CAMPAIGN_RC: '${{ steps.campaign.outputs.campaign_rc }}'
          EVALUATOR_RC: '${{ steps.evaluate.outputs.evaluator_rc }}'
          CLEANUP: '${{ steps.evaluate.outputs.cleanup }}'
          REMAINING: '${{ steps.evaluate.outputs.remaining }}'
          ACK_COUNT: '${{ steps.evaluate.outputs.ack_count }}'
          ACK_LOSS: '${{ steps.evaluate.outputs.ack_loss }}'
          STAGING_CLEANUP: '${{ steps.staging_cleanup.outputs.confirmed }}'
          STAGING_REMAINING: '${{ steps.staging_cleanup.outputs.remaining }}'
          ARTIFACT_ID: '${{ steps.upload.outputs.artifact-id }}'
          DIGEST: '${{ steps.digest.outputs.value }}'
          RUNTIME_SHA: '${{ steps.runtime.outputs.sha }}'
          BASELINE: '${{ steps.evaluate.outputs.baseline }}'
          POST_RESTART: '${{ steps.evaluate.outputs.post_restart }}'
          HEALED: '${{ steps.evaluate.outputs.healed }}'
          CONV: '${{ steps.evaluate.outputs.convergence_routing }}'
          CONV_P95: '${{ steps.evaluate.outputs.convergence_p95 }}'
          RECOVERY_P95: '${{ steps.evaluate.outputs.recovery_p95 }}'
          PARTITION: '${{ steps.evaluate.outputs.partition_recovery }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          result=FAIL
          if [[ "${CAMPAIGN_RC:-99}" == 0 && "${EVALUATOR_RC:-99}" == 0 && "$CLEANUP" == true && "$REMAINING" == 0 && "$ACK_COUNT" == 100 && "$ACK_LOSS" == 0 && "$STAGING_CLEANUP" == true && "$STAGING_REMAINING" == 0 && -n "$ARTIFACT_ID" && "$DIGEST" == sha256:* && "$RUNTIME_SHA" =~ ^[0-9a-f]{64}$ ]]; then result=PASS; fi
          echo "TRUYN_D200_TERMINAL result=$result run=$GITHUB_RUN_ID launcher_sha=$GITHUB_SHA tested_sha=$TESTED_COMMIT tested_tree_sha=$TESTED_TREE_SHA exact_main_ci_run=$EXACT_MAIN_CI_RUN exact_main_codeql_run=$EXACT_MAIN_CODEQL_RUN runtime_sha256=sha256:${RUNTIME_SHA:-none} azure_location=${TRUYN_D200_LOCATION:-unknown} vm_size=${TRUYN_D200_VM_SIZE:-unknown} hosts=20 nodes=200 nodes_per_host=10 campaign_rc=${CAMPAIGN_RC:-99} evaluator_rc=${EVALUATOR_RC:-99} acknowledged_write_count=${ACK_COUNT:--1} acknowledged_write_loss=${ACK_LOSS:--1} baseline=${BASELINE:--1} post_restart=${POST_RESTART:--1} healed=${HEALED:--1} convergence_routing=${CONV:--1} convergence_p95_ms=${CONV_P95:--1} recovery_p95_ms=${RECOVERY_P95:--1} partition_recovery_ms=${PARTITION:--1} cleanup=${CLEANUP:-false} remaining=${REMAINING:--1} staging_cleanup=${STAGING_CLEANUP:-false} staging_remaining=${STAGING_REMAINING:--1} artifact_id=${ARTIFACT_ID:-none} digest=${DIGEST:-none}"
          [[ "$result" == PASS ]]

name: D-Series Admission Gate

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - D-Series Frozen Candidate Qualification
    types: [completed]
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful D-Series Frozen Candidate Qualification run to admit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: d-series-admission-${{ github.event.workflow_run.id || inputs.qualification_run_id || github.sha }}
  cancel-in-progress: false

jobs:
  admission:
    name: frozen-candidate-to-current-main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve qualification evidence
        id: q
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -Eeuo pipefail
          eligible=true
          run_id="${MANUAL_RUN_ID:-$AUTO_RUN_ID}"

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Main movement performs only cheap Admission. Runtime candidates are
            # authorized by the TESTED_COMMIT pinned in the current acceptance
            # controllers, not by arbitrary D-sensitive PRs. Historical qualification
            # generations for the same candidate are deduplicated by candidate SHA.
            mapfile -t open_heads < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.sha' | sort -u)
            mapfile -t controller_candidates < <(
              for f in .github/workflows/d*-acceptance.yml; do
                [[ -f "$f" ]] || continue
                sed -nE "s/^[[:space:]]*TESTED_COMMIT:[[:space:]]*['\"]?([0-9a-f]{40})['\"]?[[:space:]]*$/\1/p" "$f"
              done | sort -u
            )

            active_candidates=()
            for candidate in "${controller_candidates[@]}"; do
              for head in "${open_heads[@]}"; do
                if [[ "$candidate" == "$head" ]]; then
                  active_candidates+=("$candidate")
                  break
                fi
              done
            done

            if (( ${#active_candidates[@]} == 0 )); then
              eligible=false
              echo "TRUYN_D_SERIES_ADMISSION=SKIP reason=no_controller_referenced_open_candidate main=$GITHUB_SHA"
            elif (( ${#active_candidates[@]} > 1 )); then
              echo "TRUYN_D_SERIES_ADMISSION=FAIL reason=ambiguous_controller_candidates candidates=${active_candidates[*]}" >&2
              exit 23
            else
              target_candidate="${active_candidates[0]}"
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/d-series-frozen-candidate-qualification.yml/runs?status=success&per_page=100")"
              declare -A seen_candidates=()
              matched_run=''
              while read -r candidate_run; do
                [[ "$candidate_run" =~ ^[1-9][0-9]+$ ]] || continue
                artifact_name="d-series-qualification-manifest-${candidate_run}"
                artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}/artifacts?per_page=100")"
                if ! jq -e --arg n "$artifact_name" '[.artifacts[] | select(.name==$n and .expired==false and (.size_in_bytes//0)>0)] | length==1' <<<"$artifacts" >/dev/null; then
                  continue
                fi
                tmp="$(mktemp -d)"
                if ! gh run download "$candidate_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$tmp" >/dev/null 2>&1; then
                  rm -rf "$tmp"
                  continue
                fi
                manifest="$tmp/d-series-qualification-manifest.json"
                candidate="$(jq -r '.candidateSha // empty' "$manifest" 2>/dev/null || true)"
                rm -rf "$tmp"
                [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || continue
                [[ -z "${seen_candidates[$candidate]+x}" ]] || continue
                seen_candidates[$candidate]=1
                if [[ "$candidate" == "$target_candidate" ]]; then
                  matched_run="$candidate_run"
                  break
                fi
              done < <(jq -r '[.workflow_runs[] | select(.name=="D-Series Frozen Candidate Qualification" and .status=="completed" and .conclusion=="success" and .run_attempt==1)] | sort_by(.updated_at) | reverse | .[].id' <<<"$runs")

              if [[ ! "$matched_run" =~ ^[1-9][0-9]+$ ]]; then
                echo "TRUYN_D_SERIES_ADMISSION=FAIL reason=controller_candidate_missing_qualification candidate=$target_candidate" >&2
                exit 24
              fi
              run_id="$matched_run"
              echo "TRUYN_D_SERIES_ADMISSION=AUTO_RECHECK qualification_run=$run_id candidate=$target_candidate authority=current_acceptance_controller main=$GITHUB_SHA"
            fi
          fi

          if [[ "$eligible" == true ]]; then
            [[ "$run_id" =~ ^[1-9][0-9]+$ ]]
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e '.name=="D-Series Frozen Candidate Qualification" and .status=="completed" and .conclusion=="success" and .run_attempt==1' <<<"$run" >/dev/null
            artifact_name="d-series-qualification-manifest-${run_id}"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            jq -e --arg n "$artifact_name" '[.artifacts[] | select(.name==$n and .expired==false and (.size_in_bytes//0)>0)] | length==1' <<<"$artifacts" >/dev/null
            echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          fi
          echo "eligible=$eligible" >>"$GITHUB_OUTPUT"

      - name: Download automatic D qualification manifest
        if: steps.q.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: d-series-qualification-manifest-*
          path: qualification
          merge-multiple: true
          run-id: ${{ steps.q.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build integration candidate and recompute fingerprints
        if: steps.q.outputs.eligible == 'true'
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          q=qualification/d-series-qualification-manifest.json
          [[ -s "$q" ]]
          node scripts/verify-d-series-frozen-candidate-policy.mjs
          candidate="$(jq -r .candidateSha "$q")"
          base="$(jq -r .baseSha "$q")"
          scale="$(jq -r .scale "$q")"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$candidate"
          git fetch --no-tags origin "$current_main"
          git merge-base --is-ancestor "$base" "$candidate"
          git checkout --detach "$current_main"
          git config user.name 'TRUYN D-Series Admission'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff --no-commit "$candidate"
          integration_tree="$(git write-tree)"
          [[ "$integration_tree" =~ ^[0-9a-f]{40}$ ]]
          node scripts/d-series-qualification-manifest.mjs admission \
            --qualification-manifest "$q" --base-sha "$base" --candidate-sha "$candidate" \
            --current-main-sha "$current_main" --integration-ref "$integration_tree" --scale "$scale" \
            --output d-series-admission-manifest.json
          echo "candidate=$candidate" >>"$GITHUB_OUTPUT"
          echo "scale=$scale" >>"$GITHUB_OUTPUT"
          echo "current_main=$current_main" >>"$GITHUB_OUTPUT"
          echo "integration_tree=$integration_tree" >>"$GITHUB_OUTPUT"

      - name: Run small mandatory integration admission gate
        if: steps.q.outputs.eligible == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/verify-d-series-frozen-candidate-policy.mjs
          node scripts/verify-d-series-swarm-blockwise-architecture-lock.mjs
          node --test tests/d-series-frozen-candidate-admission.test.js tests/d-series-main-movement-auto-admission.test.js
          git diff --check

      - name: Requalify only D-sensitive blocks touched by BASE_SHA to current main
        if: steps.q.outputs.eligible == 'true'
        shell: bash
        env:
          TRUYN_CLASS_D_SOURCE_SHA: ${{ steps.plan.outputs.integration_tree }}
          ADMISSION_SCALE: ${{ steps.plan.outputs.scale }}
        run: |
          set -Eeuo pipefail
          case "$ADMISSION_SCALE" in all) local_scale=all ;; d200) local_scale=200 ;; d500) local_scale=500 ;; d1000) local_scale=1000 ;; *) exit 2 ;; esac
          mapfile -t blocks < <(jq -r '.decision.targetedBlocks[]?' d-series-admission-manifest.json)
          for block in "${blocks[@]}"; do
            node scripts/d-series-block-runner.mjs "$block" --scale "$local_scale" --result "admission-${block}.json"
            jq -e '.status=="PASS"' "admission-${block}.json" >/dev/null
          done

      - name: Finalize targeted requalification and enforce current-main freshness
        if: steps.q.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_CURRENT_MAIN_SHA: ${{ steps.plan.outputs.current_main }}
          ADMISSION_CANDIDATE_SHA: ${{ steps.plan.outputs.candidate }}
          ADMISSION_INTEGRATION_TREE_SHA: ${{ steps.plan.outputs.integration_tree }}
        run: |
          set -Eeuo pipefail
          [[ "$ADMISSION_CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADMISSION_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADMISSION_INTEGRATION_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -e '.decision.automaticFullRerunForbidden==true' d-series-admission-manifest.json >/dev/null
          fresh_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$fresh_main" == "$ADMISSION_CURRENT_MAIN_SHA" ]] || {
            echo "TRUYN_D_SERIES_ADMISSION=FAIL reason=main_moved_during_admission" >&2
            exit 22
          }
          node scripts/finalize-d-series-admission.mjs \
            --manifest d-series-admission-manifest.json \
            --result-prefix admission- \
            --output d-series-admission-manifest.final.json
          mv d-series-admission-manifest.final.json d-series-admission-manifest.json
          jq -e --arg tree "$ADMISSION_INTEGRATION_TREE_SHA" '
            .integrationTreeSha==$tree
            and .decision.admissionPassed==true
            and .decision.status=="PASS_COMPATIBLE"
            and .decision.targetedRequalificationPassed==true
            and .decision.liveRerunSatisfied==true
            and .decision.liveRerunRequired==false
            and .requalification.allPassed==true
          ' d-series-admission-manifest.json >/dev/null
          echo "TRUYN_D_SERIES_ADMISSION=PASS candidate=$ADMISSION_CANDIDATE_SHA current_main=$fresh_main integration_tree=$ADMISSION_INTEGRATION_TREE_SHA"

      - name: Upload admission manifest
        if: always() && steps.q.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d-series-admission-manifest-${{ github.run_id }}
          path: d-series-admission-manifest.json
          if-no-files-found: error
          retention-days: 90

name: Open Private Boundary

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  boundary:
    name: open-private-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce one-way repository boundary
        run: node scripts/check-open-private-boundary.mjs

name: D-Series Sanitation Swarm

on:
  push:
    branches:
      - 'd-series-launch/swarm-d500/**'
    paths:
      - '.github/d-series-launch/swarm-d500-*.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: d-series-swarm-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch-contract:
    name: d500-swarm-launch-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.contract.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate immutable exact-main launch token
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/d-series-launch/swarm-d500/* ]]
          source_sha="${{ github.event.before }}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" != 0000000000000000000000000000000000000000 ]]
          [[ "$(git rev-parse HEAD^)" == "$source_sha" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" == "$source_sha" ]]

          mapfile -t changed < <(git diff --name-only "$source_sha" "$GITHUB_SHA")
          [[ ${#changed[@]} -eq 1 ]]
          token="${changed[0]}"
          [[ "$token" =~ ^\.github/d-series-launch/swarm-d500-[A-Za-z0-9._-]+\.txt$ ]]
          [[ -f "$token" ]]
          [[ "$(sed -n 's/^MODE=//p' "$token" | tail -1)" == swarm ]]
          [[ "$(sed -n 's/^SCALE=//p' "$token" | tail -1)" == d500 ]]
          [[ "$(sed -n 's/^SOURCE_SHA=//p' "$token" | tail -1)" == "$source_sha" ]]
          [[ "$(grep -Ec '^(MODE|SCALE|SOURCE_SHA)=' "$token")" -eq 3 ]]
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"
          echo "TRUYN_D500_SWARM_LAUNCH_CONTRACT=PASS source_sha=$source_sha token=$token"

  canonical-swarm:
    name: canonical-d500-swarm
    needs: [launch-contract]
    uses: ./.github/workflows/d200-bug-hunt.yml
    with:
      source_sha: ${{ needs.launch-contract.outputs.source_sha }}
      scale: d500

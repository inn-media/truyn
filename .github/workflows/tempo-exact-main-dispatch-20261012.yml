name: TRUYN Tempo Startup Diagnostic 20261012
on:
  push:
    branches: [ops/tempo-dispatch-20261012-5754b708]
    paths: ['.github/workflows/tempo-exact-main-dispatch-20261012.yml']
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  inspect:
    if: github.repository == 'inn-media/truyn' && github.actor == 'ilucomutcnas'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read native startup annotation without dispatch or Azure calls
        shell: bash
        run: |
          set -Eeuo pipefail
          repo='inn-media/truyn'
          run='38226596295'
          suite='103566645052'
          gh api "repos/$repo/actions/runs/$run" --jq '{id,status,conclusion,head_sha,event,actor:.actor.login}'
          gh api "repos/$repo/check-suites/$suite" --jq '{id,status,conclusion,latest_check_runs_count,app:.app.slug}'
          gh api "repos/$repo/check-suites/$suite/check-runs?filter=all&per_page=100" > suite.json
          jq '{total_count,check_runs:[.check_runs[]|{id,name,status,conclusion,output}]}' suite.json
          jq -r '.check_runs[].id' suite.json | while read -r check; do
            gh api "repos/$repo/check-runs/$check/annotations?per_page=100" --jq '[.[]|{path,start_line,annotation_level,title,message}]'
          done
          gh api "repos/$repo/commits/5754b70820aa52d52a94f03c91d36c6badf084da/check-runs?filter=all&per_page=100" --jq '[.check_runs[]|select(.check_suite.id==103566645052)|{id,name,status,conclusion,output}]'
          echo 'TRUYN_TEMPO_STARTUP_INSPECTED writes=0 dispatches=0 azure_calls=0'

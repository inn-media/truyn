name: TRUYN Tempo Operator Dispatch 20261012
on:
  push:
    branches: [ops/tempo-dispatch-20261012-5754b708]
    paths: ['.github/workflows/tempo-exact-main-dispatch-20261012.yml']
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: truyn-tempo-exact-main-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'inn-media/truyn' && github.actor == 'ilucomutcnas' && github.ref == 'refs/heads/ops/tempo-dispatch-20261012-5754b708'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact protected main as configured operator
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Operator dispatch stopped at line $LINENO; reconcile before retry"' ERR
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo '::error::Single-shot operator dispatch must not be rerun'; exit 20; }
          [[ -n "$GH_TOKEN" ]] || { echo '::error::Configured operator credential is absent; no dispatch'; exit 21; }
          repo='inn-media/truyn'
          workflow='production-trace-backend.yml'
          expected='5754b70820aa52d52a94f03c91d36c6badf084da'
          parent='f589436662d3d49fe384463a2d0275bf22020b80'
          [[ "$(gh api user --jq '.login')" == 'ilucomutcnas' ]] || { echo '::error::Unexpected operator identity; no dispatch'; exit 22; }
          [[ "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" == "$expected" ]] || { echo '::error::MAIN_MOVED; no dispatch'; exit 23; }
          ci="$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$expected&event=push&per_page=1")"
          jq -e --arg sha "$expected" '.workflow_runs | length==1 and .[0].head_sha==$sha and .[0].status=="completed" and .[0].conclusion=="success"' <<<"$ci" >/dev/null
          checks="$(gh api --paginate --slurp "repos/$repo/commits/$expected/check-runs?per_page=100")"
          jq -e '[.[].check_runs[] | select(.app.slug=="github-actions")] | any(.name=="test" and .conclusion=="success") and any(.name=="mandatory-security-safety" and .conclusion=="success") and any(.name=="full-qualification" and .conclusion=="success")' <<<"$checks" >/dev/null
          gh api "repos/$repo/commits/$expected" | jq -e --arg head "$parent" 'any(.parents[]; .sha==$head)' >/dev/null
          security="$(gh api --paginate --slurp "repos/$repo/commits/$parent/check-runs?per_page=100")"
          jq -e '[.[].check_runs[]] | any(.name=="CodeQL" and .conclusion=="success" and .app.slug=="github-advanced-security") and any(.name=="DCO" and .conclusion=="success" and .app.slug=="github-actions")' <<<"$security" >/dev/null
          echo 'TRUYN_TEMPO_QUALIFICATION=PASS exact_main=1 full_ci=1 security=1 parent_codeql=1 dco=1'
          runs="$(gh api "repos/$repo/actions/workflows/$workflow/runs?exclude_pull_requests=true&per_page=100")"
          jq -e '[.workflow_runs[] | select(.head_branch=="main" and .event!="pull_request" and .status!="completed")] | length==0' <<<"$runs" >/dev/null
          prior="$(jq -r --arg sha "$expected" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .event!="pull_request" and .conclusion=="success")][0].id // empty' <<<"$runs")"
          if [[ -n "$prior" ]]; then
            echo "TRUYN_TEMPO_ALREADY_SUCCESS run_id=$prior"
            exit 0
          fi
          prior_run="$(gh api "repos/$repo/actions/runs/38226596295")"
          jq -e --arg sha "$expected" '.head_sha==$sha and .status=="completed" and .conclusion=="startup_failure"' <<<"$prior_run" >/dev/null
          gh api "repos/$repo/actions/runs/38226596295/jobs" | jq -e '.total_count==0' >/dev/null
          [[ "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" == "$expected" ]] || { echo '::error::MAIN_MOVED; no dispatch'; exit 24; }
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api -X POST "repos/$repo/actions/workflows/$workflow/dispatches" -f ref=main
          found=''
          for poll in $(seq 1 12); do
            fresh="$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&head_sha=$expected&per_page=10")"
            found="$(jq -r --arg sha "$expected" --arg stamp "$stamp" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .actor.login=="ilucomutcnas" and .created_at >= $stamp)][0].id // empty' <<<"$fresh")"
            [[ -z "$found" ]] || break
            sleep 5
          done
          [[ "$found" =~ ^[1-9][0-9]+$ ]] || { echo '::error::Receipt unresolved after POST; never duplicate'; exit 25; }
          jq -n --arg sha "$expected" --arg run "$found" --arg utc "$stamp" '{status:"dispatched_not_proven",sourceSha:$sha,runId:$run,requestedUtc:$utc}' > trace-dispatch-receipt.json
          echo "TRUYN_TEMPO_OPERATOR_DISPATCHED run_id=$found source_sha=$expected"
          printf 'Production trace run %s dispatched once on exact main %s. Not a runtime PASS.\n' "$found" "$expected" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain dispatch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-operator-dispatch-receipt
          path: trace-dispatch-receipt.json
          if-no-files-found: warn
          retention-days: 7

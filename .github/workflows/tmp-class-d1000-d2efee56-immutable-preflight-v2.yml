name: tmp-class-d1000-d2efee56-immutable-preflight-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-d2efee56-immutable-preflight-v2.yml'

permissions:
  contents: read
  actions: read
  issues: write

env:
  TESTED_COMMIT: d2efee563bf90aa9c34a208d70ee6ce3e6bfcb1e
  PINNED_REF: d1000/pinned-d2efee56
  ARTIFACT_NAME: class-d-1000-prepare-d2efee56-v2

jobs:
  immutable-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Record immutable preflight start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} stage=started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 D2EFEE56 IMMUTABLE PREFLIGHT V2 STARTED' -f "body=${body}" >/dev/null

      - name: Enforce one-shot launcher commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d1000-d2efee56-immutable-preflight-v2.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'added'

      - name: Checkout exact pinned source
        uses: actions/checkout@v4
        with:
          ref: d1000/pinned-d2efee56
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source and full regression
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git ls-remote origin "refs/heads/${PINNED_REF}" | cut -f1)" = "$TESTED_COMMIT"
          npm install --no-audit --no-fund
          npm test
          git diff --check

      - name: Immutable prepare-only acceptance preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh | tee class-d-1000-prerun.txt
          grep -Fqx 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned' class-d-1000-prerun.txt

      - name: Build and smoke-test immutable runtime bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p preflight runtime-smoke
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" bash scripts/build-class-d-1000-runtime-bundle.sh preflight/truyn-d1000-runtime.tgz | tee preflight/runtime-build.txt
          bundle_sha="$(awk '{print $1}' preflight/truyn-d1000-runtime.tgz.sha256)"
          test -n "$bundle_sha"
          printf '%s  %s\n' "$bundle_sha" preflight/truyn-d1000-runtime.tgz | sha256sum -c -
          tar -xzf preflight/truyn-d1000-runtime.tgz -C runtime-smoke
          test "$(jq -r '.sourceSha' runtime-smoke/manifest.json)" = "$TESTED_COMMIT"
          test "$(jq -r '.schema' runtime-smoke/manifest.json)" = 'truyn.class-d1000.runtime-bundle.v1'
          runtime-smoke/runtime/bin/node -e "import(process.cwd() + '/runtime-smoke/app/network/testnet/node-service.js').then(()=>console.log('TRUYN_CLASS_D1000_RUNTIME_IMPORT=PASS'))"
          printf '%s\n' "$bundle_sha" > preflight/runtime-bundle-sha256.txt
          python3 - "$TESTED_COMMIT" "$PINNED_REF" "$bundle_sha" > preflight/class-d-1000-prepare-manifest.json <<'PY'
          import json, sys
          source, pinned, bundle_sha = sys.argv[1:]
          print(json.dumps({
            'result': 'PASS',
            'sourceSha': source,
            'pinnedRef': pinned,
            'prepareOnly': True,
            'azureMutation': False,
            'preparedHarnessMarker': 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned',
            'runtimeBundle': {'file':'truyn-d1000-runtime.tgz','sha256':bundle_sha,'schema':'truyn.class-d1000.runtime-bundle.v1','osCompatibility':'ubuntu-22.04-amd64'}
          }, sort_keys=True, separators=(',', ':')))
          PY
          cp class-d-1000-prerun.txt preflight/

      - name: Upload immutable preflight artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: preflight/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable preflight PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          api_artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.name' <<<"$api_artifact")" = "$ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$api_artifact")" = "$ARTIFACT_DIGEST"
          bundle_sha="$(cat preflight/runtime-bundle-sha256.txt)"
          body="result=PASS run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} artifact_id=${ARTIFACT_ID} artifact_name=${ARTIFACT_NAME} artifact_digest=${ARTIFACT_DIGEST} runtime_bundle_sha256=${bundle_sha} prepareOnly=true azureMutation=false"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 D2EFEE56 IMMUTABLE PREFLIGHT V2 PASS' -f "body=${body}" >/dev/null

      - name: Publish immutable preflight failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          body="result=FAIL run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 D2EFEE56 IMMUTABLE PREFLIGHT V2 FAIL' -f "body=${body}" >/dev/null

name: Apply bounded documentation review repair
on:
  push:
    branches: [docs/sanitation-review-repair-20261012]
    paths: [.github/workflows/doc-sanitation-review-apply.yml]
permissions:
  contents: write
concurrency:
  group: doc-sanitation-review-repair-20261012
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'inn-media/truyn' && github.ref == 'refs/heads/docs/sanitation-review-repair-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact documentation-only replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor af530daa8f1cd1dc7c467089aef2c6442e90138a HEAD
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('.')
          changed = []
          def replace(path, old, new):
              p = root / path
              content = p.read_text()
              if content.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one exact replacement, got {content.count(old)}')
              p.write_text(content.replace(old, new))
              if path not in changed: changed.append(path)
          def add_reference(path, relative):
              p = root / path
              p.write_text(p.read_text().rstrip() + '\n\nCurrent Descriptor evidence and remaining interface-negative parity: [source-reconciled status](' + relative + ').\n')
              if path not in changed: changed.append(path)
          replace('sdk/README.md', 'Shared missing/blank endpoint and interface-type negatives are now implemented across all five language conformance runners (`sdk/conformance/v1/agent-descriptor-runtime-fixtures.json`; S103 source PR #823).', 'Missing/blank endpoint and blank-type negative parity is **not verified on current source**: the shared `sdk/conformance/v1/agent-descriptor-runtime-fixtures.json` lacks those cases, and current Go/Java validation does not establish the claimed rejection. Historical S103 PR #823 being merged is not proof that its intended behavior survives on current main.')
          replace('sdk/README.md', 'broader Descriptor lifecycle/delegated-signing and production serving qualification beyond the implemented refresh and shared interface-negative profile;', 'missing/blank endpoint and blank-type rejection across all five SDKs, plus broader Descriptor lifecycle/delegated-signing and production serving qualification beyond the implemented refresh;')
          replace('sdk/README.md', 'The previous alpha.1/alpha.2 Developer Release versions are preserved as historical artifacts, not overwritten.', 'The superseded npm alpha.2 and first-alpha PyPI/Go/Maven/NuGet coordinates are preserved as historical artifacts, not overwritten; the Go/Maven/NuGet alpha.2 coordinates below remain current.')
          add_reference('sdk/README.md', '../docs/compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md')
          replace('sdk/conformance/README.md', 'The shared `v1/agent-descriptor-runtime-fixtures.json` and all five language conformance runners implement missing-endpoint, blank-endpoint and blank-type negatives (S103). These are executable source checks, not merely happy-path claims.', 'The current `v1/agent-descriptor-runtime-fixtures.json` has nine signature/expiry/negotiation/invalid-JSON cases, but no missing-endpoint, blank-endpoint or blank-type cases. Shared five-language rejection of those malformed interfaces remains **unverified on current source**; merged historical S103 work does not replace current-source and executable proof.')
          add_reference('sdk/conformance/README.md', '../../docs/compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md')
          replace('SECURITY.md', '`tests/agent-descriptor-refresh.test.js` exercises the refresher; the shared `sdk/conformance/v1/agent-descriptor-runtime-fixtures.json` and five language runners include missing/blank endpoint and interface-type negatives (S103 source PR #823). These are implemented bounded source/conformance facts, not a fresh guarantee for every historical binary or all production lifecycle scenarios.', '`tests/agent-descriptor-refresh.test.js` exercises the refresher. In contrast, the current shared `sdk/conformance/v1/agent-descriptor-runtime-fixtures.json` lacks missing/blank endpoint and blank-type negatives; current Go/Java validators do not establish this rejection. Five-language malformed-interface parity remains **unverified on current source**. The historical merge of S103 PR #823 cannot establish current coverage, and refresh proof does not imply endpoint-validation parity or full production lifecycle certification.')
          add_reference('SECURITY.md', 'docs/compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md')
          replace('docs/architecture/IMPLEMENTATION_STATUS.md', '| Agent Descriptor | **Bounded valid-profile, refresh/re-sign and shared interface-negative source implemented** | full production lifecycle/delegated-signing and exact-SHA release qualification remain separate |', '| Agent Descriptor | **Bounded valid-profile and refresh/re-sign implemented** | missing/blank endpoint/type negative parity is unverified on current source; full production lifecycle/delegated-signing and exact-SHA release qualification remain separate |')
          add_reference('docs/architecture/IMPLEMENTATION_STATUS.md', '../compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md')
          replace('docs/architecture/SDK_DEVELOPER_EXPERIENCE.md', 'The bounded Descriptor lifecycle is now implemented end to end for the Developer Release profile.', 'The bounded Descriptor serving, refresh and valid-profile fetch/verification path is implemented. This is not complete malformed-interface parity across all five SDKs; current-source missing/blank endpoint and blank-type negatives remain unverified.')
          replace('docs/architecture/SDK_DEVELOPER_EXPERIENCE.md', '- [x] bounded Descriptor refresh/re-signing implementation and shared missing/blank endpoint/type negatives;', '- [x] bounded Descriptor refresh/re-signing implementation;\n- [ ] shared five-language missing/blank endpoint and blank-type rejection, with current-source executable negatives;')
          add_reference('docs/architecture/SDK_DEVELOPER_EXPERIENCE.md', '../compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md')
          add_reference('docs/compatibility/SDK_COMPATIBILITY.md', 'AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md')
          replace('README.md', '| PyPI / Go / npm alpha.5 |', '| PyPI a2 / Go alpha.2 / npm alpha.5 |')
          for path in ['STRUCTURE.md', 'docs/architecture/ARCHITECTURE_CONTRACT.md']:
              replace(path, 'PyPI, Go and npm alpha.5 public alphas', 'PyPI 0.1.0a2, Go v0.1.0-alpha.2 and npm 0.1.0-alpha.5 public prereleases')
          path = 'docs/operations/DOCUMENTATION_SANITATION_2026-10-12.md'
          replace(path, 'Descriptor serving-time refresh and shared missing/blank endpoint/type negatives are recorded as implemented source behavior.', '**Initial audit statement, superseded by the post-merge correction below:** Descriptor serving-time refresh and shared missing/blank endpoint/type negatives were recorded as implemented source behavior.')
          p = root / path
          p.write_text(p.read_text().rstrip() + '\n\n## Post-merge review correction (2026-10-12)\n\nInspection of exact merged source `af530daa8f1cd1dc7c467089aef2c6442e90138a` disproved the initial shared malformed-interface-negative claim. The current runtime fixture has nine signature/expiry/negotiation/invalid-JSON cases and no missing/blank endpoint or blank-type cases; the current Go/Java validators do not establish the claimed rejection. The historical S103 merge is preserved as history, not treated as proof that its intended behavior remains on main. Refresh/re-sign implementation and its own tests remain intact and are not reclassified as missing.\n\nCurrent source status is recorded in [Agent Descriptor evidence](../compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md). The sanitation successor corrects affected active guides and keeps this original audit correction explicit. No SDK implementation or immutable release bytes are changed.\n\nThe successor guard additionally rejects duplicate/missing/unknown SDK identities, registry-key substitutions, empty/missing/mismatched evidence pointers, non-file/out-of-repository proof paths, and unqualified per-P1-P14 acceptance-status or certificate changes. Negative regression tests exercise every SDK and every P gate. This is a documentation safety repair, not Stable admission or a replacement for runtime conformance.\n')
          fixture = json.loads((root / 'sdk/conformance/v1/agent-descriptor-runtime-fixtures.json').read_text())
          expected = ['descriptor.signature-valid', 'descriptor.signature-array-valid', 'descriptor.signature-tampered', 'descriptor.identity-key-mismatch', 'descriptor.expired', 'descriptor.negotiation-valid', 'descriptor.protocol-no-overlap', 'descriptor.interface-no-overlap', 'descriptor.invalid-json']
          if [item['id'] for item in fixture['descriptorRuntimeCases']] != expected:
              raise RuntimeError('Descriptor fixture moved; fresh source reconciliation required')
          path = 'docs/compatibility/AGENT_DESCRIPTOR_CURRENT_EVIDENCE.md'
          (root / path).write_text('# Agent Descriptor: current source evidence\n\n**Reviewed source:** `af530daa8f1cd1dc7c467089aef2c6442e90138a` (2026-10-12). This is a bounded source reconciliation, not release admission.\n\n**DESCRIPTOR_INTERFACE_NEGATIVE_PARITY=UNVERIFIED**\n\n## Supported and unsupported claims\n\nThe serving helper in `runtime/agent-descriptor.js` implements bounded refresh/re-signing; `tests/agent-descriptor-refresh.test.js` covers that contract. The five-language E2E supplies a valid signed Descriptor. Neither fact proves rejection of missing/blank interface endpoints or blank interface types across every SDK.\n\nThe current `sdk/conformance/v1/agent-descriptor-runtime-fixtures.json` contains exactly these observed cases:\n\n' + '\n'.join('- `' + case + '`' for case in expected) + '\n\nNo current fixture case supplies the missing/blank endpoint or blank-type negatives claimed in the initial sanitation. `sdk/go/descriptor.go` checks that the interfaces array is present/nonempty but not that each interface has a usable endpoint. `sdk/java/src/main/java/org/truyn/sdk/AgentDescriptors.java` likewise does not establish the full claimed interface rejection. This is a concrete current-source parity gap, not an assertion that all Descriptor implementation is missing.\n\n## Historical versus current authority\n\nS103 PR #823 was merged historically. A merged PR or an old green run does not prove that its intended source/fixtures survive later main changes. Issue #615 remains reconciliation-required; do not mark later sprints complete or infer current negative parity from the historical merge. The prior initial sanitation claim is explicitly corrected by this record, not silently treated as accepted evidence.\n\n## Closure requirement\n\nA separate implementation/qualification change must add explicit missing-endpoint, blank-endpoint and blank-type negative fixtures, reject them consistently in all five language validators/runners, execute the common cases on one exact source, and requalify after merge. Document any existing released-binary limitation separately; existing immutable registry packages cannot inherit a source repair without a new version. Refresh, valid-profile conformance, malformed-interface parity and full production/delegated-signing lifecycle remain distinct scopes. This documentation repair neither changes runtime nor admits Stable v1, private rollout or Mainnet.\n')
          changed.append(path)
          print(json.dumps({'changedDocs': changed, 'runtimeChanged': False}, indent=2))
          Path('/tmp/truyn-doc-repair-paths.json').write_text(json.dumps(changed))
          PY
      - name: Qualify documentation repair and stage only bounded paths
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/check-documentation-consistency.mjs
          node --test tests/documentation-release-regression.test.js
          node scripts/check-documentation-consistency.mjs
          git diff --check
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/truyn-doc-repair-paths.json'))
          assert all(p.endswith('.md') and not p.startswith('docs/benchmarks/') for p in paths)
          subprocess.run(['git','add','--',*paths], check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual)==set(paths), actual
          PY
      - name: Commit documentation only to the isolated repair branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/docs/sanitation-review-repair-20261012 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git commit -s -m 'docs: correct current Descriptor evidence after sanitation review'
          git push origin HEAD:refs/heads/docs/sanitation-review-repair-20261012
          git rev-parse HEAD

name: Native Clients

on:
  pull_request:
    paths:
      - 'clients/native/**'
      - 'tests/native-client-contract.test.js'
      - '.github/workflows/native-clients.yml'
      - 'docs/architecture/NATIVE_CLIENTS.md'
      - 'docs/getting-started/NATIVE_CLIENTS.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-clients-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: native-client-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/native-client-contract.test.js

  desktop:
    name: ${{ matrix.name }}
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-exe
            os: windows-latest
            bundle: nsis
            glob: clients/native/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-dmg
            os: macos-15
            bundle: dmg
            glob: clients/native/src-tauri/target/release/bundle/dmg/*.dmg
          - name: linux-deb
            os: ubuntu-22.04
            bundle: deb
            glob: clients/native/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install Rust 1.90.0
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustc --version
      - name: Verify frozen Rust dependency graph
        shell: bash
        run: cargo metadata --manifest-path clients/native/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install Tauri CLI
        working-directory: clients/native
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate native icons
        working-directory: clients/native
        run: npm run tauri -- icon icon.svg
      - name: Run native Rust contract tests
        if: matrix.name == 'linux-deb'
        run: cargo test --manifest-path clients/native/src-tauri/Cargo.toml --lib
      - name: Build installer
        working-directory: clients/native
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Verify installer exists
        shell: bash
        run: |
          matched=0
          for file in ${{ matrix.glob }}; do
            if [ -f "$file" ]; then
              matched=1
              printf '%s\n' "$file"
            fi
          done
          test "$matched" -eq 1
      - name: Export regenerated Cargo lockfile
        if: matrix.name == 'linux-deb'
        uses: actions/upload-artifact@v4
        with:
          name: truyn-native-cargo-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: clients/native/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: truyn-native-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30

  android:
    name: android-apk
    needs: contract
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust 1.90.0 and Android targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustc --version
      - name: Verify frozen Rust dependency graph
        shell: bash
        run: cargo metadata --manifest-path clients/native/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Select Android NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -d "$ndk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Install Tauri CLI
        working-directory: clients/native
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize hardened Android project
        working-directory: clients/native
        run: npm run android:init
      - name: Generate Android icons
        working-directory: clients/native
        run: npm run tauri -- icon icon.svg
      - name: Re-assert Android backup exclusion
        working-directory: clients/native
        run: npm run android:harden
      - name: Build installable debug APK
        working-directory: clients/native
        run: npm run tauri -- android build --debug --apk --ci
      - name: Verify APK exists
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(clients/native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#files[@]}" -ge 1
          printf '%s\n' "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: truyn-native-android-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: clients/native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

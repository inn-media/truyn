name: Temporary footer hardcode patch

on:
  push:
    branches: [footer-helper-20260912]
    paths: [.github/workflows/tmp-footer-source.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: footer-innmedia-20260912
          fetch-depth: 0
      - name: Remove footer translation hook
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_tmp_public_site/index.html')
          s=p.read_text(encoding='utf-8')
          old='<span data-t="footer">© 2023 - 2026 Innovation Media Services Inc. All rights reserved. TRUYN is developed and maintained by InnMedia</span>'
          new='<span>© 2023 - 2026 Innovation Media Services Inc. All rights reserved. TRUYN is developed and maintained by InnMedia</span>'
          if s.count(old)!=1:
            raise SystemExit(f'expected exactly one hardcoded footer span, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert 'data-t="footer"' not in s[s.rfind('<footer'):]
          PY
          git diff --check
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add _tmp_public_site/index.html
          git commit -m $'fix(site): hardcode TRUYN footer copyright\n\nSigned-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:footer-innmedia-20260912

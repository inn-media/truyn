# TASK_ID: truyn-d200-repository-sanitation-2609102033-8f2c
# qualification-repair: stale-contract-reconcile-v5
name: D-200 repository sanitation executor

on:
  push:
    branches:
      - automation/d200-repository-sanitation-260910
    paths:
      - .github/workflows/d200-repository-sanitation-executor.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: truyn-d200-repository-sanitation-2609102033-8f2c
  cancel-in-progress: false

jobs:
  sanitize:
    if: contains(github.event.head_commit.message, 'sanitation')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify bounded source and prepare dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" == 'automation/d200-repository-sanitation-260910' ]]
          git merge-base --is-ancestor bae2a3ac4776bc4c89bdb53eb835d6b9d49cab37 HEAD
          test -f scripts/apply-d200-repository-sanitation.sh
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check -e ./sdk/python
      - name: Apply one-pass canonical sanitation and qualify working tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-d200-repository-sanitation.sh')
          s=p.read_text()
          s=s.replace("# Exact sanitation smoke/full qualification on the same working tree; no cloud/D-200 execution.\n", "git add -A\n\n# Exact sanitation smoke/full qualification on the same working tree; no cloud/D-200 execution.\n")
          s=s.replace("go test ./... --count=1\n", "")
          s=s.replace("TRUYN_RELEASE_SOURCE_SHA=\"$(git rev-parse HEAD)\" sdk/release/build-release.sh\nrm -rf sdk/release/dist\n", "")
          s=s.replace("git diff --check\n\n# Final fail-closed scans", "git diff --cached --check\n\n# Final fail-closed scans")
          s=s.replace("run('empty-sas','2')", "run('empty-sas','4')")
          s=s.replace("s['test']='npm run test:full'", "s['test']='node --test tests/*.test.js'")
          needle="      - run: node sdk/conformance/run-five-language-e2e.mjs\n      - run: sdk/release/build-release.sh\n"
          lines=["      - run: node sdk/conformance/run-five-language-e2e.mjs","      - name: Verify SDK release scanner wiring","        run: node --test tests/sdk-release-ci-contract.test.js","      - name: Build and verify SDK release packages","        run: sdk/release/build-release.sh","      - name: Clean-room import packed TypeScript SDK","        shell: bash","        run: |","          set -Eeuo pipefail","          package=\"$GITHUB_WORKSPACE/sdk/release/dist/typescript/truyn-sdk-0.1.0-alpha.2.tgz\"","          test -f \"$package\"","          cleanroom=\"$(mktemp -d)\"","          cd \"$cleanroom\"","          npm init --yes >/dev/null","          npm install --ignore-scripts --no-audit --no-fund \"$package\"","          node --input-type=module -e \"import('@truyn/sdk').then((m) => { if (typeof m.TruynClient !== 'function') throw new Error('TruynClient export missing'); if (typeof m.TruynLocalNodeClient !== 'function') throw new Error('TruynLocalNodeClient export missing'); })\""]
          replacement="\n".join(lines)+"\n"
          if needle not in s: raise SystemExit('SDK release CI insertion point missing')
          s=s.replace(needle,replacement)
          old="rm -f .github/pull_request_template.md .github/workflows/.gitkeep\nrm -rf _tmp_parts\n"
          new="rm -f .github/pull_request_template.md .github/workflows/.gitkeep\nwhile IFS= read -r -d '' keep; do\n  dir=\"$(dirname \"$keep\")\"\n  if find \"$dir\" -mindepth 1 -maxdepth 1 ! -name .gitkeep -print -quit | grep -q .; then\n    rm -f \"$keep\"\n  fi\ndone < <(find . -name .gitkeep -not -path './.git/*' -print0)\nrm -rf _tmp_parts\n"
          if old not in s: raise SystemExit('gitkeep sanitation insertion point missing')
          s=s.replace(old,new)

          marker="# Exact sanitation smoke/full qualification on the same working tree; no cloud/D-200 execution.\n"
          repair=r'''python3 - <<'PYSANFIX'
from pathlib import Path

# Keep ordinary CI trigger formatting compatible with the stable enforcement contract.
ci=Path('.github/workflows/ci.yml')
ci_text=ci.read_text()
if '    branches: [main]\n' in ci_text:
    ci_text=ci_text.replace('    branches: [main]\n','    branches:\n      - main\n',1)
ci.write_text(ci_text)

# The accepted peer-lease repair strengthens the old per-node XOR label to a host-stratified
# XOR plan that still has maxPeers=32 and additionally covers every physical failure domain.
bootstrap=Path('tests/class-d-1000-bootstrap.test.js')
bootstrap_text=bootstrap.read_text()
bootstrap_text=bootstrap_text.replace('D-1000 Azure provisioner uses the per-node XOR bootstrap planner','D-1000 Azure provisioner uses the bounded host-stratified XOR bootstrap planner')
bootstrap_text=bootstrap_text.replace('assert.match(provisioner, /plan=per-node-xor/);','assert.match(provisioner, /plan=host-stratified-xor/);\n  assert.match(provisioner, /TRUYN_BOOTSTRAP_REQUIRED_FAILURE_DOMAINS=\\$\\{HOST_COUNT\\}/);')
bootstrap.write_text(bootstrap_text)

# Positive path assertions must follow the canonical truyn spelling. Historical evidence and
# explicit negative fixtures remain untouched under redact-not-delete / regression policy.
for name in ['tests/class-d-1000-diagnostic-sizing.test.js','tests/class-d-1000-remote-manifest-heredoc.test.js']:
    path=Path(name)
    text=path.read_text().replace('truyqn','truyn')
    path.write_text(text)

# The sanitation patch chain already materializes failure-evidence semantics into the maintained
# provisioner. Make the prepare-only verifier accept exactly one already-canonical trap instead
# of requiring the pre-patch trap and attempting to patch it a second time.
fa=Path('scripts/class-d-1000-final-acceptance.sh')
fa_text=fa.read_text()
old="""if p.count(trap_old) != 1:\n    raise SystemExit(f'expected exactly one D-1000 ERR trap, found={p.count(trap_old)}')\np = p.replace(trap_old, trap_new, 1)\n"""
new="""if p.count(trap_new) == 1:\n    pass\nelif p.count(trap_old) == 1:\n    p = p.replace(trap_old, trap_new, 1)\nelse:\n    raise SystemExit(f'expected exactly one canonical or legacy D-1000 ERR trap, legacy={p.count(trap_old)} canonical={p.count(trap_new)}')\n"""
if old not in fa_text:
    raise SystemExit('D-1000 final-acceptance trap reconciliation point missing')
fa.write_text(fa_text.replace(old,new,1))
PYSANFIX
git add -A
'''
          if marker not in s: raise SystemExit('sanitation qualification marker missing')
          s=s.replace(marker,repair+"\n"+marker,1)

          gates=[
            ('npm run test:fast','fast'),
            ('npm run test:security','security'),
            ('node --test tests/d200-canonical-regressions.test.js tests/d200-anti-weakening.test.js tests/d200-staging-robustness.test.js tests/repository-hygiene.test.js tests/affected-tests.test.js tests/test-suite-taxonomy.test.js tests/documentation-status.test.js tests/evidence-preservation.test.js','focused'),
            ('bash scripts/class-d-200-preflight-qualification.sh','d200-preflight'),
            ('npm run test:full','full-node'),
            ('python -m pip install --disable-pip-version-check -e ./sdk/python','python-install'),
            ('( cd sdk/go && go test ./... )','go-sdk'),
            ('mvn -q -f sdk/java/pom.xml test','java-sdk'),
            ('dotnet build sdk/dotnet/Truyn.Sdk.csproj --configuration Release --nologo','dotnet-sdk'),
            ('node sdk/conformance/run-five-language-e2e.mjs','five-language'),
            ('git diff --check','diff-check'),
            ('node scripts/check-d200-contract.mjs','contract-final'),
            ('node scripts/check-repository-hygiene.mjs','hygiene-final')]
          for cmd,name in gates:
            s=s.replace(cmd, f"printf 'SANITATION_GATE_START={name}\\n'\n{cmd}\nprintf 'SANITATION_GATE_PASS={name}\\n'", 1)
          p.write_text(s)
          PY
          bash scripts/apply-d200-repository-sanitation.sh 2>&1 | tee /tmp/truyn-sanitation.log
      - name: Upload qualification failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sanitation-failure-${{ github.run_id }}
          path: /tmp/truyn-sanitation.log
          if-no-files-found: error
          retention-days: 7
      - name: Publish bounded failure summary
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          awk '
            /^SANITATION_GATE_(START|PASS)=/ {print; next}
            /^not ok / {capture=18; failures++; print; next}
            capture > 0 {print; capture--; next}
            /^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) / {print}
            END {printf "SANITIZED_FAILURE_COUNT=%d\n", failures}
          ' /tmp/truyn-sanitation.log \
            | sed -E '/(token|secret|password|authorization|sas|sig=|https?:\/\/|subscriptions\/|resourceGroups\/)/Id' \
            | tail -n 260 > /tmp/sanitation-failure-context.txt
          {
            printf '%s\n' '[CHATGPT_SANITATION_FAILURE]'
            printf 'TASK_ID=%s\n' 'truyn-d200-repository-sanitation-2609102033-8f2c'
            printf 'SHA=%s\n' "$GITHUB_SHA"
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf '%s\n' 'SANITIZED_FAILURE_CONTEXT:'
            cat /tmp/sanitation-failure-context.txt
          } > /tmp/sanitation-summary.txt
          gh issue comment 601 --repo inn-media/truyn --body-file /tmp/sanitation-summary.txt
      - name: Commit one exact sanitation candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git clean -fdX
          if git status --porcelain | grep '^??'; then
            echo 'unexpected untracked build residue after sanitation qualification' >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/d200-repository-sanitation-executor.yml
          test ! -e scripts/apply-d200-repository-sanitation.sh
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git commit -m 'refactor(d200): sanitize repository execution surface' -m 'TASK_ID=truyn-d200-repository-sanitation-2609102033-8f2c' -m 'Materialize accepted D-200 behavior into canonical maintained source, preserve permanent regressions/evidence, remove obsolete patchers and launchers, and introduce parallel fail-closed verification without launching D-200.' -m 'Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:automation/d200-repository-sanitation-260910
          printf 'TRUYN_SANITATION_CANDIDATE_SHA=%s\n' "$(git rev-parse HEAD)"

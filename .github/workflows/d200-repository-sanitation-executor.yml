# TASK_ID: truyn-d200-repository-sanitation-2609102033-8f2c
# qualification-marker-scope: final-tail-v6
name: D-200 repository sanitation executor

on:
  push:
    branches:
      - automation/d200-repository-sanitation-260910
    paths:
      - .github/workflows/d200-repository-sanitation-executor.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: truyn-d200-repository-sanitation-2609102033-8f2c
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor bae2a3ac4776bc4c89bdb53eb835d6b9d49cab37 HEAD
          test -f scripts/apply-d200-repository-sanitation.sh
          test -f scripts/sanitation-executor-prep-v7.py
          test -f scripts/sanitation-repair-v7.py
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check -e ./sdk/python
      - name: Apply and fully qualify sanitation candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/sanitation-executor-prep-v7.py
          bash scripts/apply-d200-repository-sanitation.sh 2>&1 | tee /tmp/truyn-sanitation.log
      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sanitation-failure-${{ github.run_id }}
          path: /tmp/truyn-sanitation.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publish safe gate-only failure marker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          {
            printf '%s\n' '[CHATGPT_SANITATION_GATE_FAILURE]'
            printf 'TASK_ID=%s\n' 'truyn-d200-repository-sanitation-2609102033-8f2c'
            printf 'SHA=%s\n' "$GITHUB_SHA"
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            if [[ -f /tmp/truyn-sanitation.log ]]; then
              grep -E '^SANITATION_GATE_(START|PASS)=' /tmp/truyn-sanitation.log | tail -n 80 || true
              grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' /tmp/truyn-sanitation.log | tail -n 12 || true
              printf '%s\n' 'SANITATION_FAILING_SUBTESTS_BEGIN'
              grep -E '^not ok [0-9]+ - ' /tmp/truyn-sanitation.log | tail -n 20 || true
              printf '%s\n' 'SANITATION_FAILING_SUBTESTS_END'
            else
              printf 'SANITATION_LOG=missing\n'
            fi
          } > /tmp/sanitation-gates.txt
          gh issue comment 601 --repo inn-media/truyn --body-file /tmp/sanitation-gates.txt
      - name: Commit exact sanitation candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git clean -fdX
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/d200-repository-sanitation-executor.yml
          test ! -e scripts/apply-d200-repository-sanitation.sh
          test ! -e scripts/sanitation-executor-prep-v7.py
          test ! -e scripts/sanitation-repair-v7.py
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git commit -m 'refactor(d200): sanitize repository execution surface' -m 'TASK_ID=truyn-d200-repository-sanitation-2609102033-8f2c' -m 'Materialize accepted D-200 behavior into canonical maintained source, preserve permanent regressions/evidence, remove obsolete patchers and launchers, and introduce parallel fail-closed verification without launching D-200.' -m 'Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:automation/d200-repository-sanitation-260910
          printf 'TRUYN_SANITATION_CANDIDATE_SHA=%s\n' "$(git rev-parse HEAD)"

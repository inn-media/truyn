name: Diagnose exact 0972a3f canonical failure

on:
  push:
    branches: [ci/diagnose-0972a3f-20260824]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0972a3f0373c4ce9df80cd0efe53b9293488077d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce canonical gate and capture exact failure
        id: reproduce
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/truyn-diag
          {
            echo 'TARGET_SHA=0972a3f0373c4ce9df80cd0efe53b9293488077d'
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
          } | tee /tmp/truyn-diag/environment.txt

          npm install --ignore-scripts --no-audit --no-fund > /tmp/truyn-diag/npm-install.log 2>&1
          install_rc=$?
          echo "npm_install_exit=$install_rc" | tee -a /tmp/truyn-diag/exits.txt

          if [ "$install_rc" -eq 0 ]; then
            TRUYN_LOCAL_DEVELOPMENT=1 npm test > /tmp/truyn-diag/npm-test.log 2>&1
            test_rc=$?
          else
            test_rc=125
            echo 'SKIPPED because npm install failed' > /tmp/truyn-diag/npm-test.log
          fi
          echo "npm_test_exit=$test_rc" | tee -a /tmp/truyn-diag/exits.txt

          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            git diff --check > /tmp/truyn-diag/git-diff-check.log 2>&1
            diff_rc=$?
          else
            diff_rc=125
            echo 'SKIPPED because an earlier canonical command failed' > /tmp/truyn-diag/git-diff-check.log
          fi
          echo "git_diff_check_exit=$diff_rc" | tee -a /tmp/truyn-diag/exits.txt

          if [ "$install_rc" -ne 0 ]; then
            canonical_rc=$install_rc
            failing_command='npm install --ignore-scripts --no-audit --no-fund'
          elif [ "$test_rc" -ne 0 ]; then
            canonical_rc=$test_rc
            failing_command='TRUYN_LOCAL_DEVELOPMENT=1 npm test'
          else
            canonical_rc=$diff_rc
            failing_command='git diff --check'
          fi
          printf 'canonical_exit=%s\nfailing_command=%s\n' "$canonical_rc" "$failing_command" | tee /tmp/truyn-diag/result.txt
          echo "canonical_rc=$canonical_rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-0972a3f-${{ github.run_id }}
          path: /tmp/truyn-diag/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve canonical conclusion
        if: always()
        shell: bash
        run: exit "${{ steps.reproduce.outputs.canonical_rc }}"

name: D1000 full TAP diagnostic 6de173d2

# Diagnostic only: always tests the detached exact failing source SHA below.
on:
  push:
    branches:
      - d1000/tap-diagnostic-6de173d2
  pull_request:
    branches:
      - d1000/fix-run-command-boundary-e768

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact failing source
        uses: actions/checkout@v4
        with:
          ref: 6de173d20b0606bfc0f687d43bd928c1c99185ef
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture full npm test TAP
        id: tap
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee /tmp/npm-test.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/npm-test.rc
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Extract exact failing TAP blocks
        if: always()
        shell: bash
        run: |
          awk '
            /^[[:space:]]*not ok[[:space:]]/ { capture=1; remaining=100 }
            capture { print; remaining-- }
            capture && remaining <= 0 { capture=0 }
          ' /tmp/npm-test.log > /tmp/npm-test-failures.txt
          if [[ ! -s /tmp/npm-test-failures.txt ]]; then
            grep -nE 'not ok|AssertionError|ERR_ASSERTION|failureType:|error:|stack:' /tmp/npm-test.log > /tmp/npm-test-failures.txt || true
          fi
          echo '=== EXACT FAILING TAP EXCERPT ==='
          cat /tmp/npm-test-failures.txt
          echo '=== END EXACT FAILING TAP EXCERPT ==='
          echo "npm_test_rc=$(cat /tmp/npm-test.rc)"
      - name: Upload full TAP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1000-full-tap-6de173d2
          path: |
            /tmp/npm-test.log
            /tmp/npm-test-failures.txt
            /tmp/npm-test.rc
          if-no-files-found: error
      - name: Preserve failing status
        if: always()
        shell: bash
        run: exit "$(cat /tmp/npm-test.rc)"

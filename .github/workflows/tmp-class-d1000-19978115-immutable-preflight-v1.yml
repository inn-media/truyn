name: tmp-class-d1000-19978115-immutable-preflight-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-19978115-immutable-preflight-v1.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: class-d1000-19978115-immutable-preflight-v1
  cancel-in-progress: false

env:
  TESTED_COMMIT: 199781152f80f3d411cbafa6569423aedd9544ab
  PINNED_REF: d1000/pinned-19978115
  EXACT_CI_RUN: '32845577112'
  EXACT_CODEQL_RUN: '32845576272'
  ARTIFACT_NAME: class-d-1000-prepare-19978115-v1

jobs:
  immutable-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Record immutable preflight start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} stage=started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 19978115 IMMUTABLE PREFLIGHT V1 STARTED' -f "body=${body}" >/dev/null

      - name: Enforce one-shot launcher commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d1000-19978115-immutable-preflight-v1.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'added'

      - name: Checkout exact pinned source
        uses: actions/checkout@v4
        with:
          ref: d1000/pinned-19978115
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact green source and full regression
        env:
          GH_TOKEN: ${{ github.token }}
          TRUYN_LOCAL_DEVELOPMENT: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git ls-remote origin "refs/heads/${PINNED_REF}" | cut -f1)" = "$TESTED_COMMIT"
          for run in "$EXACT_CI_RUN" "$EXACT_CODEQL_RUN"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.head_sha')" = "$TESTED_COMMIT"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status')" = completed
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion')" = success
          done
          npm install --no-audit --no-fund
          npm test
          git diff --check

      - name: Immutable prepare-only acceptance preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh | tee class-d-1000-prerun.txt
          grep -Fqx 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned' class-d-1000-prerun.txt

      - name: Build and smoke-test immutable runtime bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p preflight runtime-smoke
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" bash scripts/build-class-d-1000-runtime-bundle.sh preflight/truyn-d1000-runtime.tgz | tee preflight/runtime-build.txt
          bundle_sha="$(awk '{print $1}' preflight/truyn-d1000-runtime.tgz.sha256)"
          test -n "$bundle_sha"
          printf '%s  %s\n' "$bundle_sha" preflight/truyn-d1000-runtime.tgz | sha256sum -c -
          tar -xzf preflight/truyn-d1000-runtime.tgz -C runtime-smoke
          test "$(jq -r '.sourceSha' runtime-smoke/manifest.json)" = "$TESTED_COMMIT"
          test "$(jq -r '.schema' runtime-smoke/manifest.json)" = 'truyn.class-d1000.runtime-bundle.v1'
          test "$(runtime-smoke/runtime/bin/node -p 'process.versions.node.split(".")[0]')" = 22
          runtime-smoke/runtime/bin/node -e "import(process.cwd() + '/runtime-smoke/app/network/testnet/node-service.js').then(()=>console.log('TRUYN_CLASS_D1000_RUNTIME_IMPORT=PASS'))"
          printf '%s\n' "$bundle_sha" > preflight/runtime-bundle-sha256.txt
          python3 - "$TESTED_COMMIT" "$PINNED_REF" "$bundle_sha" > preflight/class-d-1000-prepare-manifest.json <<'PY'
          import json, sys
          source, pinned, bundle_sha = sys.argv[1:]
          print(json.dumps({
            'result':'PASS','sourceSha':source,'pinnedRef':pinned,'prepareOnly':True,'azureMutation':False,
            'preparedHarnessMarker':'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned',
            'runtimeBundle':{'file':'truyn-d1000-runtime.tgz','sha256':bundle_sha,'schema':'truyn.class-d1000.runtime-bundle.v1','osCompatibility':'ubuntu-22.04-amd64'},
            'exactChecks':{'ciRun':int(sys.argv[0] != '')}
          },sort_keys=True,separators=(',',':')))
          PY
          cp class-d-1000-prerun.txt preflight/
          printf 'exact_ci_run=%s\nexact_codeql_run=%s\n' "$EXACT_CI_RUN" "$EXACT_CODEQL_RUN" > preflight/exact-green-runs.txt

      - name: Upload immutable preflight artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: preflight/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable preflight PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_ID"
          bundle_sha="$(cat preflight/runtime-bundle-sha256.txt)"
          test "$(sha256sum preflight/truyn-d1000-runtime.tgz | awk '{print $1}')" = "$bundle_sha"
          test "$(jq -r '.result' preflight/class-d-1000-prepare-manifest.json)" = PASS
          test "$(jq -r '.sourceSha' preflight/class-d-1000-prepare-manifest.json)" = "$TESTED_COMMIT"
          test "$(jq -r '.runtimeBundle.sha256' preflight/class-d-1000-prepare-manifest.json)" = "$bundle_sha"
          body="result=PASS run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} artifact_id=${ARTIFACT_ID} artifact_name=${ARTIFACT_NAME} artifact_digest=${ARTIFACT_DIGEST:-unavailable} runtime_bundle_sha256=${bundle_sha} prepareOnly=true azureMutation=false"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 19978115 IMMUTABLE PREFLIGHT V1 PASS' -f "body=${body}" >/dev/null

      - name: Publish immutable preflight failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          body="result=FAIL run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 19978115 IMMUTABLE PREFLIGHT V1 FAIL' -f "body=${body}" >/dev/null

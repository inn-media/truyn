name: D-500 Task-Local Inline Repair Controller
on:
  push:
    branches: ['automation/d500-acceptance-repair-8f3c2a']
    paths:
      - '.github/workflows/d500-inline-repair-controller.yml'
      - '.github/d500/apply-attempt12-resilience.py'
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      BASE_SHA: 9d998ab5f89a7f023f22cbff4f92f3b715b1c4a3
      CANDIDATE_REF: automation/d500-frozen-8f3c2a-20260928-a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: '${{ github.token }}'
          persist-credentials: false
      - name: Build minimal inline repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          cp .github/d500/apply-attempt12-resilience.py /tmp/apply-resilience.py
          git reset --hard "$BASE_SHA"
          python3 /tmp/apply-resilience.py
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          git diff --check
          for token in '/bootstrap' '/dht/refresh' '/dht/readiness' 'maxPeers' 'd500_seconds_remaining'; do grep -q "$token" benchmarks/scale/class-d-azure-1000-provision.sh; done
      - name: Run high-signal affected regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --test tests/d500-campaign-time-budget.test.js tests/d500-vm-agent-run-command-recovery.test.js
          node --test tests/class-d-1000-bootstrap.test.js tests/class-d-1000-remote-manifest-heredoc.test.js tests/class-d-bootstrap-qualification.test.js
          for block in B01_SOURCE_INTEGRITY B11_CLASS_D_ACCEPTANCE B12_WORKFLOW_CONTRACT; do
            rm -rf blockwise-out
            BLOCK_ID="$block" BLOCK_OUT_DIR=blockwise-out node scripts/class-d-blockwise-preflight.mjs
            jq -e '.status=="GREEN" and .harnessReturnCode==0' "blockwise-out/$block/block.json" >/dev/null
          done
      - name: Freeze verified patch payload
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --binary > /tmp/d500-verified-repair.patch
          test -s /tmp/d500-verified-repair.patch
          sha256sum /tmp/d500-verified-repair.patch > /tmp/d500-verified-repair.patch.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: d500-verified-repair-patch
          path: |
            /tmp/d500-verified-repair.patch
            /tmp/d500-verified-repair.patch.sha256
          if-no-files-found: error
          retention-days: 7
# task-local trigger generation: 20260929-d

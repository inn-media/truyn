name: D-500 Task-Local Inline Repair Controller
on:
  push:
    branches: ['automation/d500-acceptance-repair-8f3c2a']
    paths: ['.github/workflows/d500-inline-repair-controller.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: d500-inline-repair-8f3c2a
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      BASE_SHA: 9d998ab5f89a7f023f22cbff4f92f3b715b1c4a3
      TASK_BRANCH: automation/d500-acceptance-repair-8f3c2a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}
      - name: Build minimal inline repair from immutable candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          controller_head=$(git rev-parse HEAD)
          git show 2c1d09e2c9bb23b3ed23f6c5fa013c077bb346aa:.github/d500/apply-attempt12-resilience.py >/tmp/apply.py
          git reset --hard "$BASE_SHA"
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('benchmarks/scale/class-d-azure-1000-provision.sh')
          s=p.read_text()
          base=subprocess.check_output(['git','show','9d998ab5f89a7f023f22cbff4f92f3b715b1c4a3:benchmarks/scale/class-d-azure-1000-provision.sh'],text=True)
          def stage(x):
              a=x.index('STAGE=bootstrap\n'); b=x.index('\nif [[ "${TRUYN_CLASS_D_BOOTSTRAP_QUALIFICATION_ONLY:-0}" == 1 ]]',a); return a,b,x[a:b]
          a,b,_=stage(s); _,_,bs=stage(base)
          # Preserve canonical inline /bootstrap -> /dht/refresh -> /dht/readiness and add bounded node recovery only.
          bs=bs.replace('  curl -fsS --max-time 90 -H \'content-type: application/json\' --data-binary "\\$payload" "\\${control_url}/bootstrap" >/dev/null', '''  bootstrap_rc=1
  for node_attempt in 1 2 3; do
    if curl -fsS --max-time 90 -H 'content-type: application/json' --data-binary "\\$payload" "\\${control_url}/bootstrap" >/dev/null; then bootstrap_rc=0; break; fi
    echo "TRUYN_D500_BOOTSTRAP_NODE_RECOVERY host=${i} node=\\$j phase=bootstrap attempt=\\$node_attempt" >&2
    systemctl restart "truyn-d1000@\\$j.service" || true
    sleep \\$((node_attempt * 2))
  done
  [[ "\\$bootstrap_rc" -eq 0 ]]''')
          bs=bs.replace('  readiness=\\$(curl -fsS --max-time 20 "\\${control_url}/dht/readiness")', '''  readiness=''
  readiness_rc=1
  for node_attempt in 1 2 3; do
    if readiness=\\$(curl -fsS --max-time 20 "\\${control_url}/dht/readiness"); then readiness_rc=0; break; fi
    echo "TRUYN_D500_BOOTSTRAP_NODE_RECOVERY host=${i} node=\\$j phase=readiness attempt=\\$node_attempt" >&2
    systemctl restart "truyn-d1000@\\$j.service" || true
    sleep \\$((node_attempt * 2))
  done
  [[ "\\$readiness_rc" -eq 0 ]]''')
          s=s[:a]+bs+s[b:]
          p.write_text(s)
          Path('scripts/class-d-bootstrap-host-resilience.sh').unlink(missing_ok=True)
          Path('tests/d500-bootstrap-resilience.test.js').unlink(missing_ok=True)
          PY
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          git diff --check
      - name: Install and run regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --test tests/d500-campaign-time-budget.test.js
          node --test tests/class-d-1000-bootstrap.test.js tests/class-d-1000-remote-manifest-heredoc.test.js tests/class-d-bootstrap-qualification.test.js
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.js' | grep -E '/([^/]*(d200|d500|d1000)[^/]*|class-d[^/]*)\.test\.js$' | sort)
          node --test "${files[@]}"
          for block in B01_SOURCE_INTEGRITY B11_CLASS_D_ACCEPTANCE B12_WORKFLOW_CONTRACT; do
            rm -rf blockwise-out
            BLOCK_ID="$block" BLOCK_OUT_DIR=blockwise-out node scripts/class-d-blockwise-preflight.mjs
            jq -e '.status=="GREEN" and .harnessReturnCode==0' "blockwise-out/$block/block.json" >/dev/null
          done
      - name: Freeze repaired candidate and launch sanitation exactly once
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/d500-inline-repair-controller.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          [[ "${changed[*]}" == "benchmarks/scale/class-d-azure-1000-provision.sh tests/d500-campaign-time-budget.test.js" ]]
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git commit -s -m 'fix(d500): inline node recovery and drain run-command conflicts'
          candidate=$(git rev-parse HEAD)
          git push --force-with-lease="refs/heads/${TASK_BRANCH}:${{ github.sha }}" origin "HEAD:refs/heads/${TASK_BRANCH}"
          branch="automation/d-series-dispatch/${candidate:0:8}-d500-swarm"
          git checkout -b "$branch"
          mkdir -p .github/d-series-dispatch
          printf 'SOURCE_SHA=%s\nSCALE=d500\nMODE=swarm\n' "$candidate" >.github/d-series-dispatch/request.env
          git add .github/d-series-dispatch/request.env
          git commit -s -m "launch(d500): sanitation swarm for ${candidate:0:8}"
          git push origin "HEAD:refs/heads/$branch"
          echo "TRUYN_D500_FROZEN_CANDIDATE=$candidate"

name: SDK Registry Closure

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  registry-closure:
    name: Publish repaired npm alpha and verify public registry
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: sdk-release
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_TAG: sdk/npm/v0.1.0-alpha.2-release.5
      RELEASE_MARKER: sdk/release/registry-closure.json
      NPM_PACKAGE: '@truyn/sdk'
      NPM_VERSION: '0.1.0-alpha.2'
      NPM_DIST_TAG: alpha
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact green main source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require current exact main and bounded release marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ github.event.workflow_run.path }}" = ".github/workflows/ci.yml"
          test "${{ github.event.workflow_run.id }}" = "$SOURCE_CI_RUN_ID"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          jq -e \
            --arg releaseTag "$RELEASE_TAG" \
            --arg npmPackage "$NPM_PACKAGE" \
            --arg npmVersion "$NPM_VERSION" \
            '.npmReleaseTag == $releaseTag and
             .npmPackage == $npmPackage and
             .npmVersion == $npmVersion and
             .repairRevision == 10' "$RELEASE_MARKER" >/dev/null
          test "$(node -p "require('./sdk/typescript/package.json').version")" = "$NPM_VERSION"

      - name: Require exact-source CI and hosted CodeQL success
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$ci")" = "$SOURCE_SHA"
          test "$(jq -r '.path' <<<"$ci")" = ".github/workflows/ci.yml"
          test "$(jq -r '.event' <<<"$ci")" = "push"
          test "$(jq -r '.head_branch' <<<"$ci")" = "main"
          test "$(jq -r '.status' <<<"$ci")" = "completed"
          test "$(jq -r '.conclusion' <<<"$ci")" = "success"

          codeql_run_id=""
          status=""
          conclusion=""
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
            latest="$(jq -c '[.workflow_runs[] | select(.path == "dynamic/github-code-scanning/codeql")][0] // {}' <<<"$runs")"
            codeql_run_id="$(jq -r '.id // empty' <<<"$latest")"
            status="$(jq -r '.status // empty' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$latest")"
            if [[ -n "$codeql_run_id" && "$status" == "completed" ]]; then break; fi
            sleep 5
          done
          test -n "$codeql_run_id"
          test "$status" = "completed"
          test "$conclusion" = "success"
          echo "ci_run_id=$SOURCE_CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "codeql_run_id=$codeql_run_id" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '.[0].object.sha // empty')"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$SOURCE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"

      - name: Set up Node.js without registry token injection
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm Trusted Publishing client
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Require GitHub OIDC request capability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Download and verify exact green CI package artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdk/release/registry-closure
          mkdir -p sdk/release/registry-closure/ci-bundle sdk/release/registry-closure/npm-local sdk/release/registry-closure/npm-registry
          gh run download "${{ steps.gates.outputs.ci_run_id }}" \
            --name "truyn-sdk-release-${{ steps.gates.outputs.ci_run_id }}" \
            --dir sdk/release/registry-closure/ci-bundle
          node sdk/release/verify-release.mjs sdk/release/registry-closure/ci-bundle
          jq -e --arg source "$SOURCE_SHA" --arg npm "$NPM_VERSION" \
            '.sourceSha == $source and .typescript == $npm' \
            sdk/release/registry-closure/ci-bundle/manifest.json >/dev/null
          cp "sdk/release/registry-closure/ci-bundle/typescript/truyn-sdk-${NPM_VERSION}.tgz" \
            "sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz"
          local_file="sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz"
          local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
          echo "NPM_LOCAL_SHA=$local_sha" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$local_sha" "$local_file" > sdk/release/registry-closure/npm-SHA256SUMS

      - name: Detect immutable npm alpha.2 state
        id: npm_registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(npm view "${NPM_PACKAGE}@${NPM_VERSION}" version 2>/dev/null || true)" == "$NPM_VERSION" ]]; then
            registry_file="$(npm pack "${NPM_PACKAGE}@${NPM_VERSION}" --pack-destination sdk/release/registry-closure/npm-registry | tail -n 1)"
            cmp "sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz" "sdk/release/registry-closure/npm-registry/$registry_file"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable npm alpha.2 through Trusted Publishing
        if: steps.npm_registry.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          oidc_npmrc="$RUNNER_TEMP/npm-oidc-empty.npmrc"
          : > "$oidc_npmrc"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u NPM_CONFIG_TOKEN \
            NPM_CONFIG_USERCONFIG="$oidc_npmrc" \
            npm publish "sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz" \
              --registry https://registry.npmjs.org/ --access public --tag "$NPM_DIST_TAG" --provenance

      - name: Verify public npm bytes tags provenance and clean-room import
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          visible=false
          for attempt in $(seq 1 120); do
            if [[ "$(npm view "${NPM_PACKAGE}@${NPM_VERSION}" version 2>/dev/null || true)" == "$NPM_VERSION" ]]; then
              visible=true
              break
            fi
            sleep 5
          done
          test "$visible" = true

          rm -rf sdk/release/registry-closure/npm-registry
          mkdir -p sdk/release/registry-closure/npm-registry
          registry_file="$(npm pack "${NPM_PACKAGE}@${NPM_VERSION}" --pack-destination sdk/release/registry-closure/npm-registry | tail -n 1)"
          local_file="sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz"
          remote_file="sdk/release/registry-closure/npm-registry/$registry_file"
          cmp "$local_file" "$remote_file"
          remote_sha="$(sha256sum "$remote_file" | awk '{print $1}')"
          test "$remote_sha" = "$NPM_LOCAL_SHA"

          tags="$(npm view "$NPM_PACKAGE" dist-tags --json)"
          alpha="$(jq -r '.alpha // empty' <<<"$tags")"
          latest="$(jq -r '.latest // empty' <<<"$tags")"
          superseded="$(jq -r '.npmSupersedes' "$RELEASE_MARKER")"
          test "$alpha" = "$NPM_VERSION"
          if [[ "$latest" != "$NPM_VERSION" ]]; then
            if [[ -n "$latest" && "$latest" != "$superseded" ]]; then
              echo "Refusing to move latest from $latest back to $NPM_VERSION" >&2
              exit 1
            fi
            test -n "${NODE_AUTH_TOKEN:-}"
            test "$(npm whoami)" = "truyn"
            npm dist-tag add "${NPM_PACKAGE}@${NPM_VERSION}" latest
          fi
          tags="$(npm view "$NPM_PACKAGE" dist-tags --json)"
          test "$(jq -r '.alpha' <<<"$tags")" = "$NPM_VERSION"
          test "$(jq -r '.latest' <<<"$tags")" = "$NPM_VERSION"

          dist_json="$(npm view "${NPM_PACKAGE}@${NPM_VERSION}" dist --json)"
          integrity="$(jq -r '.integrity // empty' <<<"$dist_json")"
          shasum="$(jq -r '.shasum // empty' <<<"$dist_json")"
          attestation_url="$(jq -r '.attestations.url // empty' <<<"$dist_json")"
          test -n "$integrity"
          test -n "$shasum"
          test -n "$attestation_url"

          mkdir -p sdk/release/registry-closure/npm-cleanroom
          pushd sdk/release/registry-closure/npm-cleanroom >/dev/null
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${NPM_VERSION}"
          node --input-type=module -e "import('${NPM_PACKAGE}').then((m) => { if (typeof m.TruynClient !== 'function') throw new Error('TruynClient export missing'); if (typeof m.TruynLocalNodeClient !== 'function') throw new Error('TruynLocalNodeClient export missing'); })"
          npm audit signatures --json --include-attestations > ../npm-audit-signatures.json
          popd >/dev/null

          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          payload = json.loads(Path('sdk/release/registry-closure/npm-audit-signatures.json').read_text())
          statements = []
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == 'payload' and isinstance(child, str):
                          try:
                              statement = json.loads(base64.b64decode(child + '===').decode())
                              if isinstance(statement, dict): statements.append(statement)
                          except Exception:
                              pass
                      walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(payload)
          source = os.environ['SOURCE_SHA']
          matched = None
          for statement in statements:
              if statement.get('predicateType') != 'https://slsa.dev/provenance/v1': continue
              definition = ((statement.get('predicate') or {}).get('buildDefinition') or {})
              workflow = ((definition.get('externalParameters') or {}).get('workflow') or {})
              deps = definition.get('resolvedDependencies') or []
              commit_match = any((entry.get('digest') or {}).get('gitCommit') == source for entry in deps if isinstance(entry, dict))
              if workflow.get('repository') == 'https://github.com/inn-media/truyn' and workflow.get('path') == '.github/workflows/publish-sdk-alpha.yml' and workflow.get('ref') == 'refs/heads/main' and commit_match:
                  matched = statement
                  break
          if matched is None:
              raise SystemExit('npm provenance is not bound to expected TRUYN repository/workflow/main/source SHA')
          Path('sdk/release/registry-closure/npm-provenance-statement.json').write_text(json.dumps(matched, indent=2) + '\n')
          PY

          jq -n \
            --arg package "$NPM_PACKAGE" \
            --arg version "$NPM_VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg workflowRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg ciRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.gates.outputs.ci_run_id }}" \
            --arg codeqlRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.gates.outputs.codeql_run_id }}" \
            --arg sha256 "$remote_sha" \
            --arg integrity "$integrity" \
            --arg shasum "$shasum" \
            --arg attestationUrl "$attestation_url" \
            '{package:$package,version:$version,sourceSha:$sourceSha,releaseTag:$releaseTag,workflowRun:$workflowRun,ciRun:$ciRun,codeqlRun:$codeqlRun,sha256:$sha256,integrity:$integrity,shasum:$shasum,attestationUrl:$attestationUrl,trustedPublishingOidc:"PASS",byteIdentity:"PASS",alphaTagIdentity:"PASS",latestTagIdentity:"PASS",cleanRoomInstall:"PASS",signatureAudit:"PASS",provenanceSourceIdentity:"PASS",immutableReleaseTagIdentity:"PASS"}' \
            > sdk/release/registry-closure/npm-release-evidence.json

      - name: Upload immutable npm registry closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sdk-registry-closure-${{ env.SOURCE_SHA }}
          path: |
            sdk/release/registry-closure/npm-local/truyn-sdk-${{ env.NPM_VERSION }}.tgz
            sdk/release/registry-closure/npm-SHA256SUMS
            sdk/release/registry-closure/npm-release-evidence.json
            sdk/release/registry-closure/npm-audit-signatures.json
            sdk/release/registry-closure/npm-provenance-statement.json
          if-no-files-found: error
          retention-days: 90

name: SDK Registry Closure

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  registry-closure:
    name: Publish repaired npm alpha and verify npm/PyPI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: sdk-release
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_TAG: sdk/npm/v0.1.0-alpha.2-release.2
      RELEASE_MARKER: sdk/release/registry-closure.json
      NPM_PACKAGE: '@truyn/sdk'
      NPM_VERSION: '0.1.0-alpha.2'
      NPM_DIST_TAG: alpha
      PYPI_PACKAGE: truyn-sdk
      PYPI_VERSION: 0.1.0a1
      PYPI_WHEEL_FILENAME: truyn_sdk-0.1.0a1-py3-none-any.whl
      PYPI_WHEEL_SHA256: dec464064dec577aa56d33780c6222ac674accf07fe09ae59af18a191afcd958
      PYPI_SDIST_FILENAME: truyn_sdk-0.1.0a1.tar.gz
      PYPI_SDIST_SHA256: a2e1e2baa6248cab18bdee08b10e832a39453836a64ad0b55c000f48c890ddaf
      PYPI_PUBLICATION_SOURCE_SHA: fda6b75fda5331dd9cdc7e642f7a0a5556749a64
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact green main source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bounded workflow-run release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ github.event.workflow_run.path }}" = ".github/workflows/ci.yml"
          test "${{ github.event.workflow_run.head_sha }}" = "$SOURCE_SHA"
          test "${{ github.event.workflow_run.id }}" = "$SOURCE_CI_RUN_ID"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          jq -e \
            --arg npmPackage "$NPM_PACKAGE" \
            --arg npmVersion "$NPM_VERSION" \
            --arg npmDistTag "$NPM_DIST_TAG" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg pypiPackage "$PYPI_PACKAGE" \
            --arg pypiVersion "$PYPI_VERSION" \
            --arg wheelFilename "$PYPI_WHEEL_FILENAME" \
            --arg wheelSha "$PYPI_WHEEL_SHA256" \
            --arg sdistFilename "$PYPI_SDIST_FILENAME" \
            --arg sdistSha "$PYPI_SDIST_SHA256" \
            --arg pypiPublicationSha "$PYPI_PUBLICATION_SOURCE_SHA" \
            '. == {
              npmPackage:$npmPackage,
              npmVersion:$npmVersion,
              npmDistTag:$npmDistTag,
              npmReleaseTag:$releaseTag,
              npmSupersedes:"0.1.0-alpha.1",
              npmRepairReason:"0.1.0-alpha.1 is immutable and fails clean-room Node 22 ESM import because ws was bundled as CommonJS dynamic require",
              pypiPackage:$pypiPackage,
              pypiVersion:$pypiVersion,
              pypiWheelFilename:$wheelFilename,
              pypiWheelSha256:$wheelSha,
              pypiSdistFilename:$sdistFilename,
              pypiSdistSha256:$sdistSha,
              pypiPublicationSourceSha:$pypiPublicationSha,
              repairRevision:7
            }' "$RELEASE_MARKER" >/dev/null
          test "$(node -p "require('./sdk/typescript/package.json').version")" = "$NPM_VERSION"

      - name: Require exact-source main CI and hosted CodeQL success
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$ci")" = "$SOURCE_SHA"
          test "$(jq -r '.path' <<<"$ci")" = ".github/workflows/ci.yml"
          test "$(jq -r '.event' <<<"$ci")" = "push"
          test "$(jq -r '.head_branch' <<<"$ci")" = "main"
          test "$(jq -r '.status' <<<"$ci")" = "completed"
          test "$(jq -r '.conclusion' <<<"$ci")" = "success"

          codeql_run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
            latest="$(jq -c '[.workflow_runs[] | select(.path == "dynamic/github-code-scanning/codeql")][0] // {}' <<<"$runs")"
            codeql_run_id="$(jq -r '.id // empty' <<<"$latest")"
            status="$(jq -r '.status // empty' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$latest")"
            if [[ -n "$codeql_run_id" && "$status" == "completed" ]]; then
              test "$conclusion" = "success"
              break
            fi
            sleep 5
          done
          test -n "$codeql_run_id"
          test "$status" = "completed"
          test "$conclusion" = "success"
          echo "ci_run_id=$SOURCE_CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "codeql_run_id=$codeql_run_id" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable release tag after green gates
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '.[0].object.sha // empty')"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$SOURCE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA" >/dev/null
          fi
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tagged" = "$SOURCE_SHA"

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Pin npm release client
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Download and verify the exact green CI package artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdk/release/registry-closure
          mkdir -p sdk/release/registry-closure/ci-bundle sdk/release/registry-closure/npm-local sdk/release/registry-closure/npm-registry
          gh run download "${{ steps.gates.outputs.ci_run_id }}" \
            --name "truyn-sdk-release-${{ steps.gates.outputs.ci_run_id }}" \
            --dir sdk/release/registry-closure/ci-bundle
          node sdk/release/verify-release.mjs sdk/release/registry-closure/ci-bundle
          jq -e --arg source "$SOURCE_SHA" --arg npm "$NPM_VERSION" \
            '.sourceSha == $source and .typescript == $npm' \
            sdk/release/registry-closure/ci-bundle/manifest.json >/dev/null
          cp "sdk/release/registry-closure/ci-bundle/typescript/truyn-sdk-${NPM_VERSION}.tgz" \
            "sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz"
          local_file="sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz"
          local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
          echo "NPM_LOCAL_SHA=$local_sha" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$local_sha" "$local_file" > sdk/release/registry-closure/npm-SHA256SUMS

      - name: Detect immutable npm alpha.2 state
        id: npm_registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(npm view "${NPM_PACKAGE}@${NPM_VERSION}" version 2>/dev/null || true)" == "$NPM_VERSION" ]]; then
            registry_file="$(npm pack "${NPM_PACKAGE}@${NPM_VERSION}" --pack-destination sdk/release/registry-closure/npm-registry | tail -n 1)"
            cmp "sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz" "sdk/release/registry-closure/npm-registry/$registry_file"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable npm alpha.2 repair through Trusted Publishing
        if: steps.npm_registry.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          npm publish "sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz" \
            --access public --tag "$NPM_DIST_TAG" --provenance

      - name: Verify repaired npm bytes, tags, provenance identity and clean-room import
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          visible=false
          for attempt in $(seq 1 120); do
            if [[ "$(npm view "${NPM_PACKAGE}@${NPM_VERSION}" version 2>/dev/null || true)" == "$NPM_VERSION" ]]; then
              visible=true
              break
            fi
            sleep 5
          done
          test "$visible" = true

          rm -rf sdk/release/registry-closure/npm-registry
          mkdir -p sdk/release/registry-closure/npm-registry
          registry_file="$(npm pack "${NPM_PACKAGE}@${NPM_VERSION}" --pack-destination sdk/release/registry-closure/npm-registry | tail -n 1)"
          local_file="sdk/release/registry-closure/npm-local/truyn-sdk-${NPM_VERSION}.tgz"
          remote_file="sdk/release/registry-closure/npm-registry/$registry_file"
          cmp "$local_file" "$remote_file"
          remote_sha="$(sha256sum "$remote_file" | awk '{print $1}')"
          test "$remote_sha" = "$NPM_LOCAL_SHA"

          tags="$(npm view "$NPM_PACKAGE" dist-tags --json)"
          alpha="$(jq -r '.alpha // empty' <<<"$tags")"
          latest="$(jq -r '.latest // empty' <<<"$tags")"
          superseded="$(jq -r '.npmSupersedes' "$RELEASE_MARKER")"
          for tag in alpha latest; do
            current="$(jq -r --arg tag "$tag" '.[$tag] // empty' <<<"$tags")"
            if [[ "$current" != "$NPM_VERSION" && -n "$current" && "$current" != "$superseded" ]]; then
              echo "Refusing to move npm dist-tag $tag from $current back to $NPM_VERSION" >&2
              exit 1
            fi
          done
          if [[ "$alpha" != "$NPM_VERSION" || "$latest" != "$NPM_VERSION" ]]; then
            test -n "${NODE_AUTH_TOKEN:-}"
            test "$(npm whoami)" = "truyn"
            [[ "$alpha" == "$NPM_VERSION" ]] || npm dist-tag add "${NPM_PACKAGE}@${NPM_VERSION}" alpha
            [[ "$latest" == "$NPM_VERSION" ]] || npm dist-tag add "${NPM_PACKAGE}@${NPM_VERSION}" latest
          fi
          for attempt in $(seq 1 60); do
            tags="$(npm view "$NPM_PACKAGE" dist-tags --json 2>/dev/null || true)"
            alpha="$(jq -r '.alpha // empty' <<<"${tags:-{}}" 2>/dev/null || true)"
            latest="$(jq -r '.latest // empty' <<<"${tags:-{}}" 2>/dev/null || true)"
            if [[ "$alpha" == "$NPM_VERSION" && "$latest" == "$NPM_VERSION" ]]; then break; fi
            sleep 5
          done
          test "$alpha" = "$NPM_VERSION"
          test "$latest" = "$NPM_VERSION"

          dist_json="$(npm view "${NPM_PACKAGE}@${NPM_VERSION}" dist --json)"
          integrity="$(jq -r '.integrity // empty' <<<"$dist_json")"
          shasum="$(jq -r '.shasum // empty' <<<"$dist_json")"
          attestation_url="$(jq -r '.attestations.url // empty' <<<"$dist_json")"
          test -n "$integrity"
          test -n "$shasum"
          test -n "$attestation_url"

          mkdir -p sdk/release/registry-closure/npm-cleanroom
          cd sdk/release/registry-closure/npm-cleanroom
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "${NPM_PACKAGE}@${NPM_VERSION}"
          node --input-type=module -e "import('${NPM_PACKAGE}').then((m) => { if (typeof m.TruynClient !== 'function') throw new Error('TruynClient export missing'); if (typeof m.TruynLocalNodeClient !== 'function') throw new Error('TruynLocalNodeClient export missing'); })"
          npm audit signatures --json --include-attestations > ../npm-audit-signatures.json
          cd ../../../..

          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          payload = json.loads(Path('sdk/release/registry-closure/npm-audit-signatures.json').read_text())
          statements = []
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == 'payload' and isinstance(child, str):
                          try:
                              statement = json.loads(base64.b64decode(child + '===').decode())
                              if isinstance(statement, dict):
                                  statements.append(statement)
                          except Exception:
                              pass
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(payload)
          source = os.environ['SOURCE_SHA']
          expected_repo = 'https://github.com/inn-media/truyn'
          expected_path = '.github/workflows/publish-sdk-alpha.yml'
          expected_ref = 'refs/heads/main'
          matched = None
          for statement in statements:
              if statement.get('predicateType') != 'https://slsa.dev/provenance/v1':
                  continue
              definition = ((statement.get('predicate') or {}).get('buildDefinition') or {})
              workflow = ((definition.get('externalParameters') or {}).get('workflow') or {})
              deps = definition.get('resolvedDependencies') or []
              commit_match = any((entry.get('digest') or {}).get('gitCommit') == source for entry in deps if isinstance(entry, dict))
              if workflow.get('repository') == expected_repo and workflow.get('path') == expected_path and workflow.get('ref') == expected_ref and commit_match:
                  matched = statement
                  break
          if matched is None:
              raise SystemExit('npm provenance is not bound to expected TRUYN repository/workflow/main/source SHA')
          Path('sdk/release/registry-closure/npm-provenance-statement.json').write_text(json.dumps(matched, indent=2) + '\n')
          PY

          jq -n \
            --arg package "$NPM_PACKAGE" \
            --arg version "$NPM_VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg workflowRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg ciRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.gates.outputs.ci_run_id }}" \
            --arg codeqlRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.gates.outputs.codeql_run_id }}" \
            --arg sha256 "$remote_sha" \
            --arg integrity "$integrity" \
            --arg shasum "$shasum" \
            --arg attestationUrl "$attestation_url" \
            '{package:$package,version:$version,sourceSha:$sourceSha,releaseTag:$releaseTag,workflowRun:$workflowRun,ciRun:$ciRun,codeqlRun:$codeqlRun,sha256:$sha256,integrity:$integrity,shasum:$shasum,attestationUrl:$attestationUrl,provenanceWorkflowRef:"refs/heads/main",byteIdentity:"PASS",alphaTagIdentity:"PASS",latestTagIdentity:"PASS",cleanRoomInstall:"PASS",signatureAudit:"PASS",provenanceSourceIdentity:"PASS",immutableReleaseTagIdentity:"PASS"}' \
            > sdk/release/registry-closure/npm-release-evidence.json

      - name: Set up Python for immutable PyPI verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify existing PyPI alpha bytes, publisher identity and clean-room install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pypi-attestations==0.0.30'
          mkdir -p sdk/release/registry-closure/pypi
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path

          package = os.environ['PYPI_PACKAGE']
          version = os.environ['PYPI_VERSION']
          publication_sha = os.environ['PYPI_PUBLICATION_SOURCE_SHA']
          expected = {
              os.environ['PYPI_WHEEL_FILENAME']: os.environ['PYPI_WHEEL_SHA256'],
              os.environ['PYPI_SDIST_FILENAME']: os.environ['PYPI_SDIST_SHA256'],
          }
          with urllib.request.urlopen(f'https://pypi.org/pypi/{package}/{version}/json', timeout=30) as response:
              payload = json.load(response)
          distributions = [entry for entry in payload.get('urls', []) if entry.get('packagetype') in {'bdist_wheel', 'sdist'}]
          remote = {entry['filename']: entry for entry in distributions}
          if set(remote) != set(expected):
              raise SystemExit(f'unexpected PyPI distribution file set: {sorted(remote)}')
          out = Path('sdk/release/registry-closure/pypi')
          files = []
          for filename, expected_sha in expected.items():
              entry = remote[filename]
              if entry['digests']['sha256'] != expected_sha:
                  raise SystemExit(f'PyPI metadata SHA mismatch for {filename}')
              with urllib.request.urlopen(entry['url'], timeout=30) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected_sha:
                  raise SystemExit(f'PyPI byte SHA mismatch for {filename}')
              (out / filename).write_bytes(data)
              provenance_url = f'https://pypi.org/integrity/{package}/{version}/{urllib.parse.quote(filename, safe="")}/provenance'
              with urllib.request.urlopen(provenance_url, timeout=30) as response:
                  provenance = json.load(response)
              (out / f'{filename}.provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
              matched = False
              for bundle in provenance.get('attestation_bundles', []):
                  publisher = bundle.get('publisher') or {}
                  claims = publisher.get('claims') or {}
                  if (publisher.get('kind') == 'GitHub' and publisher.get('repository_owner') == 'inn-media' and publisher.get('repository_name') == 'truyn' and publisher.get('workflow_filename') == 'publish-sdk-alpha.yml' and publisher.get('environment') == 'sdk-release' and claims.get('sha') == publication_sha):
                      matched = True
                      break
              if not matched:
                  raise SystemExit(f'PyPI provenance publisher mismatch for {filename}')
              files.append({'filename': filename, 'sha256': expected_sha, 'size': len(data), 'url': entry['url']})
          evidence = {
              'package': package,
              'version': version,
              'publicationSourceSha': publication_sha,
              'verificationSourceSha': os.environ['SOURCE_SHA'],
              'files': files,
              'distributionFileSet': 'PASS',
              'attestationsExcludedFromDistributionFileSet': 'PASS',
              'byteIdentity': 'PASS',
              'publisherSourceSha': 'PASS',
          }
          Path('sdk/release/registry-closure/pypi-release-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          python - <<'PY' > /tmp/pypi-urls
          import json
          from pathlib import Path
          for item in json.loads(Path('sdk/release/registry-closure/pypi-release-evidence.json').read_text())['files']:
              print(item['url'])
          PY
          while IFS= read -r url; do
            pypi-attestations verify pypi --repository https://github.com/inn-media/truyn "$url"
          done < /tmp/pypi-urls
          python -m venv sdk/release/registry-closure/pypi-cleanroom
          sdk/release/registry-closure/pypi-cleanroom/bin/python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple "${PYPI_PACKAGE}==${PYPI_VERSION}"
          sdk/release/registry-closure/pypi-cleanroom/bin/python - <<'PY'
          from importlib.metadata import version
          from truyn import TRUYN_SDK_STABLE_API_VERSION, TruynClient, TruynLocalNodeClient
          assert version('truyn-sdk') == '0.1.0a1'
          assert isinstance(TRUYN_SDK_STABLE_API_VERSION, str)
          assert TruynClient is not None
          assert TruynLocalNodeClient is not None
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('sdk/release/registry-closure/pypi-release-evidence.json')
          evidence = json.loads(path.read_text())
          evidence['pep740Provenance'] = 'PASS'
          evidence['cleanRoomInstall'] = 'PASS'
          path.write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Upload immutable registry closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sdk-registry-closure-${{ env.SOURCE_SHA }}
          path: |
            sdk/release/registry-closure/npm-local/truyn-sdk-${{ env.NPM_VERSION }}.tgz
            sdk/release/registry-closure/npm-SHA256SUMS
            sdk/release/registry-closure/npm-release-evidence.json
            sdk/release/registry-closure/npm-audit-signatures.json
            sdk/release/registry-closure/npm-provenance-statement.json
            sdk/release/registry-closure/pypi-release-evidence.json
            sdk/release/registry-closure/pypi/*
          if-no-files-found: error
          retention-days: 90

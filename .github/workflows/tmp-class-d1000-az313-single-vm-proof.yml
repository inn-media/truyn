name: tmp-class-d1000-az313-single-vm-proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-az313-single-vm-proof.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Azure CLI under Python 3.13
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv "$RUNNER_TEMP/az313"
          "$RUNNER_TEMP/az313/bin/python" -m pip install --disable-pip-version-check --no-input 'azure-cli==2.89.1'
          echo "$RUNNER_TEMP/az313/bin" >> "$GITHUB_PATH"
      - name: Verify pinned CLI runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v az
          head -n 1 "$(command -v az)"
          "$RUNNER_TEMP/az313/bin/python" --version
          az version --output json > az-version.json
          python - <<'PY'
          import json
          d=json.load(open('az-version.json'))
          assert d['azure-cli']=='2.89.1', d
          print('TRUYN_AZURE_CLI_RUNTIME=PASS version=2.89.1 python=3.13')
          PY
      - name: Azure login with pinned CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Reproduce exact single-VM provision pattern
        id: repro
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          RG=truyn
          P="truyn-d1000-az313-${GITHUB_RUN_ID}"
          echo "P=$P" >> "$GITHUB_ENV"
          az account show --only-show-errors >/dev/null
          az network nsg create -g "$RG" -n "${P}-nsg" -l eastus2 --only-show-errors >/dev/null
          az network vnet create -g "$RG" -n "${P}-vnet" -l eastus2 --address-prefixes 10.252.0.0/16 --subnet-name "${P}-subnet" --subnet-prefixes 10.252.1.0/24 --only-show-errors >/dev/null
          az network nic create -g "$RG" -n "${P}-nic" -l eastus2 --vnet-name "${P}-vnet" --subnet "${P}-subnet" --only-show-errors >/dev/null
          az vm create -g "$RG" -n "${P}-vm" -l eastus2 --image Ubuntu2204 --size Standard_D4as_v5 --admin-username truynadmin --generate-ssh-keys --nics "${P}-nic" --os-disk-name "${P}-os" --os-disk-delete-option Delete --only-show-errors > vm-create.json
          az vm show -g "$RG" -n "${P}-vm" --show-details --only-show-errors > vm-show.json
          az resource list -g "$RG" --query "[?starts_with(name, '${P}')].name" -o tsv --only-show-errors > resources-before-cleanup.txt
          echo 'TRUYN_D1000_AZ313_SINGLE_VM=PASS' > proof-result.txt
      - name: Cleanup proof resources
        id: cleanup
        if: always()
        shell: bash
        run: |
          set +e
          RG=truyn
          P="${P:-truyn-d1000-az313-${GITHUB_RUN_ID}}"
          az vm delete -g "$RG" -n "${P}-vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || true
          az network nic delete -g "$RG" -n "${P}-nic" --only-show-errors >/dev/null 2>&1 || true
          az disk delete -g "$RG" -n "${P}-os" --yes --only-show-errors >/dev/null 2>&1 || true
          az network vnet delete -g "$RG" -n "${P}-vnet" --only-show-errors >/dev/null 2>&1 || true
          az network nsg delete -g "$RG" -n "${P}-nsg" --only-show-errors >/dev/null 2>&1 || true
          left="$(az resource list -g "$RG" --query "[?starts_with(name, '${P}')].name" -o tsv --only-show-errors 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'cleanup_remaining=%s\n' "$left" > cleanup-result.txt
          echo "remaining=$left" >> "$GITHUB_OUTPUT"
          test "$left" = 0
      - name: Record proof result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPRO_OUTCOME: ${{ steps.repro.outcome }}
          CLEANUP_REMAINING: ${{ steps.cleanup.outputs.remaining }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} azure_cli=2.89.1 python=3.13 repro=${REPRO_OUTCOME:-missing} cleanup_remaining=${CLEANUP_REMAINING:-missing} tested_pattern=Standard_D4as_v5_private_nic"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D1000 AZ313 SINGLE VM PROOF' -f "body=${body}" >/dev/null
      - name: Strict proof gate
        if: always()
        env:
          REPRO_OUTCOME: ${{ steps.repro.outcome }}
          CLEANUP_REMAINING: ${{ steps.cleanup.outputs.remaining }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$REPRO_OUTCOME" = success
          test "$CLEANUP_REMAINING" = 0

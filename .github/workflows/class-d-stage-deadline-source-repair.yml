name: Class D Stage Deadline Source Repair

on:
  push:
    branches:
      - automation/d-series-parallel-liveness-260923
    paths:
      - scripts/apply-class-d-stage-deadlines.py
      - .github/workflows/class-d-stage-deadline-source-repair.yml

permissions:
  contents: write

jobs:
  apply-stage-deadlines:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/d-series-parallel-liveness-260923
          fetch-depth: 0
          token: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}

      - name: Apply and validate stage deadlines
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-class-d-stage-deadlines.py
          bash -n scripts/d200-stage-isolated-campaign.sh
          bash -n scripts/class-d-phase-watchdog.sh
          git diff --check
          grep -q 'class_d_wait_pid_barrier "$deadline_phase" "$stage_pid"' scripts/d200-stage-isolated-campaign.sh
          grep -q 'restart-recovery) printf.*restart' scripts/d200-stage-isolated-campaign.sh
          grep -q 'class_d_deadline_ms recovery' scripts/d200-stage-isolated-campaign.sh

      - name: Commit canonical stage deadline repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$(git status --porcelain)"
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add scripts/d200-stage-isolated-campaign.sh
          git commit -m 'fix(class-d): enforce deterministic phase deadlines' -m 'Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:automation/d-series-parallel-liveness-260923

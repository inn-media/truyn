name: Class D Workflow Contract Blob Builder

on:
  push:
    branches:
      - automation/d-series-parallel-liveness-260923
    paths:
      - scripts/generate-class-d-workflow-contracts.py
      - .github/workflows/class-d-workflow-contract-blob-builder.yml

permissions:
  contents: write

jobs:
  build-workflow-blobs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/d-series-parallel-liveness-260923
          persist-credentials: false
          fetch-depth: 1

      - name: Generate and validate workflow contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/generate-class-d-workflow-contracts.py
          git diff --check
          grep -q 'timeout-minutes: 120' .github/workflows/d500-acceptance.yml
          grep -q "timeout-minutes: \${{ inputs.scale == 'd500' && 120 || 240 }}" .github/workflows/class-d-bootstrap-qualification.yml
          grep -q 'TRUYN_CLASS_D_SCALE=d500' .github/workflows/d500-acceptance.yml
          grep -q 'block=B03 architecture=parallel-fanout-global-barrier' .github/workflows/class-d-bootstrap-qualification.yml

      - name: Publish generated blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in .github/workflows/d500-acceptance.yml .github/workflows/class-d-bootstrap-qualification.yml; do
            encoded="$(base64 -w0 "$path")"
            sha="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            echo "TRUYN_CLASS_D_WORKFLOW_BLOB path=$path sha=$sha"
          done

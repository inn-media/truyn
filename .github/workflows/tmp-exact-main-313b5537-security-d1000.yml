name: tmp-exact-main-313b5537-security-d1000

on:
  push:
    branches:
      - evidence/exact-main-313b5537-d1000
    paths:
      - .github/workflows/tmp-exact-main-313b5537-security-d1000.yml

permissions:
  actions: read
  contents: read
  issues: write
  statuses: write

concurrency:
  group: exact-main-313b5537-security-d1000
  cancel-in-progress: false

env:
  TARGET_SHA: 313b5537f4ce3a8a7b2a32ddc7cb6982310deff2
  ORDINARY_CI_RUN: '32840902692'
  CODEQL_RUN: '32840901938'
  SECURITY_ARTIFACT: immutable-main-security-green-313b5537
  D1000_ARTIFACT: class-d-1000-prepare-313b5537

jobs:
  exact-evidence:
    name: exact security + D-1000 prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Enforce isolated one-shot launcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/evidence/exact-main-313b5537-d1000'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-exact-main-313b5537-security-d1000.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'modified'

      - name: Verify ordinary CI and CodeQL on exact main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          out=/tmp/truyn-exact-main
          mkdir -p "$out"
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$current_main" = "$TARGET_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORDINARY_CI_RUN}" > "$out/ordinary-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORDINARY_CI_RUN}/jobs?per_page=100" > "$out/ordinary-jobs.json"
          jq -e --arg target "$TARGET_SHA" '.name == "CI" and .event == "push" and .head_sha == $target and .status == "completed" and .conclusion == "success"' "$out/ordinary-run.json" >/dev/null
          jq -e '[.jobs[] | select((.name == "DCO" or .name == "test") and .status == "completed" and .conclusion == "success")] | length == 2' "$out/ordinary-jobs.json" >/dev/null
          jq -e '[.jobs[] | select(.name == "test") | .steps[] | select(.name == "Run npm install --ignore-scripts --no-audit --no-fund" and .conclusion == "success")] | length == 1' "$out/ordinary-jobs.json" >/dev/null
          jq -e '[.jobs[] | select(.name == "test") | .steps[] | select(.name == "Run npm test" and .conclusion == "success")] | length == 1' "$out/ordinary-jobs.json" >/dev/null
          jq -e '[.jobs[] | select(.name == "test") | .steps[] | select(.name == "Run git diff --check" and .conclusion == "success")] | length == 1' "$out/ordinary-jobs.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CODEQL_RUN}" > "$out/codeql-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CODEQL_RUN}/jobs?per_page=100" > "$out/codeql-jobs.json"
          jq -e --arg target "$TARGET_SHA" '.head_sha == $target and .status == "completed" and .conclusion == "success"' "$out/codeql-run.json" >/dev/null
          jq -e '[.jobs[] | select(.name | startswith("Analyze ("))] as $jobs | ($jobs | length) == 2 and all($jobs[]; .status == "completed" and .conclusion == "success")' "$out/codeql-jobs.json" >/dev/null

      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: 313b5537f4ce3a8a7b2a32ddc7cb6982310deff2
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact-source dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p security
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee security/01-install.log

      - name: Run immutable exact-SHA security gate
        shell: bash
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
        run: |
          set -Eeuo pipefail
          npm test 2>&1 | tee security/02-test.log
          git diff --check 2>&1 | tee security/03-diff-check.log
          cp /tmp/truyn-exact-main/ordinary-run.json security/
          cp /tmp/truyn-exact-main/ordinary-jobs.json security/
          cp /tmp/truyn-exact-main/codeql-run.json security/
          cp /tmp/truyn-exact-main/codeql-jobs.json security/
          python3 - "$TARGET_SHA" "$ORDINARY_CI_RUN" "$CODEQL_RUN" > security/evidence.json <<'PY'
          import json, os, subprocess, sys
          target, ordinary_run, codeql_run = sys.argv[1:]
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          evidence = {
              'schema': 'truyn.main-security-green.v1',
              'target_sha': target,
              'actual_checkout_sha': actual,
              'ordinary_ci_run': int(ordinary_run),
              'codeql_run': int(codeql_run),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'npm': subprocess.check_output(['npm', '--version'], text=True).strip(),
              'commands': [
                  {'command': 'npm install --ignore-scripts --no-audit --no-fund', 'exit': 0},
                  {'command': 'TRUYN_LOCAL_DEVELOPMENT=1 npm test', 'exit': 0},
                  {'command': 'git diff --check', 'exit': 0},
              ],
              'evaluator': 'PASS',
              'terminal': 'PASS',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'launcher_sha': os.environ['GITHUB_SHA'],
          }
          assert actual == target
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          jq -e --arg target "$TARGET_SHA" '.target_sha == $target and .actual_checkout_sha == $target and .evaluator == "PASS" and .terminal == "PASS" and all(.commands[]; .exit == 0)' security/evidence.json >/dev/null

      - name: Upload immutable security-green evidence
        id: security_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SECURITY_ARTIFACT }}
          path: security/
          if-no-files-found: error
          retention-days: 90

      - name: Run immutable D-1000 prepare-only gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p d1000 runtime-smoke
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh 2>&1 | tee d1000/class-d-1000-prepare.log
          marker='TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned'
          grep -Fqx "$marker" d1000/class-d-1000-prepare.log
          if grep -Eq '(^|[[:space:]])az[[:space:]]+(group|vm|network|deployment|resource)[[:space:]]' d1000/class-d-1000-prepare.log; then
            echo 'unexpected Azure mutation command in prepare-only log' >&2
            exit 1
          fi

      - name: Build and smoke-test exact-SHA runtime bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          TRUYN_TESTED_COMMIT="$TARGET_SHA" bash scripts/build-class-d-1000-runtime-bundle.sh d1000/truyn-d1000-runtime.tgz 2>&1 | tee d1000/runtime-build.log
          bundle_sha="$(awk '{print $1}' d1000/truyn-d1000-runtime.tgz.sha256)"
          test -n "$bundle_sha"
          printf '%s  %s\n' "$bundle_sha" d1000/truyn-d1000-runtime.tgz | sha256sum -c -
          tar -xzf d1000/truyn-d1000-runtime.tgz -C runtime-smoke
          test "$(jq -r '.sourceSha' runtime-smoke/manifest.json)" = "$TARGET_SHA"
          test "$(jq -r '.schema' runtime-smoke/manifest.json)" = 'truyn.class-d1000.runtime-bundle.v1'
          test "$(jq -r '.osCompatibility' runtime-smoke/manifest.json)" = 'ubuntu-22.04-amd64'
          runtime-smoke/runtime/bin/node -e "import(process.cwd() + '/runtime-smoke/app/network/testnet/node-service.js').then(() => console.log('TRUYN_CLASS_D1000_RUNTIME_IMPORT=PASS'))" | tee d1000/runtime-import.log
          grep -Fqx 'TRUYN_CLASS_D1000_RUNTIME_IMPORT=PASS' d1000/runtime-import.log
          sha256sum \
            scripts/class-d-1000-final-acceptance.sh \
            scripts/class-d-1000-strict-acceptance.sh \
            scripts/lib/class-d-run-command.sh \
            scripts/build-class-d-1000-runtime-bundle.sh \
            benchmarks/scale/class-d-azure-1000-provision.sh \
            benchmarks/scale/class-d-azure-1000-campaign.sh \
            benchmarks/scale/class-d-1000-safety-probes.js \
            benchmarks/scale/class-d-1000-remote-dht-probe.js \
            benchmarks/scale/class-d-1000-evidence.js \
            benchmarks/scale/evaluate-class-d-1000-evidence.js \
            benchmarks/scale/verify-class-d-1000-terminal.js \
            > d1000/class-d-1000-prepare-hashes.txt
          python3 - "$TARGET_SHA" "$bundle_sha" > d1000/class-d-1000-prepare-manifest.json <<'PY'
          import json, os, sys
          source, bundle_sha = sys.argv[1:]
          runtime_manifest = json.load(open('runtime-smoke/manifest.json', encoding='utf-8'))
          marker = 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned'
          manifest = {
              'schema': 'truyn.class-d1000.prepare-evidence.v1',
              'result': 'PASS',
              'sourceSha': source,
              'actualCheckoutSha': os.popen('git rev-parse HEAD').read().strip(),
              'prepareOnly': True,
              'azureMutation': False,
              'preparedHarnessMarker': marker,
              'workflowRunId': int(os.environ['GITHUB_RUN_ID']),
              'workflowRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'launcherSha': os.environ['GITHUB_SHA'],
              'runtimeBundle': {
                  'file': 'truyn-d1000-runtime.tgz',
                  'sha256': bundle_sha,
                  'schema': runtime_manifest['schema'],
                  'sourceSha': runtime_manifest['sourceSha'],
                  'nodeVersion': runtime_manifest['nodeVersion'],
                  'packageJsonSha256': runtime_manifest['packageJsonSha256'],
                  'dependencyTreeSha256': runtime_manifest['dependencyTreeSha256'],
                  'osCompatibility': runtime_manifest['osCompatibility'],
              },
          }
          assert manifest['actualCheckoutSha'] == source
          assert manifest['runtimeBundle']['sourceSha'] == source
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
          jq -e --arg target "$TARGET_SHA" --arg digest "$bundle_sha" '.result == "PASS" and .sourceSha == $target and .actualCheckoutSha == $target and .prepareOnly == true and .azureMutation == false and .runtimeBundle.sourceSha == $target and .runtimeBundle.sha256 == $digest' d1000/class-d-1000-prepare-manifest.json >/dev/null

      - name: Upload immutable D-1000 bundle and prepare evidence
        id: d1000_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.D1000_ARTIFACT }}
          path: d1000/
          if-no-files-found: error
          retention-days: 90

      - name: Publish exact-SHA PASS statuses and durable attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_ARTIFACT_ID: ${{ steps.security_artifact.outputs.artifact-id }}
          SECURITY_ARTIFACT_DIGEST: ${{ steps.security_artifact.outputs.artifact-digest }}
          D1000_ARTIFACT_ID: ${{ steps.d1000_artifact.outputs.artifact-id }}
          D1000_ARTIFACT_DIGEST: ${{ steps.d1000_artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$TARGET_SHA"
          test -n "$SECURITY_ARTIFACT_ID"
          test -n "$SECURITY_ARTIFACT_DIGEST"
          test -n "$D1000_ARTIFACT_ID"
          test -n "$D1000_ARTIFACT_DIGEST"
          security_digest="sha256:${SECURITY_ARTIFACT_DIGEST#sha256:}"
          d1000_digest="sha256:${D1000_ARTIFACT_DIGEST#sha256:}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SECURITY_ARTIFACT_ID}" --jq '.name')" = "$SECURITY_ARTIFACT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SECURITY_ARTIFACT_ID}" --jq '.digest')" = "$security_digest"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${D1000_ARTIFACT_ID}" --jq '.name')" = "$D1000_ARTIFACT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${D1000_ARTIFACT_ID}" --jq '.digest')" = "$d1000_digest"
          bundle_sha="$(awk '{print $1}' d1000/truyn-d1000-runtime.tgz.sha256)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context=truyn/main-ci-exact-313b5537 \
            -f description='Immutable exact-SHA canonical gate PASS' \
            -f target_url="$run_url" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context=truyn/d1000-prepare-exact-313b5537 \
            -f description='Immutable D-1000 prepare-only PASS' \
            -f target_url="$run_url" >/dev/null

          body="result=PASS
          tested_sha=${TARGET_SHA}
          main_sha_at_finish=${current_main}
          ordinary_ci_run=${ORDINARY_CI_RUN}
          codeql_run=${CODEQL_RUN}
          immutable_run=${GITHUB_RUN_ID}
          immutable_run_attempt=${GITHUB_RUN_ATTEMPT}
          launcher_sha=${GITHUB_SHA}
          security_status=truyn/main-ci-exact-313b5537
          security_artifact_id=${SECURITY_ARTIFACT_ID}
          security_artifact_name=${SECURITY_ARTIFACT}
          security_artifact_digest=${security_digest}
          d1000_status=truyn/d1000-prepare-exact-313b5537
          d1000_artifact_id=${D1000_ARTIFACT_ID}
          d1000_artifact_name=${D1000_ARTIFACT}
          d1000_artifact_digest=${d1000_digest}
          runtime_bundle_sha256=${bundle_sha}
          prepareOnly=true
          azureMutation=false
          run_url=${run_url}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -f 'title=TRUYN exact main 313b5537 security-green + D-1000 prepare PASS' \
            -f body="$body" >/dev/null

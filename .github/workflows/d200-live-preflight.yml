name: D-200 Live Preflight

on:
  workflow_dispatch:
    inputs:
      source_sha: {description: Exact D-200 candidate SHA to qualify, required: true, type: string}
      pr_number: {description: Active D-200 pull request number, required: true, default: '617', type: string}
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['automation/d200-parallel-closure-*']
permissions: {contents: read, pull-requests: read, id-token: write}
env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
  TARGET_PR: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
  UPSTREAM_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || 1 }}
  AZURE_CLIENT_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_VALUE: ${{ vars[format('AZURE_{0}', 'TENANT_ID')] || secrets[format('AZURE_{0}', 'TENANT_ID')] }}
  AZURE_SUBSCRIPTION_VALUE: ${{ vars[format('AZURE_{0}', 'SUBSCRIPTION_ID')] || secrets[format('AZURE_{0}', 'SUBSCRIPTION_ID')] }}
  AZURE_RESOURCE_GROUP: ${{ vars.TRUYN_AZURE_RESOURCE_GROUP || 'truyn' }}
  REQUIRED_HOSTS: '20'
jobs:
  live-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.run_attempt == 1 && startsWith(github.event.workflow_run.head_branch, 'automation/d200-parallel-closure-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce main-ref launcher and exact candidate identity
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_RUN_ATTEMPT" == '1' && "$UPSTREAM_ATTEMPT" == '1' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_PR" =~ ^[0-9]+$ ]]
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '.state=="open" and .head.sha==$sha and .head.repo.full_name==$repo and (.head.ref|startswith("automation/d200-parallel-closure-")) and .base.ref=="main"' <<<"$pr" >/dev/null
      - uses: actions/checkout@v4
        with: {ref: '${{ env.SOURCE_SHA }}', persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify exact candidate and D-200 preflight contract
        run: |
          set -Eeuo pipefail; [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]; bash scripts/class-d-200-preflight-qualification.sh
      - name: Authenticate to Azure with existing main-ref OIDC federation
        uses: azure/login@v2
        with: {client-id: '${{ env.AZURE_CLIENT_VALUE }}', tenant-id: '${{ env.AZURE_TENANT_VALUE }}', subscription-id: '${{ env.AZURE_SUBSCRIPTION_VALUE }}'}
      - name: Select fail-closed 20-host capacity placement
        id: placement
        shell: bash
        run: |
          set -Eeuo pipefail; printf '::add-mask::%s\n' "$AZURE_RESOURCE_GROUP"; ok=false
          for l in eastus2 eastus westus2 centralus northcentralus southcentralus westeurope northeurope; do
            u="$(az vm list-usage -l "$l" -o json --only-show-errors)" || continue
            rc="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].currentValue//-1'<<<"$u")"; rl="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].limit//-1'<<<"$u")"
            for z in Standard_E2as_v7 Standard_D4as_v5 Standard_D4s_v5; do
              q="$(az vm list-skus -l "$l" --size "$z" --all -o json --only-show-errors)" || continue; [[ "$(jq length<<<"$q")" -ge 1 ]] || continue
              v="$(jq -r '[.[].capabilities[]?|select(.name=="vCPUs")|.value][0]//empty'<<<"$q")"; f="$(jq -r '.[0].family//empty'<<<"$q")"; [[ -n "$v" && -n "$f" ]] || continue
              fc="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].currentValue//-1'<<<"$u")"; fl="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].limit//-1'<<<"$u")"; blocks="$(jq '[.[].restrictions[]?|select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")]|length'<<<"$q")"; need=$((v*REQUIRED_HOSTS))
              echo "TRUYN_D200_CAPACITY_PROBE location=$l size=$z required=$need regionalRemaining=$((rl-rc)) familyRemaining=$((fl-fc)) blocks=$blocks"
              if [[ "$blocks" == 0 && "$rc" -ge 0 && "$fc" -ge 0 && $((rl-rc)) -ge "$need" && $((fl-fc)) -ge "$need" ]]; then echo "TRUYN_D200_LOCATION=$l" >>"$GITHUB_ENV"; echo "TRUYN_D200_VM_SIZE=$z" >>"$GITHUB_ENV"; echo "selected_count=$REQUIRED_HOSTS" >>"$GITHUB_OUTPUT"; ok=true; break 2; fi
            done
          done
          [[ "$ok" == true ]]
      - name: Build immutable runtime bundle
        id: bundle
        run: |
          set -Eeuo pipefail; mkdir -p .d200-preflight; tar --exclude='./.git' --exclude='./.d200-preflight' --exclude='./node_modules' --exclude='./benchmarks/results' -czf .d200-preflight/truyn-runtime.tgz .; s="$(sha256sum .d200-preflight/truyn-runtime.tgz|awk '{print $1}')"; [[ "$s" =~ ^[0-9a-f]{64}$ ]]; echo "runtime_sha=$s" >>"$GITHUB_OUTPUT"
      - name: Stage runtime through private Entra data plane
        env: {RUNTIME_BUNDLE: .d200-preflight/truyn-runtime.tgz, RUNTIME_SHA: '${{ steps.bundle.outputs.runtime_sha }}'}
        run: bash scripts/d200-stage-runtime-bundle.sh
      - name: Verify staged artifact identity and privacy
        run: |
          set -Eeuo pipefail; [[ -n "${TRUYN_D200_STAGING_ACCOUNT:-}" ]]; printf '::add-mask::%s\n' "$TRUYN_D200_STAGING_ACCOUNT"; j="$(az storage account show -g "$AZURE_RESOURCE_GROUP" -n "$TRUYN_D200_STAGING_ACCOUNT" -o json --only-show-errors)"; jq -e '(.allowBlobPublicAccess//false)==false and (.enableHttpsTrafficOnly//false)==true and (.minimumTlsVersion//"")=="TLS1_2"'<<<"$j" >/dev/null; az storage blob download --account-name "$TRUYN_D200_STAGING_ACCOUNT" --container-name runtime --name truyn-d200-runtime.tgz --file /tmp/d200-roundtrip.tgz --auth-mode login --only-show-errors -o none; [[ "$(sha256sum /tmp/d200-roundtrip.tgz|awk '{print $1}')" == "${{ steps.bundle.outputs.runtime_sha }}" ]]
      - name: Write sanitized preflight evidence
        if: success()
        run: |
          mkdir -p .d200-preflight/evidence; jq -n --arg sourceSha "$SOURCE_SHA" --arg runtimeSha "${{ steps.bundle.outputs.runtime_sha }}" --arg location "$TRUYN_D200_LOCATION" --arg vmSize "$TRUYN_D200_VM_SIZE" --argjson selectedHosts "${{ steps.placement.outputs.selected_count }}" '{schema:"truyn.d200.live-preflight.v4",sourceSha:$sourceSha,runtimeSha256:$runtimeSha,selectedHosts:$selectedHosts,capacityPlacement:true,locationClass:"qualified",vmSizeClass:"qualified",oidcAuthenticated:true,oidcSubjectClass:"main-ref",privateStaging:true,artifactDigestVerified:true,acceptanceCampaignLaunched:false}' >.d200-preflight/evidence/live-preflight.json
      - name: Cleanup staging fail-closed
        if: always()
        run: |
          set -Eeuo pipefail
          if [[ -n "${TRUYN_D200_STAGING_ACCOUNT:-}" ]]; then az storage account delete -g "$AZURE_RESOURCE_GROUP" -n "$TRUYN_D200_STAGING_ACCOUNT" --yes --only-show-errors; for _ in $(seq 1 30); do [[ "$(az storage account check-name -n "$TRUYN_D200_STAGING_ACCOUNT" --query nameAvailable -o tsv --only-show-errors||true)" == true ]] && break; sleep 2; done; [[ "$(az storage account check-name -n "$TRUYN_D200_STAGING_ACCOUNT" --query nameAvailable -o tsv --only-show-errors)" == true ]]; fi
      - name: Upload sanitized preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'd200-live-preflight-${{ github.run_id }}', path: .d200-preflight/evidence, if-no-files-found: warn, retention-days: 30}

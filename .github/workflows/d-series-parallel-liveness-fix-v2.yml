name: D-Series Parallel Liveness Repair Fix V2

on:
  push:
    branches:
      - 'automation/autorepair/d-series-parallel-liveness-260923'
    paths:
      - '.github/workflows/d-series-parallel-liveness-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}
      - name: Patch repair generator safely
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/d-series-parallel-liveness-repair.yml')
          t=p.read_text()
          expr='$' + '{{ env.SOURCE_SHA }}'
          needle='                    ref: ' + expr
          if t.count(needle) != 2:
              raise SystemExit(f'expected 2 generated ref expressions, found {t.count(needle)}')
          t=t.replace(needle, '                    ref: __SOURCE_SHA_EXPR__')
          call="replace_exact(workflow, 'jobs:\\n  block:\\n', gate_jobs)"
          if t.count(call) != 1:
              raise SystemExit(f'expected one gate replace call, found {t.count(call)}')
          idx=t.index(call)
          line_start=t.rfind('\n',0,idx)+1
          prefix=t[line_start:idx]
          insertion=prefix + "gate_jobs=gate_jobs.replace('__SOURCE_SHA_EXPR__', '$' + '{{ env.SOURCE_SHA }}')\n"
          t=t[:line_start] + insertion + t[line_start:]
          p.write_text(t)
          PY
          git diff --check
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git rm .github/workflows/d-series-parallel-liveness-fix.yml .github/workflows/d-series-parallel-liveness-fix-v2.yml
          git add .github/workflows/d-series-parallel-liveness-repair.yml
          git diff --cached --check
          git commit -s -m 'fix(class-d): preserve generated exact-source expression'
          git push origin "HEAD:${GITHUB_REF_NAME}"

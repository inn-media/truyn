name: tmp-fix-pr301-contract

on:
  push:
    branches: [fix/d1000-guest-terminal-diagnostics]
    paths: ['.github/workflows/tmp-fix-pr301-contract.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1000-guest-terminal-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact canonical cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/class-d-1000-final-acceptance.sh')
          s = p.read_text()
          replacements = {
            "test -x /opt/truin/runtime/bin/jq": "test -x /opt/truyn/runtime/bin/jq",
            "test -x /opt/truin/runtime/bin/curl": "test -x /opt/truyn/runtime/bin/curl",
            "test -x /opt/truin/runtime/bin/openssl": "test -x /opt/truy n/runtime/bin/openssl".replace('truy n','truyn'),
            "/opt/truin/runtime/bin/jq --version": "/opt/truyn/runtime/bin/jq --version",
            "p = p.replace('ExecStart=/usr/bin/node /opt/truin/network/testnet/node-service.js', 'ExecStart=/opt/truyn/runtime/bin/node /opt/truy n/app/network/testnet/node-service.js'.replace('truy n', 'truyn'))": "p = p.replace('ExecStart=/usr/bin/node /opt/truin/network/testnet/node-service.js', 'ExecStart=/opt/truyn/runtime/bin/node /opt/truyn/app/network/testnet/node-service.js')",
            "p = p.replace('ExecStart=/usr/bin/node /opt/truyn/network/testnet/node-service.js', 'ExecStart=/opt/truy n/runtime/bin/node /opt/truyn/app/network/testnet/node-service.js'.replace('truy n', 'truyn'))": "p = p.replace('ExecStart=/usr/bin/node /opt/truyn/network/testnet/node-service.js', 'ExecStart=/opt/truyn/runtime/bin/node /opt/truin/app/network/testnet/node-service.js'.replace('/opt/truin','/opt/truyn'))",
            "('install -d -m 0700 /var/lib/truyn-d1000 /etc/truy n-d1000'.replace('truy n', 'truyn'),": "('install -d -m 0700 /var/lib/truyn-d1000 /etc/truyn-d1000',",
            "grep -q 'ExecStart=/opt/truyn/runtime/bin/node /opt/truy n/app/network/testnet/node-service.js'.replace 2>/dev/null && true || true\ngrep -q 'ExecStart=/opt/truy n/runtime/bin/node /opt/truin/app/network/testnet/node-service.js' \"$TMP/provision.sh\" && exit 1 || true\ngrep -q 'ExecStart=/opt/truy n/runtime/bin/node /opt/truy n/app/network/testnet/node-service.js' \"$TMP/provision.sh\" || grep -q 'ExecStart=/opt/truin/runtime/bin/node /opt/truin/app/network/testnet/node-service.js' \"$TMP/provision.sh\"": "grep -q 'ExecStart=/opt/truy n/runtime/bin/node /opt/truy n/app/network/testnet/node-service.js' \"$TMP/provision.sh\"".replace('truy n','truyn'),
          }
          for old, new in replacements.items():
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'exact replacement count mismatch {count}: {old[:80]}')
            s = s.replace(old, new, 1)
          # Canonicalize only the newly-added bootstrap literal while retaining the
          # legacy-source canonicalization patterns needed to prepare the pinned harness.
          marker = "new_bootstrap = r'''guest_stage=runtime_bundle"
          start = s.index(marker)
          end = s.index("\np, bootstrap_count = bootstrap_pattern.subn", start)
          block = s[start:end]
          block = block.replace('/opt/truy n', '/opt/truyn').replace('/opt/truin/runtime', '/opt/truyn/runtime')
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          git diff --check
      - name: Verify prepare and boundary contract
        shell: bash
        run: |
          set -Eeuo pipefail
          TRUYN_CLASS_D1000_RUNTIME_URL=https://example.invalid/runtime.tgz \
          TRUYN_CLASS_D1000_RUNTIME_SHA256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh | tee /tmp/pr301-prepare.txt
          grep -Fq 'runCommandBoundary=accepted-d100-terminal' /tmp/pr301-prepare.txt
          node --test tests/class-d-1000-run-command-boundary.test.js
      - name: Full regression
        shell: bash
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-fix-pr301-contract.yml
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add scripts/class-d-1000-final-acceptance.sh .github/workflows/tmp-fix-pr301-contract.yml
          git diff --cached --check
          git commit -m 'fix: canonicalize D-1000 bootstrap diagnostics'
          git push origin HEAD:fix/d1000-guest-terminal-diagnostics

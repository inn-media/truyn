name: N-Series Public Admission Auto
on:
  workflow_run:
    workflows: ['N-Series Public Swarm']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  admission:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: n-public-swarm-summary-${{ github.event.workflow_run.id }}
          path: swarm-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: frozen
        name: Verify immutable exact-SHA Swarm evidence
        shell: bash
        run: |
          set -euo pipefail
          f=swarm-evidence/n-public-swarm-summary.json
          jq -e --arg sha '${{ github.event.workflow_run.head_sha }}' '.schema=="truyn.n-series.public-swarm.v1" and .status=="GREEN" and .requiredBlocks==7 and .greenBlocks==7 and .candidateSha==$sha' "$f" >/dev/null
          echo "candidate_sha=$(jq -r .candidateSha "$f")" >> "$GITHUB_OUTPUT"
      - name: Build candidate qualification and current-main Admission
        shell: bash
        run: |
          set -euo pipefail
          candidate='${{ steps.frozen.outputs.candidate_sha }}'
          base="$(git rev-parse "$candidate^1")"
          current="$(git rev-parse HEAD)"
          node scripts/n-series-qualification-manifest.mjs qualification --base-sha "$base" --candidate-sha "$candidate" --output "$RUNNER_TEMP/n-qualification.json"
          node scripts/n-series-qualification-manifest.mjs admission --qualification-manifest "$RUNNER_TEMP/n-qualification.json" --current-main-sha "$current" --integration-ref "$current" --output "$RUNNER_TEMP/n-admission.json"
          blocks="$(jq -r '.decision.targetedBlocks|join(",")' "$RUNNER_TEMP/n-admission.json")"
          if [ -n "$blocks" ]; then
            IFS=',' read -ra arr <<< "$blocks"
            for b in "${arr[@]}"; do [[ "$b" =~ ^N[1-7]$ ]] || exit 73; node scripts/n-series-selective-block-runner.mjs --manifest "$RUNNER_TEMP/n-qualification.json" --blocks "$b" --json "$RUNNER_TEMP/$b.json"; jq -e '.status=="GREEN" or .overall=="GREEN" or .passed==true' "$RUNNER_TEMP/$b.json" >/dev/null; done
          fi
      - name: Mandatory final combined-state Admission Gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema=="truyn.n-series.admission-manifest.v1" and .decision.automaticFullRerun==false and .decision.finalAdmissionGateRequired==true and .integrationFingerprint!=null' "$RUNNER_TEMP/n-admission.json" >/dev/null
          jq -n --slurpfile swarm swarm-evidence/n-public-swarm-summary.json --slurpfile admission "$RUNNER_TEMP/n-admission.json" --arg run '${{ github.run_id }}' '{schema:"truyn.n-series.public-admission-evidence.v1",status:"GREEN",runId:$run,swarm:$swarm[0],admission:$admission[0],historicalGreenAloneLaunchAuthority:false,paidProviderCalls:0}' > "$RUNNER_TEMP/n-public-admission-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: n-public-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/n-public-admission-evidence.json
          if-no-files-found: error
          retention-days: 30

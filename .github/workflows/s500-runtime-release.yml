name: S500 qualified runtime publication
on:
  push:
    branches: [task/s500-runtime-release-20261013]
    paths: [.github/workflows/s500-runtime-release.yml]
permissions:
  contents: write
concurrency:
  group: s500-runtime-release-da8104a5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: da8104a52826ac77bd9c222b71d1e0eeb768a815
      TAG: s-series-relay-da8104a52826ac77bd9c222b71d1e0eeb768a815
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da8104a52826ac77bd9c222b71d1e0eeb768a815
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact source and previous independent readiness
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38440315648" > "$RUNNER_TEMP/readiness.json"
          jq -e --arg sha "$SOURCE_SHA" '.head_sha==$sha and .conclusion=="success"' "$RUNNER_TEMP/readiness.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38440361019" > "$RUNNER_TEMP/full-ci.json"
          jq -e --arg sha "$SOURCE_SHA" '.head_sha==$sha and .conclusion=="success"' "$RUNNER_TEMP/full-ci.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/s500-*.test.js tests/cloud-providers.test.js tests/relay-load-cost-routing.test.js
      - name: Hold 500 signed NEEDs, then complete without inference
        run: |
          mkdir -p artifacts
          node benchmarks/s500-dry-burst.mjs > artifacts/s500-dry-burst.json
          cat artifacts/s500-dry-burst.json
      - name: Preserve all 500 HTTP results until requester reads
        run: |
          node benchmarks/s500-terminal-backlog.mjs > artifacts/s500-terminal-backlog.json
          cat artifacts/s500-terminal-backlog.json
      - name: Create immutable source bundle and publish once
        run: |
          set -Eeuo pipefail
          git archive --format=tar "$SOURCE_SHA" | gzip -n > artifacts/truyn-s-series-relay.tgz
          sha256sum artifacts/truyn-s-series-relay.tgz > artifacts/truyn-s-series-relay.tgz.sha256
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('artifacts')
          bundle=root/'truyn-s-series-relay.tgz'
          manifest={'schema':'truyn.s-series.runtime-manifest/v1','sourceSha':os.environ['SOURCE_SHA'],'sha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),'qualificationRun':38440315648,'publicationRun':os.environ['GITHUB_RUN_ID'],'paidCalls':0,'requestCount':500,'providerClients':8,'independentWorkerProcesses':0,'full500ProcessQualification':False,'fullCiRun':38440361019,'limits':{'fastTerminalReservations':1024,'queuedTerminalEvents':1024,'ordinaryQueuedEvents':256}}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir "$RUNNER_TEMP/existing"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/existing" --pattern manifest.json --pattern truyn-s-series-relay.tgz
            test "$(sha256sum "$RUNNER_TEMP/existing/truyn-s-series-relay.tgz" | cut -d' ' -f1)" = "$(sha256sum artifacts/truyn-s-series-relay.tgz | cut -d' ' -f1)"
            jq -e --arg sha "$SOURCE_SHA" '.sourceSha==$sha' "$RUNNER_TEMP/existing/manifest.json"
            cp "$RUNNER_TEMP/existing/manifest.json" artifacts/manifest.json
          else
            gh release create "$TAG" artifacts/manifest.json artifacts/truyn-s-series-relay.tgz artifacts/truyn-s-series-relay.tgz.sha256 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Qualified S500 relay da8104a5" --notes "Fixes terminal_capacity_invariant under delayed HTTP reads by keeping reservations and queued RESULTs under one capacity. Both 500-request WebSocket and HTTP backlog probes passed with zero inference. Supersedes the earlier 6d413962 S500 runtime for burst use. No paid S500 acceptance or full 500-process host qualification is claimed."
          fi
          sha256sum artifacts/manifest.json artifacts/truyn-s-series-relay.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: s500-qualified-runtime-publication, path: artifacts/, if-no-files-found: error}

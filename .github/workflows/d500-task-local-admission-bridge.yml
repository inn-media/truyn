name: D-500 Task-Local Admission Bridge

# Refresh current-main admission after unrelated main movement; candidate qualification remains immutable.
on:
  push:
    branches:
      - automation/d500-acceptance-repair-8f3c2a
    paths:
      - .github/workflows/d500-task-local-admission-bridge.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: d500-task-local-admission-bridge
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      QUALIFICATION_RUN_ID: '36960915266'
      QUALIFICATION_ARTIFACT: d500-frozen-qualification-36960915266
      QUALIFICATION_DIGEST: sha256:f4d2881c58cc6d2513dc791401858e862f34b73a7dc3035844d98180b5795171
      CANDIDATE_SHA: a247d1a0eeb08483701db7af47a4049342d96be8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact immutable qualification evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}")"
          jq -e --arg sha d5adb229744a33bc21c76d876f2a83133d9fd289 '.name=="D-500 Frozen Candidate Qualification One-Shot" and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .head_sha==$sha' <<<"$run" >/dev/null
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg n "$QUALIFICATION_ARTIFACT" --arg d "$QUALIFICATION_DIGEST" '[.artifacts[] | select(.name==$n and .expired==false and (.size_in_bytes//0)>0 and .digest==$d)] | length==1' <<<"$artifacts" >/dev/null
      - name: Download exact qualification manifest
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.QUALIFICATION_ARTIFACT }}
          path: qualification
          run-id: ${{ env.QUALIFICATION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Bind exact candidate to current main and build integration tree
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          q=qualification/d-series-qualification-manifest.json
          [[ -s "$q" ]]
          node scripts/verify-d-series-frozen-candidate-policy.mjs
          candidate="$(jq -r .candidateSha "$q")"; base="$(jq -r .baseSha "$q")"; scale="$(jq -r .scale "$q")"
          [[ "$candidate" == "$CANDIDATE_SHA" && "$base" =~ ^[0-9a-f]{40}$ && "$scale" == d500 ]]
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          git fetch --no-tags origin "$candidate" "$current_main"
          git merge-base --is-ancestor "$base" "$candidate"
          git checkout --detach "$current_main"
          git config user.name 'TRUYN D-500 Admission Bridge'; git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff --no-commit "$candidate"
          integration_tree="$(git write-tree)"
          node scripts/d-series-qualification-manifest.mjs admission --qualification-manifest "$q" --base-sha "$base" --candidate-sha "$candidate" --current-main-sha "$current_main" --integration-ref "$integration_tree" --scale "$scale" --output d-series-admission-manifest.json
          echo "candidate=$candidate" >>"$GITHUB_OUTPUT"; echo "current_main=$current_main" >>"$GITHUB_OUTPUT"; echo "integration_tree=$integration_tree" >>"$GITHUB_OUTPUT"
      - name: Run mandatory integration admission semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/verify-d-series-frozen-candidate-policy.mjs
          node scripts/verify-d-series-swarm-blockwise-architecture-lock.mjs
          node --test tests/d-series-frozen-candidate-admission.test.js tests/d-series-main-movement-auto-admission.test.js
          git diff --check
      - name: Requalify only D-sensitive blocks touched by base to current main
        shell: bash
        env:
          TRUYN_CLASS_D_SOURCE_SHA: ${{ steps.plan.outputs.integration_tree }}
        run: |
          set -Eeuo pipefail
          mapfile -t blocks < <(jq -r '.decision.targetedBlocks[]?' d-series-admission-manifest.json)
          for block in "${blocks[@]}"; do node scripts/d-series-block-runner.mjs "$block" --scale 500 --result "admission-${block}.json"; jq -e '.status=="PASS"' "admission-${block}.json" >/dev/null; done
      - name: Finalize and enforce current-main freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_CURRENT_MAIN_SHA: ${{ steps.plan.outputs.current_main }}
          ADMISSION_CANDIDATE_SHA: ${{ steps.plan.outputs.candidate }}
          ADMISSION_INTEGRATION_TREE_SHA: ${{ steps.plan.outputs.integration_tree }}
        run: |
          set -Eeuo pipefail
          fresh_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"; [[ "$fresh_main" == "$ADMISSION_CURRENT_MAIN_SHA" ]]
          jq -e '.decision.automaticFullRerunForbidden==true' d-series-admission-manifest.json >/dev/null
          node scripts/finalize-d-series-admission.mjs --manifest d-series-admission-manifest.json --result-prefix admission- --output d-series-admission-manifest.final.json
          mv d-series-admission-manifest.final.json d-series-admission-manifest.json
          jq -e --arg tree "$ADMISSION_INTEGRATION_TREE_SHA" '.integrationTreeSha==$tree and .decision.admissionPassed==true and .decision.status=="PASS_COMPATIBLE" and .decision.targetedRequalificationPassed==true and .decision.liveRerunSatisfied==true and .decision.liveRerunRequired==false and .requalification.allPassed==true' d-series-admission-manifest.json >/dev/null
          echo "TRUYN_D500_TASK_ADMISSION=PASS candidate=$ADMISSION_CANDIDATE_SHA current_main=$fresh_main integration_tree=$ADMISSION_INTEGRATION_TREE_SHA"
      - name: Upload exact admission manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d500-task-admission-${{ github.run_id }}
          path: d-series-admission-manifest.json
          if-no-files-found: error
          retention-days: 90

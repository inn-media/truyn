name: tmp-class-d1000-capacity-observe2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-capacity-observe2.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read capacity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          az vm list-usage -l eastus2 -o table > /tmp/usage.txt
          usage="$(grep -Ei 'cpu|core|das|dsv5|regional' /tmp/usage.txt | tr '\n' ';' | head -c 5000 || true)"
          d2="$(az vm list-skus -l eastus2 --size Standard_D2as_v5 --all --query '[0].restrictions' -o json --only-show-errors | tr -d '\n' | head -c 1500)"
          d4a="$(az vm list-skus -l eastus2 --size Standard_D4as_v5 --all --query '[0].restrictions' -o json --only-show-errors | tr -d '\n' | head -c 1500)"
          d4="$(az vm list-skus -l eastus2 --size Standard_D4s_v5 --all --query '[0].restrictions' -o json --only-show-errors | tr -d '\n' | head -c 1500)"
          body="read_only=true\nusage=${usage}\nD2as_v5=${d2}\nD4as_v5=${d4a}\nD4s_v5=${d4}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 CAPACITY OBSERVATION 2' -f "body=${body}" >/dev/null

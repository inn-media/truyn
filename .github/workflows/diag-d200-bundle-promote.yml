name: D200 canonical runtime bundle promotion

on:
  push:
    branches:
      - fix/d200-canonical-runtime-bundle

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote canonical runtime bundle bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          provision_path = Path('benchmarks/scale/class-d-azure-1000-provision.sh')
          p = provision_path.read_text()

          runtime_anchor = 'START_MS=$(date +%s%3N)\n'
          runtime_init = ''': "${TRUYN_CLASS_D1000_RUNTIME_URL:?TRUYN_CLASS_D1000_RUNTIME_URL is required}"\n: "${TRUYN_CLASS_D1000_RUNTIME_SHA256:?TRUYN_CLASS_D1000_RUNTIME_SHA256 is required}"\nRUNTIME_URL_B64="$(printf '%s' "$TRUYN_CLASS_D1000_RUNTIME_URL" | base64 -w0)"\n'''
          if runtime_init not in p:
              if p.count(runtime_anchor) != 1:
                  raise SystemExit(f'expected one runtime anchor, found={p.count(runtime_anchor)}')
              p = p.replace(runtime_anchor, runtime_anchor + runtime_init, 1)

          subnet_old = 'az network vnet subnet update -g "$RG" --vnet-name "$VNET" -n "$SUBNET" --network-security-group "$NSG" --only-show-errors >/dev/null'
          subnet_new = 'az network vnet subnet update -g "$RG" --vnet-name "$VNET" -n "$SUBNET" --network-security-group "$NSG" --service-endpoints Microsoft.Storage --only-show-errors >/dev/null'
          if subnet_new not in p:
              if p.count(subnet_old) != 1:
                  raise SystemExit('expected one subnet update anchor')
              p = p.replace(subnet_old, subnet_new, 1)

          bootstrap_pattern = re.compile(
              r'export DEBIAN_FRONTEND=noninteractive\n'
              r'install_stage=apt-update\n'
              r'.*?'
              r'install_stage=runtime-config\n',
              re.S,
          )
          new_bootstrap = r'''install_stage=runtime-prereqs
          for required in python3 tar sha256sum systemctl iptables iptables-save readlink; do command -v "\$required" >/dev/null; done
          install_stage=runtime-download
          bundle=/tmp/truyn-d1000-runtime.tgz
          rm -f "\$bundle"
          python3 - '${RUNTIME_URL_B64}' "\$bundle" <<'PYRUNTIME'
          import base64, sys, urllib.request
          url = base64.b64decode(sys.argv[1]).decode('utf-8')
          urllib.request.urlretrieve(url, sys.argv[2])
          PYRUNTIME
          install_stage=runtime-digest
          printf '%s  %s\n' '${TRUYN_CLASS_D1000_RUNTIME_SHA256}' "\$bundle" | sha256sum -c -
          install_stage=runtime-extract
          rm -rf /opt/truyqn
          mkdir -p /opt/truyqn
          tar -xzf "\$bundle" -C /opt/truyqn
          test -x /opt/truyqn/runtime/bin/node
          test -x /opt/truyqn/runtime/bin/jq
          test -x /opt/truyqn/runtime/bin/curl
          test -x /opt/truyqn/runtime/bin/openssl
          /opt/truyqn/runtime/bin/node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          /opt/truyqn/runtime/bin/jq --version >/dev/null
          /opt/truyqn/runtime/bin/curl --version >/dev/null
          /opt/truyqn/runtime/bin/openssl version >/dev/null
          install_stage=runtime-manifest
          /opt/truyqn/runtime/bin/jq -e --arg sha '${GITHUB_SHA}' '.schema == "truyn.class-d1000.runtime-bundle.v1" and .sourceSha == $sha' /opt/truyqn/manifest.json >/dev/null
          ln -sfn /opt/truyqn/runtime/bin/node /usr/local/bin/node
          ln -sfn /opt/truyqn/runtime/bin/jq /usr/local/bin/jq
          ln -sfn /opt/truyqn/runtime/bin/curl /usr/local/bin/curl
          ln -sfn /opt/truyqn/runtime/bin/openssl /usr/local/bin/openssl
          cd /opt/truyqn/app
          install_stage=quic-import
          /opt/truyqn/runtime/bin/node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          install_stage=node-service-import
          /opt/truyqn/runtime/bin/node --input-type=module -e "await import('./network/testnet/node-service.js'); console.log('NODE_SERVICE_IMPORT=PASS')"
          install_stage=runtime-config
          '''
          p, count = bootstrap_pattern.subn(new_bootstrap, p, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy VM bootstrap, replaced={count}')

          p = p.replace('WorkingDirectory=/opt/truyqn\n', 'WorkingDirectory=/opt/truyqn/app\n')
          p = p.replace('ExecStart=/usr/bin/node /opt/truyqn/network/testnet/node-service.js', 'ExecStart=/opt/truyqn/runtime/bin/node /opt/truyqn/app/network/testnet/node-service.js')
          provision_path.write_text(p)

          final_path = Path('scripts/class-d-1000-final-acceptance.sh')
          f = final_path.read_text()
          old_runtime = '''if p.count(runtime_anchor) != 1:\n    raise SystemExit(f'expected one D-1000 runtime anchor, found={p.count(runtime_anchor)}')\np = p.replace(runtime_anchor, runtime_anchor + runtime_init, 1)'''
          new_runtime = '''if runtime_init not in p:\n    if p.count(runtime_anchor) != 1:\n        raise SystemExit(f'expected one D-1000 runtime anchor, found={p.count(runtime_anchor)}')\n    p = p.replace(runtime_anchor, runtime_anchor + runtime_init, 1)\nelif p.count(runtime_init) != 1:\n    raise SystemExit(f'expected one D-1000 runtime init, found={p.count(runtime_init)}')'''
          if old_runtime not in f:
              raise SystemExit('final acceptance runtime insertion block not found')
          f = f.replace(old_runtime, new_runtime, 1)

          start = f.index("bootstrap_pattern = re.compile(")
          end_marker = "p = p.replace('WorkingDirectory=/opt/truy n', 'WorkingDirectory=/opt/truy n/app')".replace('truy n', 'truyn')
          end = f.index(end_marker, start)
          old_block = f[start:end]
          new_block = r'''bootstrap_pattern = re.compile(
              r'export DEBIAN_FRONTEND=noninteractive\n'
              r'install_stage=apt-update\n'
              r'.*?'
              r'install_stage=runtime-config\n',
              re.S,
          )
          new_bootstrap = r''' + "'''" + r'''install_stage=runtime-prereqs
          for required in python3 tar sha256sum systemctl iptables iptables-save readlink; do command -v "\$required" >/dev/null; done
          install_stage=runtime-download
          bundle=/tmp/truy n-d1000-runtime.tgz
          rm -f "\$bundle"
          python3 - '${RUNTIME_URL_B64}' "\$bundle" <<'PYRUNTIME'
          import base64, sys, urllib.request
          url = base64.b64decode(sys.argv[1]).decode('utf-8')
          urllib.request.urlretrieve(url, sys.argv[2])
          PYRUNTIME
          install_stage=runtime-digest
          printf '%s  %s\n' '${TRUYN_CLASS_D1000_RUNTIME_SHA256}' "\$bundle" | sha256sum -c -
          install_stage=runtime-extract
          rm -rf /opt/truy n
          mkdir -p /opt/truy n
          tar -xzf "\$bundle" -C /opt/truy n
          test -x /opt/truy n/runtime/bin/node
          test -x /opt/truy n/runtime/bin/jq
          test -x /opt/truy n/runtime/bin/curl
          test -x /opt/truy n/runtime/bin/openssl
          /opt/truy n/runtime/bin/node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          /opt/truy n/runtime/bin/jq --version >/dev/null
          /opt/truy n/runtime/bin/curl --version >/dev/null
          /opt/truy n/runtime/bin/openssl version >/dev/null
          install_stage=runtime-manifest
          /opt/truy n/runtime/bin/jq -e --arg sha '${GITHUB_SHA}' '.schema == "truyn.class-d1000.runtime-bundle.v1" and .sourceSha == $sha' /opt/truy n/manifest.json >/dev/null
          ln -sfn /opt/truy n/runtime/bin/node /usr/local/bin/node
          ln -sfn /opt/truy n/runtime/bin/jq /usr/local/bin/jq
          ln -sfn /opt/truy n/runtime/bin/curl /usr/local/bin/curl
          ln -sfn /opt/truy n/runtime/bin/openssl /usr/local/bin/openssl
          cd /opt/truy n/app
          install_stage=quic-import
          /opt/truy n/runtime/bin/node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          install_stage=node-service-import
          /opt/truy n/runtime/bin/node --input-type=module -e "await import('./network/testnet/node-service.js'); console.log('NODE_SERVICE_IMPORT=PASS')"
          install_stage=runtime-config''' + "'''" + r'''.replace('truy n', 'truyn')
          if 'export DEBIAN_FRONTEND=noninteractive\n' in p:
              p, bootstrap_count = bootstrap_pattern.subn(new_bootstrap, p, count=1)
              if bootstrap_count != 1:
                  raise SystemExit(f'expected exactly one legacy D-1000 network bootstrap, replaced={bootstrap_count}')
          else:
              required_runtime = (
                  'install_stage=runtime-download',
                  'install_stage=runtime-digest',
                  'install_stage=runtime-manifest',
                  'TRUYN_CLASS_D1000_RUNTIME_SHA256',
                  'sourceSha == $sha',
              )
              missing = [marker for marker in required_runtime if marker not in p]
              if missing:
                  raise SystemExit(f'canonical D-1000 runtime bootstrap incomplete: {missing}')
          
          '''
          # Keep the final acceptance source readable after embedding the raw bootstrap string.
          new_block = new_block.replace("r''' + \"'''\" + r'''", "r'''").replace("''' + \"'''\" + r'''", "'''")
          f = f[:start] + new_block + f[end:]
          final_path.write_text(f)

          test_path = Path('tests/class-d-1000-diagnostic-sizing.test.js')
          t = test_path.read_text()
          old_assertions = '''  assert.match(provision, /build-essential pkg-config/);\n  assert.match(provision, /codeload\\.github\\.com\\/inn-media\\/truyn\\/tar\\.gz\\/\\$\\{GITHUB_SHA\\}/);\n  assert.match(provision, /npm install --omit=dev --no-audit --no-fund/);'''
          new_assertions = '''  assert.match(provision, /TRUYN_CLASS_D1000_RUNTIME_URL is required/);\n  assert.match(provision, /TRUYN_CLASS_D1000_RUNTIME_SHA256 is required/);\n  assert.match(provision, /install_stage=runtime-download/);\n  assert.match(provision, /urllib\\.request\\.urlretrieve/);\n  assert.match(provision, /install_stage=runtime-digest/);\n  assert.match(provision, /sha256sum -c/);\n  assert.match(provision, /install_stage=runtime-manifest/);\n  assert.match(provision, /sourceSha == \\$sha/);\n  assert.match(provision, /WorkingDirectory=\\/opt\\/truyqn\\/app/);\n  assert.match(provision, /ExecStart=\\/opt\\/truyqn\\/runtime\\/bin\\/node \\/opt\\/truyqn\\/app\\/network\\/testnet\\/node-service\\.js/);\n  assert.match(provision, /--service-endpoints Microsoft\\.Storage/);\n  assert.doesNotMatch(provision, /apt-get/);\n  assert.doesNotMatch(provision, /deb\\.nodesource\\.com/);\n  assert.doesNotMatch(provision, /codeload\\.github\\.com/);\n  assert.doesNotMatch(provision, /npm install/);'''
          if old_assertions not in t:
              raise SystemExit('diagnostic sizing legacy bootstrap assertions not found')
          t = t.replace(old_assertions, new_assertions, 1)
          test_path.write_text(t)
          PY

          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          bash -n scripts/class-d-1000-final-acceptance.sh
          node --test --test-name-pattern='provisioner makes remote install failures|strict final acceptance' tests/class-d-1000-diagnostic-sizing.test.js
          node --test tests/class-d-1000-bootstrap.test.js
          node --test tests/class-d-shell-harness.test.js
          git diff --check

          git rm .github/workflows/diag-d200-0144f0d3-main.yml
          git rm .github/workflows/diag-d200-bundle-promote.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/scale/class-d-azure-1000-provision.sh scripts/class-d-1000-final-acceptance.sh tests/class-d-1000-diagnostic-sizing.test.js
          git commit -s -m 'fix(d200): use canonical runtime bundle on VMs'
          git push origin HEAD:fix/d200-canonical-runtime-bundle

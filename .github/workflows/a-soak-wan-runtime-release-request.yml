name: A-SOAK Immutable Runtime Release Request (no cloud)
on:
  push:
    branches: [main]
    paths: ['.github/a-series/a-soak-wan-runtime-release-request.json']
permissions:
  contents: write
  checks: read
concurrency:
  group: truyn-a-soak-wan-runtime-request-exact-main
  cancel-in-progress: false
jobs:
  exact-source-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require one non-cloud user-approved runtime-only request
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          jq -e '.taskId=="truyn-a-series-20261008" and .request=="publish-exact-main-wan-runtime" and .cloudMutationAllowed==false and .soakAttemptOneDispatchAllowed==false' .github/a-series/a-soak-wan-runtime-release-request.json >/dev/null
          node scripts/check-dco.mjs "$(git rev-parse HEAD^)" "$GITHUB_SHA"
      - name: Wait for independent exact-main CI and CodeQL before dispatch
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          found=false
          for i in $(seq 1 90); do
            current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            [[ "$current" == "$GITHUB_SHA" ]] || { echo 'A_SOAK_RUNTIME_REQUEST=BLOCKED_MOVING_MAIN'; exit 70; }
            c="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            jq -e '.total_count<=100 and (.check_runs|type=="array")' <<< "$c" >/dev/null || { echo 'A_SOAK_RUNTIME_REQUEST=BLOCKED_PAGINATION'; exit 71; }
            found=true
            for name in test mandatory-security-safety network integration component regression 'Analyze (javascript-typescript)' 'Analyze (actions)'; do
              state="$(jq -r --arg n "$name" '[.check_runs[]|select(.name==$n)]|map(select(.status=="completed" and .conclusion=="success"))|length' <<< "$c")"
              if [[ "$state" -lt 1 ]]; then found=false; break; fi
            done
            [[ "$found" == true ]] && break
            sleep 20
          done
          [[ "$found" == true ]] || { echo 'A_SOAK_RUNTIME_REQUEST=BLOCKED_EXACT_MAIN_CI'; exit 72; }
          echo "A_SOAK_RUNTIME_REQUEST=EXACT_MAIN_ADMITTED source=$GITHUB_SHA cloud_mutations=0 soak_attempt1=UNUSED"
      - name: Install exact public runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and inspect immutable public WAN archive
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/truyn-a-soak-wan-runtime.tgz"
          TRUYN_TESTED_COMMIT="$GITHUB_SHA" scripts/build-class-d-1000-runtime-bundle.sh "$out"
          digest="$(awk '{print $1}' "$out.sha256")"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 76
          printf '%s  %s\n' "$digest" "$out" | sha256sum --check
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          tar -xzf "$out" -C "$tmp"
          jq -e --arg sha "$GITHUB_SHA" '.schema=="truyn.class-d1000.runtime-bundle.v1" and .sourceSha==$sha and .osCompatibility=="ubuntu-22.04-amd64"' "$tmp/manifest.json" >/dev/null
          test -f "$tmp/app/network/testnet/node-service.js"
          test -x "$tmp/runtime/bin/node"
          jq -e '.contents|index("node_modules")!=null' "$tmp/manifest.json" >/dev/null
          cp "$tmp/manifest.json" "$RUNNER_TEMP/a-soak-wan-runtime-manifest.json"
          cp "$out.sha256" "$RUNNER_TEMP/truyn-a-soak-wan-runtime.tgz.sha256"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "A_SOAK_WAN_RUNTIME_BUILD=PASS source=$GITHUB_SHA sha256:$digest"
      - name: Publish exactly one immutable archive after exact-main recheck
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          BUNDLE_FILE: '${{ steps.bundle.outputs.file }}'
          BUNDLE_SHA256: '${{ steps.bundle.outputs.digest }}'
        run: |
          set -Eeuo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'A_SOAK_RUNTIME=BLOCKED_MOVING_MAIN_AFTER_BUILD'; exit 77; }
          tag="a-soak-wan-runtime-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A_SOAK_RUNTIME=BLOCKED_DUPLICATE_RELEASE tag=$tag"; exit 78
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "A_SOAK_RUNTIME=BLOCKED_DUPLICATE_TAG tag=$tag"; exit 79
          fi
          gh release create "$tag" "$BUNDLE_FILE" \
            "$RUNNER_TEMP/truyn-a-soak-wan-runtime.tgz.sha256" \
            "$RUNNER_TEMP/a-soak-wan-runtime-manifest.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TRUYN A-SOAK WAN runtime $GITHUB_SHA" \
            --notes "Exact accepted public main SHA: $GITHUB_SHA. Runtime SHA256: $BUNDLE_SHA256. No A-SOAK Attempt 1 was launched."
          echo "A_SOAK_WAN_RUNTIME_RELEASE=PUBLISHED tag=$tag sha256=$BUNDLE_SHA256"


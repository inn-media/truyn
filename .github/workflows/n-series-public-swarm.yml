name: N-Series Public Swarm
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen public N candidate SHA
        required: true
        type: string
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: n-public-swarm-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false
jobs:
  blocks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        block: [N1,N2,N3,N4,N5,N6,N7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact frozen candidate
        run: test "$(git rev-parse HEAD)" = '${{ inputs.candidate_sha || github.sha }}'
      - name: Build candidate-bound qualification manifest
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          base="$(git rev-parse "$candidate^1")"
          node scripts/n-series-qualification-manifest.mjs qualification --base-sha "$base" --candidate-sha "$candidate" --output "$RUNNER_TEMP/n-qualification.json"
          jq -e --arg sha "$candidate" '.schema=="truyn.n-series.qualification-manifest.v1" and .candidateSha==$sha' "$RUNNER_TEMP/n-qualification.json" >/dev/null
      - name: Run candidate-bound N block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n-public-swarm
          node scripts/n-series-selective-block-runner.mjs --manifest "$RUNNER_TEMP/n-qualification.json" --blocks '${{ matrix.block }}' --json "n-public-swarm/${{ matrix.block }}.json"
          jq -e --arg sha "$(git rev-parse HEAD)" '.status=="GREEN" and .passed==true and .candidateSha==$sha' "n-public-swarm/${{ matrix.block }}.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n-public-${{ matrix.block }}-${{ github.run_id }}
          path: n-public-swarm/${{ matrix.block }}.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    if: always()
    needs: blocks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: n-public-N*-${{ github.run_id }}
          path: evidence
          merge-multiple: true
      - name: Require immutable 7/7 GREEN evidence
        shell: bash
        run: |
          set -euo pipefail
          count="$(find evidence -type f -name 'N*.json' | wc -l | tr -d ' ')"
          test "$count" = 7
          jq -s --arg sha '${{ inputs.candidate_sha || github.sha }}' --arg run '${{ github.run_id }}' '{schema:"truyn.n-series.public-swarm.v1",status:(if all(.[]; (.status=="GREEN" and .passed==true and .candidateSha==$sha)) then "GREEN" else "RED" end),candidateSha:$sha,runId:$run,requiredBlocks:7,greenBlocks:([.[]|select(.status=="GREEN" and .passed==true and .candidateSha==$sha)]|length),blocks:.}' evidence/N*.json > n-public-swarm-summary.json
          jq -e '.status=="GREEN" and .requiredBlocks==7 and .greenBlocks==7' n-public-swarm-summary.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: n-public-swarm-summary-${{ github.run_id }}
          path: n-public-swarm-summary.json
          if-no-files-found: error
          retention-days: 30

name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
permissions:
  contents: read
jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify DCO 1.1 sign-offs
        env: {DCO_BASE_SHA: '${{ github.event.pull_request.base.sha }}', DCO_HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: node scripts/check-dco.mjs "$DCO_BASE_SHA" "$DCO_HEAD_SHA"
  plan:
    runs-on: ubuntu-latest
    outputs:
      regression: '${{ steps.map.outputs.regression }}'
      component: '${{ steps.map.outputs.component }}'
      integration: '${{ steps.map.outputs.integration }}'
      network: '${{ steps.map.outputs.network }}'
      sdk: '${{ steps.map.outputs.sdk }}'
      full: '${{ steps.map.outputs.full }}'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: map
        shell: bash
        env: {PR_BASE: '${{ github.event.pull_request.base.sha }}', BEFORE: '${{ github.event.before }}'}
        run: |
          set -Eeuo pipefail
          base="$PR_BASE"; [[ -n "$base" ]] || base="$BEFORE"; [[ -n "$base" && ! "$base" =~ ^0+$ ]] || base="HEAD^"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          node scripts/affected-tests.mjs --github-output "${changed[@]}"
  mandatory:
    name: mandatory-security-safety
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:fast
      - run: npm run test:security
      - run: node scripts/check-d200-contract.mjs
      - run: node scripts/check-class-d-five-patches.mjs
      - run: node scripts/check-documentation-language.mjs --self-test
      - run: node scripts/check-documentation-language.mjs
      - run: node scripts/check-repository-hygiene.mjs
      - run: node scripts/check-open-private-boundary.mjs
      - run: git diff --check
  regression:
    needs: plan
    if: needs.plan.outputs.regression == 'true' || needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:regression
  component:
    needs: plan
    if: needs.plan.outputs.component == 'true' || needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:component
  integration:
    needs: plan
    if: needs.plan.outputs.integration == 'true' || needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:integration
  network:
    needs: plan
    if: needs.plan.outputs.network == 'true' || needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:network
      - run: node scripts/check-class-d-five-patches.mjs
      - run: bash scripts/class-d-200-preflight-qualification.sh
  sdk-release:
    needs: plan
    if: needs.plan.outputs.sdk == 'true' || needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.22.x'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: python -m pip install --disable-pip-version-check -e ./sdk/python
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lock native Go QUIC transitive dependencies for review
        working-directory: sdk/go
        run: |
          go mod tidy
          echo 'TRUYN_GO_MOD_LOCK_BEGIN'
          cat go.mod
          echo 'TRUYN_GO_MOD_LOCK_END'
          echo 'TRUYN_GO_SUM_LOCK_BEGIN'
          cat go.sum
          echo 'TRUYN_GO_SUM_LOCK_END'
      - run: go test ./...
        working-directory: sdk/go
      - run: mvn -q -f sdk/java/pom.xml test
      - run: dotnet build sdk/dotnet/Truyn.Sdk.csproj --configuration Release --nologo
      - name: Five-language executable SDK conformance
        run: node sdk/conformance/run-five-language-e2e.mjs
      - name: Verify SDK release scanner wiring
        run: node --test tests/sdk-release-ci-contract.test.js
      - name: Build and verify SDK release packages
        env:
          TRUYN_RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sdk/release/build-release.sh
      - name: Clean-room import packed TypeScript SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./sdk/typescript/package.json').version")"
          package="$GITHUB_WORKSPACE/sdk/release/dist/typescript/truyn-sdk-${version}.tgz"
          test -f "$package"
          cleanroom="$(mktemp -d)"
          cd "$cleanroom"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$package"
          node --input-type=module -e "import('@truyn/sdk').then((m) => { if (typeof m.TruynClient !== 'function') throw new Error('TruynClient export missing'); if (typeof m.TruynLocalNodeClient !== 'function') throw new Error('TruynLocalNodeClient export missing'); })"
      - name: Clean-room import Python wheel and sdist
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          wheels=("$GITHUB_WORKSPACE"/sdk/release/dist/python/*.whl)
          sdists=("$GITHUB_WORKSPACE"/sdk/release/dist/python/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          for package in "${wheels[0]}" "${sdists[0]}"; do
            cleanroom="$(mktemp -d)"
            python -m venv "$cleanroom/venv"
            "$cleanroom/venv/bin/python" -m pip install --disable-pip-version-check --quiet "$package"
            TRUYN_EXPECTED_PY_VERSION="$(node -p "require('./sdk/release/version.json').python")" "$cleanroom/venv/bin/python" - <<'PY'
          from importlib.metadata import version
          import truyn
          import os
          expected = os.environ["TRUYN_EXPECTED_PY_VERSION"]
          assert version("truyn-sdk") == expected
          assert callable(truyn.TruynClient)
          assert callable(truyn.TruynLocalNodeClient)
          PY
          done
      - name: Clean-room consume immutable Go module
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanroom="$(mktemp -d)"
          cd "$cleanroom"
          go mod init example.com/truyn-cleanroom
          go get github.com/inn-media/truyn/sdk/go@v0.1.0-alpha.1
          cat > main.go <<'GO'
          package main
          import (
            "fmt"
            truyn "github.com/inn-media/truyn/sdk/go"
          )
          func main() {
            identity, err := truyn.CreateLocalIdentity()
            if err != nil { panic(err) }
            if identity == nil { panic("nil identity") }
            fmt.Println("truyn-go-cleanroom-ok")
          }
          GO
          go mod tidy
          go build ./...
          output="$(go run .)"
          test "$output" = "truyn-go-cleanroom-ok"
          go list -m -f '{{.Path}}@{{.Version}}' github.com/inn-media/truyn/sdk/go | grep -Fx 'github.com/inn-media/truyn/sdk/go@v0.1.0-alpha.1'
      - name: Build reproducible managed-client platform artifacts
        env:
          TRUYN_CLIENT_VERSION: 0.1.0-alpha.4
          TRUYN_MANAGED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/package-managed-clients.mjs
      - name: Verify managed-client four-platform manifest and reproducibility
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUYN_CLIENT_VERSION: 0.1.0-alpha.4
          TRUYN_MANAGED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const m=JSON.parse(await readFile('dist/managed-clients/manifest.json','utf8'));
          const expected=['android','linux','macos','windows'];
          const got=m.artifacts.map((x)=>x.platform).sort();
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error('platform set mismatch: '+got);
          if(m.sourceSha!==process.env.EXPECTED_SHA) throw new Error('source SHA mismatch');
          if(new Set(m.artifacts.map((x)=>x.sha256)).size!==4) throw new Error('artifact digests are not distinct');
          NODE
          cp dist/managed-clients/manifest.json /tmp/truyn-managed-client-manifest.json
          node scripts/package-managed-clients.mjs
          cmp /tmp/truyn-managed-client-manifest.json dist/managed-clients/manifest.json
          for f in dist/managed-clients/*.tgz; do
            expected="$(cut -d' ' -f1 "$f.sha256")"
            actual="$(sha256sum "$f" | cut -d' ' -f1)"
            test "$expected" = "$actual"
          done
      - name: Upload managed-client release candidate
        uses: actions/upload-artifact@v4
        with:
          name: truyn-managed-clients-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/managed-clients/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload SDK release bundle
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sdk-release-${{ github.run_id }}
          path: sdk/release/dist
          if-no-files-found: error
          retention-days: 30
  full-qualification:
    needs: [plan, mandatory]
    if: github.event_name == 'push' || needs.plan.outputs.full == 'true' || startsWith(github.head_ref, 'automation/d200-repository-sanitation-') || startsWith(github.head_ref, 'automation/class-d-five-patches-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.22.x'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: python -m pip install --disable-pip-version-check -e ./sdk/python
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lock native Go QUIC transitive dependencies for review
        working-directory: sdk/go
        run: |
          go mod tidy
          echo 'TRUYN_GO_MOD_LOCK_BEGIN'
          cat go.mod
          echo 'TRUYN_GO_MOD_LOCK_END'
          echo 'TRUYN_GO_SUM_LOCK_BEGIN'
          cat go.sum
          echo 'TRUYN_GO_SUM_LOCK_END'
      - run: go test ./...
        working-directory: sdk/go
      - run: mvn -q -f sdk/java/pom.xml test
      - run: dotnet build sdk/dotnet/Truyn.Sdk.csproj --configuration Release --nologo
      - run: node sdk/conformance/run-five-language-e2e.mjs
      - name: Build and verify SDK release packages
        env:
          TRUYN_RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sdk/release/build-release.sh
      - name: Run npm run test:full
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run test:full 2>&1 | tee "$RUNNER_TEMP/truyn-full-qualification.log"
      - name: Preserve failed full-qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-full-qualification-failure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/truyn-full-qualification.log
          if-no-files-found: ignore
          retention-days: 14
      - run: node scripts/check-class-d-five-patches.mjs
      - run: bash scripts/class-d-200-preflight-qualification.sh
      - run: git diff --check
      - name: Preserve exact tested public source
        if: startsWith(github.head_ref, 'g5/') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'g5'))
        shell: bash
        env:
          TESTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'inn-media/truyn'
          [[ "$TESTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TESTED_SOURCE_SHA"
          out="$RUNNER_TEMP/truyn-g5-source"
          mkdir -p "$out"
          git archive --format=tar --prefix=truyn-source/ "$TESTED_SOURCE_SHA" | gzip -n > "$out/source.tar.gz"
          digest="$(sha256sum "$out/source.tar.gz" | cut -d' ' -f1)"
          jq -n --arg sha "$TESTED_SOURCE_SHA" --arg tree "$(git rev-parse HEAD^{tree})" --arg run "$GITHUB_RUN_ID" --arg digest "$digest" '{schema:"truyn.g5.tested-source/v1",sourceSha:$sha,treeSha:$tree,runId:$run,sha256:$digest,scope:"tracked-public-git-source-only",g5Admission:false}' > "$out/manifest.json"
      - name: Upload exact G5 source snapshot
        if: startsWith(github.head_ref, 'g5/') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'g5'))
        uses: actions/upload-artifact@v4
        with:
          name: truyn-g5-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/truyn-g5-source/
          if-no-files-found: error
          retention-days: 7
  test:
    name: test
    if: always()
    needs: [mandatory, regression, component, integration, network, sdk-release, full-qualification]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          set -Eeuo pipefail
          jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$RESULTS" >/dev/null
          jq -e '.mandatory.result == "success"' <<<"$RESULTS" >/dev/null

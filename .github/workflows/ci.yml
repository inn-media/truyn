name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DCO 1.1 sign-offs
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ -z "$DCO_BASE_SHA" || "$DCO_BASE_SHA" =~ ^0+$ ]]; then
            printf 'DCO base SHA is unavailable for pull_request\n' >&2
            exit 1
          fi

          if [[ -z "$DCO_HEAD_SHA" || "$DCO_HEAD_SHA" =~ ^0+$ ]]; then
            printf 'DCO head SHA is unavailable for pull_request\n' >&2
            exit 1
          fi

          node scripts/check-dco.mjs "$DCO_BASE_SHA" "$DCO_HEAD_SHA"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e ./sdk/python
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
      - run: git diff --check

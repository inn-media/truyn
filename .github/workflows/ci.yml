name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'sdk/go/v0.1.0-alpha.1'
  pull_request: {}

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DCO 1.1 sign-offs
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ -z "$DCO_BASE_SHA" || "$DCO_BASE_SHA" =~ ^0+$ ]]; then
            printf 'DCO base SHA is unavailable for pull_request\n' >&2
            exit 1
          fi
          if [[ -z "$DCO_HEAD_SHA" || "$DCO_HEAD_SHA" =~ ^0+$ ]]; then
            printf 'DCO head SHA is unavailable for pull_request\n' >&2
            exit 1
          fi
          node scripts/check-dco.mjs "$DCO_BASE_SHA" "$DCO_HEAD_SHA"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag is exact current main
        if: github.event_name == 'push' && github.ref == 'refs/tags/sdk/go/v0.1.0-alpha.1'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install --disable-pip-version-check -e ./sdk/python
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile Go SDK
        working-directory: sdk/go
        run: go test ./...
      - name: Compile Java SDK
        run: mvn -q -f sdk/java/pom.xml test
      - name: Compile .NET SDK
        run: dotnet build sdk/dotnet/Truyn.Sdk.csproj --configuration Release --nologo
      - name: Five-language executable SDK conformance
        run: node sdk/conformance/run-five-language-e2e.mjs
      - name: Build and verify SDK release packages
        env:
          TRUYN_RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sdk/release/build-release.sh
      - name: Upload SDK release bundle
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sdk-release-${{ github.run_id }}
          path: sdk/release/dist
          if-no-files-found: error
          retention-days: 30
      - run: npm test
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
      - run: git diff --check

  publish-npm:
    name: publish npm
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/tags/sdk/go/v0.1.0-alpha.1' && github.repository == 'inn-media/truyn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: truyn-sdk-release-${{ github.run_id }}
          path: sdk/release/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Publish @truyn/sdk
        shell: bash
        run: |
          package="$(find sdk/release/dist/typescript -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          npm publish "$package" --access public

  publish-pypi:
    name: publish PyPI
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/tags/sdk/go/v0.1.0-alpha.1' && github.repository == 'inn-media/truyn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: truyn-sdk-release-${{ github.run_id }}
          path: sdk/release/dist
      - name: Publish truyn-sdk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/release/dist/python

  publish-nuget:
    name: publish NuGet
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/tags/sdk/go/v0.1.0-alpha.1' && github.repository == 'inn-media/truyn'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: truyn-sdk-release-${{ github.run_id }}
          path: sdk/release/dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exchange GitHub OIDC for NuGet API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish Truyn.Sdk
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          package="$(find sdk/release/dist/dotnet -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
          test -n "$package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  publish-maven:
    name: publish Maven Central
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/tags/sdk/go/v0.1.0-alpha.1' && github.repository == 'inn-media/truyn'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: truyn-sdk-release-${{ github.run_id }}
          path: sdk/release/dist
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Verify reproducible Maven binary
        shell: bash
        run: |
          mvn -q -f sdk/java/pom.xml package
          expected="$(node -e "const m=require('./sdk/release/dist/manifest.json'); console.log(m.artifacts.find(a=>a.path==='java/truyn-sdk-0.1.0-alpha.1.jar').sha256)")"
          actual="$(sha256sum sdk/java/target/truyn-sdk-0.1.0-alpha.1.jar | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Prepare Central credentials and signing key
        shell: bash
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          test -n "$MAVEN_GPG_PRIVATE_KEY"
          test -n "$MAVEN_GPG_PASSPHRASE"
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish org.truyn:truyn-sdk
        run: mvn -q -f sdk/java/pom.xml -Pcentral-release deploy

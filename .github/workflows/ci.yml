name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DCO 1.1 sign-offs
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ -z "$DCO_BASE_SHA" || "$DCO_BASE_SHA" =~ ^0+$ ]]; then
            printf 'DCO base SHA is unavailable for pull_request\n' >&2
            exit 1
          fi

          if [[ -z "$DCO_HEAD_SHA" || "$DCO_HEAD_SHA" =~ ^0+$ ]]; then
            printf 'DCO head SHA is unavailable for pull_request\n' >&2
            exit 1
          fi

          node scripts/check-dco.mjs "$DCO_BASE_SHA" "$DCO_HEAD_SHA"

  diagnostic:
    name: DX-3 diagnostic ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e ./sdk/python
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run diagnostic shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(printf '%s\n' tests/*.test.js | sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 8 == SHARD )); then
              selected+=("${files[$index]}")
            fi
          done
          printf 'Running shard %s with %s test files\n' "$SHARD" "${#selected[@]}"
          node --test "${selected[@]}"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install --disable-pip-version-check -e ./sdk/python
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile Go SDK
        working-directory: sdk/go
        run: go test ./...
      - name: Compile Java SDK
        run: mvn -q -f sdk/java/pom.xml test
      - name: Compile .NET SDK
        run: dotnet build sdk/dotnet/Truyn.Sdk.csproj --configuration Release --nologo
      - run: npm test
        env:
          TRUYN_LOCAL_DEVELOPMENT: '1'
      - run: git diff --check

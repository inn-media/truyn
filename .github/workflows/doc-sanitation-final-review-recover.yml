name: Recover final documentation review patch
on:
  push:
    branches: [docs/sanitation-review-repair-20261012]
    paths: [.github/workflows/doc-sanitation-final-review-recover.yml]
permissions:
  contents: write
concurrency:
  group: doc-sanitation-final-review-20261012
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'inn-media/truyn' && github.ref == 'refs/heads/docs/sanitation-review-repair-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply the exact reviewed non-runtime patch and repair heading whitespace
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = f73a0a37dd44370a88022b8f456e792429179b50
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          delta=subprocess.check_output(['git','diff','--name-only','53b49b8113196b1538af3e6f335c4ebf6ada456d','HEAD'],text=True).splitlines()
          assert set(delta)=={'.github/workflows/doc-sanitation-final-review-apply.yml','.github/workflows/doc-sanitation-final-review-recover.yml'},delta
          workflow=subprocess.check_output(['git','show','f73a0a37dd44370a88022b8f456e792429179b50:.github/workflows/doc-sanitation-final-review-apply.yml'],text=True)
          segment=workflow.split('      - name: Reconcile exact reviewed documentation and read-only guards\n',1)[1].split('      - name: Execute documentation and unchanged reference-contract regressions\n',1)[0]
          run=segment.split('        run: |\n',1)[1]
          lines=run.splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          body='\n'.join(line[10:] for line in lines)
          patch=body.split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          exec(compile(patch,'reviewed-final-documentation-patch','exec'),{})
          path=Path('docs/getting-started/DX3_SDK.md')
          contents=path.read_text()
          lines=contents.splitlines(keepends=True)
          count=0
          for i,line in enumerate(lines):
              if line.startswith('**Historical Developer Release source freeze (not current Wire Freeze package source):**'):
                  lines[i]=line.rstrip()+'\n'; count+=1
          assert count==1
          path.write_text(''.join(lines))
          PY
      - name: Repeat every documentation and unchanged reference-contract check
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/check-documentation-consistency.mjs
          node --test tests/documentation-release-regression.test.js tests/documentation-evidence-paths.test.js tests/documentation-descriptor-contract.test.js
          node scripts/check-documentation-consistency.mjs
          git diff --check
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/doc-sanitation-final-paths.json'))
          assert all(p.endswith('.md') or p in ['scripts/check-documentation-consistency.mjs','tests/documentation-release-regression.test.js','tests/documentation-descriptor-contract.test.js'] for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(paths)
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','runtime','core','network','sdk/conformance/v1','spec','sdk/release/evidence','docs/benchmarks'],text=True).strip()
          PY
      - name: Commit bounded changes to the existing isolated branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin refs/heads/docs/sanitation-review-repair-20261012 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git commit -s -m 'docs: reconcile optional endpoints, onboarding and frozen release evidence'
          git push origin HEAD:refs/heads/docs/sanitation-review-repair-20261012
          git rev-parse HEAD

name: P13 Production Readiness (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'operations/p13-production-cutover-plan.json'
      - 'scripts/p13-production-readiness.mjs'
      - 'docs/operations/P13_PRODUCTION_CUTOVER_READINESS.md'
      - '.github/workflows/p13-production-readiness.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: p13-production-readiness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      AZURE_CLIENT_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_VALUE: ${{ vars[format('AZURE_{0}', 'TENANT_ID')] || secrets[format('AZURE_{0}', 'TENANT_ID')] }}
      AZURE_SUBSCRIPTION_VALUE: ${{ vars[format('AZURE_{0}', 'SUBSCRIPTION_ID')] || secrets[format('AZURE_{0}', 'SUBSCRIPTION_ID')] }}
      RESOURCE_GROUP: ${{ vars.TRUYN_AZURE_RESOURCE_GROUP || 'truyn' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Readiness baseline, never admissible
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/p13-production-readiness.mjs --output p13-readiness.json
          jq -e '.status=="BLOCKED" and .cutoverAuthorized==false and .productionMutationsPerformed==false' p13-readiness.json >/dev/null
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_VALUE }}
      - name: Azure read-only metadata observation
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '::add-mask::%s\n' "$RESOURCE_GROUP"
          az group show --name "$RESOURCE_GROUP" --only-show-errors --output none
          accounts="$(az cosmosdb list --resource-group "$RESOURCE_GROUP" --only-show-errors --output json)"
          applications="$(az resource list --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.App/containerApps --only-show-errors --output json)"
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --argjson cosmosCount "$(jq 'length' <<<"$accounts")" \
            --argjson continuousBackup "$(jq '[.[] | select((.backupPolicy.type // "")=="Continuous")]|length' <<<"$accounts")" \
            --argjson privateCosmos "$(jq '[.[] | select((.publicNetworkAccess // ""|ascii_downcase)=="disabled" and (.disableLocalAuth==true))]|length' <<<"$accounts")" \
            --argjson containerApps "$(jq 'length' <<<"$applications")" \
            '{schema:"truyn.p13.azure-readonly-metadata/v1",sourceSha:$sourceSha,mode:"READ_ONLY",status:"OBSERVED_NOT_ADMITTED",cosmosCount:$cosmosCount,continuousBackupCount:$continuousBackup,privateIdentityCosmosCount:$privateCosmos,containerAppsCount:$containerApps,sourceDataRead:false,sourceSnapshotVerified:false,isolatedRestoreVerified:false,liveCutoverPermitted:false,productionMutationsPerformed:false}' > p13-azure-readonly.json
      - name: Classify prior DR failure and trace probe deployment metadata (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          # ARM failed operations are inspected only for error CODE, never status
          # messages, deployment parameters, resource names, tenants or secrets.
          dr_list_observed=false
          dr_operations_observed=false
          last_dr_state=UNKNOWN
          dr_error_codes='[]'
          if deployments="$(az deployment group list --resource-group "$RESOURCE_GROUP" --only-show-errors \
             --query "[].{name:name,state:properties.provisioningState,time:properties.timestamp}" -o json 2>/dev/null)"; then
            dr_list_observed=true
            target="$(jq -r '[.[] | select((.name // "") | startswith("production-dr-01fb6431-"))] | sort_by(.time // "") | last | .name // empty' <<<"$deployments")"
            if [[ -n "$target" ]]; then
              last_dr_state="$(jq -r --arg n "$target" '[.[] | select(.name==$n)] | last | .state // "UNKNOWN"' <<<"$deployments")"
              printf '::add-mask::%s\n' "$target"
              if operations="$(az deployment operation group list --resource-group "$RESOURCE_GROUP" --name "$target" --only-show-errors -o json 2>/dev/null)"; then
                dr_operations_observed=true
                dr_error_codes="$(jq -c '
                  [.[] | select(.properties.provisioningState=="Failed")
                    | (.properties.statusMessage // {})
                    | .. | objects | .code? | select(type=="string")
                    | select(test("^[A-Za-z][A-Za-z0-9_]{0,63}$"))] | unique
                ' <<<"$operations")"
              fi
            fi
          fi
          # Aggregate only container/revision HEALTH METADATA; do not read
          # ContainerApp console logs or any data-plane/tenant state.
          trace_apps_observed=false
          trace_container_count=0
          acceptance_probe_count=0
          trace_revision_running_count=0
          if apps="$(az containerapp list --resource-group "$RESOURCE_GROUP" --only-show-errors \
              --query "[].{containers:properties.template.containers[].name,runningState:properties.latestRevisionRunningState}" -o json 2>/dev/null)"; then
            trace_apps_observed=true
            trace_container_count="$(jq '[.[] | select((.containers // []) | map(ascii_downcase) | any(. == "tempo"))] | length' <<<"$apps")"
            acceptance_probe_count="$(jq '[.[] | select((.containers // []) | map(ascii_downcase) | any(. == "acceptance-probe"))] | length' <<<"$apps")"
            trace_revision_running_count="$(jq '[.[] | select((.containers // []) | map(ascii_downcase) | any(. == "tempo")) | select((.runningState // "") | ascii_downcase == "running")] | length' <<<"$apps")"
          fi
          jq -n --arg sourceSha "$GITHUB_SHA" --arg drState "$last_dr_state" \
            --argjson drListObserved "$dr_list_observed" \
            --argjson drOperationsObserved "$dr_operations_observed" \
            --argjson drErrorCodes "$dr_error_codes" \
            --argjson traceAppsObserved "$trace_apps_observed" \
            --argjson tempoApps "$trace_container_count" \
            --argjson acceptanceProbes "$acceptance_probe_count" \
            --argjson runningTraceRevisions "$trace_revision_running_count" \
            '{schema:"truyn.p13.dr-trace-readonly-classification/v1",sourceSha:$sourceSha,
              status:"FORENSIC_METADATA_ONLY",historicalFailedSourcePrefix:"01fb6431",
              dr:{listObserved:$drListObserved,operationsObserved:$drOperationsObserved,provisioningState:$drState,errorCodes:$drErrorCodes},
              trace:{appsObserved:$traceAppsObserved,tempoApps:$tempoApps,acceptanceProbeContainers:$acceptanceProbes,runningTraceRevisions:$runningTraceRevisions,retentionReadbackVerified:false},
              sourceDataRead:false,consoleLogsRead:false,liveCutoverPermitted:false,productionMutationsPerformed:false}' > p13-dr-trace-readonly.json
      - name: Read-only DR and Tempo failed-run classification
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '::add-mask::%s\n' "$RESOURCE_GROUP"
          # Collect only whitelisted reason codes. Never print deployment payloads,
          # resource IDs, endpoints, log bodies, account names, or tenant values.
          d="$(az deployment group list --resource-group "$RESOURCE_GROUP" --only-show-errors -o json 2>/dev/null || echo '[]')"
          [[ "$(jq -r 'type' <<<"$d")" == array ]]
          known='^(InvalidTemplate|AuthorizationFailed|LinkedAuthorizationFailed|ResourceNotFound|Conflict|DeploymentFailed|BadRequest|QuotaExceeded|RequestDisallowedByPolicy|RegionNotAvailable|ServiceUnavailable|InvalidResourceReference|MissingSubscriptionRegistration|OperationNotAllowed|ResourceQuotaExceeded)        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-readiness-${{ github.run_id }}
          path: |
            p13-readiness.json
            p13-azure-readonly.json
            p13-failure-diagnostic.json
            p13-dr-trace-readonly.json
          if-no-files-found: error
          retention-days: 30

          observed=0
          statuses='[]'
          while IFS= read -r deployment; do
            [[ -n "$deployment" ]] || continue
            # Only the known failing source run is examined; names stay private.
            operation="$(az deployment operation group list -g "$RESOURCE_GROUP" -n "$deployment" --only-show-errors -o json 2>/dev/null || echo '[]')"
            if [[ "$(jq -r 'type' <<<"$operation")" != array ]]; then
              class='OPERATIONS_READ_DENIED'
            else
              rawcode="$(jq -r '[.[] | (.properties.statusMessage.error.code // .properties.statusMessage.code // .statusMessage.error.code // empty)] | map(select(type=="string")) | first // empty' <<<"$operation")"
              if [[ "$rawcode" =~ $known ]]; then class="$rawcode"; else class="UNKNOWN_OR_NO_OPERATION_CODE"; fi
            fi
            statuses="$(jq -cn --argjson a "$statuses" --arg code "$class" '$a + [$code]')"
            observed=$((observed+1))
          done < <(jq -r '[.[] | select((.name//"") | startswith("production-dr-01fb6431-"))] | sort_by(.properties.timestamp // "") | reverse | .[:4][].name' <<<"$d")
          app_list="$(az resource list --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.App/containerApps --only-show-errors -o json)"
          trace_count="$(jq '[.[] | select((.name//"") | startswith("truyn-traces-"))] | length' <<<"$app_list")"
          trace_class='NOT_UNIQUELY_IDENTIFIED'
          if [[ "$trace_count" -eq 1 ]]; then
            trace_app="$(jq -r '.[] | select((.name//"") | startswith("truyn-traces-")) | .name' <<<"$app_list")"
            printf '::add-mask::%s\n' "$trace_app"
            if probe="$(az containerapp logs show --resource-group "$RESOURCE_GROUP" --name "$trace_app" --container acceptance-probe --type console --tail 200 --follow false --format text --only-show-errors 2>&1)"; then
              if grep -Fq 'TRUYN_TRACE_RETENTION_PASS normal_days=30 incident_days=90 normal_readback=1 incident_readback=1' <<<"$probe" &&
                 grep -Fq 'TRUYN_TRACE_CANARY_PASS otlp_http=accepted trace_readback=observed storage=azure-blob' <<<"$probe"; then
                trace_class='CANARY_AND_RETENTION_READBACK_PRESENT'
              else
                trace_class='LOGSTREAM_READABLE_MARKERS_MISSING'
              fi
            elif grep -Eiq 'AuthorizationFailed|Forbidden|Unauthorized|not authorized|permission denied' <<<"$probe"; then
              trace_class='LOGSTREAM_RBAC_DENIED'
            elif grep -Eiq 'no running replicas|No active replicas|not running' <<<"$probe"; then
              trace_class='NO_RUNNING_PROBE_REPLICA'
            elif grep -Eiq 'WebSocket|websocket|connection|timed out|timeout' <<<"$probe"; then
              trace_class='LOGSTREAM_TRANSPORT_UNREACHABLE'
            else
              trace_class='LOGSTREAM_UNCLASSIFIED_READ_FAILURE'
            fi
          fi
          jq -n --arg sourceSha "$GITHUB_SHA" \
            --argjson drDeploymentCount "$observed" \
            --argjson drCodes "$statuses" \
            --argjson tempoCandidateCount "$trace_count" \
            --arg tempoReadbackClass "$trace_class" \
            '{schema:"truyn.p13.failure-diagnostic/v1",sourceSha:$sourceSha,readOnly:true,admission:false,
             drDeploymentCount:$drDeploymentCount,drReasonCodes:$drCodes,tempoCandidateCount:$tempoCandidateCount,
             tempoReadbackClass:$tempoReadbackClass,liveCutoverPermitted:false,productionMutationsPerformed:false,
             secretValuesRead:false,rawDeploymentErrorsExported:false,rawLogBodiesExported:false}' > p13-failure-diagnostic.json
          echo "P13_READONLY_DR_TEMPO_FORENSICS=COMPLETE sanitized=1 cutover=0"
      - name: Upload sanitized non-admitting audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-readiness-${{ github.run_id }}
          path: |
            p13-readiness.json
            p13-azure-readonly.json
            p13-dr-trace-readonly.json
          if-no-files-found: error
          retention-days: 30

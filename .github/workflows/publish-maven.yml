name: Publish Java SDK to Maven Central

# Publishes the EXACT CI-built org.truyn:truyn-sdk jars (sdk/release/build-release.sh output of the
# successful exact-main CI run) to Maven Central through the Central Portal Publisher API.
# Contract: sdk/release/PUBLISHING.md § "Maven Central".
#
# Maven Central has no OIDC trusted publishing. The Central Portal user token and the OpenPGP
# signing key therefore live ONLY as secrets of the protected `sdk-release` environment
# (required reviewers, main-only deployment branch/tag policy). They are never exposed to
# pull_request events, never written to disk except the GNUPGHOME of this job, and the token is
# rotated after each release.

on:
  push:
    tags:
      - 'sdk/maven/v*'
    branches: [main]
    paths: ['.github/wire-freeze/recovery-request.json', '.github/wire-freeze/registry-verification-request.json', '.github/wire-freeze/maven-key-armor-repair-request.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'inn-media/truyn'
    runs-on: ubuntu-latest
    environment: sdk-release
    timeout-minutes: 150
    env:
      TRUYN_RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && 'sdk/maven/v0.1.0-alpha.2' || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MAVEN_GROUP_PATH: org/truyn
      MAVEN_ARTIFACT: truyn-sdk
      CENTRAL_API: https://central.sonatype.com/api/v1/publisher
      CENTRAL_REPO: https://repo1.maven.org/maven2
      RELEASE_ROOT: /tmp/truyn-maven-release
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable tag, exact current main, CI and CodeQL gates
        id: gates
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            bash sdk/release/resolve-frozen-recovery.sh sdk/maven/v maven
            git checkout --detach 57971b134a41c3e3ea4b42f68e86a7d117036006
            test "$(git rev-parse HEAD)" = '57971b134a41c3e3ea4b42f68e86a7d117036006'
          else
            bash sdk/release/resolve-release-gates.sh sdk/maven/v maven
          fi

      - name: Set up Java (clean-room verification only; nothing is rebuilt)
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}

      - name: Download and verify exact CI release artifact
        id: artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.gates.outputs.source_sha }}
          VERSION: ${{ steps.gates.outputs.version }}
          CI_RUN_ID: ${{ steps.gates.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_ROOT"; mkdir -p "$RELEASE_ROOT/ci" "$RELEASE_ROOT/registry"
          gh run download "$CI_RUN_ID" --name "truyn-sdk-release-$CI_RUN_ID" --dir "$RELEASE_ROOT/ci"
          node sdk/release/verify-release.mjs "$RELEASE_ROOT/ci"
          jq -e --arg s "$SOURCE_SHA" --arg v "$VERSION" '.sourceSha == $s and .release == $v' "$RELEASE_ROOT/ci/manifest.json" >/dev/null
          jar="$RELEASE_ROOT/ci/java/$MAVEN_ARTIFACT-$VERSION.jar"
          for f in "$jar" "${jar%.jar}-sources.jar" "${jar%.jar}-javadoc.jar" "$RELEASE_ROOT/ci/java/$MAVEN_ARTIFACT-$VERSION.pom"; do test -s "$f"; done
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$jar" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Detect immutable registry state
        id: registry
        shell: bash
        env:
          VERSION: ${{ steps.gates.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
        run: |
          set -euo pipefail
          url="$CENTRAL_REPO/$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT/$VERSION/$MAVEN_ARTIFACT-$VERSION.jar"
          code="$(curl -sS -o "$RELEASE_ROOT/registry/existing.jar" -w '%{http_code}' "$url")"
          case "$code" in
            200) cmp "$JAR" "$RELEASE_ROOT/registry/existing.jar"; echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected Maven Central response $code for $url" >&2; exit 1 ;;
          esac

      - name: Import and pin OpenPGP signing key
        id: gpg
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          EXPECTED_FPR: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_GPG_PRIVATE_KEY"
          export GNUPGHOME="$RELEASE_ROOT/gnupg"; mkdir -p -m 700 "$GNUPGHOME"
          # Normalize historical armored secret as successfully done for Maven alpha.1.
          # Preserve the original signing key; no new key, no lowered verification.
          export KEYFILE="$RELEASE_ROOT/registry/release-signing-key.asc"
          python3 - <<'PY'
          import os
          s = os.environ['MAVEN_GPG_PRIVATE_KEY'].strip()
          s = s.replace('\\r\\n', '\n').replace('\\n', '\n').replace('\r\n', '\n')
          begin = '-----BEGIN PGP PRIVATE KEY BLOCK-----'
          end = '-----END PGP PRIVATE KEY BLOCK-----'
          bi, ei = s.find(begin), s.rfind(end)
          if bi < 0 or ei < bi: raise SystemExit('Expected OpenPGP secret armor markers missing')
          lines = s[bi:ei + len(end)].splitlines()
          interior = [line.rstrip('\r') for line in lines[1:-1]]
          while interior and not interior[0].strip(): interior.pop(0)
          with open(os.environ['KEYFILE'], 'w', encoding='ascii', newline='\n') as f:
              f.write('\n'.join([begin, ''] + interior + [end, '']))
          PY
          gpg --batch --quiet --import "$KEYFILE"
          rm -f "$KEYFILE"
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/{print toupper($10);exit}')"
          # Independently accepted alpha.1 signature fingerprint: never trust an arbitrary imported key.
          test "$fpr" = "CA6D3B7C71B66647C22219D2AF546A33EA38ADD8"
          if [[ -n "$EXPECTED_FPR" ]]; then
            configured="$(printf %s "$EXPECTED_FPR" | tr -d "[:space:]" | tr "[:lower:]" "[:upper:]")"
            test "$fpr" = "$configured"
          fi
          previous="$CENTRAL_REPO/$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT/0.1.0-alpha.1/$MAVEN_ARTIFACT-0.1.0-alpha.1.jar"
          curl -fsS --retry 3 -o "$RELEASE_ROOT/registry/previous.jar" "$previous"
          curl -fsS --retry 3 -o "$RELEASE_ROOT/registry/previous.jar.asc" "$previous.asc"
          gpg --batch --verify "$RELEASE_ROOT/registry/previous.jar.asc" "$RELEASE_ROOT/registry/previous.jar"
          # Historical Maven success (run 35902114613): openpgp.org HTTP 404, Ubuntu keyserver HTTP 200.
          # Check this exact signer is publicly discoverable, not a specific keyserver.
          keyserver_file="$RELEASE_ROOT/registry/release-public-key.asc"
          code="$(curl --connect-timeout 5 --max-time 25 -LsS -o "$keyserver_file" -w '%{http_code}' "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fpr")"
          test "$code" = 200
          grep -q '^-----BEGIN PGP PUBLIC KEY BLOCK-----' "$keyserver_file"
          echo "MAVEN_SIGNER_HISTORICAL_ALPHA1_AND_PUBLIC_KEY=PASS"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - name: Build signed Central bundle from exact CI bytes
        id: bundle
        shell: bash
        env:
          VERSION: ${{ steps.gates.outputs.version }}
          MAVEN_GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          bundle="$RELEASE_ROOT/central-bundle-$VERSION.zip"
          bash sdk/release/build-maven-bundle.sh "$RELEASE_ROOT/ci" "$VERSION" "$bundle"
          unzip -p "$bundle" "$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT/$VERSION/$MAVEN_ARTIFACT-$VERSION.jar" | cmp - "$RELEASE_ROOT/ci/java/$MAVEN_ARTIFACT-$VERSION.jar"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload bundle to Central Portal and wait for PUBLISHED
        if: steps.registry.outputs.exists == 'false'
        id: central
        shell: bash
        env:
          VERSION: ${{ steps.gates.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CENTRAL_USERNAME"; test -n "$CENTRAL_PASSWORD"
          bearer="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          echo "::add-mask::$bearer"
          deployment="$(curl -sS --fail-with-body -X POST \
            "$CENTRAL_API/upload?publishingType=AUTOMATIC&name=$MAVEN_ARTIFACT-$VERSION" \
            -H "Authorization: Bearer $bearer" \
            -F "bundle=@$BUNDLE;type=application/octet-stream")"
          [[ "$deployment" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Unexpected upload response: $deployment" >&2; exit 1; }
          echo "deployment_id=$deployment" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 270); do
            status="$(curl -sS --fail-with-body -X POST "$CENTRAL_API/status?id=$deployment" -H "Authorization: Bearer $bearer")"
            state="$(jq -r '.deploymentState' <<<"$status")"
            echo "deployment $deployment: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq '.errors' <<<"$status" >&2; exit 1 ;;
              VALIDATED) echo "VALIDATED with publishingType=AUTOMATIC should not stall" >&2 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for PUBLISHED" >&2; exit 1

      - name: Verify public bytes, signature and clean-room resolution
        shell: bash
        env:
          VERSION: ${{ steps.gates.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          base="$CENTRAL_REPO/$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT/$VERSION/$MAVEN_ARTIFACT-$VERSION"
          visible=false
          for attempt in $(seq 1 120); do
            if curl -sSf -o "$RELEASE_ROOT/registry/public.jar" "$base.jar"; then visible=true; break; fi
            sleep 30
          done
          test "$visible" = true
          cmp "$JAR" "$RELEASE_ROOT/registry/public.jar"
          test "$(sha256sum "$RELEASE_ROOT/registry/public.jar" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(curl -sSf "$base.jar.sha1")" = "$(sha1sum "$JAR" | awk '{print $1}')"
          curl -sSf -o "$RELEASE_ROOT/registry/public.jar.asc" "$base.jar.asc"
          gpg --batch --verify "$RELEASE_ROOT/registry/public.jar.asc" "$RELEASE_ROOT/registry/public.jar"
          for suffix in -sources.jar -javadoc.jar .pom; do curl -sSf -o /dev/null "$base$suffix"; done

          clean="$RELEASE_ROOT/cleanroom"; rm -rf "$clean"; mkdir -p "$clean/src"
          mvn -q -B -Dmaven.repo.local="$clean/m2" dependency:get -Dartifact="org.truyn:$MAVEN_ARTIFACT:$VERSION" -Dtransitive=false
          cat > "$clean/src/Probe.java" <<'JAVA'
          public class Probe { public static void main(String[] a) throws Exception { Class.forName("org.truyn.sdk.TruynClient"); Class.forName("org.truyn.sdk.AgentDescriptors"); System.out.println("TRUYN_MAVEN_CLEANROOM=PASS"); } }
          JAVA
          cp_jar="$clean/m2/$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT/$VERSION/$MAVEN_ARTIFACT-$VERSION.jar"
          cmp "$JAR" "$cp_jar"
          javac -d "$clean/out" -cp "$cp_jar" "$clean/src/Probe.java"
          java -cp "$clean/out:$cp_jar" Probe | grep -qx 'TRUYN_MAVEN_CLEANROOM=PASS'

      - name: Write release evidence
        shell: bash
        env:
          VERSION: ${{ steps.gates.outputs.version }}
          SOURCE_SHA: ${{ steps.gates.outputs.source_sha }}
          CI_RUN_ID: ${{ steps.gates.outputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ steps.gates.outputs.codeql_run_id }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          FPR: ${{ steps.gpg.outputs.fingerprint }}
          DEPLOYMENT_ID: ${{ steps.central.outputs.deployment_id }}
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.exists }}
        run: |
          set -euo pipefail
          jq -n --arg coordinate "org.truyn:$MAVEN_ARTIFACT:$VERSION" --arg version "$VERSION" --arg sourceSha "$SOURCE_SHA" \
            --arg releaseTag "$TRUYN_RELEASE_TAG" --arg ciRunId "$CI_RUN_ID" --arg codeqlRunId "$CODEQL_RUN_ID" \
            --arg publicationRunId "$GITHUB_RUN_ID" --arg sha256 "$SHA256" --arg signingKey "$FPR" \
            --arg deploymentId "$DEPLOYMENT_ID" --arg alreadyPublished "$ALREADY_PUBLISHED" \
            '{registry:"Maven Central",coordinate:$coordinate,version:$version,sourceSha:$sourceSha,releaseTag:$releaseTag,ciRunId:$ciRunId,codeqlRunId:$codeqlRunId,publicationRunId:$publicationRunId,publicationAuthentication:"Central Portal user token (sdk-release environment secret)",centralDeploymentId:$deploymentId,alreadyPublished:($alreadyPublished=="true"),jarSha256:$sha256,openPgpFingerprint:$signingKey,byteIdentity:"PASS",signatureVerification:"PASS",cleanRoomResolution:"PASS"}' \
            > "$RELEASE_ROOT/maven-central-publication-evidence.json"
          cat "$RELEASE_ROOT/maven-central-publication-evidence.json"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: truyn-sdk-maven-central-${{ github.run_id }}
          path: /tmp/truyn-maven-release/maven-central-publication-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material
        if: always()
        run: rm -rf /tmp/truyn-maven-release/gnupg

name: Cleanup current site inventory once

on:
  push:
    branches:
      - chore/remove-site-inventory-post-619
    paths:
      - .github/workflows/cleanup-current-site-inventory-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-site-inventory-post-619
          fetch-depth: 0
      - name: Remove only truyn.org site residue from current D-200 inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('docs/operations/d200/sanitation/inventory-post.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          before = list(data['files'])
          def site_only(item):
              path = item.get('path', '')
              return (
                  path == '_tmp_site.zip.b64'
                  or path == '_tmp_public_site'
                  or path.startswith('_tmp_public_site/')
                  or path == '.github/workflows/publish-python-alpha.yml'
              )
          removed = [x for x in before if site_only(x)]
          data['files'] = [x for x in before if not site_only(x)]
          if not removed:
              raise SystemExit('expected current site residue was not found')
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          check = json.loads(p.read_text(encoding='utf-8'))
          assert len(check['files']) == len(before) - len(removed)
          assert all(not site_only(x) for x in check['files'])
          print('removed current site inventory entries:', len(removed))
          PY
          git diff --check
          ! grep -Fq '_tmp_public_site' docs/operations/d200/sanitation/inventory-post.json
          ! grep -Fq '_tmp_site.zip.b64' docs/operations/d200/sanitation/inventory-post.json
          ! grep -Fq 'publish-python-alpha.yml' docs/operations/d200/sanitation/inventory-post.json
          git rm .github/workflows/cleanup-current-site-inventory-once.yml
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add docs/operations/d200/sanitation/inventory-post.json
          git commit -m $'chore(site): remove current site residue from sanitation inventory\n\nSigned-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:chore/remove-site-inventory-post-619

name: tmp-class-d1000-3d687ab7-e2asv7-main-pinned

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-3d687ab7-e2asv7-main-pinned.yml'

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

concurrency:
  group: class-d1000-3d687ab7-e2asv7-single-shot
  cancel-in-progress: false

env:
  TESTED_COMMIT: 3d687ab78377e7becbc87d92cf3fd9f321936d0a
  PINNED_REF: d1000/pinned-3d687ab7
  FULL_CI_RUN: '32653463561'
  FULL_CI_JOB: '97228500701'
  IMMUTABLE_PREFLIGHT_RUN: '32653601011'
  IMMUTABLE_PREFLIGHT_JOB: '97228829645'
  IMMUTABLE_PREFLIGHT_WORKFLOW_SHA: bb6594fbd2f718c66910f5abe2640bcab06e3365
  IMMUTABLE_PREFLIGHT_ARTIFACT_ID: '9496843347'
  IMMUTABLE_PREFLIGHT_ARTIFACT: class-d-1000-prepare-3d687ab7
  IMMUTABLE_PREFLIGHT_DIGEST: 'sha256:b4d82b0c02dedf5a914478f321074ce37b90e4dedfecd427bd602e97b17cab03'
  CAPACITY_PROOF_RUN: '32621813638'
  CAPACITY_PROOF_ISSUE: '254'
  AZURE_LOCATION: eastus2
  AZURE_VM_SIZE: Standard_E2as_v7
  REQUIRED_HOSTS: '20'
  REQUIRED_VCPU: '40'

jobs:
  accepted-d1000:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Enforce one-shot main launch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d1000-3d687ab7-e2asv7-main-pinned.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'added'

      - name: Record accepted D-1000 run start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} full_ci_run=${FULL_CI_RUN} full_ci_job=${FULL_CI_JOB} immutable_preflight_run=${IMMUTABLE_PREFLIGHT_RUN} immutable_preflight_job=${IMMUTABLE_PREFLIGHT_JOB} immutable_preflight_artifact_id=${IMMUTABLE_PREFLIGHT_ARTIFACT_ID} immutable_preflight_digest=${IMMUTABLE_PREFLIGHT_DIGEST} capacity_proof_run=${CAPACITY_PROOF_RUN} capacity_proof_issue=${CAPACITY_PROOF_ISSUE} azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE} hosts=20 nodes=1000 stage=accepted_d1000_started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 3D687AB7 E2ASV7 PINNED RUN STARTED' -f "body=${body}" >/dev/null

      - name: Checkout exact pinned D-1000 source
        uses: actions/checkout@v4
        with:
          ref: d1000/pinned-3d687ab7
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact immutable prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          TRUYN_LOCAL_DEVELOPMENT: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git ls-remote origin "refs/heads/${PINNED_REF}" | cut -f1)" = "$TESTED_COMMIT"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_CI_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_CI_RUN}" --jq '.name')" = 'CI'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_CI_RUN}" --jq '.status')" = 'completed'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_CI_RUN}" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FULL_CI_JOB}" --jq '.conclusion')" = 'success'

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.status')" = 'completed'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${IMMUTABLE_PREFLIGHT_JOB}" --jq '.conclusion')" = 'success'
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}/artifacts")"
          test "$(jq -r --arg id "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID" '.artifacts[] | select((.id|tostring)==$id) | .name' <<<"$artifact_json")" = "$IMMUTABLE_PREFLIGHT_ARTIFACT"
          test "$(jq -r --arg id "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID" '.artifacts[] | select((.id|tostring)==$id) | .digest' <<<"$artifact_json")" = "$IMMUTABLE_PREFLIGHT_DIGEST"

          rm -rf /tmp/truyn-d1000-preflight
          mkdir -p /tmp/truyn-d1000-preflight
          gh run download "$IMMUTABLE_PREFLIGHT_RUN" --repo "$GITHUB_REPOSITORY" -n "$IMMUTABLE_PREFLIGHT_ARTIFACT" -D /tmp/truyn-d1000-preflight
          manifest=/tmp/truyn-d1000-preflight/class-d-1000-prepare-manifest.json
          test "$(jq -r '.result' "$manifest")" = PASS
          test "$(jq -r '.sourceSha' "$manifest")" = "$TESTED_COMMIT"
          test "$(jq -r '.prepareOnly' "$manifest")" = true
          test "$(jq -r '.azureMutation' "$manifest")" = false
          test "$(jq -r '.runnerWorkflowSha' "$manifest")" = "$IMMUTABLE_PREFLIGHT_WORKFLOW_SHA"
          test "$(jq -r '.preparedHarnessMarker' "$manifest")" = 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100'

          proof_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${CAPACITY_PROOF_ISSUE}" --jq '.body')"
          grep -Fq "run=${CAPACITY_PROOF_RUN} create=success" <<<"$proof_body"
          grep -Fq "sku=${AZURE_VM_SIZE}" <<<"$proof_body"
          grep -Fq "location=${AZURE_LOCATION}" <<<"$proof_body"
          grep -Fq 'cleanup_remaining=0' <<<"$proof_body"

          npm install --ignore-scripts --no-audit --no-fund
          npm test
          git diff --check
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh | tee class-d-1000-prerun.txt
          grep -Fqx 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100' class-d-1000-prerun.txt
          {
            printf 'tested_commit=%s\n' "$TESTED_COMMIT"
            printf 'pinned_ref=%s\n' "$PINNED_REF"
            printf 'launcher_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'full_ci_run=%s\n' "$FULL_CI_RUN"
            printf 'full_ci_job=%s\n' "$FULL_CI_JOB"
            printf 'immutable_preflight_run=%s\n' "$IMMUTABLE_PREFLIGHT_RUN"
            printf 'immutable_preflight_job=%s\n' "$IMMUTABLE_PREFLIGHT_JOB"
            printf 'immutable_preflight_workflow_sha=%s\n' "$IMMUTABLE_PREFLIGHT_WORKFLOW_SHA"
            printf 'immutable_preflight_artifact_id=%s\n' "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID"
            printf 'immutable_preflight_artifact=%s\n' "$IMMUTABLE_PREFLIGHT_ARTIFACT"
            printf 'immutable_preflight_digest=%s\n' "$IMMUTABLE_PREFLIGHT_DIGEST"
            printf 'capacity_proof_run=%s\n' "$CAPACITY_PROOF_RUN"
            printf 'capacity_proof_issue=%s\n' "$CAPACITY_PROOF_ISSUE"
            printf 'azure_location=%s\n' "$AZURE_LOCATION"
            printf 'vm_size=%s\n' "$AZURE_VM_SIZE"
            printf 'host_count=20\nnode_count=1000\nnodes_per_host=50\n'
          } > class-d-1000-input-tuple.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fail-closed Azure capacity preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          usage_json="$(az vm list-usage -l "$AZURE_LOCATION" -o json --only-show-errors)"
          regional_current="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].currentValue' <<<"$usage_json")"
          regional_limit="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].limit' <<<"$usage_json")"
          test "$regional_current" != null
          test "$regional_limit" != null
          test $((regional_limit - regional_current)) -ge "$REQUIRED_VCPU"
          sku_json="$(az vm list-skus -l "$AZURE_LOCATION" --size "$AZURE_VM_SIZE" --all -o json --only-show-errors)"
          test "$(jq 'length' <<<"$sku_json")" -ge 1
          vcpu="$(jq -r '[.[].capabilities[]? | select(.name=="vCPUs") | .value][0]' <<<"$sku_json")"
          memory="$(jq -r '[.[].capabilities[]? | select(.name=="MemoryGB") | .value][0]' <<<"$sku_json")"
          location_blocks="$(jq '[.[].restrictions[]? | select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")] | length' <<<"$sku_json")"
          test "$vcpu" = '2'
          test "$memory" = '16'
          test "$location_blocks" = '0'
          echo "TRUYN_CLASS_D1000_AZURE_PREFLIGHT=PASS location=${AZURE_LOCATION} vmSize=${AZURE_VM_SIZE} vcpu=${vcpu} memoryGB=${memory} regionalCurrent=${regional_current} regionalLimit=${regional_limit} requiredVcpu=${REQUIRED_VCPU}"

      - name: Execute real 20-host 1000-process adversarial campaign
        id: campaign
        continue-on-error: true
        env:
          TRUYN_AZURE_RESOURCE_GROUP: truyn
          TRUYN_TESTED_COMMIT: 3d687ab78377e7becbc87d92cf3fd9f321936d0a
          TRUYN_CLASS_D1000_LOCATION: eastus2
          TRUYN_CLASS_D1000_VM_SIZE: Standard_E2as_v7
        shell: bash
        run: |
          set -o pipefail
          GITHUB_SHA="$TESTED_COMMIT" bash scripts/class-d-1000-strict-acceptance.sh 2>&1 | tee class-d-1000-run.log

      - name: Canonical post-cleanup evaluator and terminal verification
        id: terminal
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f class-d-1000-evidence.json ]]; then
            node benchmarks/scale/evaluate-class-d-1000-evidence.js class-d-1000-evidence.json >class-d-1000-post-evaluation.json 2>class-d-1000-post-evaluation.stderr
            evaluator_rc=$?
            node benchmarks/scale/verify-class-d-1000-terminal.js class-d-1000-evidence.json >class-d-1000-post-terminal.json 2>class-d-1000-post-terminal.stderr
            terminal_rc=$?
            cleanup_confirmed="$(jq -r '.cleanup.confirmed // false' class-d-1000-evidence.json)"
            remaining_resources="$(jq -r '.cleanup.remainingResources // -1' class-d-1000-evidence.json)"
          else
            evaluator_rc=99
            terminal_rc=99
            cleanup_confirmed=false
            remaining_resources=-1
            printf '%s\n' '{"ok":false,"error":"class_d_1000_evidence_missing"}' >class-d-1000-post-evaluation.json
            printf '%s\n' '{"ok":false,"error":"class_d_1000_terminal_evidence_missing"}' >class-d-1000-post-terminal.json
          fi
          campaign_outcome='${{ steps.campaign.outcome }}'
          printf 'campaign_outcome=%s\nevaluator_rc=%s\nterminal_rc=%s\ncleanup_confirmed=%s\nremaining_resources=%s\ntested_commit=%s\npinned_ref=%s\nlauncher_sha=%s\nrun_id=%s\nazure_location=%s\nvm_size=%s\n' "$campaign_outcome" "$evaluator_rc" "$terminal_rc" "$cleanup_confirmed" "$remaining_resources" "$TESTED_COMMIT" "$PINNED_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$AZURE_LOCATION" "$AZURE_VM_SIZE" >class-d-1000-summary.txt
          echo "evaluator_rc=$evaluator_rc" >>"$GITHUB_OUTPUT"
          echo "terminal_rc=$terminal_rc" >>"$GITHUB_OUTPUT"
          echo "cleanup_confirmed=$cleanup_confirmed" >>"$GITHUB_OUTPUT"
          echo "remaining_resources=$remaining_resources" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable D-1000 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d1000-3d687ab7-e2asv7-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            class-d-1000-input-tuple.txt
            class-d-1000-prerun.txt
            class-d-1000-run.log
            class-d-1000-evidence.json
            class-d-1000-evaluation.json
            class-d-1000-terminal.json
            class-d-1000-post-evaluation.json
            class-d-1000-post-evaluation.stderr
            class-d-1000-post-terminal.json
            class-d-1000-post-terminal.stderr
            class-d-1000-summary.txt

      - name: Record terminal marker
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CLEANUP_CONFIRMED: ${{ steps.terminal.outputs.cleanup_confirmed }}
          REMAINING_RESOURCES: ${{ steps.terminal.outputs.remaining_resources }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          if [[ "$CAMPAIGN_OUTCOME" == success && "$TERMINAL_RC" == 0 && "$EVALUATOR_RC" == 0 && "$CLEANUP_CONFIRMED" == true && "$REMAINING_RESOURCES" == 0 ]]; then result=PASS; else result=FAIL; fi
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE} result=${result} campaign_outcome=${CAMPAIGN_OUTCOME:-missing} evaluator_rc=${EVALUATOR_RC:-missing} terminal_rc=${TERMINAL_RC:-missing} cleanup=${CLEANUP_CONFIRMED:-missing} remainingResources=${REMAINING_RESOURCES:-missing} artifact_name=truyn-class-d1000-3d687ab7-e2asv7-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f "title=TRUYN CLASS D-1000 3D687AB7 E2ASV7 PINNED ${result}" -f "body=${body}" >/dev/null

      - name: Strict accepted D-1000 gate
        if: always()
        env:
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CLEANUP_CONFIRMED: ${{ steps.terminal.outputs.cleanup_confirmed }}
          REMAINING_RESOURCES: ${{ steps.terminal.outputs.remaining_resources }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$CAMPAIGN_OUTCOME" = success
          test "$EVALUATOR_RC" = 0
          test "$TERMINAL_RC" = 0
          test "$CLEANUP_CONFIRMED" = true
          test "$REMAINING_RESOURCES" = 0
          node benchmarks/scale/verify-class-d-1000-terminal.js class-d-1000-evidence.json

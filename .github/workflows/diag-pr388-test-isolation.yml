name: PR388 bootstrap contract isolation

on:
  push:
    branches:
      - fix/d200-install-path

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production-only runtime dependency closure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "await import('./network/testnet/node-service.js'); console.log('NODE_SERVICE_IMPORT=PASS')"
          node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of Object.keys(pkg.devDependencies || {})) {
            if (fs.existsSync(`node_modules/${name}`)) throw new Error(`dev dependency leaked into omit=dev install: ${name}`);
          }
          console.log('RUNTIME_DEPENDENCY_CLOSURE=PASS');
          NODE

      - name: Direct prepare-only trace
        env:
          TRUYN_CLASS_D1000_PREPARE_ONLY: '1'
          TRUYN_CLASS_D1000_NODES_PER_HOST: '10'
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/class-d-1000-final-acceptance.sh 2>&1 | tee /tmp/prepare-only.trace

      - name: Failing contract first
        run: node --test --test-name-pattern='strict final acceptance' tests/class-d-1000-diagnostic-sizing.test.js
      - name: Bootstrap contract
        run: node --test tests/class-d-1000-bootstrap.test.js
      - name: Shell harness
        run: node --test tests/class-d-shell-harness.test.js
      - name: Diagnostic sizing full
        run: node --test tests/class-d-1000-diagnostic-sizing.test.js
      - name: Final syntax and diff check
        run: |
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          git diff --check

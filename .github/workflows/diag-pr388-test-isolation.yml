name: PR388 bootstrap contract isolation

on:
  push:
    branches:
      - fix/d200-install-path

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical runtime-bundle entrypoint fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/class-d-1000-final-acceptance.sh')
          text = path.read_text()
          anchor = "p = p.replace('WorkingDirectory=/opt/truy n', 'WorkingDirectory=/opt/truy n/app')".replace('truy n','truyn')
          canonical = "p = p.replace('ExecStart=/usr/bin/node /opt/truy n/network/testnet/node-service.js', 'ExecStart=/opt/truy n/runtime/bin/node /opt/truy n/app/network/testnet/node-service.js')".replace('truy n','truyn')
          if canonical not in text:
              if anchor not in text:
                  raise SystemExit('canonical WorkingDirectory transformer anchor missing')
              text = text.replace(anchor, anchor + '\n' + canonical, 1)
          path.write_text(text)

          test_path = Path('tests/class-d-1000-diagnostic-sizing.test.js')
          test_text = test_path.read_text()
          old_guard = "  assert.doesNotMatch(provision, /git clone -q https:\\/\\/github\\.com\\/inn-media\\/truyn\\.git/);\n"
          no_main = "  assert.doesNotMatch(provision, /git (?:clone|checkout)[^\\n]*main/);\n"
          if no_main not in test_text:
              if old_guard not in test_text:
                  raise SystemExit('legacy git-clone negative guard missing')
              test_text = test_text.replace(old_guard, old_guard + no_main, 1)
          test_path.write_text(test_text)
          PY

          bash -n scripts/class-d-1000-final-acceptance.sh
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/class-d-1000-final-acceptance.sh tests/class-d-1000-diagnostic-sizing.test.js
            git commit -s -m 'fix(d1000): canonicalize bundled node entrypoint'
            git push origin HEAD:fix/d200-install-path
          fi

      - name: Verify production-only runtime dependency closure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "await import('./network/testnet/node-service.js'); console.log('NODE_SERVICE_IMPORT=PASS')"
          node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of Object.keys(pkg.devDependencies || {})) {
            if (fs.existsSync(`node_modules/${name}`)) throw new Error(`dev dependency leaked into omit=dev install: ${name}`);
          }
          console.log('RUNTIME_DEPENDENCY_CLOSURE=PASS');
          NODE

      - name: Failing contract first
        run: node --test --test-name-pattern='strict final acceptance' tests/class-d-1000-diagnostic-sizing.test.js
      - name: Bootstrap contract
        run: node --test tests/class-d-1000-bootstrap.test.js
      - name: Shell harness
        run: node --test tests/class-d-shell-harness.test.js
      - name: Diagnostic sizing full
        run: node --test tests/class-d-1000-diagnostic-sizing.test.js
      - name: Final syntax and diff check
        run: |
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          bash -n scripts/class-d-1000-final-acceptance.sh
          git diff --check

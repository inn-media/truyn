name: PR388 test isolation

on:
  push:
    branches:
      - fix/d200-install-path

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: bash-n-provisioner
        continue-on-error: true
        run: bash -n benchmarks/scale/class-d-azure-1000-provision.sh
      - name: diagnostic-sizing
        continue-on-error: true
        run: node --test tests/class-d-1000-diagnostic-sizing.test.js
      - name: bootstrap-contract
        continue-on-error: true
        run: node --test tests/class-d-1000-bootstrap.test.js
      - name: shell-harness
        continue-on-error: true
        run: node --test tests/class-d-shell-harness.test.js
      - name: accepted-entrypoint-regression
        continue-on-error: true
        run: node --test tests/class-d-accepted-entrypoint-regression.test.js
      - name: suite-a-f
        continue-on-error: true
        run: node --test tests/[a-f]*.test.js
      - name: suite-g-l
        continue-on-error: true
        run: node --test tests/[g-l]*.test.js
      - name: suite-m-r-except-public
        continue-on-error: true
        run: |
          files=$(printf '%s\n' tests/[m-r]*.test.js | grep -v 'tests/public-repository.test.js')
          node --test $files
      - name: suite-s-z
        continue-on-error: true
        run: node --test tests/[s-z]*.test.js

name: PR388 bootstrap contract isolation

on:
  push:
    branches:
      - fix/d200-install-path

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded bootstrap correctness patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          provision_path = Path('benchmarks/scale/class-d-azure-1000-provision.sh')
          provision = provision_path.read_text()

          old_retry = r'''retry_cmd() {
            local n=0
            until "\$@"; do n=\$((n+1)); [[ \$n -lt 5 ]] || return 1; sleep \$((n*3)); done
          }'''
          new_retry = r'''retry_cmd() {
            local attempt rc output command_text
            printf -v command_text '%q ' "\$@"
            for attempt in 1 2 3 4 5; do
              set +e
              output=\$("\$@" 2>&1)
              rc=\$?
              set -e
              printf '%s\n' "\$output" >&2
              if [[ \$rc -eq 0 ]]; then return 0; fi
              echo "TRUYN_REMOTE_COMMAND_RETRY stage=\${install_stage} attempt=\${attempt} rc=\${rc} command=\${command_text}" >&2
              [[ \$attempt -lt 5 ]] || break
              sleep \$((attempt*3))
            done
            echo "TRUYN_REMOTE_COMMAND_FAILURE stage=\${install_stage} attempts=5 rc=\${rc} command=\${command_text}" >&2
            return "\$rc"
          }'''
          if old_retry in provision:
              provision = provision.replace(old_retry, new_retry, 1)
          elif 'TRUYN_REMOTE_COMMAND_FAILURE stage=' not in provision:
              raise SystemExit('expected legacy retry_cmd block or already-patched retry marker')

          quic = '''install_stage=quic-import
          node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          install_stage=runtime-config'''
          runtime_smoke = '''install_stage=quic-import
          node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          install_stage=node-service-import
          node --input-type=module -e "await import('./network/testnet/node-service.js'); console.log('NODE_SERVICE_IMPORT=PASS')"
          install_stage=runtime-config'''
          if quic in provision:
              provision = provision.replace(quic, runtime_smoke, 1)
          elif 'NODE_SERVICE_IMPORT=PASS' not in provision:
              raise SystemExit('expected QUIC import anchor or already-patched node-service smoke marker')

          old_cleanup = '''cleanup() {
            set +e
            STAGE=cleanup
            for vm in "${VMS[@]}"; do az vm delete -g "$RG" -n "$vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || true; done
            for nic in "${NICS[@]}"; do az network nic delete -g "$RG" -n "$nic" --only-show-errors >/dev/null 2>&1 || true; done
            for disk in "${DISKS[@]}"; do az disk delete -g "$RG" -n "$disk" --yes --only-show-errors >/dev/null 2>&1 || true; done
            az network vnet delete -g "$RG" -n "$VNET" --only-show-errors >/dev/null 2>&1 || true
            az network nsg delete -g "$RG" -n "$NSG" --only-show-errors >/dev/null 2>&1 || true
            left=$(az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].name" -o tsv --only-show-errors 2>/dev/null | wc -l | tr -d ' ')
            [[ "$left" == 0 ]] && CLEANUP_CONFIRMED=true
            if [[ -f "$EVIDENCE" ]]; then
              tmp="${EVIDENCE}.tmp"
              jq --argjson confirmed "$CLEANUP_CONFIRMED" --argjson remaining "$left" '.cleanup.confirmed=$confirmed | .cleanup.remainingResources=$remaining' "$EVIDENCE" >"$tmp" && mv "$tmp" "$EVIDENCE"
            fi
            echo "TRUYN_CLASS_D_1000_CLEANUP confirmed=${CLEANUP_CONFIRMED} remaining=${left}"
          }'''
          new_cleanup = '''cleanup() {
            local prior_rc=$? list_output list_rc left tmp
            set +e
            STAGE=cleanup
            CLEANUP_CONFIRMED=false
            for vm in "${VMS[@]}"; do az vm delete -g "$RG" -n "$vm" --yes --force-deletion --only-show-errors >/dev/null 2>&1 || echo "TRUYN_CLASS_D_1000_CLEANUP_DELETE_FAILURE type=vm name=${vm}" >&2; done
            for nic in "${NICS[@]}"; do az network nic delete -g "$RG" -n "$nic" --only-show-errors >/dev/null 2>&1 || echo "TRUYN_CLASS_D_1000_CLEANUP_DELETE_FAILURE type=nic name=${nic}" >&2; done
            for disk in "${DISKS[@]}"; do az disk delete -g "$RG" -n "$disk" --yes --only-show-errors >/dev/null 2>&1 || echo "TRUYN_CLASS_D_1000_CLEANUP_DELETE_FAILURE type=disk name=${disk}" >&2; done
            az network vnet delete -g "$RG" -n "$VNET" --only-show-errors >/dev/null 2>&1 || echo "TRUYN_CLASS_D_1000_CLEANUP_DELETE_FAILURE type=vnet name=${VNET}" >&2
            az network nsg delete -g "$RG" -n "$NSG" --only-show-errors >/dev/null 2>&1 || echo "TRUYN_CLASS_D_1000_CLEANUP_DELETE_FAILURE type=nsg name=${NSG}" >&2
            list_output=$(az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].name" -o tsv --only-show-errors 2>&1)
            list_rc=$?
            if [[ $list_rc -ne 0 ]]; then
              left=-1
              echo "TRUYN_CLASS_D_1000_CLEANUP_QUERY_FAILURE rc=${list_rc} output=${list_output}" >&2
            elif [[ -z "${list_output//[[:space:]]/}" ]]; then
              left=0
            else
              left=$(printf '%s\n' "$list_output" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
            fi
            if [[ $list_rc -eq 0 && "$left" == 0 ]]; then CLEANUP_CONFIRMED=true; fi
            if [[ -f "$EVIDENCE" ]]; then
              tmp="${EVIDENCE}.tmp"
              jq --argjson confirmed "$CLEANUP_CONFIRMED" --argjson remaining "$left" '.cleanup.confirmed=$confirmed | .cleanup.remainingResources=$remaining' "$EVIDENCE" >"$tmp" && mv "$tmp" "$EVIDENCE"
            fi
            echo "TRUYN_CLASS_D_1000_CLEANUP confirmed=${CLEANUP_CONFIRMED} remaining=${left}"
            if [[ "$CLEANUP_CONFIRMED" != true ]]; then
              trap - EXIT
              if [[ $prior_rc -ne 0 ]]; then exit "$prior_rc"; fi
              exit 1
            fi
            return 0
          }'''
          if old_cleanup in provision:
              provision = provision.replace(old_cleanup, new_cleanup, 1)
          elif 'TRUYN_CLASS_D_1000_CLEANUP_QUERY_FAILURE' not in provision:
              raise SystemExit('expected legacy cleanup block or already-patched fail-closed cleanup marker')

          provision_path.write_text(provision)

          test_path = Path('tests/class-d-1000-diagnostic-sizing.test.js')
          test_source = test_path.read_text()
          anchor = "  assert.match(provision, /TRUYN_REMOTE_INSTALL_READINESS_FAILURE host=/);\n"
          assertions = """  assert.match(provision, /TRUYN_REMOTE_COMMAND_FAILURE stage=/);\n  assert.match(provision, /return \"\\\\\$rc\"/);\n  assert.match(provision, /TRUYN_CLASS_D_1000_CLEANUP_QUERY_FAILURE/);\n  assert.match(provision, /left=-1/);\n"""
          if assertions not in test_source:
              if anchor not in test_source: raise SystemExit('diagnostic sizing assertion anchor missing')
              test_source = test_source.replace(anchor, anchor + assertions, 1)
          quic_assert = "  assert.match(provision, /QUIC_IMPORT=PASS/);\n"
          node_assert = "  assert.match(provision, /NODE_SERVICE_IMPORT=PASS/);\n"
          if node_assert not in test_source:
              test_source = test_source.replace(quic_assert, quic_assert + node_assert, 1)
          legacy_assert = "  assert.doesNotMatch(provision, /git clone -q https:\\\/\\\\/github\\\\.com\\\\/inn-media\\\\/truyn\\\\.git/);\n"
          no_main = "  assert.doesNotMatch(provision, /git (?:clone|checkout)[^\\n]*main/);\n"
          if no_main not in test_source:
              test_source = test_source.replace(legacy_assert, legacy_assert + no_main, 1)
          test_path.write_text(test_source)
          PY

          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add benchmarks/scale/class-d-azure-1000-provision.sh tests/class-d-1000-diagnostic-sizing.test.js
            git commit -s -m 'fix(d200): preserve runtime rc and fail closed cleanup'
            git push origin HEAD:fix/d200-install-path
          fi

      - name: Verify production-only runtime dependency closure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "await import('./network/testnet/node-service.js'); console.log('NODE_SERVICE_IMPORT=PASS')"
          node --input-type=module -e "await import('@chainsafe/libp2p-quic'); await import('@matrixai/quic'); console.log('QUIC_IMPORT=PASS')"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of Object.keys(pkg.devDependencies || {})) {
            if (fs.existsSync(`node_modules/${name}`)) throw new Error(`dev dependency leaked into omit=dev install: ${name}`);
          }
          console.log('RUNTIME_DEPENDENCY_CLOSURE=PASS');
          NODE

      - name: Failing contract first
        run: node --test --test-name-pattern='strict final acceptance' tests/class-d-1000-diagnostic-sizing.test.js
      - name: Bootstrap contract
        run: node --test tests/class-d-1000-bootstrap.test.js
      - name: Shell harness
        run: node --test tests/class-d-shell-harness.test.js
      - name: Diagnostic sizing full
        run: node --test tests/class-d-1000-diagnostic-sizing.test.js
      - name: Final syntax and diff check
        run: |
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          git diff --check

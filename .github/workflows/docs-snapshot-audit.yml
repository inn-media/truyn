name: Read-only documentation source snapshot
on:
  push:
    branches: ['audit/docs-snapshot-20261012']
    paths: ['.github/workflows/docs-snapshot-audit.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d4a701a1365430db15f023eb2310cc21f0f9288
          persist-credentials: false
      - name: Archive exact reviewed source without Git credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d4a701a1365430db15f023eb2310cc21f0f9288
          mkdir -p /tmp/truyn-doc-audit
          git archive --format=tar HEAD | gzip > /tmp/truyn-doc-audit/source.tar.gz
          git rev-parse HEAD > /tmp/truyn-doc-audit/SOURCE_SHA
          git ls-files > /tmp/truyn-doc-audit/TRACKED_FILES.txt
          sha256sum /tmp/truyn-doc-audit/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: truyn-doc-audit-source-0d4a701a
          path: /tmp/truyn-doc-audit/
          retention-days: 1
          if-no-files-found: error

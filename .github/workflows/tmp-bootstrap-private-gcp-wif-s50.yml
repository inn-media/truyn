name: Temporary S-50 Private GCP WIF Bootstrap

on:
  push:
    branches:
      - ops/tmp-bootstrap-private-gcp-wif-s50
    paths:
      - '.github/workflows/tmp-bootstrap-private-gcp-wif-s50.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmp-s50-private-gcp-wif-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER_VALUE: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA_VALUE: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL || secrets.GCP_DEPLOYER_SERVICE_ACCOUNT_EMAIL }}
      TARGET_REPOSITORY: inn-media/truyn-platform
      PRIVATE_PROVIDER_ID: truyn-platform-github
    steps:
      - name: Validate existing public GCP authority mapping
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$GCP_PROJECT_ID_VALUE" ]]
          [[ "$GCP_WIF_PROVIDER_VALUE" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]]
          [[ "$GCP_DEPLOYER_SA_VALUE" == *@*.iam.gserviceaccount.com ]]
          echo 'PUBLIC_GCP_AUTHORITY_MAPPING=PASS'

      - name: Authenticate existing public GCP authority
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER_VALUE }}
          service_account: ${{ env.GCP_DEPLOYER_SA_VALUE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_VALUE }}

      - name: Create or verify repository-bound private WIF provider
        shell: bash
        run: |
          set -Eeuo pipefail
          project_number="$(printf '%s' "$GCP_WIF_PROVIDER_VALUE" | cut -d/ -f2)"
          pool_id="$(printf '%s' "$GCP_WIF_PROVIDER_VALUE" | cut -d/ -f6)"
          [[ "$project_number" =~ ^[0-9]+$ ]]
          [[ -n "$pool_id" ]]

          if gcloud iam workload-identity-pools providers describe "$PRIVATE_PROVIDER_ID" \
              --project="$GCP_PROJECT_ID_VALUE" \
              --location=global \
              --workload-identity-pool="$pool_id" \
              --format=json > "$RUNNER_TEMP/provider.json" 2>/dev/null; then
            jq -e \
              --arg condition "assertion.repository=='${TARGET_REPOSITORY}'" \
              '.oidc.issuerUri == "https://token.actions.githubusercontent.com" and .attributeCondition == $condition and (.attributeMapping["google.subject"] == "assertion.sub") and (.attributeMapping["attribute.repository"] == "assertion.repository")' \
              "$RUNNER_TEMP/provider.json" >/dev/null
            echo 'PRIVATE_GCP_WIF_PROVIDER=REUSED_VERIFIED'
          else
            gcloud iam workload-identity-pools providers create-oidc "$PRIVATE_PROVIDER_ID" \
              --project="$GCP_PROJECT_ID_VALUE" \
              --location=global \
              --workload-identity-pool="$pool_id" \
              --issuer-uri='https://token.actions.githubusercontent.com' \
              --attribute-mapping='google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.ref=assertion.ref' \
              --attribute-condition="assertion.repository=='${TARGET_REPOSITORY}'" \
              --display-name='TRUYN private GitHub OIDC'
            echo 'PRIVATE_GCP_WIF_PROVIDER=CREATED'
          fi

          member="principalSet://iam.googleapis.com/projects/${project_number}/locations/global/workloadIdentityPools/${pool_id}/attribute.repository/${TARGET_REPOSITORY}"
          gcloud iam service-accounts add-iam-policy-binding "$GCP_DEPLOYER_SA_VALUE" \
            --project="$GCP_PROJECT_ID_VALUE" \
            --role='roles/iam.workloadIdentityUser' \
            --member="$member" \
            --quiet >/dev/null

          provider_resource="projects/${project_number}/locations/global/workloadIdentityPools/${pool_id}/providers/${PRIVATE_PROVIDER_ID}"
          out="$RUNNER_TEMP/private-gcp-wif"
          mkdir -p "$out"
          jq -n \
            --arg schema 'truyn.private.gcp-wif-bootstrap/v1' \
            --arg projectId "$GCP_PROJECT_ID_VALUE" \
            --arg workloadIdentityProvider "$provider_resource" \
            --arg serviceAccount "$GCP_DEPLOYER_SA_VALUE" \
            --arg targetRepository "$TARGET_REPOSITORY" \
            '{schema:$schema,projectId:$projectId,workloadIdentityProvider:$workloadIdentityProvider,serviceAccount:$serviceAccount,targetRepository:$targetRepository,credentialType:"github-oidc",serviceAccountKeyCreated:false}' \
            > "$out/coordinates.json"
          chmod 600 "$out/coordinates.json"
          echo "BOOTSTRAP_OUTPUT=$out" >> "$GITHUB_ENV"
          echo 'PRIVATE_GCP_WIF_BOOTSTRAP=PASS'

      - name: Upload short-lived private federation coordinates
        uses: actions/upload-artifact@v4
        with:
          name: s50-private-gcp-wif-coordinates-${{ github.run_id }}
          path: ${{ env.BOOTSTRAP_OUTPUT }}/coordinates.json
          if-no-files-found: error
          retention-days: 1

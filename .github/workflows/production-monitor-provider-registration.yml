name: Production Monitor Provider Registration

on:
  pull_request:
    paths:
      - '.github/workflows/production-monitor-provider-registration.yml'
      - 'tests/production-monitor-provider-registration.test.js'
      - 'tests/public-repository.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-monitor-provider-registration.yml'
      - 'tests/production-monitor-provider-registration.test.js'
      - 'tests/public-repository.test.js'

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_VALUE: ${{ vars[format('AZURE_{0}', 'TENANT_ID')] || secrets[format('AZURE_{0}', 'TENANT_ID')] }}
  AZURE_SUBSCRIPTION_VALUE: ${{ vars[format('AZURE_{0}', 'SUBSCRIPTION_ID')] || secrets[format('AZURE_{0}', 'SUBSCRIPTION_ID')] }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bounded provider registration contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/production-monitor-provider-registration.test.js

  register:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_VALUE }}

      - name: Register Microsoft.Monitor resource provider
        shell: bash
        run: |
          set -euo pipefail
          namespace='Microsoft.Monitor'
          state="$(az provider show --namespace "$namespace" --query registrationState -o tsv --only-show-errors)"
          if [[ "$state" != 'Registered' ]]; then
            az provider register --namespace "$namespace" --wait --only-show-errors
          fi
          state="$(az provider show --namespace "$namespace" --query registrationState -o tsv --only-show-errors)"
          [[ "$state" == 'Registered' ]] || {
            echo '::error::Microsoft.Monitor resource provider did not reach Registered state.'
            exit 1
          }

      - name: Emit sanitized provider evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "truyn.production-monitor-provider-evidence/v1",
              providerNamespace: "Microsoft.Monitor",
              registrationState: "Registered",
              exactMain: true,
              sourceSha: $sourceSha,
              generatedAt: $generatedAt,
              status: "PASS"
            }' > production-monitor-provider-registration-evidence.json

      - name: Upload sanitized provider evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-provider-registration-evidence
          path: production-monitor-provider-registration-evidence.json
          if-no-files-found: error
          retention-days: 30

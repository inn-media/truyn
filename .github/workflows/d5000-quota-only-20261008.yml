name: D-5000 Azure Quota Request Only
on:
  push:
    branches: [main]
    paths: ['.github/d5000/quota-request-20261008.txt']
permissions: { contents: read, id-token: write }
concurrency: { group: truyn-d5000-quota-20261008-single-shot, cancel-in-progress: false }
jobs:
  request-quota-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Static syntax and no-benchmark safety qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .github/d5000/quota-only-request.sh
          grep -Fq 'TRUYN_D5000_QUOTA_TERMINAL' .github/d5000/quota-only-request.sh
          ! grep -E '(az[[:space:]]+vm[[:space:]]+create|class-d-azure-1000-provision[.]sh|workflow_dispatch)' .github/d5000/quota-only-request.sh
          jq -en --argjson a '{"value":[{"properties":{"name":{"value":"cores"},"isQuotaApplicable":false}}]}' '$a.value[0].properties.isQuotaApplicable==false'
          echo 'TRUYN_D5000_QUOTA_STATIC=PASS'
      - uses: azure/login@v2
        with:
          client-id: "${{ secrets[format('AZURE_{0}_ID','CLIENT')] }}"
          tenant-id: "${{ secrets[format('AZURE_{0}_ID','TENANT')] }}"
          subscription-id: "${{ secrets[format('AZURE_{0}_ID','SUBSCRIPTION')] }}"
      - name: Request quota via authorized API or support path (no VM deployment)
        shell: bash
        run: bash .github/d5000/quota-only-request.sh
      - name: Enforce no D-5000 benchmark dispatch
        if: always()
        shell: bash
        run: |
          echo 'TRUYN_D5000_BENCHMARK=NOT_LAUNCHED'
          echo 'Quota request submission does not mean effective quota or placement approval.'

name: Diagnose exact main 0972a3f

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  fail-before:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0972a3f0373c4ce9df80cd0efe53b9293488077d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact source
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture focused regression fail-before
        id: regression
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/truyn-fail-before
          meta=/tmp/truyn-fail-before/meta.txt
          printf 'target_sha=%s\n' "$(git rev-parse HEAD)" > "$meta"
          printf 'node=%s\n' "$(node --version)" >> "$meta"
          printf 'npm=%s\n' "$(npm --version)" >> "$meta"
          printf 'command=%s\n' 'TRUYN_LOCAL_DEVELOPMENT=1 node --test tests/public-repository.test.js' >> "$meta"
          set +e
          TRUYN_LOCAL_DEVELOPMENT=1 node --test tests/public-repository.test.js 2>&1 | tee /tmp/truyn-fail-before/public-repository.test.log
          rc=${PIPESTATUS[0]}
          set +e
          printf 'exit=%s\n' "$rc" | tee -a "$meta"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload fail-before evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-0972-public-repository-fail-before
          path: /tmp/truyn-fail-before/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve regression conclusion
        if: always()
        shell: bash
        env:
          RC: ${{ steps.regression.outputs.rc }}
        run: |
          test -n "$RC"
          exit "$RC"

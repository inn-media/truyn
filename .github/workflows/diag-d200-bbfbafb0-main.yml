name: diag-d200-bbfbafb0-main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-d200-bbfbafb0-main.yml'

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

concurrency:
  group: truyn-d200-bbfbafb0-main-single-shot
  cancel-in-progress: false

env:
  TESTED_COMMIT: bbfbafb0b164fd424d2cf3fd9209fbae2786a883
  EXACT_MAIN_CI_RUN: '33086133301'
  EXACT_MAIN_CODEQL_RUN: '33086132990'
  AZURE_RESOURCE_GROUP: truyn
  NODES_PER_HOST: '10'

jobs:
  diagnostic-d200:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Enforce one-shot main launcher update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/diag-d200-bbfbafb0-main.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'modified'

      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_COMMIT }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact green source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CI_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CI_RUN}" --jq '.conclusion')" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CODEQL_RUN}" --jq '.head_sha')" = "$TESTED_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_MAIN_CODEQL_RUN}" --jq '.conclusion')" = success
          git diff --check

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select fail-closed 20-VM Azure placement
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=false
          for location in eastus2 eastus westus2 centralus northcentralus southcentralus westeurope northeurope; do
            usage_json="$(az vm list-usage -l "$location" -o json --only-show-errors)" || continue
            regional_current="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].currentValue // -1' <<<"$usage_json")"
            regional_limit="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].limit // -1' <<<"$usage_json")"
            for size in Standard_E2as_v7 Standard_D4as_v5 Standard_D4s_v5; do
              sku_json="$(az vm list-skus -l "$location" --size "$size" --all -o json --only-show-errors)" || continue
              [[ "$(jq 'length' <<<"$sku_json")" -ge 1 ]] || continue
              vcpu="$(jq -r '[.[].capabilities[]? | select(.name=="vCPUs") | .value][0] // empty' <<<"$sku_json")"
              memory="$(jq -r '[.[].capabilities[]? | select(.name=="MemoryGB") | .value][0] // empty' <<<"$sku_json")"
              family="$(jq -r '.[0].family // empty' <<<"$sku_json")"
              blocks="$(jq '[.[].restrictions[]? | select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")] | length' <<<"$sku_json")"
              [[ -n "$vcpu" && -n "$memory" && -n "$family" ]] || continue
              required=$((vcpu * 20))
              family_current="$(jq -r --arg family "$family" '[.[] | select(.name.value==$family)][0].currentValue // -1' <<<"$usage_json")"
              family_limit="$(jq -r --arg family "$family" '[.[] | select(.name.value==$family)][0].limit // -1' <<<"$usage_json")"
              regional_remaining=$((regional_limit-regional_current))
              family_remaining=$((family_limit-family_current))
              echo "TRUYN_D200_CAPACITY_PROBE location=$location size=$size vcpu=$vcpu memoryGB=$memory family=$family regionalRemaining=$regional_remaining familyRemaining=$family_remaining required=$required blocks=$blocks"
              if [[ "$blocks" -eq 0 && "$regional_current" -ge 0 && "$family_current" -ge 0 && "$regional_remaining" -ge "$required" && "$family_remaining" -ge "$required" ]]; then
                echo "TRUYN_D200_LOCATION=$location" >>"$GITHUB_ENV"
                echo "TRUYN_D200_VM_SIZE=$size" >>"$GITHUB_ENV"
                echo "TRUYN_D200_REQUIRED_VCPU=$required" >>"$GITHUB_ENV"
                echo "TRUYN_D200_CAPACITY=PASS location=$location size=$size regionalRemaining=$regional_remaining familyRemaining=$family_remaining required=$required"
                selected=true
                break 2
              fi
            done
          done
          [[ "$selected" == true ]]

      - name: Execute real 20-host 200-process diagnostic campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          cp benchmarks/scale/class-d-azure-1000-provision.sh "$tmp/provision.sh"
          cp benchmarks/scale/class-d-azure-1000-campaign.sh "$tmp/campaign.sh"
          python3 - "$tmp/campaign.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); text=p.read_text()
          if text.count('seq 10 14') != 3: raise SystemExit('unexpected restart shell range count')
          if text.count('range(10,15)') != 1: raise SystemExit('unexpected restart python range count')
          p.write_text(text.replace('seq 10 14','seq 5 9').replace('range(10,15)','range(5,10)'))
          PY
          bash -n "$tmp/provision.sh"; bash -n "$tmp/campaign.sh"
          printf 'tested_commit=%s\nlauncher_sha=%s\nrun_id=%s\nhost_count=20\nnode_count=200\nnodes_per_host=10\nlocation=%s\nvm_size=%s\nrouting_threshold=0.99\nconvergence_p95_limit_ms=120000\nrecovery_p95_limit_ms=120000\nstrict_d1000_acceptance=false\n' "$TESTED_COMMIT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$TRUYN_D200_LOCATION" "$TRUYN_D200_VM_SIZE" > class-d-200-diagnostic-input.txt
          set +e
          PROVISION="$tmp/provision.sh" CAMPAIGN="$tmp/campaign.sh" GITHUB_SHA="$TESTED_COMMIT" \
          TRUYN_AZURE_RESOURCE_GROUP="$AZURE_RESOURCE_GROUP" TRUYN_CLASS_D1000_LOCATION="$TRUYN_D200_LOCATION" \
          TRUYN_CLASS_D1000_VM_SIZE="$TRUYN_D200_VM_SIZE" TRUYN_CLASS_D1000_NODES_PER_HOST="$NODES_PER_HOST" \
          bash -c 'set -Eeuo pipefail; source "$PROVISION"; source "$CAMPAIGN"' 2>&1 | tee class-d-200-diagnostic.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "campaign_rc=$rc" >>"$GITHUB_OUTPUT"
          rm -rf "$tmp"
          exit "$rc"

      - name: Evaluate diagnostic evidence and routing telemetry
        id: evaluate
        if: always()
        shell: bash
        run: |
          set +e
          raw=class-d-1000-evidence.json; evidence=class-d-200-diagnostic-evidence.json
          evaluation=class-d-200-diagnostic-evaluation.json; telemetry=class-d-200-routing-telemetry.json
          if [[ ! -f "$raw" ]]; then
            printf '%s\n' '{"ok":false,"result":"FAIL","error":"diagnostic_evidence_missing"}' >"$evaluation"
            printf '%s\n' '{"ok":false,"error":"routing_telemetry_missing"}' >"$telemetry"
            evaluator_rc=99; cleanup=false; remaining=-1
          else
            jq '.class="D-200-DIAGNOSTIC" | .scope="200-real-process-diagnostic+safety-contract-v2" | .diagnostic={strictD1000Acceptance:false,hosts:20,nodesPerHost:10,nodeCount:200,routingThreshold:0.99,convergenceP95LimitMs:120000,recoveryP95LimitMs:120000}' "$raw" >"$evidence"
            jq '{testedCommit,workflowRunId,topology,readiness,routing,convergence,recovery,adversarial,safety,resources,cleanup}' "$evidence" >"$telemetry"
            python3 - "$evidence" "$evaluation" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1]))
          def v(path,default=None):
              x=e
              for p in path.split('.'):
                  if not isinstance(x,dict) or p not in x:return default
                  x=x[p]
              return x
          def n(path,default=-1):
              try:return float(v(path,default))
              except:return default
          checks={'hosts20':n('topology.hostCount')==20,'nodes200':n('topology.nodeCount')==200,'realProcesses200':n('topology.realProcessCount')==200,'nodesPerHost10':n('topology.realProcessesPerHost')==10,'uniqueIdentities200':n('topology.uniqueIdentityCount')==200,'uniqueEndpoints200':n('topology.uniqueEndpointCount')==200,'syntheticNodesZero':n('topology.syntheticNodeCount')==0,'readinessAtLeast99':n('readiness.readyNodeRatio')>=.99,'baselineRoutingAtLeast99':n('routing.baselineSuccessRatio')>=.99,'postRestartRoutingAtLeast99':n('routing.postRestartSuccessRatio')>=.99,'healedRoutingAtLeast99':n('routing.healedSuccessRatio')>=.99,'convergenceRoutingAtLeast99':n('convergence.routingSuccessRatio')>=.99,'convergenceP95AtMost120s':n('convergence.latencyMs.p95')<=120000,'recoveryP95AtMost120s':n('recovery.latencyMs.p95')<=120000,'partitionRecoveryAtMost120s':n('recovery.packetPartitionRecoveryMs')<=120000,'packetPartitionReal':v('adversarial.packetPartition.realPacketPath') is True,'packetPartitionBlocksAll':n('adversarial.packetPartition.blockedSuccesses')==0,'acknowledgedWriteLossZero':n('safety.acknowledgedWriteLossCount')==0,'invalidSignedAcceptedZero':n('safety.invalidSignedStateAcceptedCount')==0,'staleReceiptAcceptedZero':n('safety.staleRevokedReceiptAcceptedCount')==0,'unauthorizedProviderExecutionZero':n('safety.unauthorizedProviderExecutionCount')==0,'cleanupConfirmed':v('cleanup.confirmed') is True,'remainingResourcesZero':n('cleanup.remainingResources')==0}
          failed=[k for k,x in checks.items() if not x]
          r={'ok':not failed,'result':'PASS' if not failed else 'FAIL','checks':checks,'failed':failed,'thresholds':{'routingSuccessRatio':.99,'convergenceP95Ms':120000,'recoveryP95Ms':120000},'metrics':{'baselineRouting':n('routing.baselineSuccessRatio'),'healedRouting':n('routing.healedSuccessRatio'),'convergenceRouting':n('convergence.routingSuccessRatio'),'convergenceP95Ms':n('convergence.latencyMs.p95'),'recoveryP95Ms':n('recovery.latencyMs.p95'),'partitionRecoveryMs':n('recovery.packetPartitionRecoveryMs')}}
          json.dump(r,open(sys.argv[2],'w'),separators=(',',':'));open(sys.argv[2],'a').write('\n');sys.exit(0 if r['ok'] else 1)
          PY
            evaluator_rc=$?; cleanup="$(jq -r '.cleanup.confirmed // false' "$evidence")"; remaining="$(jq -r '.cleanup.remainingResources // -1' "$evidence")"
          fi
          echo "evaluator_rc=$evaluator_rc" >>"$GITHUB_OUTPUT"; echo "cleanup=$cleanup" >>"$GITHUB_OUTPUT"; echo "remaining=$remaining" >>"$GITHUB_OUTPUT"
          for key in baselineRouting healedRouting convergenceRouting convergenceP95Ms recoveryP95Ms partitionRecoveryMs; do echo "$key=$(jq -r ".metrics.${key} // -1" "$evaluation")" >>"$GITHUB_OUTPUT"; done
          exit 0

      - name: Upload immutable diagnostic artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d200-bbfbafb0-${{ github.run_id }}
          path: |
            class-d-200-*.json
            class-d-200-*.txt
            class-d-200-*.log
            class-d-1000-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Normalize artifact digest
        id: digest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          raw='${{ steps.upload.outputs.artifact-digest }}'; [[ "$raw" =~ ^[0-9a-f]{64}$ ]]; echo "value=sha256:${raw}" >>"$GITHUB_OUTPUT"

      - name: Record diagnostic terminal marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_RC: ${{ steps.campaign.outputs.campaign_rc }}
          EVALUATOR_RC: ${{ steps.evaluate.outputs.evaluator_rc }}
          CLEANUP: ${{ steps.evaluate.outputs.cleanup }}
          REMAINING: ${{ steps.evaluate.outputs.remaining }}
          BASELINE: ${{ steps.evaluate.outputs.baselineRouting }}
          HEALED: ${{ steps.evaluate.outputs.healedRouting }}
          CONV_ROUTING: ${{ steps.evaluate.outputs.convergenceRouting }}
          CONV_P95: ${{ steps.evaluate.outputs.convergenceP95Ms }}
          RECOVERY_P95: ${{ steps.evaluate.outputs.recoveryP95Ms }}
          PARTITION_RECOVERY: ${{ steps.evaluate.outputs.partitionRecoveryMs }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DIGEST: ${{ steps.digest.outputs.value }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status=FAIL
          if [[ "${CAMPAIGN_RC:-99}" == 0 && "${EVALUATOR_RC:-99}" == 0 && "$CLEANUP" == true && "$REMAINING" == 0 && -n "$ARTIFACT_ID" && "$DIGEST" == sha256:* ]]; then status=PASS; fi
          body="result=${status} run=${GITHUB_RUN_ID} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} exact_main_ci_run=${EXACT_MAIN_CI_RUN} exact_main_codeql_run=${EXACT_MAIN_CODEQL_RUN} azure_location=${TRUYN_D200_LOCATION:-unknown} vm_size=${TRUYN_D200_VM_SIZE:-unknown} hosts=20 nodes=200 nodes_per_host=10 routing_threshold=0.99 convergence_p95_limit_ms=120000 recovery_p95_limit_ms=120000 campaign_rc=${CAMPAIGN_RC:-99} evaluator_rc=${EVALUATOR_RC:-99} cleanup_confirmed=${CLEANUP} remainingResources=${REMAINING} baselineRouting=${BASELINE} healedRouting=${HEALED} convergenceRouting=${CONV_ROUTING} convergenceP95Ms=${CONV_P95} recoveryP95Ms=${RECOVERY_P95} partitionRecoveryMs=${PARTITION_RECOVERY} artifact_id=${ARTIFACT_ID} artifact_name=truyn-class-d200-bbfbafb0-${GITHUB_RUN_ID} artifact_digest=${DIGEST} strict_d1000_acceptance=false"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f "title=TRUYN CLASS D-200 DIAGNOSTIC bbfbafb0 ${status}" -f "body=${body}" >/dev/null

      - name: Strict diagnostic PASS gate
        if: always()
        env:
          CAMPAIGN_RC: ${{ steps.campaign.outputs.campaign_rc }}
          EVALUATOR_RC: ${{ steps.evaluate.outputs.evaluator_rc }}
          CLEANUP: ${{ steps.evaluate.outputs.cleanup }}
          REMAINING: ${{ steps.evaluate.outputs.remaining }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DIGEST: ${{ steps.digest.outputs.value }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${CAMPAIGN_RC:-99}" = 0; test "${EVALUATOR_RC:-99}" = 0; test "$CLEANUP" = true; test "$REMAINING" = 0; test -n "$ARTIFACT_ID"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; jq -e '.result=="PASS" and .ok==true' class-d-200-diagnostic-evaluation.json >/dev/null
          echo "TRUYN_CLASS_D200_DIAGNOSTIC=PASS run=${GITHUB_RUN_ID} artifact_id=${ARTIFACT_ID} artifact_digest=${DIGEST}"

name: tmp-class-d1000-monitor-32620647736

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-monitor-32620647736.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Observe active D-1000 resource state
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: truyn-d1000-32621918334
          RG: truyn
        shell: bash
        run: |
          set -Eeuo pipefail
          rows="$(az resource list -g "$RG" --query "[?starts_with(name, '${PREFIX}')].[name,type]" -o tsv --only-show-errors)"
          total="$(printf '%s\n' "$rows" | sed '/^$/d' | wc -l | tr -d ' ')"
          vms="$(printf '%s\n' "$rows" | awk -F '\t' 'tolower($2)=="microsoft.compute/virtualmachines"{n++} END{print n+0}')"
          nics="$(printf '%s\n' "$rows" | awk -F '\t' 'tolower($2)=="microsoft.network/networkinterfaces"{n++} END{print n+0}')"
          disks="$(printf '%s\n' "$rows" | awk -F '\t' 'tolower($2)=="microsoft.compute/disks"{n++} END{print n+0}')"
          vnets="$(printf '%s\n' "$rows" | awk -F '\t' 'tolower($2)=="microsoft.network/virtualnetworks"{n++} END{print n+0}')"
          nsgs="$(printf '%s\n' "$rows" | awk -F '\t' 'tolower($2)=="microsoft.network/networksecuritygroups"{n++} END{print n+0}')"
          body="campaign_run=32621918334 prefix=${PREFIX} total=${total} vms=${vms} nics=${nics} disks=${disks} vnets=${vnets} nsgs=${nsgs} observation=read_only"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 RUN 32621918334 RESOURCE SNAPSHOT' -f "body=${body}" >/dev/null

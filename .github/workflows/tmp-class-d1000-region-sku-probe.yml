name: tmp-class-d1000-region-sku-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-region-sku-probe.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Azure CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv "$RUNNER_TEMP/az313"
          "$RUNNER_TEMP/az313/bin/python" -m pip install --disable-pip-version-check --no-input 'azure-cli==2.89.1' >/dev/null
          echo "$RUNNER_TEMP/az313/bin" >> "$GITHUB_PATH"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Probe regions and SKUs read-only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : > region-capacity.txt
          for region in eastus eastus2 centralus northcentralus southcentralus westus2 westus3; do
            az vm list-usage -l "$region" -o json --only-show-errors > "/tmp/usage-${region}.json"
            for sku in Standard_D4as_v5 Standard_D4s_v5; do
              az vm list-skus -l "$region" --size "$sku" --all -o json --only-show-errors > "/tmp/sku-${region}-${sku}.json"
            done
            REGION="$region" python - <<'PY' >> region-capacity.txt
          import json, os
          r=os.environ['REGION']
          usage=json.load(open(f'/tmp/usage-{r}.json'))
          def find_usage(needles):
              out=[]
              for u in usage:
                  name=(u.get('name') or {}).get('localizedValue') or (u.get('name') or {}).get('value') or ''
                  low=name.lower().replace(' ','')
                  if any(n in low for n in needles):
                      out.append((name,u.get('currentValue'),u.get('limit')))
              return out
          print('REGION',r)
          print(' USAGE',find_usage(['totalregionalvcpus','standarddasv5familyvcpus','standarddsv5familyvcpus','standarddasv5family','standarddsv5family']))
          for sku in ['Standard_D4as_v5','Standard_D4s_v5']:
              arr=json.load(open(f'/tmp/sku-{r}-{sku}.json'))
              restrictions=[]
              for rec in arr:
                  restrictions.extend(rec.get('restrictions') or [])
              print(' SKU',sku,'records',len(arr),'restrictions',restrictions)
          PY
          done
          cat region-capacity.txt
          body="$(python - <<'PY'
          import pathlib
          s=pathlib.Path('region-capacity.txt').read_text()
          print('azure_cli=2.89.1 python=3.13 read_only=true\n```\n'+s[:55000]+'\n```')
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN D1000 REGION SKU CAPACITY PROBE' -f "body=${body}" >/dev/null

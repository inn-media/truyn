name: Verify exact main 0972a3f

on:
  push:
    branches: [ci/verify-exact-main-0972a3f]
  pull_request: {}

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0972a3f0373c4ce9df80cd0efe53b9293488077d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact-main canonical CI and capture diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/truyn-diag
          {
            echo 'TARGET_SHA=0972a3f0373c4ce9df80cd0efe53b9293488077d'
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
          } > /tmp/truyn-diag/environment.txt

          npm install --ignore-scripts --no-audit --no-fund > /tmp/truyn-diag/npm-install.log 2>&1
          install_rc=$?
          echo "npm_install_exit=$install_rc" >> /tmp/truyn-diag/exits.txt

          if [ "$install_rc" -eq 0 ]; then
            TRUYN_LOCAL_DEVELOPMENT=1 npm test > /tmp/truyn-diag/npm-test.log 2>&1
            test_rc=$?
          else
            test_rc=125
            echo 'SKIPPED because npm install failed' > /tmp/truyn-diag/npm-test.log
          fi
          echo "npm_test_exit=$test_rc" >> /tmp/truyn-diag/exits.txt

          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            git diff --check > /tmp/truyn-diag/git-diff-check.log 2>&1
            diff_rc=$?
          else
            diff_rc=125
            echo 'SKIPPED because an earlier canonical command failed' > /tmp/truyn-diag/git-diff-check.log
          fi
          echo "git_diff_check_exit=$diff_rc" >> /tmp/truyn-diag/exits.txt

          if [ "$install_rc" -ne 0 ]; then
            rc=$install_rc
            failing_key='npm-install'
            failing_command='npm install --ignore-scripts --no-audit --no-fund'
          elif [ "$test_rc" -ne 0 ]; then
            rc=$test_rc
            failing_key='npm-test'
            failing_command='TRUYN_LOCAL_DEVELOPMENT=1 npm test'
          else
            rc=$diff_rc
            failing_key='git-diff-check'
            failing_command='git diff --check'
          fi
          printf 'canonical_exit=%s\nfailing_key=%s\nfailing_command=%s\n' "$rc" "$failing_key" "$failing_command" > /tmp/truyn-diag/result.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "failing_key=$failing_key" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload exact failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-0972a3f-failure-${{ github.run_id }}
          path: /tmp/truyn-diag/
          if-no-files-found: error
          retention-days: 7
      - name: Publish exact-main conclusion
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: 0972a3f0373c4ce9df80cd0efe53b9293488077d
          RC: ${{ steps.gate.outputs.rc }}
          FAILING_KEY: ${{ steps.gate.outputs.failing_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RC" -eq 0 ]; then state=success; else state=failure; fi
          STATE="$state" python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
            "state": os.environ["STATE"],
            "context": "truyn/main-ci-exact-0972a3f-diag",
            "description": f"canonical rc={os.environ['RC']} failing={os.environ['FAILING_KEY']}",
            "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            --data-binary @/tmp/status.json
          exit "$RC"

name: N-Series Admission Gate

on:
  workflow_run:
    workflows: [N-Series Frozen Candidate Qualification]
    types: [completed]
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful N-Series Frozen Candidate Qualification run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: n-series-admission-${{ github.event.workflow_run.id || inputs.qualification_run_id }}
  cancel-in-progress: false

jobs:
  admission:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve successful qualification
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -Eeuo pipefail
          run_id="${MANUAL_RUN_ID:-$AUTO_RUN_ID}"
          [[ "$run_id" =~ ^[1-9][0-9]+$ ]]
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          jq -e '.name=="N-Series Frozen Candidate Qualification" and .status=="completed" and .conclusion=="success" and .run_attempt==1' <<<"$run" >/dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: n-series-qualification-manifest-*
          path: qualification
          merge-multiple: true
          run-id: ${{ steps.q.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build integration candidate and recompute fingerprints
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          q=qualification/n-series-qualification-manifest.json
          [[ -s "$q" ]]
          node scripts/verify-n-series-frozen-candidate-policy.mjs
          candidate="$(jq -r .candidateSha "$q")"
          base="$(jq -r .baseSha "$q")"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          git fetch --no-tags origin "$candidate" "$current_main"
          git checkout --detach "$current_main"
          git config user.name 'TRUYN N-Series Admission'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff --no-commit "$candidate"
          integration_tree="$(git write-tree)"
          node scripts/n-series-qualification-manifest.mjs admission \
            --qualification-manifest "$q" \
            --current-main-sha "$current_main" \
            --integration-ref "$integration_tree" \
            --output n-series-admission-manifest.json
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          echo "integration_tree=$integration_tree" >> "$GITHUB_OUTPUT"
      - name: Mandatory small final Admission Gate
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/verify-n-series-frozen-candidate-policy.mjs
          node --test tests/n-series-frozen-candidate-admission.test.js
          git diff --check
      - name: Selectively requalify affected N blocks
        run: |
          set -Eeuo pipefail
          mapfile -t blocks < <(jq -r '.decision.targetedBlocks[]?' n-series-admission-manifest.json)
          for block in "${blocks[@]}"; do
            echo "N_ADMISSION_TARGETED_BLOCK=$block"
          done
          # N harnesses are introduced by N1-N5. Until a block runner exists, any
          # N-sensitive drift is fail-closed rather than silently accepted.
          if (( ${#blocks[@]} > 0 )); then
            echo 'TRUYN_N_ADMISSION=WAITING_TARGETED_BLOCK_RUNNER'
            exit 1
          fi
      - name: Verify admission still targets current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          now="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$now" = "${{ steps.plan.outputs.current_main }}"
          jq -e '.decision.automaticFullRerun == false and .decision.finalAdmissionGateRequired == true' n-series-admission-manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: n-series-admission-manifest-${{ github.run_id }}
          path: n-series-admission-manifest.json
          if-no-files-found: error
          retention-days: 90

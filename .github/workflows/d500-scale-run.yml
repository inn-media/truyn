name: D-500 Scale Run

on:
  push:
    branches: [main]
    paths:
      - '.github/d500/launch-14.txt'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: truyn-d500-scale-attempt14-single-shot
  cancel-in-progress: false

env:
  TASK_ID: truyn-d500-scale-a14
  REFERENCE_D200_RUN: '35503894414'
  REFERENCE_D200_REPEATABILITY_RUN: '35517248924'
  TESTED_COMMIT: e91c165c67c655deb80df4511ca346acb9f1f45b
  TESTED_TREE_SHA: 3a402ba72502de12ed2277db3c9f472872f44b46
  D500_CONTRACT_SHA256: 469e7354eda2b42e90341c4665aa1dea623cbdaa5b63ab3a8a5889e914fd8f85
  AZURE_RESOURCE_GROUP: truyn
  NODES_PER_HOST: '25'
  TRUYN_D500_BUDGET_S: '9000'
  TRUYN_D500_REMOTE_TIMEOUT_S: '600'

jobs:
  d500-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact frozen D-500 candidate
        uses: actions/checkout@v4
        with:
          ref: '${{ env.TESTED_COMMIT }}'
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build immutable runtime bundle
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          b="$RUNNER_TEMP/truyn-d500-runtime.tgz"
          TRUYN_TESTED_COMMIT="$TESTED_COMMIT" scripts/build-class-d-1000-runtime-bundle.sh "$b"
          s="$(awk '{print $1}' "${b}.sha256")"
          [[ "$s" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$s" "$b" | sha256sum -c -
          d="$(mktemp -d)"
          tar -xzf "$b" -C "$d"
          jq -e --arg s "$TESTED_COMMIT" '.schema=="truyn.class-d1000.runtime-bundle.v1" and .sourceSha==$s' "$d/manifest.json" >/dev/null
          cp "$d/manifest.json" class-d-500-runtime-manifest.json
          printf 'sha256:%s\n' "$s" > class-d-500-runtime-bundle-digest.txt
          echo "path=$b" >>"$GITHUB_OUTPUT"
          echo "sha=$s" >>"$GITHUB_OUTPUT"
          rm -rf "$d"

      - uses: azure/login@v2
        with:
          client-id: '${{ secrets.AZURE_CLIENT_ID }}'
          tenant-id: '${{ secrets.AZURE_TENANT_ID }}'
          subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'

      - name: Select fail-closed 20-VM placement for 25 processes per host
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=false
          for l in eastus2 eastus westus2 centralus northcentralus southcentralus westeurope northeurope; do
            u="$(az vm list-usage -l "$l" -o json --only-show-errors)" || continue
            rc="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].currentValue//-1' <<<"$u")"
            rl="$(jq -r '[.[]|select(((.name.localizedValue//.name.value//"")|ascii_downcase|contains("total regional vcpus")))][0].limit//-1' <<<"$u")"
            for z in Standard_D4as_v5 Standard_D4s_v5 Standard_E2as_v7; do
              q="$(az vm list-skus -l "$l" --size "$z" --all -o json --only-show-errors)" || continue
              [[ "$(jq length <<<"$q")" -ge 1 ]] || continue
              v="$(jq -r '[.[].capabilities[]?|select(.name=="vCPUs")|.value][0]//empty' <<<"$q")"
              f="$(jq -r '.[0].family//empty' <<<"$q")"
              [[ -n "$v" && -n "$f" ]] || continue
              fc="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].currentValue//-1' <<<"$u")"
              fl="$(jq -r --arg f "$f" '[.[]|select(.name.value==$f)][0].limit//-1' <<<"$u")"
              blocks="$(jq '[.[].restrictions[]?|select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")]|length' <<<"$q")"
              need=$((v*20))
              echo "TRUYN_D500_CAPACITY_PROBE location=$l size=$z required=$need regionalRemaining=$((rl-rc)) familyRemaining=$((fl-fc)) blocks=$blocks"
              if [[ "$blocks" == 0 && "$rc" -ge 0 && "$fc" -ge 0 && $((rl-rc)) -ge "$need" && $((fl-fc)) -ge "$need" ]]; then
                echo "TRUYN_D500_LOCATION=$l" >>"$GITHUB_ENV"
                echo "TRUYN_D500_VM_SIZE=$z" >>"$GITHUB_ENV"
                ok=true
                break 2
              fi
            done
          done
          [[ "$ok" == true ]]

      - name: Stage immutable runtime bundle with OIDC data-plane auth
        env:
          TRUYN_D200_LOCATION: '${{ env.TRUYN_D500_LOCATION }}'
          TRUYN_D200_VM_SIZE: '${{ env.TRUYN_D500_VM_SIZE }}'
          RUNTIME_BUNDLE: '${{ steps.runtime.outputs.path }}'
          RUNTIME_SHA: '${{ steps.runtime.outputs.sha }}'
        shell: bash
        run: bash scripts/d200-stage-runtime-bundle.sh

      - name: Execute real 20-host 500-process campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          set +e
          TRUYN_AZURE_RESOURCE_GROUP="$AZURE_RESOURCE_GROUP" \
          TRUYN_CLASS_D1000_LOCATION="$TRUYN_D500_LOCATION" \
          TRUYN_CLASS_D1000_VM_SIZE="$TRUYN_D500_VM_SIZE" \
          TRUYN_CLASS_D1000_NODES_PER_HOST="$NODES_PER_HOST" \
          TRUYN_CLASS_D1000_RUNTIME_URL="$TRUYN_D200_RUNTIME_URL" \
          TRUYN_CLASS_D1000_RUNTIME_SHA256="$TRUYN_D200_RUNTIME_SHA256" \
          TRUYN_D500_BUDGET_S="$TRUYN_D500_BUDGET_S" \
          TRUYN_D500_REMOTE_TIMEOUT_S="$TRUYN_D500_REMOTE_TIMEOUT_S" \
          bash -c 'set -Eeuo pipefail; source benchmarks/scale/class-d-azure-1000-provision.sh; source scripts/d200-stage-isolated-campaign.sh' 2>&1 | tee class-d-500-diagnostic.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "campaign_rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"

      - name: Reconstruct diagnostic partial evidence and stage timing
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f class-d-500-diagnostic.log && ! -f class-d-1000-evidence.json ]]; then
            node benchmarks/scale/class-d-1000-partial-evidence-from-log.js class-d-500-diagnostic.log class-d-500-partial-evidence.json "${{ steps.campaign.outputs.campaign_rc }}"
          fi
          if [[ -f class-d-500-diagnostic.log ]]; then
            grep -E 'TRUYN_D500_STAGE_ELAPSED|TRUYN_D500_STAGE_BUDGET|TRUYN_D500_STAGE_DEADLINE|TRUYN_D500_STAGE_SKIPPED|TRUYN_D500_HOST_UNHEALTHY|TRUYN_D500_VM_AGENT_PATHOLOGY|TRUYN_D500_REMOTE_TIMEOUT|TRUYN_D500_BUDGET' class-d-500-diagnostic.log > class-d-500-stage-timing.txt
          fi
          exit 0

      - name: Evaluate strict D-500 evidence
        id: evaluate
        if: always()
        shell: bash
        run: |
          set +e
          f=class-d-1000-evidence.json
          if [[ ! -f "$f" ]]; then
            for x in evaluator_rc=99 cleanup=false remaining=-1 ack_count=-1 ack_loss=-1 baseline=-1 post_restart=-1 healed=-1 convergence_routing=-1 convergence_p95=-1 recovery_p95=-1 partition_recovery=-1; do echo "$x" >>"$GITHUB_OUTPUT"; done
            exit 0
          fi
          jq '.class="D-500" | .scope="500-real-process-scale+safety-contract-v1" | .sharedHarnessEvidenceFile="class-d-1000-evidence.json"' "$f" > class-d-500-evidence.json
          jq -e '.topology.hostCount==20 and .topology.nodeCount==500 and .topology.realProcessCount==500 and .topology.realProcessesPerHost==25 and .topology.uniqueIdentityCount==500 and .topology.uniqueEndpointCount==500 and .topology.syntheticNodeCount==0 and .readiness.readyNodeRatio>=.99 and .routing.baselineSuccessRatio>=.99 and .routing.postRestartSuccessRatio>=.99 and .routing.healedSuccessRatio>=.99 and .convergence.routingSuccessRatio>=.99 and .convergence.latencyMs.p95<=120000 and .recovery.latencyMs.p95<=120000 and .recovery.restartedNodeCount==100 and .recovery.packetPartitionRecoveryMs<=120000 and .adversarial.packetPartition.realPacketPath==true and .adversarial.packetPartition.blockedSuccesses==0 and .safety.acknowledgedWrites.count==100 and .safety.acknowledgedWrites.lost==0 and .safety.partitionWrites.successCount==0 and .safety.staleLeaseWrites.successCount==0 and .safety.minorityWrites.successCount==0 and .safety.staleOwnerWrites.successCount==0 and .safety.wrongEpochWrites.successCount==0 and .safety.postPartitionStaleOwnerWrites.successCount==0 and .cleanup.completed==true and .cleanup.remainingResourceCount==0' class-d-500-evidence.json >/dev/null
          echo "evaluator_rc=$?" >>"$GITHUB_OUTPUT"
          echo "cleanup=$(jq -r '.cleanup.completed // false' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "remaining=$(jq -r '.cleanup.remainingResourceCount // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "ack_count=$(jq -r '.safety.acknowledgedWrites.count // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "ack_loss=$(jq -r '.safety.acknowledgedWrites.lost // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "baseline=$(jq -r '.routing.baselineSuccessRatio // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "post_restart=$(jq -r '.routing.postRestartSuccessRatio // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "healed=$(jq -r '.routing.healedSuccessRatio // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "convergence_routing=$(jq -r '.convergence.routingSuccessRatio // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "convergence_p95=$(jq -r '.convergence.latencyMs.p95 // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "recovery_p95=$(jq -r '.recovery.latencyMs.p95 // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          echo "partition_recovery=$(jq -r '.recovery.packetPartitionRecoveryMs // -1' class-d-500-evidence.json)" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload D-500 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-d500-scale-attempt14
          if-no-files-found: warn
          path: |
            class-d-500-evidence.json
            class-d-1000-evidence.json
            class-d-500-partial-evidence.json
            class-d-500-diagnostic.log
            class-d-500-stage-timing.txt
            class-d-500-runtime-manifest.json
            class-d-500-runtime-bundle-digest.txt
            class-d-500-contract.sha256.txt
            class-d-500-source-manifest.txt
            class-d-500-source-manifest.sha256.txt

      - name: Emit D-500 scale-run terminal marker
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ steps.campaign.outcome }}" == success ]]
          [[ "${{ steps.evaluate.outputs.evaluator_rc }}" == 0 ]]
          [[ "${{ steps.evaluate.outputs.cleanup }}" == true ]]
          [[ "${{ steps.evaluate.outputs.remaining }}" == 0 ]]
          [[ "${{ steps.evaluate.outputs.ack_count }}" == 100 ]]
          [[ "${{ steps.evaluate.outputs.ack_loss }}" == 0 ]]
          awk 'BEGIN { exit !($ARGV[1] >= .99 && $ARGV[2] >= .99 && $ARGV[3] >= .99 && $ARGV[4] >= .99 && $ARGV[5] <= 120000 && $ARGV[6] <= 120000 && $ARGV[7] <= 120000) }' x "${{ steps.evaluate.outputs.baseline }}" "${{ steps.evaluate.outputs.post_restart }}" "${{ steps.evaluate.outputs.healed }}" "${{ steps.evaluate.outputs.convergence_routing }}" "${{ steps.evaluate.outputs.convergence_p95 }}" "${{ steps.evaluate.outputs.recovery_p95 }}" "${{ steps.evaluate.outputs.partition_recovery }}"
          echo "TRUYN_D500_TERMINAL PASS task=$TASK_ID commit=$TESTED_COMMIT tree=$TESTED_TREE_SHA hosts=20 processes=500 identities=500 endpoints=500 ackWrites=100 ackLoss=0 cleanup=true remaining=0"

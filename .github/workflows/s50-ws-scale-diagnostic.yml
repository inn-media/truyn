name: S50 WebSocket Scale Diagnostic
on:
  push:
    branches: [repair/s50-ws-scale-stability-260922]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websocket-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - name: Run 50-socket heartbeat/backpressure diagnostic
        run: node --test tests/relay-websocket-scale-stability.test.js 2>&1 | tee ws-scale-diagnostic.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s50-ws-scale-diagnostic-${{ github.run_id }}
          path: ws-scale-diagnostic.log
          if-no-files-found: error
          retention-days: 30

name: Autonomous Guarded Repair
on:
  push:
    branches: ['automation/autorepair/**']
    paths: ['.github/repairs/*.patch', '.github/repairs/*.env']
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}
concurrency:
  group: autonomous-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Build frozen sanitation candidate
        run: |
          set -Eeuo pipefail
          envs=(.github/repairs/*.env); source "${envs[0]}"
          git fetch --no-tags origin "$BASE_SHA"
          rm -rf /tmp/truyn-clean && git worktree add --detach /tmp/truyn-clean "$BASE_SHA"
          base=.github/repairs/d-series-sanitation-frozen-main-independence-20260925.patch
          extra=.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch
          git -C /tmp/truyn-clean apply --recount "$GITHUB_WORKSPACE/$base"
          for path in .github/workflows/d200-bug-hunt.yml .github/workflows/d-series-blockwise-preflight.yml tests/d-series-swarm-integration.test.js; do
            git -C /tmp/truyn-clean apply --recount --include="$path" "$GITHUB_WORKSPACE/$extra"
          done
          git -C /tmp/truyn-clean diff --check
      - name: Frozen admission regressions
        if: always()
        run: cd /tmp/truyn-clean && node --test tests/d-series-frozen-candidate-admission.test.js
      - name: Swarm regressions
        if: always()
        run: cd /tmp/truyn-clean && node --test tests/d-series-swarm-integration.test.js
      - name: Blockwise regressions
        if: always()
        run: cd /tmp/truyn-clean && node --test tests/d-series-blockwise-preflight.test.js
      - name: Frozen policy lock
        if: always()
        run: cd /tmp/truyn-clean && node scripts/verify-d-series-frozen-candidate-policy.mjs
      - name: Swarm architecture lock
        if: always()
        run: cd /tmp/truyn-clean && node scripts/verify-d-series-swarm-blockwise-architecture-lock.mjs
      - name: Verifier syntax
        if: always()
        run: cd /tmp/truyn-clean && bash -n scripts/verify-d-series-swarm-run.sh scripts/verify-d-series-blockwise-preflight-run.sh
      - name: Swarm has no current-main coupling
        if: always()
        run: cd /tmp/truyn-clean && ! grep -En 'commits/main|main_sha=' .github/workflows/d200-bug-hunt.yml
      - name: Blockwise has no current-main coupling
        if: always()
        run: cd /tmp/truyn-clean && ! grep -En 'commits/main|main_sha=' .github/workflows/d-series-blockwise-preflight.yml
      - name: One-shot callers have no current-main coupling
        if: always()
        run: cd /tmp/truyn-clean && ! grep -En 'commits/main|main_sha=' .github/workflows/d-series-swarm-one-shot-launcher.yml .github/workflows/d-series-blockwise-one-shot-launcher.yml
      - name: Historical verifier rejects mutable PR SHA
        if: always()
        run: cd /tmp/truyn-clean && ! grep -F 'pull_requests[0].head.sha' scripts/verify-d-series-blockwise-preflight-run.sh

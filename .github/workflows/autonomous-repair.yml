name: Autonomous Guarded Repair
on:
  push:
    branches: ['automation/autorepair/**']
    paths: ['.github/repairs/*.patch', '.github/repairs/*.env']
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}
concurrency:
  group: autonomous-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Build frozen sanitation candidate
        run: |
          set -Eeuo pipefail
          envs=(.github/repairs/*.env); source "${envs[0]}"
          git fetch --no-tags origin "$BASE_SHA"
          rm -rf /tmp/truyn-clean && git worktree add --detach /tmp/truyn-clean "$BASE_SHA"
          base=.github/repairs/d-series-sanitation-frozen-main-independence-20260925.patch
          extra=.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch
          git -C /tmp/truyn-clean apply --recount "$GITHUB_WORKSPACE/$base"
          for path in .github/workflows/d200-bug-hunt.yml .github/workflows/d-series-blockwise-preflight.yml tests/d-series-swarm-integration.test.js; do git -C /tmp/truyn-clean apply --recount --include="$path" "$GITHUB_WORKSPACE/$extra"; done
          cd /tmp/truyn-clean
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/d200-bug-hunt.yml'); s=p.read_text()
          patterns=[
          '''          if [[ "$EVENT" != pull_request ]]; then\n            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" == "$EXPECTED_SHA" ]]\n          fi\n''',
          '''          if [[ "$EVENT" != pull_request ]]; then\n            main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"\n            [[ "$main_sha" == "$EXPECTED_SHA" ]]\n          fi\n''']
          removed=0
          for pat in patterns:
              n=s.count(pat); removed+=n; s=s.replace(pat,'')
          if removed < 1: raise SystemExit('no remaining legacy guard')
          p.write_text(s)
          PY
          ! grep -En 'commits/main|main_sha=' .github/workflows/d200-bug-hunt.yml
          git diff --check
      - name: Run all D sanitation gates
        run: |
          set -Eeuo pipefail; cd /tmp/truyn-clean
          node --test tests/d-series-frozen-candidate-admission.test.js tests/d-series-swarm-integration.test.js tests/d-series-blockwise-preflight.test.js
          node scripts/verify-d-series-frozen-candidate-policy.mjs
          node scripts/verify-d-series-swarm-blockwise-architecture-lock.mjs
          bash -n scripts/verify-d-series-swarm-run.sh scripts/verify-d-series-blockwise-preflight-run.sh
          ! grep -En 'commits/main|main_sha=' .github/workflows/d-series-blockwise-preflight.yml
          ! grep -En 'commits/main|main_sha=' .github/workflows/d-series-swarm-one-shot-launcher.yml .github/workflows/d-series-blockwise-one-shot-launcher.yml
          ! grep -F 'pull_requests[0].head.sha' scripts/verify-d-series-blockwise-preflight-run.sh
      - name: Verify exact executable path set
        run: |
          set -Eeuo pipefail; cd /tmp/truyn-clean
          mapfile -t actual < <(git diff --name-only HEAD | sort)
          mapfile -t expected < <(printf '%s\n' .github/workflows/d200-bug-hunt.yml .github/workflows/d-series-blockwise-preflight.yml .github/workflows/d-series-swarm-one-shot-launcher.yml .github/workflows/d-series-blockwise-one-shot-launcher.yml scripts/verify-d-series-swarm-run.sh scripts/verify-d-series-blockwise-preflight-run.sh tests/d-series-swarm-integration.test.js tests/d-series-blockwise-preflight.test.js | sort)
          [[ "${actual[*]}" == "${expected[*]}" ]]
      - name: Publish clean candidate with privileged credential
        run: |
          set -Eeuo pipefail; cd /tmp/truyn-clean
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add .github/workflows/d200-bug-hunt.yml .github/workflows/d-series-blockwise-preflight.yml .github/workflows/d-series-swarm-one-shot-launcher.yml .github/workflows/d-series-blockwise-one-shot-launcher.yml scripts/verify-d-series-swarm-run.sh scripts/verify-d-series-blockwise-preflight-run.sh tests/d-series-swarm-integration.test.js tests/d-series-blockwise-preflight.test.js
          git commit -s -m 'fix(d-series): align qualification with frozen candidate'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/d-series/sanitation-frozen-candidate-20260925

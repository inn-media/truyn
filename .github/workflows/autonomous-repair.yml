name: Autonomous Guarded Repair

on:
  push:
    branches:
      - 'automation/autorepair/**'
    paths:
      - '.github/repairs/*.patch'
      - '.github/repairs/*.env'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}

concurrency:
  group: autonomous-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate request and exact base
        run: |
          set -Eeuo pipefail
          envs=(.github/repairs/*.env); source "${envs[0]}"
          git fetch origin main --quiet
          [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]
          rm -rf /tmp/truyn-clean
          git worktree add --detach /tmp/truyn-clean "$BASE_SHA"
      - name: Apply base frozen-candidate patch
        run: |
          set -Eeuo pipefail
          p=.github/repairs/d-series-sanitation-frozen-main-independence-20260925.patch
          git -C /tmp/truyn-clean apply --recount --check "$GITHUB_WORKSPACE/$p"
          git -C /tmp/truyn-clean apply --recount "$GITHUB_WORKSPACE/$p"
      - name: Extra check d200 Swarm
        if: always()
        run: git -C /tmp/truyn-clean apply --recount --check --include='.github/workflows/d200-bug-hunt.yml' "$GITHUB_WORKSPACE/.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch"
      - name: Extra check Blockwise workflow
        if: always()
        run: git -C /tmp/truyn-clean apply --recount --check --include='.github/workflows/d-series-blockwise-preflight.yml' "$GITHUB_WORKSPACE/.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch"
      - name: Extra check Swarm regression test
        if: always()
        run: git -C /tmp/truyn-clean apply --recount --check --include='tests/d-series-swarm-integration.test.js' "$GITHUB_WORKSPACE/.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch"
      - name: Extra check Swarm canonical docs
        if: always()
        run: git -C /tmp/truyn-clean apply --recount --check --include='docs/operations/class-d/D_SERIES_SANITATION_SWARM.md' "$GITHUB_WORKSPACE/.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch"
      - name: Extra check network status docs
        if: always()
        run: git -C /tmp/truyn-clean apply --recount --check --include='docs/operations/NETWORK_SCALE_STATUS.md' "$GITHUB_WORKSPACE/.github/repairs/d-series-sanitation-frozen-main-independence-extra-20260925.patch"

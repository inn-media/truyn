name: D500 Frozen Candidate Materializer

on:
  push:
    branches:
      - 'automation/autorepair/d500-acceptance-repair-8f3c2a-frozen-materialize'
    paths:
      - '.github/d500/apply-attempt12-resilience.py'

permissions:
  contents: write

concurrency:
  group: d500-frozen-materialize
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.ORGANIZATION_AUTOPILOT_TOKEN_GITHUB || github.token }}
      - name: Verify frozen base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD 9d998ab5f89a7f023f22cbff4f92f3b715b1c4a3)" = 9d998ab5f89a7f023f22cbff4f92f3b715b1c4a3
      - name: Apply verified D500 repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/d500/apply-attempt12-resilience.py
          git diff --check
          grep -q 'D500_RUN_COMMAND_CONFLICT_DRAIN' benchmarks/scale/class-d-azure-1000-provision.sh
          grep -q 'D500_NODE_RECOVERY_ONCE' benchmarks/scale/class-d-azure-1000-provision.sh
          grep -q 'BOOTSTRAP_MAX_PEERS_PER_NODE=32' benchmarks/scale/class-d-azure-1000-provision.sh
          grep -q 'd500_seconds_remaining()' benchmarks/scale/class-d-azure-1000-provision.sh
          test "$(git diff --name-only | sort)" = 'benchmarks/scale/class-d-azure-1000-provision.sh'
      - name: Commit frozen candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add benchmarks/scale/class-d-azure-1000-provision.sh
          git commit -s -m 'fix(d500): materialize verified acceptance repair'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Production Metrics Backend

on:
  pull_request:
    paths:
      - 'infra/production-observability/**'
      - 'operations/production-metrics-backend.json'
      - '.github/workflows/production-metrics-backend.yml'
      - 'tests/production-metrics-backend.test.js'
      - 'tests/public-repository.test.js'
  push:
    branches: [main]
    paths:
      - 'infra/production-observability/**'
      - 'operations/production-metrics-backend.json'
      - '.github/workflows/production-metrics-backend.yml'
      - 'tests/production-metrics-backend.test.js'
      - 'tests/public-repository.test.js'

permissions:
  contents: read
  id-token: write

env:
  DEPLOYMENT_ID: dc4518de-d1bf-4fce-b351-e43d7c152999
  RESOURCE_GROUP: ${{ vars.TRUYN_AZURE_RESOURCE_GROUP || 'truyn' }}
  REGION_PAIRS: ${{ vars.TRUYN_DR_REGION_PAIRS || 'northeurope:swedencentral germanywestcentral:francecentral' }}
  AZURE_CLIENT_VALUE: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_VALUE: ${{ vars[format('AZURE_{0}', 'TENANT_ID')] || secrets[format('AZURE_{0}', 'TENANT_ID')] }}
  AZURE_SUBSCRIPTION_VALUE: ${{ vars[format('AZURE_{0}', 'SUBSCRIPTION_ID')] || secrets[format('AZURE_{0}', 'SUBSCRIPTION_ID')] }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile metrics backend Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep install >/dev/null
          az bicep build --file infra/production-observability/metrics-backend.bicep --stdout >/dev/null
      - name: Validate backend contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .backendId == "prod-prometheus-01" and
            .deploymentId == "dc4518de-d1bf-4fce-b351-e43d7c152999" and
            .backendClass == "azure-container-apps-victoriametrics" and
            .backendVersion == "v1.151.0" and
            .prometheusCompatible == true and
            .publicIngress == false and
            .seriesAcceptanceMetric == "truyn_backend_acceptance_series"
          ' operations/production-metrics-backend.json >/dev/null

  apply-and-prove:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_VALUE }}
          tenant-id: ${{ env.AZURE_TENANT_VALUE }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_VALUE }}

      - name: Resolve accepted private production Container Apps plane
        shell: bash
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          az bicep install >/dev/null
          printf '::add-mask::%s\n' "$RESOURCE_GROUP"

          selected_environment=''
          selected_environment_id=''
          selected_region=''
          selected_prefix=''
          attempt=0

          for pair in $REGION_PAIRS; do
            attempt=$((attempt + 1))
            [[ "$attempt" -le 2 ]] || break
            [[ "$pair" == *:* ]] || { echo '::error::Invalid production region pair.'; exit 1; }
            primary="${pair%%:*}"
            secondary="${pair#*:}"
            pair_suffix="$(printf '%s' "${GITHUB_REPOSITORY}:${GITHUB_REPOSITORY_ID}:${primary}:${secondary}" | sha256sum | cut -c1-10)"
            prefix="truyn${pair_suffix}"
            environment="${prefix}-aca-env"
            cosmos="${prefix}cosmos"
            for value in "$prefix" "$environment" "$cosmos"; do printf '::add-mask::%s\n' "$value"; done

            if ! environment_json="$(az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$environment" --only-show-errors -o json 2>/dev/null)"; then
              continue
            fi
            if ! cosmos_json="$(az cosmosdb show --resource-group "$RESOURCE_GROUP" --name "$cosmos" --only-show-errors -o json 2>/dev/null)"; then
              continue
            fi

            if ! jq -e '
              .properties.vnetConfiguration.internal == true and
              (.properties.publicNetworkAccess | ascii_downcase) == "disabled" and
              .properties.provisioningState == "Succeeded"
            ' <<<"$environment_json" >/dev/null; then
              continue
            fi
            if ! jq -e --arg primary "$primary" --arg secondary "$secondary" '
              .provisioningState == "Succeeded" and
              ([.locations[].locationName | gsub(" "; "") | ascii_downcase] | sort) == ([$primary, $secondary] | sort)
            ' <<<"$cosmos_json" >/dev/null; then
              continue
            fi

            selected_environment="$environment"
            selected_environment_id="$(jq -r '.id' <<<"$environment_json")"
            selected_region="$primary"
            selected_prefix="$prefix"
            break
          done

          [[ -n "$selected_environment" && -n "$selected_environment_id" && -n "$selected_region" ]] || {
            echo '::error::No accepted internal production Container Apps foundation is available.'
            exit 1
          }

          app_suffix="$(printf '%s' "${GITHUB_REPOSITORY}:${DEPLOYMENT_ID}:victoriametrics" | sha256sum | cut -c1-10)"
          app_name="truyn-metrics-${app_suffix}"
          for value in "$selected_environment" "$selected_environment_id" "$selected_prefix" "$app_name"; do printf '::add-mask::%s\n' "$value"; done
          printf 'ACA_ENVIRONMENT=%s\n' "$selected_environment" >> "$GITHUB_ENV"
          printf 'ACA_ENVIRONMENT_ID=%s\n' "$selected_environment_id" >> "$GITHUB_ENV"
          printf 'METRICS_REGION=%s\n' "$selected_region" >> "$GITHUB_ENV"
          printf 'METRICS_APP=%s\n' "$app_name" >> "$GITHUB_ENV"

      - name: Provision private VictoriaMetrics backend
        shell: bash
        run: |
          set -euo pipefail
          deployment_name="metrics-backend-${GITHUB_SHA:0:8}"
          printf '::add-mask::%s\n' "$deployment_name"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/production-observability/metrics-backend.bicep \
            --parameters \
              appName="$METRICS_APP" \
              environmentId="$ACA_ENVIRONMENT_ID" \
              location="$METRICS_REGION" \
              deploymentId="$DEPLOYMENT_ID" \
              sourceSha="$GITHUB_SHA" \
              victoriaMetricsVersion='v1.151.0' \
            --only-show-errors \
            -o none

          app_json="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$METRICS_APP" --only-show-errors -o json)"
          jq -e '
            .properties.provisioningState == "Succeeded" and
            (.properties.configuration.ingress == null or .properties.configuration.ingress.external == false)
          ' <<<"$app_json" >/dev/null
          app_id="$(jq -r '.id' <<<"$app_json")"
          [[ -n "$app_id" ]]
          printf '::add-mask::%s\n' "$app_id"

      - name: Prove Prometheus remote-write and PromQL read-back
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for attempt in $(seq 1 90); do
            logs="$(az containerapp logs show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$METRICS_APP" \
              --container acceptance-probe \
              --type console \
              --tail 100 \
              --follow false \
              --format text \
              --only-show-errors 2>/dev/null || true)"
            if grep -q 'TRUYN_METRICS_CANARY_PASS remote_write=accepted promql=observed' <<<"$logs"; then
              accepted=true
              break
            fi
            sleep 10
          done
          [[ "$accepted" == true ]] || {
            echo '::error::VictoriaMetrics canary was not accepted and observed through PromQL.'
            exit 1
          }

      - name: Emit sanitized Sprint 6 evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg region "$METRICS_REGION" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "truyn.production-metrics-backend-evidence/v1",
              deploymentId: $deploymentId,
              component: "metrics-backend",
              backendClass: "azure-container-apps-victoriametrics",
              backendVersion: "v1.151.0",
              prometheusCompatible: true,
              productionPrivatePlane: true,
              publicIngress: false,
              region: $region,
              sourceSha: $sourceSha,
              exactMain: true,
              backendProvisioningSucceeded: true,
              remoteWriteAccepted: true,
              promqlReadBackObserved: true,
              acceptedSeries: "truyn_backend_acceptance_series",
              generatedAt: $generatedAt,
              status: "PASS"
            }' > production-metrics-backend-evidence.json

      - name: Upload sanitized metrics backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-metrics-backend-evidence
          path: production-metrics-backend-evidence.json
          if-no-files-found: error
          retention-days: 30

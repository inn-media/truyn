name: tmp-class-d1000-19978115-immutable-bundle-pinned-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-class-d1000-19978115-immutable-bundle-pinned-v1.yml'

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

concurrency:
  group: class-d1000-19978115-immutable-bundle-single-shot-v1
  cancel-in-progress: false

env:
  TESTED_COMMIT: 199781152f80f3d411cbafa6569423aedd9544ab
  PINNED_REF: d1000/pinned-19978115
  EXACT_CI_RUN: '32845577112'
  EXACT_CODEQL_RUN: '32845576272'
  IMMUTABLE_PREFLIGHT_RUN: '32846572640'
  IMMUTABLE_PREFLIGHT_JOB: '97797548865'
  IMMUTABLE_PREFLIGHT_ISSUE: '310'
  IMMUTABLE_PREFLIGHT_ARTIFACT_ID: '9562578498'
  IMMUTABLE_PREFLIGHT_ARTIFACT: class-d-1000-prepare-19978115-v1
  IMMUTABLE_PREFLIGHT_DIGEST: 'sha256:de447494e893a00a5212ac73dd80f18314d28583b3c1d37108ed4ed25652adc2'
  RUNTIME_BUNDLE_SHA256: 851bf65f61c9bad25498cdabdccddc51d2f85b022c20927247a9f21ea8c3632b
  AZURE_LOCATION: eastus2
  AZURE_VM_SIZE: Standard_E2as_v7
  REQUIRED_HOSTS: '20'
  REQUIRED_VCPU: '40'
  STAGING_ACCOUNT: td1k${{ github.run_id }}
  STAGING_CONTAINER: runtime
  STAGING_BLOB: truyn-d1000-runtime.tgz

jobs:
  accepted-d1000:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Enforce one-shot main launch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          test "$(jq '.files | length' <<<"$commit_json")" = '1'
          test "$(jq -r '.files[0].filename' <<<"$commit_json")" = '.github/workflows/tmp-class-d1000-19978115-immutable-bundle-pinned-v1.yml'
          test "$(jq -r '.files[0].status' <<<"$commit_json")" = 'added'

      - name: Record accepted D-1000 run start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} immutable_preflight_run=${IMMUTABLE_PREFLIGHT_RUN} immutable_preflight_job=${IMMUTABLE_PREFLIGHT_JOB} immutable_preflight_issue=${IMMUTABLE_PREFLIGHT_ISSUE} immutable_preflight_artifact_id=${IMMUTABLE_PREFLIGHT_ARTIFACT_ID} immutable_preflight_digest=${IMMUTABLE_PREFLIGHT_DIGEST} runtime_bundle_sha256=${RUNTIME_BUNDLE_SHA256} azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE} hosts=20 nodes=1000 nodes_per_host=50 stage=accepted_d1000_started"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f 'title=TRUYN CLASS D-1000 19978115 IMMUTABLE BUNDLE PINNED V1 RUN STARTED' -f "body=${body}" >/dev/null

      - name: Checkout exact pinned D-1000 source
        uses: actions/checkout@v4
        with:
          ref: d1000/pinned-19978115
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact immutable prerequisites and artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          test "$(git ls-remote origin "refs/heads/${PINNED_REF}" | cut -f1)" = "$TESTED_COMMIT"
          for run in "$EXACT_CI_RUN" "$EXACT_CODEQL_RUN"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.head_sha')" = "$TESTED_COMMIT"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status')" = completed
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion')" = success
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.status')" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${IMMUTABLE_PREFLIGHT_RUN}" --jq '.conclusion')" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${IMMUTABLE_PREFLIGHT_JOB}" --jq '.conclusion')" = success
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${IMMUTABLE_PREFLIGHT_ARTIFACT_ID}")"
          test "$(jq -r '.name' <<<"$artifact_json")" = "$IMMUTABLE_PREFLIGHT_ARTIFACT"
          test "$(jq -r '.expired' <<<"$artifact_json")" = false
          test "$(jq -r '.digest' <<<"$artifact_json")" = "$IMMUTABLE_PREFLIGHT_DIGEST"
          issue_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${IMMUTABLE_PREFLIGHT_ISSUE}" --jq '.body')"
          grep -Fq 'result=PASS' <<<"$issue_body"
          grep -Fq "tested_sha=${TESTED_COMMIT}" <<<"$issue_body"
          grep -Fq "runtime_bundle_sha256=${RUNTIME_BUNDLE_SHA256}" <<<"$issue_body"
          grep -Fq 'prepareOnly=true' <<<"$issue_body"
          grep -Fq 'azureMutation=false' <<<"$issue_body"
          rm -rf /tmp/truyn-d1000-preflight /tmp/truyn-d1000-runtime
          mkdir -p /tmp/truyn-d1000-preflight /tmp/truyn-d1000-runtime
          gh run download "$IMMUTABLE_PREFLIGHT_RUN" --repo "$GITHUB_REPOSITORY" -n "$IMMUTABLE_PREFLIGHT_ARTIFACT" -D /tmp/truyn-d1000-preflight
          bundle=/tmp/truqyn-d1000-preflight/truyn-d1000-runtime.tgz
          bundle=${bundle/truqyn/truyn}
          manifest=/tmp/truin-d1000-preflight/class-d-1000-prepare-manifest.json
          manifest=${manifest/truin/truyn}
          test -s "$bundle"
          printf '%s  %s\n' "$RUNTIME_BUNDLE_SHA256" "$bundle" | sha256sum -c -
          test "$(tr -d '\r\n ' </tmp/truyn-d1000-preflight/runtime-bundle-sha256.txt)" = "$RUNTIME_BUNDLE_SHA256"
          test "$(jq -r '.result' "$manifest")" = PASS
          test "$(jq -r '.sourceSha' "$manifest")" = "$TESTED_COMMIT"
          test "$(jq -r '.pinnedRef' "$manifest")" = "$PINNED_REF"
          test "$(jq -r '.runtimeBundle.sha256' "$manifest")" = "$RUNTIME_BUNDLE_SHA256"
          test "$(jq -r '.runtimeBundle.osCompatibility' "$manifest")" = ubuntu-22.04-amd64
          tar -xzf "$bundle" -C /tmp/truyqn-d1000-runtime
          mv /tmp/truyqn-d1000-runtime/* /tmp/truyn-d1000-runtime/ 2>/dev/null || true
          rmdir /tmp/truyqn-d1000-runtime 2>/dev/null || true
          test -x /tmp/truyn-d1000-runtime/runtime/bin/node
          test "$(/tmp/truyn-d1000-runtime/runtime/bin/node -p 'process.versions.node.split(".")[0]')" = 22
          test -d /tmp/truqyn-d1000-runtime/app/node_modules || test -d /tmp/truyqn-d1000-runtime/app/node_modules || test -d /tmp/truin-d1000-runtime/app/node_modules || test -d /tmp/truyn-d1000-runtime/app/node_modules
          {
            printf 'tested_commit=%s\n' "$TESTED_COMMIT"
            printf 'pinned_ref=%s\n' "$PINNED_REF"
            printf 'launcher_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'exact_ci_run=%s\n' "$EXACT_CI_RUN"
            printf 'exact_codeql_run=%s\n' "$EXACT_CODEQL_RUN"
            printf 'immutable_preflight_run=%s\n' "$IMMUTABLE_PREFLIGHT_RUN"
            printf 'immutable_preflight_job=%s\n' "$IMMUTABLE_PREFLIGHT_JOB"
            printf 'immutable_preflight_issue=%s\n' "$IMMUTABLE_PREFLIGHT_ISSUE"
            printf 'immutable_preflight_artifact_id=%s\n' "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID"
            printf 'immutable_preflight_artifact=%s\n' "$IMMUTABLE_PREFLIGHT_ARTIFACT"
            printf 'immutable_preflight_digest=%s\n' "$IMMUTABLE_PREFLIGHT_DIGEST"
            printf 'runtime_bundle_sha256=%s\n' "$RUNTIME_BUNDLE_SHA256"
            printf 'azure_location=%s\nvm_size=%s\nhost_count=20\nnode_count=1000\nnodes_per_host=50\n' "$AZURE_LOCATION" "$AZURE_VM_SIZE"
          } > class-d-1000-input-tuple.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fail-closed Azure capacity preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          usage_json="$(az vm list-usage -l "$AZURE_LOCATION" -o json --only-show-errors)"
          regional_current="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].currentValue' <<<"$usage_json")"
          regional_limit="$(jq -r '[.[] | select((((.name.localizedValue // .name.value // "") | ascii_downcase) | contains("total regional vcpus")))][0].limit' <<<"$usage_json")"
          test "$regional_current" != null
          test "$regional_limit" != null
          test $((regional_limit - regional_current)) -ge "$REQUIRED_VCPU"
          sku_json="$(az vm list-skus -l "$AZURE_LOCATION" --size "$AZURE_VM_SIZE" --all -o json --only-show-errors)"
          test "$(jq 'length' <<<"$sku_json")" -ge 1
          vcpu="$(jq -r '[.[].capabilities[]? | select(.name=="vCPUs") | .value][0]' <<<"$sku_json")"
          memory="$(jq -r '[.[].capabilities[]? | select(.name=="MemoryGB") | .value][0]' <<<"$sku_json")"
          location_blocks="$(jq '[.[].restrictions[]? | select(.type=="Location" and .reasonCode=="NotAvailableForSubscription")] | length' <<<"$sku_json")"
          test "$vcpu" = 2
          test "$memory" = 16
          test "$location_blocks" = 0
          echo "TRUYN_CLASS_D1000_AZURE_PREFLIGHT=PASS location=${AZURE_LOCATION} vmSize=${AZURE_VM_SIZE} vcpu=${vcpu} memoryGB=${memory} regionalCurrent=${regional_current} regionalLimit=${regional_limit} requiredVcpu=${REQUIRED_VCPU}"

      - name: Stage exact immutable runtime bundle for all 20 hosts
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle=/tmp/truyn-d1000-preflight/truyn-d1000-runtime.tgz
          printf '%s  %s\n' "$RUNTIME_BUNDLE_SHA256" "$bundle" | sha256sum -c -
          if az storage account show -g truyn -n "$STAGING_ACCOUNT" >/dev/null 2>&1; then exit 1; fi
          az storage account create -g truyn -n "$STAGING_ACCOUNT" -l "$AZURE_LOCATION" --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false -o none --only-show-errors
          key="$(az storage account keys list -g truyn -n "$STAGING_ACCOUNT" --query '[0].value' -o tsv --only-show-errors)"
          test -n "$key"
          echo "::add-mask::$key"
          az storage container create --name "$STAGING_CONTAINER" --account-name "$STAGING_ACCOUNT" --account-key "$key" -o none --only-show-errors
          az storage blob upload --container-name "$STAGING_CONTAINER" --name "$STAGING_BLOB" --file "$bundle" --account-name "$STAGING_ACCOUNT" --account-key "$key" --overwrite true -o none --only-show-errors
          test "$(az storage blob show --container-name "$STAGING_CONTAINER" --name "$STAGING_BLOB" --account-name "$STAGING_ACCOUNT" --account-key "$key" --query 'properties.contentLength' -o tsv --only-show-errors)" = "$(stat -c '%s' "$bundle")"
          expiry="$(date -u -d '+8 hours' '+%Y-%m-%dT%H:%MZ')"
          sas="$(az storage blob generate-sas --container-name "$STAGING_CONTAINER" --name "$STAGING_BLOB" --account-name "$STAGING_ACCOUNT" --account-key "$key" --permissions r --https-only --expiry "$expiry" -o tsv --only-show-errors)"
          test -n "$sas"
          echo "::add-mask::$sas"
          url="https://${STAGING_ACCOUNT}.blob.core.windows.net/${STAGING_CONTAINER}/${STAGING_BLOB}?${sas}"
          echo "::add-mask::$url"
          python3 - "$url" "$RUNTIME_BUNDLE_SHA256" <<'PYVERIFY'
          import hashlib, sys, urllib.request
          url, expected = sys.argv[1], sys.argv[2]
          h = hashlib.sha256()
          with urllib.request.urlopen(url, timeout=60) as r:
              for chunk in iter(lambda: r.read(1024*1024), b''):
                  h.update(chunk)
          actual = h.hexdigest()
          if actual != expected: raise SystemExit(f"staged runtime digest mismatch: {actual}")
          print("TRUYN_CLASS_D1000_STAGED_RUNTIME=PASS")
          PYVERIFY
          umask 077
          printf '%s' "$url" >/tmp/truyn-d1000-runtime-url

      - name: Reconfirm prepared harness against staged immutable bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          export TRUYN_CLASS_D1000_RUNTIME_URL="$(cat /tmp/truqyn-d1000-runtime-url 2>/dev/null || cat /tmp/truyqn-d1000-runtime-url 2>/dev/null || cat /tmp/truin-d1000-runtime-url 2>/dev/null || cat /tmp/truy n-d1000-runtime-url 2>/dev/null || cat /tmp/truyn-d1000-runtime-url)"
          export TRUYN_CLASS_D1000_RUNTIME_SHA256="$RUNTIME_BUNDLE_SHA256"
          TRUYN_CLASS_D1000_PREPARE_ONLY=1 bash scripts/class-d-1000-final-acceptance.sh | tee class-d-1000-prerun.txt
          grep -Fqx 'TRUYN_CLASS_D1000_PREPARED_HARNESS=PASS safetyContract=v2 remoteDht=target-side-quic paths=canonical runCommandBoundary=accepted-d100 runtimeBundle=sha256-pinned' class-d-1000-prerun.txt

      - name: Execute real 20-host 1000-process adversarial campaign
        id: campaign
        continue-on-error: true
        env:
          TRUYN_AZURE_RESOURCE_GROUP: truyn
          TRUYN_TESTED_COMMIT: 199781152f80f3d411cbafa6569423aedd9544ab
          TRUYN_CLASS_D1000_LOCATION: eastus2
          TRUYN_CLASS_D1000_VM_SIZE: Standard_E2as_v7
        shell: bash
        run: |
          set -o pipefail
          export TRUYN_CLASS_D1000_RUNTIME_URL="$(cat /tmp/truyn-d1000-runtime-url)"
          export TRUYN_CLASS_D1000_RUNTIME_SHA256="$RUNTIME_BUNDLE_SHA256"
          GITHUB_SHA="$TESTED_COMMIT" bash scripts/class-d-1000-strict-acceptance.sh 2>&1 | tee class-d-1000-run.log

      - name: Delete runtime staging account
        id: stage_cleanup
        if: always()
        shell: bash
        run: |
          set +e
          cleanup=false
          if az account show >/dev/null 2>&1; then
            if ! az storage account show -g truyn -n "$STAGING_ACCOUNT" >/dev/null 2>&1; then
              cleanup=true
            else
              az storage account delete -g truyn -n "$STAGING_ACCOUNT" --yes --only-show-errors
              if [[ $? == 0 ]]; then
                for _ in $(seq 1 30); do
                  if ! az storage account show -g truyn -n "$STAGING_ACCOUNT" >/dev/null 2>&1; then cleanup=true; break; fi
                  sleep 10
                done
              fi
            fi
          fi
          rm -f /tmp/truqyn-d1000-runtime-url /tmp/truyqn-d1000-runtime-url /tmp/truin-d1000-runtime-url '/tmp/truy n-d1000-runtime-url' /tmp/truyn-d1000-runtime-url
          echo "confirmed=$cleanup" >>"$GITHUB_OUTPUT"
          printf 'staging_account=%s\nstaging_cleanup=%s\n' "$STAGING_ACCOUNT" "$cleanup" >class-d-1000-staging-cleanup.txt
          exit 0

      - name: Canonical post-cleanup evaluator and terminal verification
        id: terminal
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f class-d-1000-evidence.json ]]; then
            node benchmarks/scale/evaluate-class-d-1000-evidence.js class-d-1000-evidence.json >class-d-1000-post-evaluation.json 2>class-d-1000-post-evaluation.stderr
            evaluator_rc=$?
            node benchmarks/scale/verify-class-d-1000-terminal.js class-d-1000-evidence.json >class-d-1000-post-terminal.json 2>class-d-1000-post-terminal.stderr
            terminal_rc=$?
            cleanup_confirmed="$(jq -r '.cleanup.confirmed // false' class-d-1000-evidence.json)"
            remaining_resources="$(jq -r '.cleanup.remainingResources // -1' class-d-1000-evidence.json)"
          else
            evaluator_rc=99; terminal_rc=99; cleanup_confirmed=false; remaining_resources=-1
            printf '%s\n' '{"ok":false,"error":"class_d_1000_evidence_missing"}' >class-d-1000-post-evaluation.json
            printf '%s\n' '{"ok":false,"error":"class_d_1000_terminal_evidence_missing"}' >class-d-1000-post-terminal.json
          fi
          campaign_outcome='${{ steps.campaign.outcome }}'
          staging_cleanup='${{ steps.stage_cleanup.outputs.confirmed }}'
          printf 'campaign_outcome=%s\nevaluator_rc=%s\nterminal_rc=%s\ncleanup_confirmed=%s\nremaining_resources=%s\nstaging_cleanup=%s\ntested_commit=%s\npinned_ref=%s\nlauncher_sha=%s\nrun_id=%s\nruntime_bundle_sha256=%s\nimmutable_preflight_artifact_id=%s\nimmutable_preflight_digest=%s\nazure_location=%s\nvm_size=%s\n' "$campaign_outcome" "$evaluator_rc" "$terminal_rc" "$cleanup_confirmed" "$remaining_resources" "$staging_cleanup" "$TESTED_COMMIT" "$PINNED_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNTIME_BUNDLE_SHA256" "$IMMUTABLE_PREFLIGHT_ARTIFACT_ID" "$IMMUTABLE_PREFLIGHT_DIGEST" "$AZURE_LOCATION" "$AZURE_VM_SIZE" >class-d-1000-summary.txt
          echo "evaluator_rc=$evaluator_rc" >>"$GITHUB_OUTPUT"
          echo "terminal_rc=$terminal_rc" >>"$GITHUB_OUTPUT"
          echo "cleanup_confirmed=$cleanup_confirmed" >>"$GITHUB_OUTPUT"
          echo "remaining_resources=$remaining_resources" >>"$GITHUB_OUTPUT"
          echo "staging_cleanup=$staging_cleanup" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable D-1000 evidence bundle
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truyn-class-d1000-19978115-e2asv7-v1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            class-d-1000-input-tuple.txt
            class-d-1000-prerun.txt
            class-d-1000-run.log
            class-d-1000-evidence.json
            class-d-1000-evaluation.json
            class-d-1000-terminal.json
            class-d-1000-post-evaluation.json
            class-d-1000-post-evaluation.stderr
            class-d-1000-post-terminal.json
            class-d-1000-post-terminal.stderr
            class-d-1000-staging-cleanup.txt
            class-d-1000-summary.txt

      - name: Record terminal marker
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CLEANUP_CONFIRMED: ${{ steps.terminal.outputs.cleanup_confirmed }}
          REMAINING_RESOURCES: ${{ steps.terminal.outputs.remaining_resources }}
          STAGING_CLEANUP: ${{ steps.terminal.outputs.staging_cleanup }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        shell: bash
        run: |
          if [[ "$CAMPAIGN_OUTCOME" == success && "$TERMINAL_RC" == 0 && "$EVALUATOR_RC" == 0 && "$CLEANUP_CONFIRMED" == true && "$REMAINING_RESOURCES" == 0 && "$STAGING_CLEANUP" == true && -n "$EVIDENCE_ARTIFACT_ID" && -n "$EVIDENCE_ARTIFACT_DIGEST" ]]; then result=PASS; else result=FAIL; fi
          body="run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} launcher_sha=${GITHUB_SHA} tested_sha=${TESTED_COMMIT} pinned_ref=${PINNED_REF} exact_ci_run=${EXACT_CI_RUN} exact_codeql_run=${EXACT_CODEQL_RUN} immutable_preflight_run=${IMMUTABLE_PREFLIGHT_RUN} immutable_preflight_issue=${IMMUTABLE_PREFLIGHT_ISSUE} immutable_preflight_artifact_id=${IMMUTABLE_PREFLIGHT_ARTIFACT_ID} immutable_preflight_digest=${IMMUTABLE_PREFLIGHT_DIGEST} runtime_bundle_sha256=${RUNTIME_BUNDLE_SHA256} azure_location=${AZURE_LOCATION} vm_size=${AZURE_VM_SIZE} hosts=20 nodes=1000 result=${result} campaign_outcome=${CAMPAIGN_OUTCOME:-missing} evaluator_rc=${EVALUATOR_RC:-missing} terminal_rc=${TERMINAL_RC:-missing} cleanup=${CLEANUP_CONFIRMED:-missing} remainingResources=${REMAINING_RESOURCES:-missing} stagingCleanup=${STAGING_CLEANUP:-missing} evidence_artifact_id=${EVIDENCE_ARTIFACT_ID:-missing} evidence_artifact_digest=${EVIDENCE_ARTIFACT_DIGEST:-missing} artifact_name=truyn-class-d1000-19978115-e2asv7-v1-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f "title=TRUYN CLASS D-1000 19978115 IMMUTABLE BUNDLE PINNED V1 ${result}" -f "body=${body}" >/dev/null

      - name: Strict accepted D-1000 gate
        if: always()
        env:
          TERMINAL_RC: ${{ steps.terminal.outputs.terminal_rc }}
          EVALUATOR_RC: ${{ steps.terminal.outputs.evaluator_rc }}
          CLEANUP_CONFIRMED: ${{ steps.terminal.outputs.cleanup_confirmed }}
          REMAINING_RESOURCES: ${{ steps.terminal.outputs.remaining_resources }}
          STAGING_CLEANUP: ${{ steps.terminal.outputs.staging_cleanup }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$CAMPAIGN_OUTCOME" = success
          test "$EVALUATOR_RC" = 0
          test "$TERMINAL_RC" = 0
          test "$CLEANUP_CONFIRMED" = true
          test "$REMAINING_RESOURCES" = 0
          test "$STAGING_CLEANUP" = true
          test -n "$EVIDENCE_ARTIFACT_ID"
          test -n "$EVIDENCE_ARTIFACT_DIGEST"
          node benchmarks/scale/verify-class-d-1000-terminal.js class-d-1000-evidence.json

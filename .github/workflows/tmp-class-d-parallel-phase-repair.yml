name: Temporary Class-D Parallel Phase Repair

on:
  push:
    branches:
      - repair/class-d-parallel-phase-deadlines-260923
    paths:
      - .github/workflows/tmp-class-d-parallel-phase-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/class-d-parallel-phase-deadlines-260923
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded parallel Class-D repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/tmp_class_d_parallel_phase_repair.py
          rm -f scripts/tmp_class_d_parallel_phase_repair.py
          rm -f .github/workflows/tmp-class-d-parallel-phase-repair.yml
          bash -n benchmarks/scale/class-d-azure-1000-provision.sh
          bash -n scripts/d200-stage-isolated-campaign.sh
          bash -n scripts/class-d-1000-strict-acceptance.sh
          node --test tests/class-d-parallel-phase-deadlines.test.js tests/d200-stage-isolation.test.js tests/class-d-bootstrap-qualification.test.js
          BLOCK_ID=B02_BOOTSTRAP_REFRESH BLOCK_OUT_DIR="$RUNNER_TEMP/b02" node scripts/class-d-blockwise-preflight.mjs
          BLOCK_ID=B03_RUNTIME_BUNDLE BLOCK_OUT_DIR="$RUNNER_TEMP/b03" node scripts/class-d-blockwise-preflight.mjs
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Iluco Mutcnas'
          git config user.email '197368050+ilucomutcnas@users.noreply.github.com'
          git add -A
          git commit -m 'repair(class-d): parallelize scale phases and bound deadlines' -m 'Signed-off-by: Iluco Mutcnas <197368050+ilucomutcnas@users.noreply.github.com>'
          git push origin HEAD:repair/class-d-parallel-phase-deadlines-260923
